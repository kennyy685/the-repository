<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aldaba Sound · dev</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Bricolage L";src:url(../fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Geist L";src:url(../fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(../fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(../fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(../fonts/GeistMono-500.woff2) format("woff2");font-weight:400 600;font-display:swap}
:root{--page:#07080a;--panel:#0c0d10;--panel-2:#121317;--text:#f1f2f4;--text-2:#b8bbc2;--muted:#80838b;--rule:#1e2024;--rule-2:#2b2d32;
  --acc:#f5883a;--acc-ink:#1a0d03;--ok:#5fd39a;--bad:#ff4f5a;--wave:#f5883a;--grid:#1a1c20;
  --display:"Bricolage L",system-ui,sans-serif;--ui:"Geist L",system-ui,sans-serif;--mono:"Geist Mono L",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--page:#eef0ee;--panel:#f7f8f6;--panel-2:#e6e8e4;--text:#18191c;--text-2:#3d4046;
  --muted:#6b6e75;--rule:#d9dbd6;--rule-2:#c8cbc4;--acc:#d8661a;--acc-ink:#fff;--ok:#1f8f5a;--bad:#d9303c;--wave:#d8661a;--grid:#e0e2dd}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:0 48px 64px}
header{padding:34px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:600 34px/1.05 var(--display);letter-spacing:-.02em;margin:10px 0 0}
h2{font:600 19px/1.1 var(--display);letter-spacing:-.01em;margin:0}
.sub{color:var(--text-2);max-width:620px;margin:8px 0 0}
button{font:500 13px/1 var(--ui);color:var(--text);background:var(--panel-2);border:1px solid var(--rule-2);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
select{font:500 13px/1 var(--ui);color:var(--text);background:var(--panel-2);border:1px solid var(--rule-2);border-radius:8px;padding:8px 10px;min-height:36px}
label.sl{display:grid;grid-template-columns:78px 1fr 38px;align-items:center;gap:10px;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
label.sl output{color:var(--text-2);text-align:right}
input[type=range]{width:100%;accent-color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-bottom:18px}
.bar .vol{flex:1 1 220px;max-width:320px}
.status{font:500 11px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em}
.meter{width:120px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--acc);transition:width .06s linear}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--rule);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 8px}
.card .use{font:500 11px/1.2 var(--mono);color:var(--muted);letter-spacing:.04em;text-align:right}
.card canvas{display:block;width:100%;height:84px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--page)}
.nums{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px;font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.03em}
.nums b{color:var(--text-2);font-weight:500}
.ctl{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.keys button{min-width:44px;padding:9px 10px;font-family:var(--mono)}
.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font:500 12px/1.3 var(--mono)}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
td.ok{color:var(--ok)} td.bad{color:var(--bad)}
.tbl{overflow-x:auto;padding:0 16px 14px}
.note{font:500 11px/1.4 var(--mono);color:var(--muted);padding:0 16px 14px;letter-spacing:.02em}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.wrap{padding:0 16px 48px}.grid{grid-template-columns:1fr}h1{font-size:28px}.bar{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Claude's Aldaba · dev · js/lib/sound.js</div>
      <h1>Sound</h1>
      <p class="sub">Synthesized, sparse and warm. Off until you turn it on. The waveforms and numbers are silent offline renders of the exact same code (48 kHz, seeded), so the mix can be checked without ears.</p>
    </div>
    <div class="status" id="support"></div>
  </header>

  <div class="bar" role="region" aria-label="Master">
    <button id="power" class="primary" aria-pressed="false">Turn sound on</button>
    <label class="sl vol">VOLUME <input id="vol" type="range" min="0" max="1" step="0.01"><output id="volv"></output></label>
    <label class="status">REDUCED
      <select id="red" aria-label="Reduced mode"><option value="">Follow system</option><option value="1">Force on (knock only)</option><option value="0">Force off</option></select>
    </label>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="status" id="state">off</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="../js/lib/sound.js"></script>
<script>
(function () {
  'use strict';
  var S = window.Sound, $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    for (var k in attrs || {}) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'on') { for (var ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); } else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function fmt(x, d) { return x === -Infinity || x == null || isNaN(x) ? '-inf' : x.toFixed(d == null ? 1 : d); }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  // ---------------------------------------------------------------- cues: live play + offline render recipe
  var P = { knock: { count: 2, gap: 0.19, gain: 1 }, hail: { x: 0.8, pan: 0, surface: 'glass' }, bed: { level: 0.6 },
    thunder: { dist: 0.7 }, ring: { deg: 0 }, tick: {}, score: {} };
  var CUES = [
    { id: 'knock', name: 'Knock', use: 'a door is tapped', sec: 1.4,
      rec: function (a) { a.knock({ count: P.knock.count, gap: P.knock.gap, gain: P.knock.gain, at: 0.05 }); },
      play: function () { S.knock({ count: P.knock.count, gap: P.knock.gap, gain: P.knock.gain }); },
      ctl: [['sel', 'count', 'knock', [1, 2, 3]], ['sl', 'gap', 'knock', 0.1, 0.35, 0.01], ['sl', 'strength', 'knock', 0.3, 1, 0.01, 'gain']] },
    { id: 'hail', name: 'Hail stone', use: 'one stone, roof or window', sec: 0.5,
      rec: function (a) { a.hail(P.hail.x, { pan: P.hail.pan, surface: P.hail.surface || undefined, at: 0.05 }); },
      play: function () { S.hail(P.hail.x, { pan: P.hail.pan, surface: P.hail.surface || undefined }); },
      ctl: [['sl', 'intensity', 'hail', 0, 1, 0.01, 'x'], ['sl', 'pan', 'hail', -1, 1, 0.05], ['sel', 'surface', 'hail', ['glass', 'roof', '']]] },
    { id: 'bed', name: 'Hail bed', use: 'storm replay texture', sec: 5, from: 1.5, toggle: true,
      rec: function (a) { a.hailBed(P.bed.level, 0); },
      play: function (on) { S.hailBed(on ? P.bed.level : 0); },
      ctl: [['sl', 'level', 'bed', 0, 1, 0.01, 'level', function () { if (bedOn) S.hailBed(P.bed.level); }]] },
    { id: 'thunder', name: 'Thunder', use: 'distant rumble, rare', sec: 9,
      rec: function (a) { a.thunder(P.thunder.dist, { at: 0.05 }); },
      play: function () { if (!S.thunder(P.thunder.dist)) flash('thunder', 'cooling down (one per 6 s)'); },
      ctl: [['sl', 'distance', 'thunder', 0, 1, 0.01, 'dist']] },
    { id: 'ring', name: 'Ring', use: 'impact ripple, the pick locks in', sec: 4,
      rec: function (a) { a.ring(P.ring.deg, { at: 0.05 }); },
      play: function () { S.ring(P.ring.deg); }, keys: true },
    { id: 'tick', name: 'Tick', use: 'counters and toggles', sec: 0.25,
      rec: function (a) { a.tick({ at: 0.05 }); },
      play: function () { S.tick(); }, count: true },
    { id: 'score', name: 'Score', use: 'pad under the film', sec: 10, from: 3, toggle: true,
      rec: function (a) { a.score(true, 0); },
      play: function (on) { S.score(on); } },
    { id: 'replay', name: 'Storm replay', use: 'everything together, 16 s', sec: 16, wide: true,
      rec: function (a) { replayScript(function (t, f) { f(a, t); }); },
      play: function () { replayScript(function (t, f) { later.push(setTimeout(function () { f(S, 0, true); }, t * 1000)); }); } }
  ];
  var later = [], bedOn = false;
  // one scene, two drivers: offline (a.* with times) and live (Sound.* on timers)
  function replayScript(at) {
    var q = function (t, f) { at(t, f); };
    q(0, function (a, t, L) { a.score(true, t); });
    q(0.4, function (a, t, L) { a.hailBed(0.12, t); });
    q(2.6, function (a, t, L) { a.hailBed(0.55, t); });
    q(3.4, function (a, t, L) { a.thunder(0.75, L ? {} : { at: t }); });
    q(5.2, function (a, t, L) { a.hailBed(0.95, t); });
    [5.8, 6.5, 7.3].forEach(function (s, i) { q(s, function (a, t, L) { a.ring([0, 2, 4][i], L ? {} : { at: t }); }); });
    q(8.6, function (a, t, L) { a.hailBed(0.25, t); });
    q(10.2, function (a, t, L) { a.hailBed(0, t); });
    q(11.4, function (a, t, L) { a.knock(L ? {} : { at: t }); });
    q(12.2, function (a, t, L) { a.ring(5, L ? {} : { at: t }); });
    q(13, function (a, t, L) { a.score(false, t); });
  }

  // ---------------------------------------------------------------- build cards
  var grid = $('#grid'), cards = {};
  CUES.forEach(function (c) {
    var cv = el('canvas', { 'aria-label': c.name + ' waveform (offline render)', role: 'img' });
    var nums = el('div', { class: 'nums' });
    var ctl = el('div', { class: 'ctl' });
    var card = el('section', { class: 'card' + (c.wide ? ' wide' : ''), 'data-cue': c.id }, [
      el('div', { class: 'hd' }, [el('h2', { text: c.name }), el('span', { class: 'use', text: c.use })]), cv, nums, ctl]);
    var row = el('div', { class: 'row' });
    if (c.toggle) {
      var b = el('button', { 'aria-pressed': 'false', 'data-play': c.id, text: 'Start' });
      b.addEventListener('click', function () {
        ensureOn(); var on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Stop' : 'Start';
        if (c.id === 'bed') bedOn = on; c.play(on);
      });
      row.appendChild(b);
    } else if (!c.keys) {
      row.appendChild(el('button', { 'data-play': c.id, text: c.id === 'replay' ? 'Play the scene' : 'Play', on: { click: function () { ensureOn(); c.play(); } } }));
    }
    if (c.count) {
      var out = el('span', { class: 'status', text: '0' });
      row.appendChild(el('button', { 'data-play': 'tick-count', text: 'Count to 24', on: { click: function () {
        ensureOn(); var n = 0; (function step() { out.textContent = String(n); S.tick(); if (n++ < 24) setTimeout(step, 45 + n * 2); })();
      } } }));
      row.appendChild(out);
    }
    if (c.keys) {
      var keys = el('div', { class: 'row keys' });
      var names = ['D', 'E', 'F#', 'A', 'B'];
      for (var d = -2; d <= 9; d++) (function (d) {
        var nm = names[((d % 5) + 5) % 5] + (5 + Math.floor(d / 5));
        keys.appendChild(el('button', { 'data-play': 'ring', 'data-deg': String(d), title: Math.round(S.scale(d)) + ' Hz', text: nm, on: { click: function () {
          ensureOn(); P.ring.deg = d; S.ring(d); draw(c);
        } } }));
      })(d);
      ctl.appendChild(keys);
      row.appendChild(el('button', { 'data-play': 'ripple', text: 'Ripple (motif x5)', on: { click: function () {
        ensureOn(); for (var i = 0; i < 5; i++) S.ring(undefined, { delay: i * 0.16 });
      } } }));
    }
    if (c.id === 'replay') row.appendChild(el('button', { text: 'Stop', on: { click: function () { later.forEach(clearTimeout); later = []; S.stop(); } } }));
    ctl.appendChild(row);
    (c.ctl || []).forEach(function (k) {
      if (k[0] === 'sl') {
        var field = k[6] || k[1], after = k[7];
        var inp = el('input', { type: 'range', min: k[3], max: k[4], step: k[5], value: P[k[2]][field] });
        var o = el('output', { text: String(P[k[2]][field]) });
        inp.addEventListener('input', function () { P[k[2]][field] = +inp.value; o.textContent = (+inp.value).toFixed(2); if (after) after(); schedule(c); });
        ctl.appendChild(el('label', { class: 'sl' }, [document.createTextNode(k[1].toUpperCase()), inp, o]));
      } else {
        var s = el('select', { 'aria-label': k[1] });
        k[3].forEach(function (v) { var op = el('option', { value: String(v), text: v === '' ? 'random' : String(v) }); if (String(P[k[2]][k[1]]) === String(v)) op.selected = true; s.appendChild(op); });
        s.addEventListener('change', function () { var v = s.value; P[k[2]][k[1]] = v === '' ? '' : (isNaN(+v) ? v : +v); schedule(c); });
        ctl.appendChild(el('label', { class: 'sl' }, [document.createTextNode(k[1].toUpperCase()), s, el('span')]));
      }
    });
    grid.appendChild(card);
    cards[c.id] = { cv: cv, nums: nums, card: card };
  });

  // ---------------------------------------------------------------- measurement table (worst case: volume 1)
  var mt = el('section', { class: 'card wide', 'data-cue': 'measure' }, [
    el('div', { class: 'hd' }, [el('h2', { text: 'Measure' }), el('span', { class: 'use', text: 'offline, 48 kHz, volume 1.0 = worst case' })]),
    el('div', { class: 'row', style: 'padding:0 16px 10px' }, [el('button', { id: 'measure', text: 'Run again', on: { click: function () { measureAll(); } } })]),
    el('div', { class: 'tbl' }, [el('table', { id: 'mtab' })]),
    el('p', { class: 'note', text: 'LUFS = max momentary loudness (BS.1770 K-weighted, 400 ms). Peak must stay under -1 dBFS; the master ceiling tops out at -1.6. Knock and ring lead; bed and score sit well under them.' })]);
  grid.appendChild(mt);

  var MATRIX = [
    ['knock', 1.4, function (a) { a.knock({ at: 0.05 }); }],
    ['knock x3, gain 1.5', 1.6, function (a) { a.knock({ count: 3, gain: 1.5, at: 0.05 }); }],
    ['ring D5 (0)', 4, function (a) { a.ring(0, { at: 0.05 }); }],
    ['ring A5 (3)', 4, function (a) { a.ring(3, { at: 0.05 }); }],
    ['ring B6 (9)', 4, function (a) { a.ring(9, { at: 0.05 }); }],
    ['ring motif x5 (160 ms)', 5, function (a) { for (var i = 0; i < 5; i++) a.ring(undefined, { at: 0.05 + i * 0.16 }); }],
    ['hail 1.0 glass', 0.5, function (a) { a.hail(1, { surface: 'glass', at: 0.05 }); }],
    ['hail 1.0 roof', 0.5, function (a) { a.hail(1, { surface: 'roof', at: 0.05 }); }],
    ['hail 0.3', 0.5, function (a) { a.hail(0.3, { at: 0.05 }); }],
    ['hailBed 0.3', 6, function (a) { a.hailBed(0.3, 0); }, 2],
    ['hailBed 0.6', 6, function (a) { a.hailBed(0.6, 0); }, 2],
    ['hailBed 1.0', 6, function (a) { a.hailBed(1, 0); }, 2],
    ['thunder 0.2 (near)', 9, function (a) { a.thunder(0.2, { at: 0.05 }); }],
    ['thunder 0.7', 9, function (a) { a.thunder(0.7, { at: 0.05 }); }],
    ['thunder 1.0 (far)', 10, function (a) { a.thunder(1, { at: 0.05 }); }],
    ['tick', 0.25, function (a) { a.tick({ at: 0.05 }); }],
    ['score (steady)', 10, function (a) { a.score(true, 0); }, 3],
    ['storm replay scene', 16, function (a) { replayScript(function (t, f) { f(a, t); }); }],
    ['STACK: all at once', 6, function (a) {
      a.score(true, 0); a.hailBed(1, 0); a.thunder(0, { at: 2 }); a.knock({ count: 3, gain: 1.5, at: 2 });
      for (var i = 0; i < 6; i++) a.ring(i, { at: 2 + i * 0.02, gain: 1.5 }); a.hail(1, { at: 2, gain: 1.5 });
    }, 1]
  ];
  function measureAll(volume) {
    var v = volume == null ? 1 : volume, tab = $('#mtab');
    tab.innerHTML = '<tr><th>cue</th><th>peak dBFS</th><th>rms dBFS</th><th>LUFS max</th><th>length s</th><th>clips</th><th>&lt; -1 dBFS</th></tr>';
    var out = [];
    return MATRIX.reduce(function (p, m) {
      return p.then(function () {
        return S.render(m[2], m[1], { volume: v }).then(function (buf) {
          var r = S.analyze(buf, { from: m[3] || 0 });
          var row = { cue: m[0], peakDb: +r.peakDb.toFixed(2), rmsDb: +r.rmsDb.toFixed(1), lufs: +r.lufs.toFixed(1), dur: +r.dur.toFixed(2), clips: r.clips, pass: r.peakDb < -1 };
          out.push(row);
          var tr = el('tr', {}, [el('td', { text: row.cue }), el('td', { text: fmt(row.peakDb, 2) }), el('td', { text: fmt(row.rmsDb) }),
            el('td', { text: fmt(row.lufs) }), el('td', { text: row.dur.toFixed(2) }), el('td', { text: String(row.clips) }),
            el('td', { class: row.pass ? 'ok' : 'bad', text: row.pass ? 'pass' : 'FAIL' })]);
          tab.appendChild(tr);
        }, function (e) {
          out.push({ cue: m[0], error: e.message });
          tab.appendChild(el('tr', {}, [el('td', { text: m[0] }), el('td', { class: 'bad', colspan: '6', text: 'render unavailable: ' + e.message })]));
        });
      });
    }, Promise.resolve()).then(function () { return out; });
  }
  window.measureAll = measureAll;

  // ---------------------------------------------------------------- offline waveform per card
  var timers = {};
  function schedule(c) { clearTimeout(timers[c.id]); timers[c.id] = setTimeout(function () { draw(c); }, 120); }
  function draw(c) {
    var k = cards[c.id];
    return S.render(c.rec, c.sec, { volume: 1 }).then(function (buf) {
      var r = S.analyze(buf, { from: c.from || 0 });
      k.nums.innerHTML = '';
      [['peak', fmt(r.peakDb, 1) + ' dBFS'], ['lufs', fmt(r.lufs)], ['rms', fmt(r.rmsDb)], ['length', r.dur.toFixed(2) + ' s']].forEach(function (p) {
        var s = el('span', { text: p[0] + ' ' }); s.appendChild(el('b', { text: p[1] })); k.nums.appendChild(s);
      });
      wave(k.cv, buf);
    }).catch(function (e) { k.nums.textContent = 'render unavailable: ' + e.message; });
  }
  function wave(cv, buf) {
    var dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth || 300, h = cv.clientHeight || 84;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    var x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
    var L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L, n = L.length, mid = h / 2;
    x.strokeStyle = css('--grid'); x.lineWidth = 1;
    [0.891, 0.6].forEach(function (lv, i) { x.setLineDash(i ? [2, 3] : []); [mid - lv * mid, mid + lv * mid].forEach(function (y) { x.beginPath(); x.moveTo(0, y + 0.5); x.lineTo(w, y + 0.5); x.stroke(); }); });
    x.setLineDash([]); x.fillStyle = css('--wave');
    for (var px = 0; px < w; px++) {
      var a = Math.floor(px / w * n), b = Math.floor((px + 1) / w * n), lo = 0, hi = 0;
      for (var i = a; i < b; i++) { var v = (L[i] + R[i]) / 2; if (v < lo) lo = v; if (v > hi) hi = v; }
      x.fillRect(px, mid - hi * mid, 1, Math.max(1, (hi - lo) * mid));
    }
  }

  // ---------------------------------------------------------------- master bar
  var power = $('#power'), volIn = $('#vol'), volOut = $('#volv'), red = $('#red'), stateEl = $('#state'), meter = $('#meter');
  $('#support').textContent = S.supported ? 'Web Audio: yes' : 'Web Audio: not available (every call is a no-op)';
  volIn.value = S.volume(); volOut.textContent = (+volIn.value).toFixed(2);
  function ensureOn() { if (!S.enabled) S.enable(); }
  power.addEventListener('click', function () { S.toggle(); });
  volIn.addEventListener('input', function () { S.volume(+volIn.value); volOut.textContent = (+volIn.value).toFixed(2); });
  red.addEventListener('change', function () { S.setReduced(red.value === '' ? null : red.value === '1'); });
  function paint(st) {
    power.setAttribute('aria-pressed', String(st.enabled)); power.textContent = st.enabled ? 'Sound on' : 'Turn sound on';
    stateEl.textContent = (st.enabled ? 'on' : 'off') + ' · ctx ' + st.context + ' · reduced ' + (st.reduced ? 'yes' : 'no') + ' · bed ' + st.bed.toFixed(2) + ' · score ' + (st.score ? 'on' : 'off');
  }
  window.addEventListener('sound:change', function (e) { paint(e.detail); });
  paint(S.state());
  (function loop() { meter.style.width = Math.min(100, S.level() * 400) + '%'; requestAnimationFrame(loop); })();

  function flash(id, msg) { var k = cards[id]; var s = el('span', { text: msg, style: 'color:var(--acc)' }); k.nums.appendChild(s); setTimeout(function () { s.remove(); }, 1600); }

  // render every card (silent), then the table
  CUES.reduce(function (p, c) { return p.then(function () { return draw(c); }); }, Promise.resolve())
    .then(function () { return measureAll(); })
    .then(function (rows) { window.__measured = rows; document.documentElement.setAttribute('data-measured', '1'); });
})();
</script>
</body>
</html>

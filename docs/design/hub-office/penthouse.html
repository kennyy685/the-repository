/* One deliberate dark look: a lit penthouse at dusk. The sky tokens below are driven by the clock + weather. */
:root{
  color-scheme:dark;
  --bg:#0b0c0f; --ink:#f5f2ec; --ink-2:rgba(245,242,236,.76); --muted:rgba(245,242,236,.56); --faint:rgba(245,242,236,.36);
  --glass:rgba(14,14,18,.50); --glass-2:rgba(24,24,30,.72); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --hi:rgba(255,255,255,.07);
  --brass:#c9a45c; --brass-hi:#ead1a0; --hmp:#f5883a; --hmp-hi:#ffae72; --hmp-glow:rgba(245,136,58,.42);
  --st-working:#62d6a0; --st-idle:#b8c1d4; --st-sleeping:#93a0d8; --st-waiting:#f5883a; --st-blocked:#ff6b5f; --st-done:#e7cd95;
  --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --r:18px;
  --sky-top:#18203f; --sky-mid:#4a3f6e; --sky-low:#b0697a; --sky-glow:#f09a6c; --cloud-lit:#e89a8a; --cloud-shade:#3d3a5c;
  --land-far:#2a2438; --land:#120f18; --stars:.2; --lights:.6; --sun-y:104%; --sun:#ffcf9a; --sun-a:.8; --storm:0; --flash:0; --horizon:58%;
  --panel-w:344px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px;border-radius:10px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:500 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 20px 50px -24px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35)}

/* ---------- layout: phone first ---------- */
.app{position:relative}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#26262c,#141418);border:1px solid var(--line-2);flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.brand p{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap}
.clock{display:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{height:28px;min-width:36px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.ibtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.ibtn:hover{background:rgba(255,255,255,.11)}

.needs{margin:0 16px 12px;padding:12px 12px 10px;position:relative;z-index:6}
.needs-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.needs-h .lbl{color:var(--hmp-hi)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hmp);color:#1b1206;font:600 12px/20px var(--f);text-align:center;box-shadow:0 0 18px var(--hmp-glow)}
.count[data-n="0"]{background:rgba(255,255,255,.12);color:var(--muted);box-shadow:none}
.sum{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.sum span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.needs ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.need{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:13px;text-align:left;background:linear-gradient(90deg,rgba(245,136,58,.14),rgba(245,136,58,.03));border:1px solid rgba(245,136,58,.28);animation:needIn .5s var(--ease) both}
.need:hover{background:linear-gradient(90deg,rgba(245,136,58,.2),rgba(245,136,58,.05))}
.need .t{flex:1;min-width:0;display:grid;gap:1px}
.need b{font-size:12px;font-weight:600;color:var(--hmp-hi);letter-spacing:.01em}
.need .ask{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .where{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .i{color:var(--muted)}
.none{padding:6px 4px 4px;font-size:14px;color:var(--muted)}
@keyframes needIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.av{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative}
.av svg{width:28px;height:28px}
.av .sd{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 8px var(--c)}

.stage{position:relative;height:clamp(380px,118vw,560px);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
.no-gl .still{display:block}
.no-gl #gl{display:none}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.skyctl{position:absolute;left:16px;bottom:14px;z-index:4;display:flex;gap:8px;align-items:center}
.skyctl .seg{background:rgba(10,10,14,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function route(from, to){   // Dijkstra over the aisles
  const d = {}, prev = {}, left = new Set(Object.keys(NODES));
  for (const k of left) d[k] = Infinity; d[from] = 0;

    let u = null; for (const k of left) if (u === null || d[k] < d[u]) u = k;

  }
  const out = [to]; let k = to; while (k !== from && prev[k]) { k = prev[k]; out.unshift(k); }

}
function nearestNode(x,z){ let best=null, bd=1e9; for (const [k,p] of Object.entries(NODES)){ const dd = Math.hypot(p[0]-x,p[1]-z); if (dd<bd){bd=dd;best=k;} } return best; }
function claim(a, pool){

}
function release(a){ for (const [s,id] of claims) if (id === a.id) claims.delete(s); }
function spotFor(a, key){ if (key === 'desk') { release(a); return DESK[a.id]; } if (key === 'here') return null; return claim(a, key); }

function planPath(a, spot){
  const pts = [[a.x, a.z]];
  const cur = a.spot;
  let startNode;
  if (cur && Math.hypot(cur.x-a.x, cur.z-a.z) < 0.3){ for (const p of (cur.via||[]).slice().reverse()) pts.push(p); startNode = cur.node; }
  else startNode = nearestNode(a.x, a.z);
  const nodes = route(startNode, spot.node);
  for (const n of nodes) pts.push(NODES[n]);
  for (const p of (spot.via||[])) pts.push(p);
  pts.push([spot.x, spot.z]);
  const clean = [pts[0]]; for (const p of pts.slice(1)) if (dist(p, clean[clean.length-1]) > 0.05) clean.push(p);
  // skip a node that doubles back (keeps glides smooth)
  for (let i=1; i<clean.length-1; i++){ const a0=clean[i-1], b0=clean[i], c0=clean[i+1]; const ab=[b0[0]-a0[0],b0[1]-a0[1]], bc=[c0[0]-b0[0],c0[1]-b0[1]];

  const cum = [0]; for (let i=1;i<clean.length;i++) cum.push(cum[i-1] + dist(clean[i], clean[i-1]));
  return {pts:clean, cum, len:cum[cum.length-1]};
}
function pointAt(p, s){
  if (s <= 0) return p.pts[0]; if (s >= p.len) return p.pts[p.pts.length-1];
  let i = 1; while (p.cum[i] < s) i++;
  const t = (s - p.cum[i-1]) / (p.cum[i] - p.cum[i-1]); const A = p.pts[i-1], B = p.pts[i];
  return [A[0] + (B[0]-A[0])*t, A[1] + (B[1]-A[1])*t];
}

function place(a, spot){ a.x = spot.x; a.z = spot.z; a.vx = a.vz = 0; a.yaw = a.yawDraw = spot.yaw; a.spot = spot; a.moving = false; a.path = null; }
function go(a, spot){

function runQueue(a){

    if (a.moving) return;
    if (!step.posed){ step.posed = true; a.pose = step.pose; a.poseT = 0; if (a.spot) a.yaw = a.spot.yaw; }
    if (step.dur && a.poseT < step.dur) return;

function stepAgent(a, dt){
  a.poseT += dt; a.fade = Math.min(1, a.fade + dt*2.5);
  if (a.moving){
    const p = a.path, k = 38, damp = 2*Math.sqrt(k)*0.95, n = Math.ceil(dt/0.012), h = dt/n; let c;
    for (let i = 0; i < n; i++){   // small steps keep the glide spring stable on slow frames
      const left = p.len - a.s;
      a.v = Math.min(1.55, a.v + 2.2*h, Math.sqrt(2*1.6*Math.max(0,left)) + 0.05);
      a.s = Math.min(p.len, a.s + a.v*h);
      c = pointAt(p, Math.min(p.len, a.s + 0.18));
      a.vx += (k*(c[0]-a.x) - damp*a.vx)*h; a.vz += (k*(c[1]-a.z) - damp*a.vz)*h;
      a.x += a.vx*h; a.z += a.vz*h;
    }
    if (a.s >= p.len && Math.hypot(c[0]-a.x, c[1]-a.z) < 0.03 && Math.hypot(a.vx,a.vz) < 0.08){ place(a, a.target); a.pose = 'settle'; }
  }
  const sp = Math.hypot(a.vx, a.vz);
  const want = (a.moving && sp > 0.12) ? Math.atan2(a.vx, a.vz) : (a.spot ? a.spot.yaw : a.yaw);
  let d = want - a.yawDraw; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
  const turn = d * Math.min(1, dt*5.5); a.yawDraw += turn;
  a.bank += ((a.moving ? Math.max(-.22, Math.min(.22, -turn/dt*0.05)) : 0) - a.bank) * Math.min(1, dt*6);
  a.pitch += ((a.moving ? Math.min(.14, sp*0.07) : 0) - a.pitch) * Math.min(1, dt*5);
  runQueue(a);
  // idle life: drift between lounge spots every so often
  if (!a.moving && !a.queue.length && (a.st === 'idle' || a.st === 'done')){
    if (!a.wanderAt) a.wanderAt = a.poseT + 9 + Math.random()*7;
    else if (a.poseT > a.wanderAt){ a.wanderAt = 0; a.queue = [{spot:'lounge', pose:'lounge'}]; }

}

function skyAt(min){
  let i = 0; while (i < SKY_KEYS.length-2 && SKY_KEYS[i+1][0] <= min) i++;

let W = 1, H = 1;
function area(){
  const wide = HUB.wide;

function fit(){

  for (const p of BOX){ v.copy(p).applyMatrix4(cam.matrixWorldInverse); mnx = Math.min(mnx, v.x); mxx = Math.max(mxx, v.x); mny = Math.min(mny, v.y); mxy = Math.max(mxy, v.y); }

  else if (pose === 'blocked'){ col = RED; I = .6 + (rm ? .2 : (Math.random() < .06 ? -.3 : (Math.sin(t*3)*.5+.5)*.35)); }
  else if (pose === 'cheer') I = 1; else if (pose === 'glide') I = .85;
  cTmp.copy(DIM).lerp(col, Math.min(1, I)); R.stripMat.color.lerp(cTmp, Math.min(1, dt*8));
  R.haloMat.color.copy(col); R.haloMat.opacity = lerp(R.haloMat.opacity, .08 + I*.34, Math.min(1, dt*6));
  R.glow.material.color.copy(col); R.glow.material.opacity = lerp(R.glow.material.opacity, (pose === 'sleep' ? .03 : .06 + I*.12) * (pose === 'wait' ? 1.8 : 1), Math.min(1, dt*5));
  const chasing = (pose === 'type' || pose === 'read' || pose === 'radar' || pose === 'glide') && !rm;
  R.chase.visible = chasing; if (chasing){ const ang = t*3.2 + ph; R.chase.position.set(Math.cos(ang)*.218, .25, Math.sin(ang)*.218); }
  // hands
  const hl = R.hl, L0 = hl[0], R0 = hl[1];
  const setH = (v, x, y, z) => v.set(x, y, z);
  if (pose === 'type'){ setH(L0, -.12, .5 + (rm?0:Math.max(0,Math.sin(t*15+ph))*.025), .3); setH(R0, .12, .5 + (rm?0:Math.max(0,Math.sin(t*15+ph+Math.PI))*.025), .3); }
  else if (pose === 'read' || pose === 'radar'){ setH(L0, -.12, .55, .25); setH(R0, .12, .55 + (rm?0:Math.max(0,Math.sin(t*.7+ph)-.9)*.3), .27); }
  else if (pose === 'wait'){ setH(L0, -.27, .33, .06); setH(R0, .3, .8 + (rm?0:Math.sin(t*6)*.04), .1 + (rm?0:Math.sin(t*6)*.05)); }
  else if (pose === 'blocked'){ setH(L0, -.25, .86, .06); setH(R0, .25, .86, .06); }
  else if (pose === 'cheer'){ setH(L0, -.27, 1.02, 0); setH(R0, .27, 1.02, 0); }
  else if (pose === 'coffee'){ const sip = rm ? 0 : Math.max(0, Math.sin(t*.9 + ph)); setH(L0, -.27, .32, .06); setH(R0, .1, .48 + sip*.24, .25); }
  else if (pose === 'sleep'){ setH(L0, -.26, .2, .05); setH(R0, .26, .2, .05); }
  else if (pose === 'meet'){ setH(L0, -.27, .33, .06); setH(R0, .19, .5 + (rm?0:Math.max(0,Math.sin(t*1.1+ph))*.08), .22); }
  else { const sw = rm ? 0 : Math.sin(t*1.7 + ph)*.02; setH(L0, -.28, .32 + sw, .05); setH(R0, .28, .32 - sw, .05); }
  const hk = Math.min(1, dt*(pose === 'type' ? 18 : 7));
  R.hands[0].position.lerp(L0, hk); R.hands[1].position.lerp(R0, hk);
  // props
  const reading = pose === 'read' || pose === 'meet' && a.id === 'code';
  R.tablet.visible = reading; if (reading){ R.tablet.position.set(0, R.hands[0].position.y + .02, .3); R.tablet.rotation.set(.9, 0, 0); }
  R.cup.visible = pose === 'coffee'; if (R.cup.visible){ R.cup.position.copy(R.hands[1].position).add(V.set(0,.06,.02)); }
  R.steam.forEach((s,i) => { const on = pose === 'coffee' && !rm; const k = ((t*.6 + i/3) % 1); s.material.opacity = on ? Math.sin(k*Math.PI)*.35 : 0; if (on) s.position.set(R.cup.position.x + Math.sin(k*6+i)*.02, R.cup.position.y + .06 + k*.22, R.cup.position.z); s.scale.setScalar(.05 + k*.06); });
  if (a.tip) a.tip.material.color.setHex(pose === 'sleep' ? 0x40221a : (rm || Math.sin(t*4) > 0 ? 0xff6a3d : 0x5a2615));
  // floor: contact shadow + state ring
  const hh = R.hov.position.y; R.shadow.scale.setScalar(.95 - hh*.45); R.shadow.material.opacity = Math.max(.15, .62 - hh*.55);
  let rc = null, rop = 0, rs = 1;
  if (pose === 'wait'){ rc = ORANGE; const k = rm ? .5 : (t*.8) % 1; rs = 1 + k*.9; rop = (1-k)*.85; }
  else if (pose === 'blocked'){ rc = RED; rop = .35 + (rm ? 0 : Math.sin(t*3)*.15); }
  else if (pose === 'cheer'){ rc = new THREE.Color(0xead1a0); const k = Math.min(1, pt/1.2); rs = 1 + k*1.6; rop = (1-k)*.9; }
  else if (HUB.selected === a.id){ rc = EYE; rop = .35; }
  if (rc){ R.ring.material.color.copy(rc); } R.ring.material.opacity = lerp(R.ring.material.opacity, rop, Math.min(1, dt*10)); R.ring.scale.setScalar(rs);
  const sel = HUB.selected === a.id && pose !== 'wait' && pose !== 'blocked'; R.ring2.material.color.copy(EYE); R.ring2.material.opacity = lerp(R.ring2.material.opacity, sel ? .5 : (pose === 'wait' ? .55 : 0), Math.min(1, dt*8));
  if (pose === 'wait') R.ring2.material.color.copy(ORANGE); R.ring2.scale.setScalar(pose === 'wait' ? 1.05 : 1.15);
  // fade in after a reduced-motion jump
  // overlay anchor: top of the head, and the floor under the robot
  V.set(a.x, hh*1.24 + (a.crown ? 1.46 : 1.3), a.z).project(cam); const ax = (V.x+1)/2*W, ay = (1-V.y)/2*H;
  V.set(a.x, .0, a.z).project(cam); anchors[a.id] = {x:ax, y:ay, fx:(V.x+1)/2*W, fy:(1-V.y)/2*H};
}

/* sky -> lights */
const cA = new THREE.Color(), cB = new THREE.Color();
function lightFromSky(t){
  const s = HUB.sky.state; if (!s) return;
  const alt = s.alt, storm = s.storm, flash = s.flash;
  const day = Math.max(0, Math.min(1, (alt + 4)/20));                  // 0 night .. 1 day
  const low = Math.max(0, 1 - Math.abs(alt - 2)/12);                   // golden-hour weight
  cA.setRGB(s.glow[0]/255, s.glow[1]/255, s.glow[2]/255, THREE.SRGBColorSpace);
  sun.color.copy(cA).lerp(new THREE.Color(0xffffff), day*.6).lerp(new THREE.Color(0x9fb2d8), storm*.8);
  sun.intensity = (0.35 + low*1.9 + day*1.4) * (1 - storm*.75) + flash*2.5;
  const el = Math.max(.12, (alt + 8)/50);
  sun.position.set(-4.5, 3 + el*14, -12); sun.target.position.set(0,0,0);
  cB.setRGB(s.top[0]/255, s.top[1]/255, s.top[2]/255, THREE.SRGBColorSpace); hemi.color.copy(cB).lerp(new THREE.Color(0xd9d6e4), .62 + day*.25);
  hemi.groundColor.setHex(0x4a3a30); hemi.intensity = (1.05 + day*.6) * (1 - storm*.3) + flash*1.6;
  const lamps = 1 - day*.75 + storm*.35;
  lampTable.intensity = 28*lamps; lampSofa.intensity = 14*lamps; lampKing.intensity = 5*lamps; lampRead.intensity = 7*lamps;
  MAT.opal.emissiveIntensity = .5 + 1.4*lamps;
  scene.environmentIntensity = .62 + day*.35 - storm*.2;
  MAT.glass.opacity = .1 + (1-day)*.06;
}

function frame(t, dt){
  const now = performance.now();
  const drift = RM.matches || CAPTURE ? 0 : Math.sin(t*.05)*.05;
  if (!dragStart && view.lastDrag && now - view.lastDrag > 5000) view.drag *= Math.pow(.2, dt);
  const az = Math.PI/4 - .06 + drift + view.drag;
  if (Math.abs(az - view.azNow || 1) > 1e-5){ view.azNow = az; aim(az); }
  lightFromSky(t);
  for (const a of HUB.agents) animRobot(a, robots[a.id], t, dt);
  // station screens wake when their robot works there
  for (const [id, sc] of Object.entries(screens)){
    const a = HUB.byId[id], here = a && a.spot === HUB.DESK[id];
    const on = here && (a.pose === 'type' || a.pose === 'read') ? .95 : here && a.pose === 'blocked' ? .5 : .16;
    sc.on = lerp(sc.on, on, Math.min(1, dt*3)); sc.m.material.opacity = sc.on;
    sc.m.material.color.setHex(here && a.pose === 'blocked' ? 0xff6b5f : 0xffffff);
    if (here && a.pose === 'type' && !RM.matches) sc.t.offset.y = (sc.t.offset.y + dt*.06) % 1;
  }
  // radar: sweeps while Storm Watch is up, blips once it finds hail
  const sw = HUB.byId['storm-watch'], awake = sw.pose !== 'sleep';
  radar.sweep.material.opacity = lerp(radar.sweep.material.opacity, awake ? .9 : 0, Math.min(1, dt*2));
  radar.disc.material.opacity = lerp(radar.disc.material.opacity, awake ? .75 : .22, Math.min(1, dt*2));
  if (!RM.matches) radar.sweep.rotation.z -= dt*1.6;
  const hail = HUB.sky.state && HUB.sky.state.storm > .15 || (sw.st === 'done');
  radar.blips.forEach((b,i) => { b.material.opacity = lerp(b.material.opacity, hail ? .6 + Math.sin(t*3+i)*.35 : 0, Math.min(1, dt*3)); });
  // "your spot" glows when someone is waiting on you
  const waiting = HUB.agents.some(a => a.pose === 'wait');
  spot.glow.material.opacity = lerp(spot.glow.material.opacity, waiting ? .55 + (RM.matches ? 0 : Math.sin(t*4)*.25) : .16, Math.min(1, dt*4));
  // pendants breathe very slightly
  // bursts
  for (let i = bursts.length - 1; i >= 0; i--){ const b = bursts[i]; b.t += dt; const arr = b.p.geometry.attributes.position.array;
    for (let k=0;k<b.vel.length;k++){ const v = b.vel[k]; v[1] -= 3.2*dt; arr[k*3] += v[0]*dt; arr[k*3+1] += v[1]*dt; arr[k*3+2] += v[2]*dt; }
    b.p.geometry.attributes.position.needsUpdate = true; b.p.material.opacity = Math.max(0, 1 - b.t/1.5);
    if (b.t > 1.5){ scene.remove(b.p); b.p.geometry.dispose(); b.p.material.dispose(); bursts.splice(i,1); } }
  renderer.render(scene, cam);
  // keep phones smooth: drop resolution if frames run long
  perf.acc += dt; perf.n++; if (perf.acc > 2){ const avg = perf.acc/perf.n; if (avg > .026 && DPR > 1){ DPR = Math.max(1, DPR - .25); renderer.setPixelRatio(DPR); resize(); } perf.acc = 0; perf.n = 0; }
}
const perf = {acc:0, n:0};

let boardLang = 'en';
function syncBoard(){ const l = document.documentElement.lang === 'es' ? 'es' : 'en'; if (l !== boardLang){ boardLang = l; boardMesh.material.map.dispose(); boardMesh.material.map = boardTex(l); boardMesh.material.needsUpdate = true; } }
setInterval(syncBoard, 400);
document.fonts && document.fonts.ready.then(() => { boardMesh.material.map.dispose(); boardMesh.material.map = boardTex(boardLang); boardMesh.material.needsUpdate = true; });

window.SCENE = {ready:true, anchors, frame, resize, get dragged(){ return SC.dragged; }};
resize();
HUB.layout();

if (CAPTURE){
  // render a still for the no-WebGL fallback (transparent background; the CSS sky shows through)
  setTimeout(() => { const out = document.createElement('textarea'); out.id = 'cap'; renderer.render(scene, cam); out.value = canvas.toDataURL('image/webp', .86); document.body.append(out); }, 2500);
}
</script>

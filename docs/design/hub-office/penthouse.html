/* One deliberate dark look: a lit penthouse at dusk. The sky tokens below are driven by the clock + weather. */
:root{
  color-scheme:dark;
  --bg:#0b0c0f; --ink:#f5f2ec; --ink-2:rgba(245,242,236,.76); --muted:rgba(245,242,236,.56); --faint:rgba(245,242,236,.36);
  --glass:rgba(14,14,18,.50); --glass-2:rgba(24,24,30,.72); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16); --hi:rgba(255,255,255,.07);
  --brass:#c9a45c; --brass-hi:#ead1a0; --hmp:#f5883a; --hmp-hi:#ffae72; --hmp-glow:rgba(245,136,58,.42);
  --st-working:#62d6a0; --st-idle:#b8c1d4; --st-sleeping:#93a0d8; --st-waiting:#f5883a; --st-blocked:#ff6b5f; --st-done:#e7cd95;
  --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --r:18px;
  --sky-top:#18203f; --sky-mid:#4a3f6e; --sky-low:#b0697a; --sky-glow:#f09a6c; --cloud-lit:#e89a8a; --cloud-shade:#3d3a5c;
  --land-far:#2a2438; --land:#120f18; --stars:.2; --lights:.6; --sun-y:104%; --sun:#ffcf9a; --sun-a:.8; --storm:0; --flash:0; --horizon:58%;
  --panel-w:344px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px;border-radius:10px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:500 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 20px 50px -24px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(22px) saturate(1.35);backdrop-filter:blur(22px) saturate(1.35)}

/* ---------- layout: phone first ---------- */
.app{position:relative}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px 12px;position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#26262c,#141418);border:1px solid var(--line-2);flex:none}
.mark svg{width:22px;height:22px}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.1}
.brand p{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap}
.clock{display:none}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{height:28px;min-width:36px;padding:0 10px;border-radius:999px;font:500 12px var(--mono);letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink)}
.ibtn{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.ibtn:hover{background:rgba(255,255,255,.11)}

.needs{order:5;flex:1 0 100%;margin:0;padding:12px 12px 10px;position:relative;z-index:6}
.needs-h{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.needs-h .lbl{color:var(--hmp-hi)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--hmp);color:#1b1206;font:600 12px/20px var(--f);text-align:center;box-shadow:0 0 18px var(--hmp-glow)}
.count[data-n="0"]{background:rgba(255,255,255,.12);color:var(--muted);box-shadow:none}
.sum{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.sum span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.needs ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.need{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:13px;text-align:left;background:linear-gradient(90deg,rgba(245,136,58,.14),rgba(245,136,58,.03));border:1px solid rgba(245,136,58,.28);animation:needIn .5s var(--ease) both}
.need:hover{background:linear-gradient(90deg,rgba(245,136,58,.2),rgba(245,136,58,.05))}
.need .t{flex:1;min-width:0;display:grid;gap:1px}
.need b{font-size:12px;font-weight:600;color:var(--hmp-hi);letter-spacing:.01em}
.need .ask{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .where{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .top{display:flex;gap:6px;align-items:baseline;min-width:0}
.need .top b{white-space:nowrap;flex:none}
.need .top .where{display:none}
.need .i{color:var(--muted)}
.none{padding:6px 4px 4px;font-size:14px;color:var(--muted)}
@keyframes needIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.av{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative}
.av svg{width:28px;height:28px}
.av .sd{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg),0 0 8px var(--c)}

.stage{position:relative;height:clamp(370px,108vw,540px);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.still{position:absolute;left:0;right:0;top:44px;bottom:48px;width:100%;height:calc(100% - 92px);object-fit:contain;display:none}
.no-gl .still{display:block}
.no-gl #gl{display:none}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.skyctl{position:absolute;left:16px;bottom:14px;z-index:4;display:flex;gap:8px;align-items:center}
.skyctl .seg{background:rgba(10,10,14,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.skyctl .seg button{display:inline-flex;align-items:center;gap:6px;padding:0 10px;font:500 12px var(--f);letter-spacing:0}
.skyctl .seg button .i{width:15px;height:15px}
.skyctl .ibtn{width:34px;height:34px;background:rgba(10,10,14,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.democlk{position:absolute;right:16px;bottom:14px;z-index:4;padding:6px 10px;border-radius:999px;background:rgba(10,10,14,.42);border:1px solid var(--line);font:500 12px var(--mono);color:var(--ink-2);display:flex;gap:8px;align-items:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.democlk em{font-style:normal;color:var(--muted)}
.hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:12px;color:var(--ink-2);text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;transition:opacity .6s}

.panel{padding:16px 16px 48px;display:grid;gap:14px;position:relative;z-index:6}
.roster{padding:10px}
.roster-h{display:flex;align-items:center;gap:10px;padding:4px 6px 8px}
.roster-h .rsum{display:none;margin-left:auto;gap:10px;font-size:12px;color:var(--muted)}
.roster-h .rsum span{display:inline-flex;align-items:center;gap:5px}
.roster ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.row{width:100%;display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:13px;text-align:left}
.row:hover{background:rgba(255,255,255,.05)}
.row[aria-pressed="true"]{background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px var(--line-2)}
.row .t{flex:1;min-width:0;display:grid;gap:1px}
.row .n{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.row .n small{font:500 11px var(--f);color:var(--c);letter-spacing:.01em}
.row .d{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the robot card: a bottom sheet on the phone, the top of the side panel on desktop */
.card{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;padding:18px 18px 16px;max-height:74vh;overflow:auto;transform:translateY(calc(100% + 24px));transition:transform .45s var(--ease);background:rgba(20,20,25,.82)}
.card.open{transform:none}
.card:not(.open){visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.card-h{display:flex;align-items:flex-start;gap:12px}
.card-h .av{width:52px;height:52px;border-radius:16px}
.card-h .av svg{width:44px;height:44px}
.card-h .who{flex:1;min-width:0}
.card-h h2{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:3px 9px 3px 8px;border-radius:999px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.card .role{margin-top:12px;font-size:14px;color:var(--ink-2);text-wrap:pretty}
.facts{display:grid;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fact .v{margin-top:3px;font-size:15px;font-weight:500;text-wrap:pretty}
.fact.ask .v{color:var(--hmp-hi)}
.fact.stuck .v{color:var(--st-blocked)}
.fact .s{font-size:13px;color:var(--muted);margin-top:2px}
.fact.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

/* ---------- overlay: name tags, bubbles, sleep z ---------- */
.tag{position:absolute;left:0;top:0;padding:3px 9px;border-radius:999px;font:500 11px/1.3 var(--f);letter-spacing:.01em;color:var(--ink);background:rgba(12,12,16,.56);border:1px solid var(--line-2);white-space:nowrap;opacity:0;transition:opacity .35s;will-change:transform}
.tag.on{opacity:1}
.tag.sel{background:rgba(245,242,236,.92);color:#15151a;border-color:transparent}
.bub{position:absolute;left:0;top:0;max-width:min(240px,62vw);padding:8px 11px 9px;border-radius:14px;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .35s;will-change:transform;
  background:rgba(18,18,23,.74);border:1px solid var(--line-2);box-shadow:inset 0 1px 0 var(--hi),0 14px 30px -12px rgba(0,0,0,.75);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.bub.on{opacity:1}
.bub::after{content:"";position:absolute;left:var(--tail,50%);bottom:-6px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:inherit;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);-webkit-backdrop-filter:none;backdrop-filter:none}
.bub .bh{display:flex;align-items:center;gap:6px;font:600 11px/1.2 var(--f);letter-spacing:.02em;color:var(--muted);margin-bottom:3px}
.bub .bt{font-size:13px;font-weight:500;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bub .ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none}
.bub .ic svg{width:10px;height:10px}
.bub.waiting{border-color:rgba(245,136,58,.55);box-shadow:inset 0 1px 0 var(--hi),0 0 0 4px rgba(245,136,58,.08),0 14px 34px -10px rgba(245,136,58,.45)}
.bub.waiting::after{border-color:rgba(245,136,58,.55)}
.bub.waiting .bh{color:var(--hmp-hi)}
.bub.waiting .ic{background:var(--hmp);color:#1b1206;animation:pulse 1.6s ease-in-out infinite}
.bub.blocked{background:rgba(48,16,16,.72);border-color:rgba(255,107,95,.5)}
.bub.blocked::after{border-color:rgba(255,107,95,.5)}
.bub.blocked .bh{color:#ff9d93}
.bub.blocked .ic{background:var(--st-blocked);color:#2a0b08}
.bub.done{border-color:rgba(231,205,149,.5)}
.bub.done .bh{color:var(--st-done)}
.bub.done .ic{background:var(--st-done);color:#241b09}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,136,58,.6)}50%{box-shadow:0 0 0 6px rgba(245,136,58,0)}}
.zz{position:absolute;left:0;top:0;width:40px;height:40px;opacity:0;transition:opacity .5s}
.zz.on{opacity:1}
.zz span{position:absolute;left:8px;bottom:0;font:600 13px var(--f);color:#c9d1f2;text-shadow:0 0 10px rgba(147,160,216,.8);animation:zz 3s linear infinite;opacity:0}
.zz span:nth-child(2){animation-delay:1s;font-size:11px}
.zz span:nth-child(3){animation-delay:2s;font-size:9px}
@keyframes zz{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(16px,-30px);opacity:0}}

/* ---------- the sky (the room's glass shows it; weather + time of day drive the tokens) ---------- */
.sky{position:absolute;inset:0;overflow:hidden;background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) calc(var(--horizon) - 26%),var(--sky-low) calc(var(--horizon) - 5%),var(--sky-glow) var(--horizon),var(--land-far) calc(var(--horizon) + .5%),var(--land) 100%)}
.sky .stars{position:absolute;inset:0 0 40% 0;opacity:var(--stars)}
.sky .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.sky .sun{position:absolute;left:24%;top:var(--sun-y);width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;opacity:var(--sun-a);background:radial-gradient(circle,var(--sun) 0,var(--sun) 2.6%,color-mix(in srgb,var(--sun) 40%,transparent) 5%,color-mix(in srgb,var(--sun) 12%,transparent) 22%,transparent 60%)}
.sky .clouds{position:absolute;left:-40%;right:-40%;top:0;height:calc(var(--horizon) + 2%);animation:drift 160s linear infinite}
.sky .clouds.b{animation-duration:240s;opacity:.7;top:4%}
.sky .cl{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,var(--cloud-lit) 0%,color-mix(in srgb,var(--cloud-lit) 55%,var(--cloud-shade)) 34%,color-mix(in srgb,var(--cloud-shade) 60%,transparent) 58%,transparent 72%);opacity:.55}
@keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.sky .land{position:absolute;left:0;right:0;top:var(--horizon);height:calc(100% - var(--horizon))}
.sky .hills{position:absolute;left:0;right:0;top:-18px;width:100%;height:40px}
.sky .mark-lm{position:absolute;bottom:calc(100% - var(--horizon));}
.lm{position:absolute;top:var(--horizon);transform:translateY(-100%)}
.lm svg{display:block}
.sky .town{position:absolute;left:0;right:0;top:calc(var(--horizon) + 3px);height:16px;opacity:var(--lights)}
.sky .town i{position:absolute;width:2px;height:2px;border-radius:50%;background:#ffd7a0;box-shadow:0 0 5px #ffb45e}
.beacon{animation:beacon 2.4s steps(1,end) infinite}
@keyframes beacon{0%{opacity:1}12%{opacity:.15}100%{opacity:.15}}
.sky .deck{position:absolute;left:-10%;right:-10%;top:-6%;height:calc(var(--horizon) + 4%);opacity:var(--storm);background:
  radial-gradient(60% 34% at 30% 30%,#3a3f4c 0,rgba(40,44,54,.9) 40%,transparent 72%),
  radial-gradient(55% 30% at 72% 26%,#353a46 0,rgba(38,42,52,.9) 42%,transparent 74%),
  radial-gradient(80% 30% at 50% 58%,#2b2f38 0,rgba(30,33,41,.85) 45%,transparent 75%),
  linear-gradient(to bottom,rgba(24,27,34,.95),rgba(34,38,48,.6) 70%,transparent)}
.sky .rain{position:absolute;inset:-20% -20% 0 -20%;opacity:calc(var(--storm) * .55);background:repeating-linear-gradient(104deg,transparent 0 13px,rgba(200,215,235,.28) 13px 14px,transparent 14px 29px);background-size:100% 90px;animation:rain .5s linear infinite}
@keyframes rain{to{background-position:22px 90px}}
.sky .flash{position:absolute;inset:0;background:radial-gradient(90% 70% at 62% 20%,rgba(235,240,255,.95),rgba(200,212,255,.35) 50%,transparent 80%);opacity:var(--flash);mix-blend-mode:screen}
.sky .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 55%,transparent 55%,rgba(5,6,10,.45) 100%)}

/* ---------- desktop: the room fills the screen, the UI floats on glass ---------- */
@media (min-width:900px){
  body{overflow:hidden}
  .app{height:100vh;min-height:680px;overflow:hidden}
  .stage{position:absolute;inset:0;height:auto}
  .bar{position:absolute;top:0;left:0;right:0;padding:18px 28px;pointer-events:none;flex-wrap:nowrap;align-items:flex-start}
  .bar > *{pointer-events:auto}
  .brand{flex:none;padding-top:4px}
  .clock{margin-top:5px}
  .seg{margin-top:5px}
  .needs{order:0;flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-radius:16px;margin:0 8px}
  .needs-h{padding:0;flex:none}
  .needs .sum{display:none}
  .needs ul{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden}
  .needs li{flex:1 1 0;min-width:0;max-width:420px}
  .need{padding:6px 12px 6px 6px}
  .need .top .where{display:inline;font-size:11.5px}
  .need .t > .where{display:none}
  .need .ask{font-size:14px}
  .none{padding:0 6px;font-size:13px}
  .roster-h .rsum{display:flex}
  .brand h1{font-size:22px}
  .clock{display:flex;align-items:center;gap:10px;margin-left:8px;white-space:nowrap;padding:7px 12px;border-radius:999px;background:rgba(10,10,14,.36);border:1px solid var(--line);font:500 13px var(--mono);color:var(--ink-2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .clock em{font-style:normal;color:var(--muted)}
  .bar .spacer{flex:1}
  .panel{position:absolute;top:112px;right:28px;bottom:28px;width:var(--panel-w);padding:0;display:flex;flex-direction:column;gap:12px}
  .roster{flex:1;min-height:0;overflow:auto}
  .card{position:relative;left:auto;right:auto;bottom:auto;transform:none;max-height:none;flex:none;display:none;background:var(--glass-2)}
  .card.open{display:block;animation:cardIn .45s var(--ease)}
  .skyctl{left:28px;bottom:26px}
  .still{left:24px;top:120px;bottom:60px;right:calc(var(--panel-w) + 56px);width:auto;height:auto}
  .democlk{display:none}
  .hint{top:auto;bottom:34px;left:auto;right:calc(var(--panel-w) + 56px);text-align:right}
  .bub{max-width:260px}
}
.test .bub,.test .tag,.test .need,.test .zz{transition:none!important;animation-duration:0s!important}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:899px){ .bar .clock,.bar .spacer{display:none} .bub{max-width:min(210px,56vw);padding:6px 9px 7px;border-radius:12px} .bub{display:flex;align-items:center;gap:6px;max-width:min(190px,50vw)} .bub .bh{margin:0} .bub .bh .nm{display:none} .bub .bt{font-size:12px;-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block} }
@media (max-width:380px){ .sum .opt{display:none} }
@media (prefers-reduced-motion:reduce){
  .sky .clouds,.sky .rain,.zz span,.bub.waiting .ic,.beacon,.sky .stars i,.need{animation:none!important}
  .zz span{opacity:1}.zz span:nth-child(2){transform:translate(8px,-14px)}.zz span:nth-child(3){transform:translate(16px,-26px)}
  .card{transition:none}
}

const agents = CREW.map((c,i) => ({def:c, id:c.id, x:0, z:0, vx:0, vz:0, yaw:0, yawDraw:0, bank:0, pitch:0,
  path:null, s:0, len:0, moving:false, v:0, spot:null, queue:[], pose:'idle', poseT:0, st:'idle', doing:null, ask:null, reason:null, where:null, at:0,
  wanderAt:0, phase:i*1.37, blinkAt:2+i*0.7, blinkT:0, fade:1}));
const byId = Object.fromEntries(agents.map(a => [a.id, a]));
const claims = new Map();   // pool spot -> agent id

function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function route(from, to){   // Dijkstra over the aisles
  const d = {}, prev = {}, left = new Set(Object.keys(NODES));
  for (const k of left) d[k] = Infinity; d[from] = 0;
  while (left.size){
    let u = null; for (const k of left) if (u === null || d[k] < d[u]) u = k;
    left.delete(u); if (u === to) break;
    for (const [a,b] of EDGES){ const v = a===u ? b : b===u ? a : null; if (!v || !left.has(v)) continue;
      const nd = d[u] + dist(NODES[u], NODES[v]); if (nd < d[v]) { d[v] = nd; prev[v] = u; } }
  }
  const out = [to]; let k = to; while (k !== from && prev[k]) { k = prev[k]; out.unshift(k); }
  return out;
}
function nearestNode(x,z){ let best=null, bd=1e9; for (const [k,p] of Object.entries(NODES)){ const dd = Math.hypot(p[0]-x,p[1]-z); if (dd<bd){bd=dd;best=k;} } return best; }
function claim(a, pool){
  release(a);
  const list = POOL[pool]; let pick = list.find(s => !claims.has(s)) || list[Math.floor(Math.random()*list.length)];
  if (pool==='lounge'){ const free = list.filter(s => !claims.has(s) && s !== a.lastLounge); if (free.length) pick = free[Math.floor(Math.random()*free.length)]; a.lastLounge = pick; }
  claims.set(pick, a.id); return pick;
}
function release(a){ for (const [s,id] of claims) if (id === a.id) claims.delete(s); }
function spotFor(a, key){ if (key === 'desk') { release(a); return DESK[a.id]; } if (key === 'here') return null; return claim(a, key); }

function planPath(a, spot){
  const pts = [[a.x, a.z]];
  const cur = a.spot;
  let startNode;
  if (cur && Math.hypot(cur.x-a.x, cur.z-a.z) < 0.3){ for (const p of (cur.via||[]).slice().reverse()) pts.push(p); startNode = cur.node; }
  else startNode = nearestNode(a.x, a.z);
  const nodes = route(startNode, spot.node);
  for (const n of nodes) pts.push(NODES[n]);
  for (const p of (spot.via||[])) pts.push(p);
  pts.push([spot.x, spot.z]);
  const clean = [pts[0]]; for (const p of pts.slice(1)) if (dist(p, clean[clean.length-1]) > 0.05) clean.push(p);
  // skip a node that doubles back (keeps glides smooth)
  for (let i=1; i<clean.length-1; i++){ const a0=clean[i-1], b0=clean[i], c0=clean[i+1]; const ab=[b0[0]-a0[0],b0[1]-a0[1]], bc=[c0[0]-b0[0],c0[1]-b0[1]];
    if (ab[0]*bc[0]+ab[1]*bc[1] < -0.2*Math.hypot(...ab)*Math.hypot(...bc) && Math.hypot(...ab) < 0.9) { clean.splice(i,1); i--; } }
  const cum = [0]; for (let i=1;i<clean.length;i++) cum.push(cum[i-1] + dist(clean[i], clean[i-1]));
  return {pts:clean, cum, len:cum[cum.length-1]};
}
function pointAt(p, s){
  if (s <= 0) return p.pts[0]; if (s >= p.len) return p.pts[p.pts.length-1];
  let i = 1; while (p.cum[i] < s) i++;
  const t = (s - p.cum[i-1]) / (p.cum[i] - p.cum[i-1]); const A = p.pts[i-1], B = p.pts[i];
  return [A[0] + (B[0]-A[0])*t, A[1] + (B[1]-A[1])*t];
}

function place(a, spot){ a.x = spot.x; a.z = spot.z; a.vx = a.vz = 0; a.yaw = a.yawDraw = spot.yaw; a.spot = spot; a.moving = false; a.path = null; }
function go(a, spot){
  if (!spot) return false;
  if (a.spot === spot && Math.hypot(spot.x-a.x, spot.z-a.z) < 0.08) return false;
  if (RM.matches){ place(a, spot); a.fade = 0; return false; }
  a.path = planPath(a, spot); a.s = 0; a.v = 0; a.moving = true; a.target = spot; a.spot = null; a.pose = 'glide'; a.poseT = 0;
  return true;
}
function runQueue(a){
  while (a.queue.length){
    const step = a.queue[0];
    if (!step.started){ step.started = true; const spot = step.spot ? spotFor(a, step.spot) : null; if (spot && go(a, spot)) return; }
    if (a.moving) return;
    if (!step.posed){ step.posed = true; a.pose = step.pose; a.poseT = 0; if (a.spot) a.yaw = a.spot.yaw; }
    if (step.dur && a.poseT < step.dur) return;
    if (!step.dur) { a.queue.shift(); return; }
    a.queue.shift();
  }
}
function workPose(a){ const w = DESK[a.id].work; return w === 'type' ? 'type' : w === 'radar' ? 'radar' : 'read'; }
function setState(a, st, info, instant){
  a.st = st; a.doing = info.doing || a.doing; a.ask = info.ask || null; a.reason = info.reason || null; a.where = info.where || null;
  a.at = instant && info.at != null ? START + info.at : minuteNow();
  const q = [];
  if (st === 'working') q.push(info.spot === 'standup' ? {spot:'standup', pose:'meet'} : {spot:'desk', pose:workPose(a)});
  else if (st === 'sleeping') q.push({spot:'desk', pose:'sleep'});
  else if (st === 'waiting') q.push({spot:'front', pose:'wait'});
  else if (st === 'blocked') q.push({spot:'desk', pose:'blocked'});
  else if (st === 'done') { q.push({spot:null, pose:'cheer', dur:2.4}, {spot:'coffee', pose:'coffee', dur:6}, {spot:'lounge', pose:'lounge'}); }
  else q.push({spot:info.spot || 'lounge', pose:(info.spot === 'coffee' ? 'coffee' : 'lounge')});
  a.queue = q; a.wanderAt = 0;
  if (instant){ const step = q[0]; const spot = step.spot ? spotFor(a, step.spot) : a.spot; if (spot) place(a, spot); step.started = step.posed = true; a.pose = step.pose; a.poseT = 3 + a.phase; if (!step.dur) q.shift(); }
  if (info.storm != null) sky.stormTo = info.storm;
  feedChanged = true;
}

function stepAgent(a, dt){
  a.poseT += dt; a.fade = Math.min(1, a.fade + dt*2.5);
  if (a.moving){
    const p = a.path, k = 38, damp = 2*Math.sqrt(k)*0.95, n = Math.ceil(dt/0.012), h = dt/n; let c;
    for (let i = 0; i < n; i++){   // small steps keep the glide spring stable on slow frames
      const left = p.len - a.s;
      a.v = Math.min(1.9, a.v + 2.6*h, Math.sqrt(2*1.9*Math.max(0,left)) + 0.05);
      a.s = Math.min(p.len, a.s + a.v*h);
      c = pointAt(p, Math.min(p.len, a.s + 0.18));
      a.vx += (k*(c[0]-a.x) - damp*a.vx)*h; a.vz += (k*(c[1]-a.z) - damp*a.vz)*h;
      a.x += a.vx*h; a.z += a.vz*h;
    }
    if (a.s >= p.len && Math.hypot(c[0]-a.x, c[1]-a.z) < 0.03 && Math.hypot(a.vx,a.vz) < 0.08){ place(a, a.target); a.pose = 'settle'; }
  }
  const sp = Math.hypot(a.vx, a.vz);
  const want = (a.moving && sp > 0.12) ? Math.atan2(a.vx, a.vz) : (a.spot ? a.spot.yaw : a.yaw);
  let d = want - a.yawDraw; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
  const turn = d * Math.min(1, dt*5.5); a.yawDraw += turn;
  a.bank += ((a.moving ? Math.max(-.22, Math.min(.22, -turn/dt*0.05)) : 0) - a.bank) * Math.min(1, dt*6);
  a.pitch += ((a.moving ? Math.min(.14, sp*0.07) : 0) - a.pitch) * Math.min(1, dt*5);
  runQueue(a);
  // idle life: drift between lounge spots every so often
  if (!a.moving && !a.queue.length && (a.st === 'idle' || a.st === 'done')){
    if (!a.wanderAt) a.wanderAt = a.poseT + 9 + Math.random()*7;
    else if (a.poseT > a.wanderAt){ a.wanderAt = 0; a.queue = [{spot:'lounge', pose:'lounge'}]; }
  }
  // blink
  if (a.blinkT > 0) a.blinkT -= dt; else if ((a.blinkAt -= dt) <= 0){ a.blinkT = 0.13; a.blinkAt = 2.4 + Math.random()*4; }
}

{
  scene.updateMatrixWorld(true);
  const groups = new Map();
  for (const o of scene.children.slice()){
    if (!o.isMesh || o.isInstancedMesh || o.userData.dyn) continue; const m = o.material;
    if (Array.isArray(m) || m.transparent || !o.geometry.index) continue;
    const key = m.uuid + (o.castShadow ? 'c' : '') + (o.receiveShadow ? 'r' : ''); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(o);
  }
  for (const list of groups.values()){
    if (list.length < 2) continue;
    const geos = list.map(o => { const g = o.geometry.clone(); for (const k of Object.keys(g.attributes)) if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k); g.morphAttributes = {}; g.clearGroups(); g.applyMatrix4(o.matrixWorld); return g; });
    if (geos.some(g => !g.attributes.uv || !g.attributes.normal)) continue;
    const merged = mergeGeometries(geos, false); if (!merged) continue;
    const mesh = new THREE.Mesh(merged, list[0].material); mesh.castShadow = list[0].castShadow; mesh.receiveShadow = list[0].receiveShadow; scene.add(mesh);
    for (const o of list){ scene.remove(o); o.geometry.dispose(); } for (const g of geos) g.dispose();
  }
}

const lampSofa = new THREE.PointLight(0xffc27f, 14, 7, 2); lampSofa.position.set(3.95, 1.55, .1); scene.add(lampSofa);
const lampKing = new THREE.PointLight(0xffc88a, 5, 4, 2); lampKing.position.set(1.2, 1.1, -2.5); scene.add(lampKing);
const lampRead = new THREE.PointLight(0xffc88a, 7, 5, 2); lampRead.position.set(-4.5, 1.45, 2.4); scene.add(lampRead);

/* ---------- camera: orthographic 3/4 view, slow drift, drag to turn ---------- */
const cam = new THREE.OrthographicCamera(-5, 5, 5, -5, .1, 100);
const TARGET = new THREE.Vector3(.1, .85, .25);
const view = {az:Math.PI/4 - .06, el:.6, drag:0, dragV:0, fit:null};
const BOX = []; for (const x of [-FX, FX]) for (const z of [-FZ, FZ]) BOX.push(new THREE.Vector3(x,-.6,z)); for (const p of [[-FX,WALL+.1,-FZ],[-FX,WALL+.1,FZ],[FX,WALL+.1,-FZ]]) BOX.push(new THREE.Vector3(...p));
function aim(az){ const d = 30; cam.position.set(TARGET.x + Math.sin(az)*Math.cos(view.el)*d, TARGET.y + Math.sin(view.el)*d, TARGET.z + Math.cos(az)*Math.cos(view.el)*d); cam.up.set(0,1,0); cam.lookAt(TARGET); cam.updateMatrixWorld(); }
let W = 1, H = 1;
function area(){
  const wide = HUB.wide;
  if (CAPTURE) return {x0:20, y0:20, x1:W-20, y1:H-20};
  if (wide){ const pw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--panel-w')) || 344; return {x0:30, y0:128, x1:W - pw - 60, y1:H - 64}; }
  return {x0:-18, y0:46, x1:W + 18, y1:H - 50};
}
function fit(){
  aim(view.az);
  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9; const v = new THREE.Vector3();
  for (const p of BOX){ v.copy(p).applyMatrix4(cam.matrixWorldInverse); mnx = Math.min(mnx, v.x); mxx = Math.max(mxx, v.x); mny = Math.min(mny, v.y); mxy = Math.max(mxy, v.y); }
  const A = area(), aw = A.x1 - A.x0, ah = A.y1 - A.y0;
  const s = Math.min(aw/(mxx-mnx), ah/(mxy-mny));
  const offx = A.x0 + (aw - (mxx-mnx)*s)/2, offy = A.y0 + (ah - (mxy-mny)*s)/2;
  cam.left = mnx - offx/s; cam.right = cam.left + W/s; cam.top = mxy + offy/s; cam.bottom = cam.top - H/s;
  cam.updateProjectionMatrix(); view.scale = s;
  // the horizon line sits behind the glass wall at about eye height
  const hz = new THREE.Vector3(0, 1.25, -FZ).project(cam); document.getElementById('sky').style.setProperty('--horizon', ((1 - hz.y)/2*100).toFixed(2) + '%');
}
function resize(){
  W = stage.clientWidth; H = stage.clientHeight; renderer.setSize(W, H, false); fit();
}
// drag to turn the room a little (tap still selects: the core ignores taps after a drag)
let dragStart = null; const SC = {dragged:false};
stage.addEventListener('pointerdown', e => { if (e.target.closest('.skyctl,.bub')) return; dragStart = {x:e.clientX, y:e.clientY, az:view.drag}; SC.dragged = false; });
window.addEventListener('pointermove', e => { if (!dragStart) return; const dx = e.clientX - dragStart.x; if (Math.abs(dx) > 7 && Math.abs(dx) > Math.abs(e.clientY - dragStart.y)) SC.dragged = true;
  if (SC.dragged){ view.drag = Math.max(-.55, Math.min(.55, dragStart.az - dx*0.004)); view.lastDrag = performance.now(); } });
window.addEventListener('pointerup', () => { dragStart = null; setTimeout(() => SC.dragged = false, 0); });

/* ---------- per-frame ---------- */
const V = new THREE.Vector3(), anchors = {};
const HOVER = {glide:.24, settle:.22, lounge:.2, type:.36, read:.34, radar:.3, meet:.24, wait:.5, blocked:.34, cheer:.36, coffee:.3, sleep:.035};
const lerp = (a,b,t) => a + (b-a)*t;
const ORANGE = new THREE.Color(0xf5883a), RED = new THREE.Color(0xff4d42), DIM = new THREE.Color(0x5b3a26), EYE = new THREE.Color(0xfff2e0), EYE_DIM = new THREE.Color(0x3a3f55), EYE_RED = new THREE.Color(0xffc7bd);
const cTmp = new THREE.Color();
function animRobot(a, R, t, dt){
  const rm = RM.matches, pose = a.pose, pt = a.poseT, ph = a.phase;
  if (pose !== R.lastPose){ R.lastPose = pose; if (pose === 'cheer' && !rm){ R.root.updateMatrixWorld(); burst(a.x, 1.35, a.z); } }
  R.root.position.set(a.x, 0, a.z);
  let spin = 0; if (pose === 'cheer' && !rm){ const k = Math.min(1, pt/1.1); spin = (1 - Math.pow(1-k, 3)) * Math.PI*2; }
  R.root.rotation.y = a.yawDraw + spin;
  const seat = a.spot && a.spot.seat ? .2 : 0;
  R.h = lerp(R.h, (HOVER[pose] ?? .22) + seat, Math.min(1, dt*3));
  const breath = rm ? 0 : Math.sin(t*1.7 + ph);
  const bob = breath * (pose === 'sleep' ? .008 : .02);
  const jump = (pose === 'cheer' && !rm) ? Math.abs(Math.sin(pt*5.2)) * .2 * Math.max(0, 1 - pt/2.2) : 0;
  R.hov.position.y = R.h + bob + jump;
  R.hov.rotation.z = a.bank; R.hov.rotation.x = a.pitch;
  // head
  let hp = 0, hy = 0, hr = 0;
  if (pose === 'read') hp = .26; else if (pose === 'radar') hp = .38; else if (pose === 'sleep') hp = .42; else if (pose === 'type') hp = .1 + (rm?0:Math.sin(t*2.1+ph)*.03);
  else if (pose === 'blocked'){ hp = .2; hr = rm ? .1 : Math.sin(t*1.3+ph)*.12; } else if (pose === 'wait') hp = -.12;
  else if (pose === 'lounge' || pose === 'settle'){ hy = rm ? 0 : Math.sin(t*.35 + ph)*.45; hp = rm ? 0 : Math.sin(t*.23+ph)*.06; }
  else if (pose === 'meet') hp = rm ? 0 : Math.max(0, Math.sin(t*1.4+ph))*.12;
  R.head.rotation.x = lerp(R.head.rotation.x, hp, Math.min(1, dt*4)); R.head.rotation.y = lerp(R.head.rotation.y, hy, Math.min(1, dt*3)); R.head.rotation.z = lerp(R.head.rotation.z, hr, Math.min(1, dt*4));
  if (a.crown) a.crown.rotation.y = rm ? 0 : t*.35;
  // eyes: blink, sleep, state tint
  const closed = pose === 'sleep' ? .22 : (a.blinkT > 0 && !rm ? .12 : 1);
  for (const e of R.eyes) e.scale.y = lerp(e.scale.y, .6*closed, Math.min(1, dt*22));
  R.eyeMat.color.lerp(pose === 'sleep' ? EYE_DIM : pose === 'blocked' ? EYE_RED : EYE, Math.min(1, dt*4));
  // the light strip
  let I = .7, col = ORANGE;
  if (pose === 'sleep') I = .14 + (rm ? 0 : (Math.sin(t*.9 + ph)*.5 + .5)*.12);
  else if (pose === 'lounge' || pose === 'settle' || pose === 'coffee') I = .45 + (rm ? .15 : (Math.sin(t*1.2 + ph)*.5 + .5)*.4);
  else if (pose === 'type' || pose === 'read' || pose === 'radar' || pose === 'meet') I = .95;
  else if (pose === 'wait') I = .7 + (rm ? .2 : (Math.sin(t*4.2)*.5 + .5)*.3);
  else if (pose === 'blocked'){ col = RED; I = .6 + (rm ? .2 : (Math.random() < .06 ? -.3 : (Math.sin(t*3)*.5+.5)*.35)); }
  else if (pose === 'cheer') I = 1; else if (pose === 'glide') I = .85;
  cTmp.copy(DIM).lerp(col, Math.min(1, I)); R.stripMat.color.lerp(cTmp, Math.min(1, dt*8));
  R.haloMat.color.copy(col); R.haloMat.opacity = lerp(R.haloMat.opacity, .08 + I*.34, Math.min(1, dt*6));
  R.glow.material.color.copy(col); R.glow.material.opacity = lerp(R.glow.material.opacity, (pose === 'sleep' ? .03 : .06 + I*.12) * (pose === 'wait' ? 1.8 : 1), Math.min(1, dt*5));
  const chasing = (pose === 'type' || pose === 'read' || pose === 'radar' || pose === 'glide') && !rm;
  R.chase.visible = chasing; if (chasing){ const ang = t*3.2 + ph; R.chase.position.set(Math.cos(ang)*.218, .25, Math.sin(ang)*.218); }
  // hands
  const hl = R.hl, L0 = hl[0], R0 = hl[1];
  const setH = (v, x, y, z) => v.set(x, y, z);
  if (pose === 'type'){ setH(L0, -.12, .5 + (rm?0:Math.max(0,Math.sin(t*15+ph))*.025), .3); setH(R0, .12, .5 + (rm?0:Math.max(0,Math.sin(t*15+ph+Math.PI))*.025), .3); }
  else if (pose === 'read' || pose === 'radar'){ setH(L0, -.12, .55, .25); setH(R0, .12, .55 + (rm?0:Math.max(0,Math.sin(t*.7+ph)-.9)*.3), .27); }
  else if (pose === 'wait'){ setH(L0, -.27, .33, .06); setH(R0, .3, .8 + (rm?0:Math.sin(t*6)*.04), .1 + (rm?0:Math.sin(t*6)*.05)); }
  else if (pose === 'blocked'){ setH(L0, -.25, .86, .06); setH(R0, .25, .86, .06); }
  else if (pose === 'cheer'){ setH(L0, -.27, 1.02, 0); setH(R0, .27, 1.02, 0); }
  else if (pose === 'coffee'){ const sip = rm ? 0 : Math.max(0, Math.sin(t*.9 + ph)); setH(L0, -.27, .32, .06); setH(R0, .1, .48 + sip*.24, .25); }
  else if (pose === 'sleep'){ setH(L0, -.26, .2, .05); setH(R0, .26, .2, .05); }
  else if (pose === 'meet'){ setH(L0, -.27, .33, .06); setH(R0, .19, .5 + (rm?0:Math.max(0,Math.sin(t*1.1+ph))*.08), .22); }
  else { const sw = rm ? 0 : Math.sin(t*1.7 + ph)*.02; setH(L0, -.28, .32 + sw, .05); setH(R0, .28, .32 - sw, .05); }
  const hk = Math.min(1, dt*(pose === 'type' ? 18 : 7));
  R.hands[0].position.lerp(L0, hk); R.hands[1].position.lerp(R0, hk);
  // props
  const reading = pose === 'read' || pose === 'meet' && a.id === 'code';
  R.tablet.visible = reading; if (reading){ R.tablet.position.set(0, R.hands[0].position.y + .02, .3); R.tablet.rotation.set(.9, 0, 0); }
  R.cup.visible = pose === 'coffee'; if (R.cup.visible){ R.cup.position.copy(R.hands[1].position).add(V.set(0,.06,.02)); }
  R.steam.forEach((s,i) => { const on = pose === 'coffee' && !rm; s.visible = on; const k = ((t*.6 + i/3) % 1); s.material.opacity = on ? Math.sin(k*Math.PI)*.35 : 0; if (on) s.position.set(R.cup.position.x + Math.sin(k*6+i)*.02, R.cup.position.y + .06 + k*.22, R.cup.position.z); s.scale.setScalar(.05 + k*.06); });
  if (a.tip) a.tip.material.color.setHex(pose === 'sleep' ? 0x40221a : (rm || Math.sin(t*4) > 0 ? 0xff6a3d : 0x5a2615));
  // floor: contact shadow + state ring
  const hh = R.hov.position.y; R.shadow.scale.setScalar(.95 - hh*.45); R.shadow.material.opacity = Math.max(.15, .62 - hh*.55);
  let rc = null, rop = 0, rs = 1;
  if (pose === 'wait'){ rc = ORANGE; const k = rm ? .5 : (t*.8) % 1; rs = 1 + k*.9; rop = (1-k)*.85; }
  else if (pose === 'blocked'){ rc = RED; rop = .35 + (rm ? 0 : Math.sin(t*3)*.15); }
  else if (pose === 'cheer'){ rc = new THREE.Color(0xead1a0); const k = Math.min(1, pt/1.2); rs = 1 + k*1.6; rop = (1-k)*.9; }
  else if (HUB.selected === a.id){ rc = EYE; rop = .35; }
  if (rc){ R.ring.material.color.copy(rc); } R.ring.material.opacity = lerp(R.ring.material.opacity, rop, Math.min(1, dt*10)); R.ring.scale.setScalar(rs);
  const sel = HUB.selected === a.id && pose !== 'wait' && pose !== 'blocked'; R.ring2.material.color.copy(EYE); R.ring2.material.opacity = lerp(R.ring2.material.opacity, sel ? .5 : (pose === 'wait' ? .55 : 0), Math.min(1, dt*8));
  if (pose === 'wait') R.ring2.material.color.copy(ORANGE); R.ring2.scale.setScalar(pose === 'wait' ? 1.05 : 1.15);
  R.ring.visible = R.ring.material.opacity > .01; R.ring2.visible = R.ring2.material.opacity > .01;
  // fade in after a reduced-motion jump
  // overlay anchor: top of the head, and the floor under the robot
  V.set(a.x, hh*1.24 + (a.crown ? 1.46 : 1.3), a.z).project(cam); const ax = (V.x+1)/2*W, ay = (1-V.y)/2*H;
  V.set(a.x, .0, a.z).project(cam); anchors[a.id] = {x:ax, y:ay, fx:(V.x+1)/2*W, fy:(1-V.y)/2*H};
}

/* sky -> lights */
const cA = new THREE.Color(), cB = new THREE.Color();
function lightFromSky(t){
  const s = HUB.sky.state; if (!s) return;
  const alt = s.alt, storm = s.storm, flash = s.flash;
  const day = Math.max(0, Math.min(1, (alt + 4)/20));                  // 0 night .. 1 day
  const low = Math.max(0, 1 - Math.abs(alt - 2)/12);                   // golden-hour weight
  cA.setRGB(s.glow[0]/255, s.glow[1]/255, s.glow[2]/255, THREE.SRGBColorSpace);
  sun.color.copy(cA).lerp(new THREE.Color(0xffffff), day*.6).lerp(new THREE.Color(0x9fb2d8), storm*.8);
  sun.intensity = (0.35 + low*1.9 + day*1.4) * (1 - storm*.75) + flash*2.5;
  const el = Math.max(.12, (alt + 8)/50);
  sun.position.set(-4.5, 3 + el*14, -12); sun.target.position.set(0,0,0);
  cB.setRGB(s.top[0]/255, s.top[1]/255, s.top[2]/255, THREE.SRGBColorSpace); hemi.color.copy(cB).lerp(new THREE.Color(0xd9d6e4), .62 + day*.25);
  hemi.groundColor.setHex(0x4a3a30); hemi.intensity = (1.05 + day*.6) * (1 - storm*.3) + flash*1.6;
  const lamps = 1 - day*.75 + storm*.35;
  lampTable.intensity = 28*lamps; lampSofa.intensity = 14*lamps; lampKing.intensity = 5*lamps; lampRead.intensity = 7*lamps;
  MAT.opal.emissiveIntensity = .5 + 1.4*lamps;
  scene.environmentIntensity = .62 + day*.35 - storm*.2;
  MAT.glass.opacity = .1 + (1-day)*.06;
}

let onScreen = true;
new IntersectionObserver(es => { onScreen = es[0].isIntersecting; }).observe(stage);
function frame(t, dt){
  if (!onScreen && !CAPTURE) return;
  const now = performance.now();
  const drift = RM.matches || CAPTURE ? 0 : Math.sin(t*.05)*.05;
  if (!dragStart && view.lastDrag && now - view.lastDrag > 5000) view.drag *= Math.pow(.2, dt);
  const az = Math.PI/4 - .06 + drift + view.drag;
  if (Math.abs(az - view.azNow || 1) > 1e-5){ view.azNow = az; aim(az); }
  lightFromSky(t);
  for (const a of HUB.agents) animRobot(a, robots[a.id], t, dt);
  // station screens wake when their robot works there
  for (const [id, sc] of Object.entries(screens)){
    const a = HUB.byId[id], here = a && a.spot === HUB.DESK[id];
    const on = here && (a.pose === 'type' || a.pose === 'read') ? .95 : here && a.pose === 'blocked' ? .5 : .16;
    sc.on = lerp(sc.on, on, Math.min(1, dt*3)); sc.m.material.opacity = sc.on;
    sc.m.material.color.setHex(here && a.pose === 'blocked' ? 0xff6b5f : 0xffffff);
    if (here && a.pose === 'type' && !RM.matches) sc.t.offset.y = (sc.t.offset.y + dt*.06) % 1;
  }
  // radar: sweeps while Storm Watch is up, blips once it finds hail
  const sw = HUB.byId['storm-watch'], awake = sw.pose !== 'sleep';
  radar.sweep.material.opacity = lerp(radar.sweep.material.opacity, awake ? .9 : 0, Math.min(1, dt*2));
  radar.disc.material.opacity = lerp(radar.disc.material.opacity, awake ? .75 : .22, Math.min(1, dt*2));
  if (!RM.matches) radar.sweep.rotation.z -= dt*1.6;
  const hail = HUB.sky.state && HUB.sky.state.storm > .15 || (sw.st === 'done');
  radar.blips.forEach((b,i) => { b.material.opacity = lerp(b.material.opacity, hail ? .6 + Math.sin(t*3+i)*.35 : 0, Math.min(1, dt*3)); });
  // "your spot" glows when someone is waiting on you
  const waiting = HUB.agents.some(a => a.pose === 'wait');
  spot.glow.material.opacity = lerp(spot.glow.material.opacity, waiting ? .55 + (RM.matches ? 0 : Math.sin(t*4)*.25) : .16, Math.min(1, dt*4));
  // pendants breathe very slightly
  // bursts
  for (let i = bursts.length - 1; i >= 0; i--){ const b = bursts[i]; b.t += dt; const arr = b.p.geometry.attributes.position.array;
    for (let k=0;k<b.vel.length;k++){ const v = b.vel[k]; v[1] -= 3.2*dt; arr[k*3] += v[0]*dt; arr[k*3+1] += v[1]*dt; arr[k*3+2] += v[2]*dt; }
    b.p.geometry.attributes.position.needsUpdate = true; b.p.material.opacity = Math.max(0, 1 - b.t/1.5);
    if (b.t > 1.5){ scene.remove(b.p); b.p.geometry.dispose(); b.p.material.dispose(); bursts.splice(i,1); } }
  renderer.render(scene, cam);
  // keep phones smooth: drop resolution if frames run long
  perf.acc += dt; perf.n++; if (perf.acc > 2){ const avg = perf.acc/perf.n; if (avg > .026 && DPR > 1){ DPR = Math.max(1, DPR - .25); renderer.setPixelRatio(DPR); resize(); } perf.acc = 0; perf.n = 0; }
}
const perf = {acc:0, n:0};

let boardLang = 'en';
function syncBoard(){ const l = document.documentElement.lang === 'es' ? 'es' : 'en'; if (l !== boardLang){ boardLang = l; boardMesh.material.map.dispose(); boardMesh.material.map = boardTex(l); boardMesh.material.needsUpdate = true; } }
setInterval(syncBoard, 400);
document.fonts && document.fonts.ready.then(() => { boardMesh.material.map.dispose(); boardMesh.material.map = boardTex(boardLang); boardMesh.material.needsUpdate = true; });

window.SCENE = {ready:true, anchors, frame, resize, get dragged(){ return SC.dragged; }, get info(){ return renderer.info.render; }};
resize();
HUB.layout();

if (CAPTURE){
  // render a still for the no-WebGL fallback (transparent background; the CSS sky shows through)
  setTimeout(() => { const out = document.createElement('textarea'); out.id = 'cap'; renderer.render(scene, cam); out.value = canvas.toDataURL('image/webp', .84); document.body.append(out); }, 7000);
}
</script>

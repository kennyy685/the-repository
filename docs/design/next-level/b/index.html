<!doctype html>
<!--
  Direction B, "The Brief": Aldaba writes your morning; the hail field is drawn as generative topography.
  Borrowed from (and where):
  - Apple keynote / Apple ad title cards: one oversized word, then one line of fact (apple.com/apple-events).
  - Linear, "A calmer interface for a product in motion" (2026-03): warm graphite neutrals, one accent,
    120-180 ms eased UI feedback. https://linear.app/now/behind-the-latest-design-refresh
  - Vercel / Rauno Web Interface Guidelines: animate transform/opacity, motion explains cause and effect,
    interruptible. https://vercel.com/design/guidelines
  - Inigo Quilez, iso-lines from a scalar field with screen-space derivatives (fwidth) for constant-width
    anti-aliased contours. https://iquilezles.org/articles/distance/
  - Swisstopo / National Geographic atlas conventions: index contours every 5th line, detail loupe with a
    leader line, locator inset, quiet italic water labels. https://www.swisstopo.admin.ch/en/maps
  - Apple Liquid Glass (WWDC25 "Meet Liquid Glass"): glass only on controls, text on solid.
    https://developer.apple.com/videos/play/wwdc2025/219/
  - Apple Weather: layout reshapes around what matters now.
  Data: ../shared/data.js (window.NL): NOAA SPC + MRMS swaths (engine hh.py), Nebraska GIS streets/rivers,
  Census ACS. Homes are FAKE samples. No owner names. No network needed.
-->
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aldaba Morning Brief</title>
<style>
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(../shared/fonts/GeistMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Bricolage L";src:url(../shared/fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --page:#07080a;--page-2:#0c0d10;--text:#f1f2f4;--text-2:#b8bbc2;--muted:#80838b;--faint:#5a5d64;
  --rule:#1f2125;--rule-2:#2c2e33;--chip:#18191d;--glass:rgba(22,23,27,.62);
  --acc:#f5883a;--acc-ink:#ffa766;--on-acc:#1b1206;--acc-bg:rgba(245,136,58,.13);
  --h1:#f2c14e;--h15:#f5883a;--h2:#ff4f5a;
  --display:"Bricolage Grotesque","Bricolage L",system-ui,sans-serif;
  --ui:"Geist","Geist L",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono","Geist Mono L",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --page:#eef0ee;--page-2:#e6e8e4;--text:#18191c;--text-2:#3d3f45;--muted:#6c6f77;--faint:#9a9ca1;
  --rule:#d9dbd6;--rule-2:#c9cbc5;--chip:#e2e4df;--glass:rgba(244,245,242,.7);
  --acc:#f5883a;--acc-ink:#a4520f;--on-acc:#1b1206;--acc-bg:rgba(245,136,58,.14);
  --h1:#c9960e;--h15:#d8661a;--h2:#d9303c;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background-color .18s var(--ease),color .18s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- top line ---------- */
.top{position:absolute;inset:0 0 auto 0;height:64px;display:flex;align-items:center;gap:18px;padding:0 28px 0 min(64px,4.4vw);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:650 17px/1 var(--display);letter-spacing:-.02em}
.brand svg{width:26px;height:26px;display:block}
.brand .ink{stroke:var(--text)}.brand .dot{fill:var(--text)}
.when{font:500 12.5px/1 var(--mono);color:var(--muted);letter-spacing:.02em;padding-left:18px;border-left:1px solid var(--rule-2)}
.when b{color:var(--text-2);font-weight:500}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--glass);border:1px solid var(--rule-2);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.seg button{height:26px;min-width:34px;padding:0 9px;border-radius:7px;font:500 11.5px/1 var(--mono);color:var(--muted);transition:background-color .14s var(--ease),color .14s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--text)}
.seg button:hover{color:var(--text)}
.seg svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}

/* ---------- left: the brief ---------- */
.left{position:absolute;left:0;top:0;bottom:0;width:44vw;padding:calc(56px + 2.4vh) 0 3.2vh min(64px,4.4vw);display:flex;flex-direction:column;z-index:3;
  background:linear-gradient(90deg,var(--page) 0%,var(--page) 82%,transparent 100%)}
.eyebrow{display:flex;align-items:center;gap:10px;font:500 11.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
.eyebrow b{color:var(--acc-ink);font-weight:500}
h1{margin:1.3vh 0 0;font:720 min(12.4vh,7.7vw)/.9 var(--display);letter-spacing:-.045em;font-variation-settings:"opsz" 96;color:var(--text)}
h2{margin:.9vh 0 0;font:650 min(5.4vh,3.3vw)/1.02 var(--display);letter-spacing:-.03em;font-variation-settings:"opsz" 96;color:var(--text);white-space:nowrap}
h2 .dim{color:var(--muted)}
.w{display:inline-block;will-change:transform,opacity}
.why{margin:1.5vh 0 0;max-width:31em;font-size:min(1.85vh,16px);line-height:1.5;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,auto));justify-content:start;gap:0;margin-top:1.8vh;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:.9vh 18px .9vh 0;margin-right:16px;position:relative}
.stat+.stat{padding-left:18px;border-left:1px solid var(--rule)}
.stat .k{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{margin-top:6px;font:500 min(2.5vh,20px)/1 var(--mono);color:var(--text);white-space:nowrap}
.stat .v small{font-size:.62em;color:var(--muted);margin-left:3px}
.stat .v.hail{color:var(--h15)}
.shead{margin-top:2.1vh;display:flex;align-items:baseline;gap:10px;font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.shead::after{content:"";flex:1;height:1px;background:var(--rule);transform:translateY(-3px)}
ol.brief{list-style:none;margin:1.1vh 0 0;padding:0;display:grid;gap:.6vh;max-width:33em}
ol.brief li{display:grid;grid-template-columns:26px minmax(0,1fr);font-size:min(1.66vh,13.6px);line-height:1.38;color:var(--text-2)}
ol.brief li .n{font:500 11px/1.9 var(--mono);color:var(--faint)}
ol.brief li b{color:var(--text);font-weight:600}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;font:500 9.5px/1.5 var(--mono);letter-spacing:.03em;color:var(--muted);background:var(--chip);vertical-align:1px;white-space:nowrap}
ol.time{list-style:none;margin:.8vh 0 0;padding:0;position:relative;max-width:36em}
ol.time::before{content:"";position:absolute;left:107px;top:8px;bottom:8px;width:1px;background:var(--rule-2)}
ol.time li{display:grid;grid-template-columns:90px 11px minmax(0,1fr);column-gap:12px;align-items:center;min-height:min(3.2vh,28px);font-size:min(1.66vh,13.6px);color:var(--text-2)}
ol.time .t{font:500 11.5px/1 var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
ol.time .d{width:9px;height:9px;border-radius:50%;background:var(--page);border:1.5px solid var(--faint);justify-self:center;position:relative;z-index:1}
ol.time li.now .d{background:var(--text);border-color:var(--text);box-shadow:0 0 0 4px var(--rule-2)}
ol.time li.now .t{color:var(--text)}
ol.time li.go{min-height:min(4.2vh,36px)}
ol.time li.go .d{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-bg)}
ol.time li.go .t{color:var(--acc-ink)}
ol.time li.go .x{padding:6px 10px;border-radius:9px;background:var(--acc-bg);margin-left:-10px}
ol.time b{color:var(--text);font-weight:600;margin-right:8px}
.ctas{margin-top:auto;padding-top:1.6vh;display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:10px;height:min(5.8vh,50px);padding:0 22px;border-radius:12px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .14s var(--ease),background-color .14s var(--ease),border-color .14s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--on-acc);box-shadow:0 10px 30px -12px rgba(245,136,58,.55)}
.btn.pri:hover{background:#ff9548}
.btn.sec{border:1px solid var(--rule-2);color:var(--text)}
.btn.sec:hover{border-color:var(--faint)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kbd{font:500 11px/1 var(--mono);color:var(--muted);margin-left:6px}

/* source hover */
[data-src]{cursor:help}
[data-src]:hover::after{content:attr(data-src);position:absolute;left:0;top:calc(100% + 6px);z-index:9;width:max-content;max-width:300px;white-space:normal;padding:7px 9px;border-radius:8px;background:var(--chip);border:1px solid var(--rule-2);font:500 11px/1.4 var(--mono);color:var(--text-2);text-transform:none;letter-spacing:0;pointer-events:none}

/* ---------- right: generative atlas ---------- */
.map{position:absolute;top:0;right:0;bottom:0;left:36vw;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%);mask-image:linear-gradient(90deg,transparent 0,#000 14%)}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;z-index:4;pointer-events:none;font:500 10.5px/1.45 var(--mono);color:var(--muted);letter-spacing:.02em}
.cap b{color:var(--text-2);font-weight:500}
.cap.title{top:78px;left:calc(44vw + 28px)}
.cap.title .big{font:italic 500 13px/1.3 var(--ui);color:var(--text-2);letter-spacing:0;display:block;margin-bottom:3px}
.legend{position:absolute;z-index:4;left:calc(44vw + 28px);bottom:44px;font:500 10.5px/1 var(--mono);color:var(--muted)}
.legend .bar{width:190px;height:6px;border-radius:3px;margin:8px 0 5px;background:linear-gradient(90deg,var(--faint) 0%,var(--faint) 20%,var(--h1) 40%,var(--h15) 70%,var(--h2) 100%)}
.legend .ticks{display:flex;justify-content:space-between;width:190px}
.attr{position:absolute;z-index:4;right:24px;bottom:14px;font:500 9.5px/1.3 var(--mono);color:var(--faint);text-align:right;max-width:58vw}
.loupecap{position:absolute;z-index:4;pointer-events:none;text-align:center;font:500 10.5px/1.45 var(--mono);color:var(--muted);opacity:0;transition:opacity .4s var(--ease)}
.loupecap b{display:block;font:600 13px/1.3 var(--ui);color:var(--text);letter-spacing:-.01em}
.loupecap.on{opacity:1}
.hide{opacity:0;transform:translateY(6px)}
.reveal{transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.in{opacity:1;transform:none}
ol.time .x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stat .k{white-space:nowrap}
@media (max-height:840px){
  h1{font-size:min(11vh,7.2vw)}
  h2{font-size:min(4.8vh,3.1vw)}
  .why{margin-top:1.1vh;font-size:14.5px}
  .stats{margin-top:1.4vh}
  .shead{margin-top:1.7vh}
  ol.brief{gap:.4vh}
  ol.brief li,ol.time li{font-size:13px}
  ol.time li{min-height:26px}
  ol.time li.go{min-height:32px}
  .ctas{padding-top:1.2vh}
}
@media (prefers-reduced-motion:reduce){.reveal,.w{transition:none!important}}
</style>
</head>
<body>
<div class="map" id="map">
  <canvas id="under"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="over"></canvas>
</div>

<header class="top">
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="ink" d="M9 19 24 8 39 19" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot" cx="24" cy="17" r="3"/><circle cx="24" cy="31.5" r="10" fill="none" stroke="#f5883a" stroke-width="5"/></svg>Aldaba</div>
  <div class="when" id="when"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="es">ES</button></div>
    <div class="seg" role="group" aria-label="Theme">
      <button data-t="dark" aria-label="Dark"><svg viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3 5.5 5.5 0 1 0 13 9.5z"/></svg></button>
      <button data-t="light" aria-label="Light"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg></button>
    </div>
  </div>
</header>

<main class="left" id="left">
  <div class="eyebrow reveal hide" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <h2 id="h2"></h2>
  <p class="why reveal hide" id="why"></p>
  <div class="stats reveal hide" id="stats"></div>
  <div class="shead reveal hide" id="secBrief"></div>
  <ol class="brief" id="brief"></ol>
  <div class="shead reveal hide" id="secToday"></div>
  <ol class="time" id="time"></ol>
  <div class="ctas reveal hide" id="ctas">
    <button class="btn pri" id="go"><svg viewBox="0 0 16 16"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg><span></span></button>
    <button class="btn sec" id="all"><span></span></button>
  </div>
</main>

<div class="cap title reveal hide" id="mapcap"></div>
<div class="legend reveal hide" id="legend"></div>
<div class="loupecap" id="loupecap"></div>
<div class="attr" id="attr"></div>

<script src="../shared/data.js"></script>
<script>
(() => {
'use strict';
const N = window.NL;
const Q = new URLSearchParams(location.search);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let STILL = Q.get('still') === '1' || reduce;
let SLOW = false;   // software WebGL (SwiftShader/llvmpipe): skip the intro, draw the field rarely
let theme = Q.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
let lang = Q.get('lang') === 'es' ? 'es' : 'en';
try { if (!Q.get('theme')) theme = localStorage.getItem('nlb.theme') || theme; if (!Q.get('lang')) lang = localStorage.getItem('nlb.lang') || lang; } catch (e) {}

/* ---------- words (EN + natural Latin American Spanish) ---------- */
const P = N.pick, B = N.backup, S = N.src;
const zones = N.zones, storms = N.storms;
const pickStorm = storms.find(s => s.date === P.storm_day);
const inSwath = zones.filter(z => z.kind === 'storm' && z.id.startsWith(P.storm_day)).length;
const latest = storms[0];
const latestArea = N.areas.find(a => a.st === latest.id);
const area = N.areas.find(a => a.id === P.area_id);
const driveMin = Math.round(P.dist_mi / 50 * 60 / 5) * 5;           // est. at 50 mph average
const fmtT = (hm, l) => { const [h, m] = hm.split(':').map(Number); const h12 = ((h + 11) % 12) + 1; return h12 + ':' + String(m).padStart(2, '0') + (l === 'es' ? (h < 12 ? ' a. m.' : ' p. m.') : (h < 12 ? ' AM' : ' PM')); };
const [kh, kmin] = P.best_time.start.split(':').map(Number);
const leaveMin = kh * 60 + kmin - driveMin - 10;
const leave = String(Math.floor(leaveMin / 60)).padStart(2, '0') + ':' + String(leaveMin % 60).padStart(2, '0');
const bt = l => { const e = fmtT(P.best_time.end, l); const s0 = fmtT(P.best_time.start, l).replace(/ ?(AM|PM|a\. m\.|p\. m\.)$/, '').replace(':00', ''); return s0 + '–' + e; };
const short = n => n.replace(/^.*?:\s*/, '');
const T = {
  en: {
    when: '<b>Tuesday, September 29</b> · 7:02 AM',
    eyebrow: `<i></i>Aldaba’s pick <b>· rank 1 of ${zones.length}</b>`,
    h1: 'Columbus.',
    h2: [`${P.doors} doors.`, `<span class="dim">${bt('en')}</span>`],
    why: P.why.en,
    stats: [['Hail', P.hail_in.toFixed(2), 'in', 'hail', `${S.storms} · ${pickStorm.long.en}`], ['Storm', pickStorm.d.en, '', '', S.storms], ['Drive', P.dist_mi.toFixed(1), 'mi', '', `Distance: engine (hh.py), from Fremont HQ. About ${driveMin} min at 50 mph (estimate).`], ['Area', area ? area.insured.en.replace('Likely insured: ', '') : '—', '', '', `Likely insured (area estimate, never one home): ${S.census}. ${area ? area.owner + '% owner-lived' : ''}`]],
    statArea: 'Likely insured',
    secBrief: 'Morning brief · written 7:02 AM', secToday: 'Today',
    brief: [
      [`<b>Overnight.</b> ${N.headline.en}`, 'SPC · MRMS', S.storms],
      [`<b>Pick.</b> ${short(P.name)}, Columbus: ${P.hail_in} in on ${pickStorm.d.en}, older roofs, mostly owner-lived. Score ${P.score}.`, 'engine', 'Engine score (hh.py): hail size, roof age, owner-lived share, distance.'],
      [`<b>Backup.</b> Omaha, ${short(B.name)}: ${B.dist_mi} mi, pre-1980 homes, owner-lived. Everyday zone, no recent hail.`, 'Census ACS', S.census],
      [`<b>Changed.</b> Nothing new. ${inSwath} of ${zones.length} zones sit in the ${pickStorm.d.en} swath; latest hail nearby was ${latest.d.en} (${latestArea ? latestArea.name.en : ''}, ${latest.max} in).`, 'zones/current', 'Engine zones/current + ' + S.storms]
    ],
    time: [
      ['07:02', 'Brief ready', `${storms.length} storm days checked`, 'now'],
      ['09:00', 'Follow-ups', 'callbacks and notes', ''],
      ['13:00', 'Prep', `${P.doors} door cards, 3-day cancel forms EN + ES`, ''],
      [leave, 'Drive', `Fremont → Columbus · ${P.dist_mi} mi · ~${driveMin} min`, ''],
      ['go', 'Knock', `${P.doors} doors · park at ${N.walk.pn[0]} & ${N.walk.pn[1]}`, 'go']
    ],
    go: 'Start the walk', all: `Show all ${zones.length} zones`, back: 'Back to the pick',
    mapcap: `<span class="big">Hail field, ${pickStorm.long.en}</span>Contours every 0.1 in · index line every 0.5 in<br>modeled from ${storms.length} storm swaths + zone peaks`,
    legend: 'Hail size, inches',
    loupe: [`The walk · ${short(P.name)}`, `${P.doors} sample homes · park at ${N.walk.pn[0]}`],
    attr: 'Streets + rivers: Nebraska GIS / USGS NHD · Hail: NOAA SPC + MRMS (engine) · Area: US Census ACS 2024 · Homes: SAMPLE, no owner names',
    locator: `Fremont → Columbus ${P.dist_mi} mi`, sample: 'sample', park: 'P'
  },
  es: {
    when: '<b>martes, 29 de septiembre</b> · 7:02 a. m.',
    eyebrow: `<i></i>La elección de Aldaba <b>· 1 de ${zones.length}</b>`,
    h1: 'Columbus.',
    h2: [`${P.doors} puertas.`, `<span class="dim">${bt('es')}</span>`],
    why: P.why.es,
    stats: [['Granizo', P.hail_in.toFixed(2), 'pulg.', 'hail', `${S.storms} · ${pickStorm.long.es}`], ['Tormenta', pickStorm.d.es, '', '', S.storms], ['Manejo', P.dist_mi.toFixed(1), 'mi', '', `Distancia: motor (hh.py), desde la oficina en Fremont. Unos ${driveMin} min a 50 mph (estimado).`], ['Zona', area ? area.insured.es.replace('Probablemente asegurado: ', '') : '—', '', '', `Probablemente asegurado (estimado de la zona, nunca de una casa): ${S.census}. ${area ? area.owner + '% viven sus dueños' : ''}`]],
    secBrief: 'Resumen de la mañana · 7:02 a. m.', secToday: 'Hoy',
    brief: [
      [`<b>Anoche.</b> ${N.headline.es}`, 'SPC · MRMS', S.storms],
      [`<b>Elección.</b> ${short(P.name)}, Columbus: ${P.hail_in} pulg. el ${pickStorm.d.es}, techos con años, casi todas con dueño viviendo. Puntaje ${P.score}.`, 'motor', 'Puntaje del motor (hh.py): tamaño del granizo, edad del techo, casas con dueño, distancia.'],
      [`<b>Respaldo.</b> Omaha, ${short(B.name)}: ${B.dist_mi} mi, casas de antes de 1980 con dueño. Zona de todos los días, sin granizo reciente.`, 'Censo ACS', S.census],

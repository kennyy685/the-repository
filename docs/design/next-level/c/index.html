<!doctype html>
<!--
  Direction C "Deck" - the 7 AM open as a 3D instrument deck (HMP App / Aldaba). Mockup, not the live app.
  Borrowed (and where from):
  - Extruded data columns + hex-prism aggregates: deck.gl ColumnLayer / HexagonLayer
      https://deck.gl/docs/api-reference/layers/column-layer
      https://deck.gl/docs/api-reference/aggregation-layers/hexagon-layer
  - Focus + context "lens" (the walk is magnified 3x, the rest of town compresses around it): Furnas,
      "Generalized Fisheye Views" (CHI 1986) https://dl.acm.org/doi/10.1145/22627.22342
  - Dense telemetry panels, thin rules, mono readouts, time scrubber: NASA Open MCT https://nasa.github.io/openmct/
  - Glass only on floating controls, text on solid, specular top edge: Apple "Meet Liquid Glass" (WWDC25)
      https://developer.apple.com/videos/play/wwdc2025/219/
  - 150 ms panel stagger, 120-180 ms eased feedback: Linear design refresh https://linear.app/now/behind-the-latest-design-refresh
  - Animate only transform/opacity, interruptible motion: Vercel Web Interface Guidelines https://vercel.com/design/guidelines
  Data: ../shared/data.js (Nebraska GIS streets, NOAA SPC + MRMS storms, Census ACS, engine pick). Homes are FAKE samples.
  Raw WebGL2, no libraries, no network.
-->
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aldaba Deck</title>
<style>
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(../shared/fonts/GeistMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Bricolage L";src:url(../shared/fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --page:#07080a;--panel:#0d0f12;--panel-2:#121418;--rule:#1f2228;--rule-2:#2a2e35;
  --text:#f1f2f4;--text-2:#b8bbc2;--muted:#80838b;--faint:#555960;
  --acc:#f5883a;--acc-ink:#ffa766;--acc-soft:rgba(245,136,58,.14);
  --h1:#f2c14e;--h15:#f5883a;--h2:#ff4f5a;--ok:#5fd39a;
  --glass:rgba(22,24,28,.46);--glass-edge:rgba(255,255,255,.16);--glass-hi:rgba(255,255,255,.30);
  --sans:"Geist","Geist L",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono","Geist Mono L",ui-monospace,Menlo,monospace;
  --disp:"Bricolage Grotesque","Bricolage L","Geist L",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
:root[data-theme="light"]{
  --ok:#1f9d62;--page:#eef0ee;--panel:#f7f8f6;--panel-2:#ffffff;--rule:#dcdfdb;--rule-2:#cdd1cc;
  --text:#18191c;--text-2:#3d3f45;--muted:#6c6f77;--faint:#9a9da3;
  --acc:#f5883a;--acc-ink:#a4520f;--acc-soft:rgba(245,136,58,.13);
  --glass:rgba(255,255,255,.55);--glass-edge:rgba(20,22,26,.12);--glass-hi:rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--text);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.app{display:grid;height:100vh;grid-template-columns:clamp(292px,23.5vw,344px) minmax(0,1fr) clamp(272px,22vw,322px);
  grid-template-rows:52px minmax(0,1fr) clamp(104px,13.5vh,124px);grid-template-areas:"top top top" "left stage right" "tl tl tl"}
/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--page);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:8px;font:650 17px/1 var(--disp);letter-spacing:-.03em}
.brand svg{width:24px;height:24px}
.brand svg .k{stroke:var(--text)} .brand svg .kd{fill:var(--text)}
.vr{width:1px;height:22px;background:var(--rule-2)}
.clock{font:500 12.5px var(--mono);color:var(--text-2);white-space:nowrap}
.clock b{color:var(--text);font-weight:500}
.ovl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovl .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(95,211,154,.15);flex:none}
.ovl span.t{overflow:hidden;text-overflow:ellipsis}
/* Liquid Glass: controls layer only */
.glass{position:relative;display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.18),0 6px 22px rgba(0,0,0,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 46%)}
.glass button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font:500 11.5px var(--sans);color:var(--text-2);transition:background .15s var(--ease),color .15s var(--ease)}
.glass button[aria-pressed="true"]{background:var(--text);color:var(--page)}
.glass button:hover{color:var(--text)} .glass button[aria-pressed="true"]:hover{color:var(--page)}
/* panels (solid) */
.col{min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;background:var(--panel)}
.left{grid-area:left;border-right:1px solid var(--rule)} .right{grid-area:right;border-left:1px solid var(--rule)}
.sec{padding:14px 16px;border-bottom:1px solid var(--rule)}
.sec.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.eyebrow .acc{color:var(--acc-ink)}
.slide{opacity:0;transform:translateY(8px)}
.ready .slide{opacity:1;transform:none;transition:opacity .42s var(--ease),transform .42s var(--ease);transition-delay:var(--d,0ms)}
.still .slide{transition:none!important}
/* pick card */
.pick h1{margin:0;font:700 42px/.92 var(--disp);letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.pick .sub{font:600 17px/1.2 var(--disp);letter-spacing:-.02em;color:var(--text-2);margin:5px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.stat{padding:7px 8px 7px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.stat .v{font:500 17px/1.05 var(--mono);letter-spacing:-.03em;white-space:nowrap}
.stat .v small{font-size:11px;color:var(--muted);margin-left:2px;letter-spacing:0}
.stat .l{font:500 10.5px/1.2 var(--sans);color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.stat.hot .v{color:var(--acc-ink)}
.why{color:var(--text-2);margin:11px 0 12px;font-size:12.5px;line-height:1.45}
.go{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:10px;padding:12px 14px;background:var(--acc);color:#1a0d02;
  font:650 15px/1 var(--sans);letter-spacing:-.01em;box-shadow:0 8px 26px rgba(245,136,58,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s var(--ease),filter .15s}
.go:hover{filter:brightness(1.06)} .go:active{transform:scale(.985)}
.go .ar{font:500 13px var(--mono)}
.park{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11.5px}
.backup{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px dashed var(--rule-2);font-size:12px}
.backup .k{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.backup .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
/* zone list */
.zl{list-style:none;margin:0;padding:0;overflow:auto;min-height:0;scrollbar-width:none}
.zl li{display:grid;grid-template-columns:20px minmax(0,1fr) 62px 34px;gap:8px;align-items:center;padding:2.5px 4px;border-radius:6px;cursor:default;transition:background .15s}
.zl li:hover,.zl li.on{background:var(--acc-soft)}
.zl .r{font:500 11px var(--mono);color:var(--muted)}
.zl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.zl .n em{font-style:normal;color:var(--muted);font-size:11px;margin-left:4px}
.zl li:first-child .n{color:var(--acc-ink);font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:linear-gradient(90deg,var(--h1),var(--h15))}
.bar.ev i{background:var(--muted)}
.zl .sc{font:500 11.5px var(--mono);text-align:right;color:var(--text-2)}
/* right: plan */
.plan{list-style:none;margin:0;padding:0;position:relative}
.plan::before{content:"";position:absolute;left:76px;top:6px;bottom:6px;width:1px;background:var(--rule-2)}
.plan li{display:grid;grid-template-columns:68px 16px minmax(0,1fr);gap:0;align-items:start;padding:4px 0;position:relative}
.plan .tm{font:500 11px/1.5 var(--mono);color:var(--muted);text-align:right;padding-right:6px;white-space:nowrap}.plan .tm span{font-size:9.5px}
.plan .dt{width:9px;height:9px;border-radius:50%;margin:3px 0 0 4px;background:var(--panel);border:1.5px solid var(--faint);position:relative;z-index:1}
.plan .tx{font-size:12.5px;line-height:1.35;color:var(--text-2);padding-left:8px}
.plan .tx b{color:var(--text);font-weight:600}
.plan .tx small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.plan li.done .dt{background:var(--ok);border-color:var(--ok)} .plan li.done .tx{color:var(--muted)}
.plan li.now .tm{color:var(--ok)}
.plan li.key{margin:3px 0;padding:7px 0;background:var(--acc-soft);border-radius:8px}
.plan li.key .dt{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(245,136,58,.2)}
.plan li.key .tm{color:var(--acc-ink)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:12px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font:500 12px var(--mono);text-align:right;color:var(--text)}
.kv dd.z{color:var(--muted)}
.head{font:600 15.5px/1.3 var(--disp);letter-spacing:-.015em;margin:0}
.chip{display:inline-block;font:600 10.5px var(--mono);padding:2px 6px;border-radius:5px;background:var(--acc-soft);color:var(--acc-ink);letter-spacing:.02em}
/* source tags */
.s{font:600 8.5px/1 var(--mono);letter-spacing:.06em;color:var(--faint);border:1px solid var(--rule-2);border-radius:3px;padding:1px 3px 1.5px;text-transform:uppercase;cursor:help;vertical-align:1px;white-space:nowrap;font-style:normal}
.s:hover{color:var(--acc-ink);border-color:var(--acc)}
/* stage */
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--page)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;font:500 10.5px var(--mono);color:var(--text-2)}
.lb.z{padding:2px 6px;border-radius:4px;background:rgba(7,8,10,.72);border:1px solid var(--rule-2);transform-origin:0 0}
:root[data-theme="light"] .lb.z{background:rgba(255,255,255,.82)}
.lb.z b{color:var(--acc-ink);font-weight:500;margin-right:4px}
.lb.st{font:600 11px var(--sans);color:var(--acc-ink);text-shadow:0 1px 6px var(--page)}
.lb.pk{padding:4px 8px;border-radius:6px;background:var(--acc);color:#1a0d02;font:650 11.5px var(--sans);box-shadow:0 6px 18px rgba(245,136,58,.35)}
.lb.pk::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--acc)}
.lb.pn{width:18px;height:18px;border-radius:5px;background:var(--text);color:var(--page);font:700 11px/18px var(--sans);text-align:center}
.lb.sw{font:500 10.5px var(--mono);color:var(--h15);letter-spacing:.04em;text-transform:uppercase}
.lb.town{font:700 26px var(--disp);letter-spacing:-.03em;color:var(--text);opacity:.2}
.hud{position:absolute;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.03em;pointer-events:none}
.hud.tl{left:12px;top:12px;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--rule)} .hud.tl b{color:var(--text);font:650 13px var(--sans);letter-spacing:-.01em;margin-bottom:2px}
.hud.tr{right:12px;top:12px;text-align:right;pointer-events:auto;padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--rule)}
.legend{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.legend .grad{width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--h1),var(--h15) 50%,var(--h2))}
.legend-t{display:flex;justify-content:space-between;width:110px;margin-left:auto;margin-top:3px;font-size:9.5px}
.hud.bl{left:12px;bottom:12px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--rule);display:flex;align-items:center;gap:10px}.cmp{position:relative;width:28px;height:28px;color:var(--text-2)}.cmp svg{width:28px;height:28px;display:block}.cmp span{position:absolute;left:34px;top:8px;font-size:9px;color:var(--acc-ink)}.cmp{margin-right:12px}
.ctrl{position:absolute;right:12px;bottom:12px}
.tip{position:fixed;z-index:20;pointer-events:none;min-width:170px;padding:9px 11px;border-radius:9px;background:var(--panel-2);border:1px solid var(--rule-2);
  box-shadow:0 12px 34px rgba(0,0,0,.35);font-size:12px;display:none}
.tip.on{display:block}
.tip .k{font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tip .a{font:650 15px var(--disp);letter-spacing:-.02em;margin:2px 0 6px}
.tip .g{display:grid;grid-template-columns:auto auto;gap:2px 14px} .tip .g span:nth-child(odd){color:var(--muted)} .tip .g span:nth-child(even){font-family:var(--mono);text-align:right}
.tip .srcl{margin-top:6px;color:var(--faint);font-size:10.5px;max-width:260px}
/* timeline */
.tl{grid-area:tl;display:grid;grid-template-columns:clamp(292px,23.5vw,344px) minmax(0,1fr) auto;border-top:1px solid var(--rule);background:var(--panel)}
.tl .ro{padding:12px 16px;border-right:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.tl .ro .d{font:650 20px/1 var(--disp);letter-spacing:-.03em}
.tl .ro .m{color:var(--text-2);font-size:12px}
.tl .ro .m b{font:500 12px var(--mono);color:var(--acc-ink)}
.tl .ro button{align-self:flex-start;margin-top:4px;border:1px solid var(--rule-2);background:transparent;border-radius:6px;padding:3px 8px;font:500 11px var(--sans);color:var(--text-2)}
.tl .ro button:hover{border-color:var(--acc);color:var(--acc-ink)}
.tlw{position:relative;min-width:0}
#tls{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tl .rg{padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;border-left:1px solid var(--rule)}
.tl .rg .seg{display:flex;border:1px solid var(--rule-2);border-radius:7px;overflow:hidden}
.tl .rg .seg button{border:0;background:transparent;padding:4px 9px;font:500 11px var(--sans);color:var(--muted)}
.tl .rg .seg button[aria-pressed="true"]{background:var(--text);color:var(--page)}
.tl .rg .lg{font:500 10px var(--mono);color:var(--muted);line-height:1.5}
svg text{font-family:var(--mono)}
.tk{transition:transform .2s var(--ease)} .tk.flash{transform:scaleY(1.18)}
@media (prefers-reduced-motion:reduce){.slide,.ready .slide{transition:none!important;opacity:1;transform:none}}
@media (max-height:840px){.pick h1{font-size:38px}.sec{padding:11px 14px}.stat .v{font-size:16px}.plan li{padding:2.5px 0}.why{margin:8px 0 10px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="k" d="M9 19 24 8 39 19" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle class="kd" cx="24" cy="17" r="3"/><circle cx="24" cy="31.5" r="10" fill="none" stroke="#f5883a" stroke-width="5"/></svg>Aldaba</div>
    <div class="vr"></div>
    <div class="clock" id="clock"></div>
    <div class="vr"></div>
    <div class="ovl"><i class="dot"></i><span class="t" id="ovl"></span></div>
    <div class="glass" role="group" aria-label="Theme"><button data-theme-set="dark" data-t="dark"></button><button data-theme-set="light" data-t="light"></button></div>
    <div class="glass" role="group" aria-label="Language"><button data-lang-set="en">EN</button><button data-lang-set="es">ES</button></div>
  </header>

  <aside class="col left" id="left"></aside>

  <section class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="labels" id="labels"></div>
    <div class="hud tl slide" style="--d:300ms"><b id="hudTown"></b><span id="hudCoord"></span></div>
    <div class="hud tr slide" style="--d:450ms"><div class="legend"><span data-t="hailIn"></span><span class="grad"></span></div><div class="legend-t"><span>1.0</span><span>1.5</span><span>2.0+</span></div></div>
    <div class="hud bl slide" style="--d:600ms"><div class="cmp"><svg viewBox="0 0 28 28" id="compass"><circle cx="14" cy="14" r="12.5" fill="none" stroke="currentColor" opacity=".35"/><path d="M14 4 17.5 14 14 12.5 10.5 14Z" fill="var(--acc)"/><path d="M14 24 17.5 14 14 15.5 10.5 14Z" fill="currentColor" opacity=".45"/></svg><span>N</span></div><span id="hudLens"></span></div>
    <div class="ctrl glass slide" style="--d:600ms"><button id="bOrbit" aria-pressed="true" data-t="orbit"></button><button id="bWalk" aria-pressed="false" data-t="walkView"></button></div>
  </section>

  <aside class="col right" id="right"></aside>

  <footer class="tl" id="tlbar">
    <div class="ro" id="ro"></div>
    <div class="tlw" id="tlw"><svg id="tls"></svg></div>
    <div class="rg"><div class="seg"><button data-range="90" aria-pressed="true" data-t="r90"></button><button data-range="210" aria-pressed="false" data-t="rAll"></button></div><div class="lg" id="tlLg"></div></div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script src="../shared/data.js"></script>
<script>
(() => {
'use strict';
const NL = window.NL, Q = new URLSearchParams(location.search);
const root = document.documentElement, app = document.getElementById('app');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STILL = Q.get('still') === '1' || reduce;
let lang = Q.get('lang') === 'es' ? 'es' : 'en';
let theme = Q.get('theme') === 'light' ? 'light' : 'dark';
root.dataset.theme = theme; root.dataset.lang = lang; root.lang = lang;
if (STILL) document.body.classList.add('still');

/* ---------- strings (EN + natural Latin American Spanish) ---------- */
const S = {
  dark:{en:'Dark',es:'Oscuro'}, light:{en:'Light',es:'Claro'},
  clock:{en:'<b>Tue, Sep 29</b> · 7:02 AM',es:'<b>mar 29 sep</b> · 7:02 a. m.'},
  pick:{en:"Aldaba's pick",es:'La elección de Aldaba'}, of12:{en:'#1 of 12',es:'#1 de 12'},
  doors:{en:'doors',es:'puertas'}, hail:{en:'hail',es:'granizo'}, storm:{en:'storm',es:'tormenta'},
  drive:{en:'drive',es:'manejo'}, best:{en:'best time',es:'mejor hora'}, score:{en:'score',es:'puntaje'},
  bestV:{en:'4–7:30',es:'4–7:30'}, pm:{en:'PM',es:'p.m.'}, unit:{en:'in',es:'pulg'},
  go:{en:'Start the walk',es:'Empezar la ruta'},
  park:{en:'Park at 22 St & 40th Ave',es:'Estaciónate en 22 St y 40th Ave'},
  parkShort:{en:'Park',es:'Estaciona'},
  backup:{en:'Plan B',es:'Plan B'}, everyday:{en:'everyday',es:'diaria'}, offmap:{en:'off map',es:'fuera del mapa'},
  zones:{en:'Top zones',es:'Mejores zonas'}, ranked:{en:'12 ranked · engine',es:'12 en orden · motor'},
  today:{en:'Today',es:'Hoy'}, now:{en:'now',es:'ahora'},
  overnight:{en:'Overnight',es:'Durante la noche'},

/* ---------- geometry: real meters -> focus lens (warped) ---------- */
const LON0 = -97.3761, LAT0 = 41.4371, KX = Math.cos(LAT0*Math.PI/180)*111320, KZ = 110540;
const LK = 3, LR = 220, LS = 125;           // lens: 3x inside 220 m, log compression outside
const toM = (lon,lat) => [(lon-LON0)*KX, -(lat-LAT0)*KZ];
function warpR(r){ return r < LR ? r*LK : LK*LR + LK*LS*Math.log(1 + (r-LR)/LS); }
function warp(x,z){ const r = Math.hypot(x,z); if (r < 1e-6) return [0,0]; const k = warpR(r)/r; return [x*k, z*k]; }
const W = (lon,lat) => { const m = toM(lon,lat); return warp(m[0], m[1]); };
function subdiv(pts, maxLen){ // pts in meters, returns warped
  const out = []; for (let i = 0; i < pts.length; i++){
    if (i){ const a = pts[i-1], b = pts[i], L = Math.hypot(b[0]-a[0], b[1]-a[1]), n = Math.max(1, Math.ceil(L/maxLen));
      for (let j = 1; j <= n; j++){ const f = j/n; out.push(warp(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f)); } }
    else out.push(warp(pts[0][0], pts[0][1])); }
  return out; }

uniform float uDark, uTime, uSweep, uEdge, uScan;
uniform vec2 uP0, uP1, uP2;
const float LK=${LK}.0, LR=${LR}.0, LS=${LS}.0, HW=3300.0;
vec2 unwarp(vec2 w){ float rp=length(w); if(rp<1e-3) return w; float r = rp<LK*LR ? rp/LK : LR + LS*(exp((rp-LK*LR)/(LK*LS))-1.0); return w*(r/rp); }
// distance to the swath centerline (real meters) + normalized position along it
vec2 swath(vec2 m){
  vec2 a=uP1-uP0, b=uP2-uP1; float la=length(a), lb=length(b), L=la+lb;
  float ta=clamp(dot(m-uP0,a)/(la*la),0.,1.), tb=clamp(dot(m-uP1,b)/(lb*lb),0.,1.);
  float da=length(m-uP0-a*ta), db=length(m-uP1-b*tb);
  return da<db ? vec2(da, ta*la/L) : vec2(db, (la+tb*lb)/L);
}
vec3 hailCol(float h){ vec3 c1=vec3(.949,.757,.306), c2=vec3(.961,.533,.227), c3=vec3(1.,.31,.353);
  return h<1.5 ? mix(c1,c2,clamp((h-1.)/.5,0.,1.)) : mix(c2,c3,clamp((h-1.5)/.5,0.,1.)); }
float sdn(float a,float b,float x){ return 1.-smoothstep(b,a,x); }
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);

float bandAt(vec2 w, out float tt){ vec2 sw=swath(unwarp(w)); tt=sw.y;
  float core=sdn(HW, HW*0.25, sw.x);

function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);

  for (let i = 0; i < n; i++){ const inf = gl.getActiveUniform(p, i); u[inf.name.replace('[0]','')] = gl.getUniformLocation(p, inf.name); }

`in vec2 vW; out vec4 o; uniform float uMode, uSlice; uniform vec4 uHomes[25];

  // camera
  const ci = STILL ? 1 : ease((T - 0.2)/4.2);
  if (!STILL && T > 4.4 && orbit) cam.yaw += 0.5*dt;
  camBlend += ((walkView ? 1 : 0) - camBlend)*Math.min(1, dt*3.2);
  const pitch = (72 + (cam.pitch - 72)*ci) - camBlend*9, dist = (cam.dist*(1 + 0.35*(1-ci)))*(1 - camBlend*0.55);
  const yaw = (cam.yaw - 30*(1-ci)) * Math.PI/180;
  const lead = cam.lead*(1-camBlend), tx = -Math.sin(yaw)*lead, tz = -Math.cos(yaw)*lead, pr = pitch*Math.PI/180;
  eye = [tx + dist*Math.cos(pr)*Math.sin(yaw), dist*Math.sin(pr), tz + dist*Math.cos(pr)*Math.cos(yaw)];
  VP = M4.mul(M4.persp(37*Math.PI/180, cw/ch, 20, 40000), M4.look(eye, [tx, 0, tz]));
  compass.style.transform = `rotate(${(-yaw*180/Math.PI + 180).toFixed(1)}deg)`;
  if (gl) draw(now, sweep, edge, scan, walkLen, rT);
  placeLabels(); pickHover();
  requestAnimationFrame(frame);
}
function common(P, now, sweep, edge, scan){ gl.useProgram(P.p); const u = P.u;
  if (u.uVP) gl.uniformMatrix4fv(u.uVP, false, VP); if (u.uDark) gl.uniform1f(u.uDark, theme === 'dark' ? 1 : 0);
  if (u.uTime) gl.uniform1f(u.uTime, now % 1000); if (u.uSweep) gl.uniform1f(u.uSweep, sweep); if (u.uEdge) gl.uniform1f(u.uEdge, edge);
  if (u.uScan) gl.uniform1f(u.uScan, scan); if (u.uP0){ gl.uniform2fv(u.uP0, swP[0]); gl.uniform2fv(u.uP1, swP[1]); gl.uniform2fv(u.uP2, swP[2]); } return u; }
function draw(now, sweep, edge, scan, walkLen, rT){
  const dark = theme === 'dark';
  gl.viewport(0, 0, cv.width, cv.height);
  const bg = dark ? [.027,.031,.039] : [.933,.941,.933];
  gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND); gl.depthMask(true); gl.disable(gl.CULL_FACE);
  homes.forEach((h,i) => { homeU.set([h.w[0], h.w[1], h.hail, Math.max(0, Math.min(1, (rT - h.delay)/0.75))], i*4); });
  // ground
  let u = common(P_GROUND, now, sweep, edge, scan); gl.uniform1f(u.uMode, 0); gl.uniform1f(u.uY, 0); gl.uniform1f(u.uSlice, 0); gl.uniform4fv(u.uHomes, homeU);
  gl.bindVertexArray(vGround); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // lines
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  u = common(P_LINE, now, sweep, edge, scan);
  gl.uniform3fv(u.uCol, dark ? [.72,.77,.87] : [.46,.48,.52]); gl.uniform1f(u.uA, dark ? .78 : .7);
  gl.bindVertexArray(vStreets); gl.drawArrays(gl.LINES, 0, nStreets);
  gl.uniform3fv(u.uCol, dark ? [.35,.55,.75] : [.45,.6,.72]); gl.uniform1f(u.uA, dark ? .5 : .55);
  gl.bindVertexArray(vCtx); gl.drawArrays(gl.LINES, 0, nCtx);
  // shadows (daylight model) / faint contact shadow in dark
  u = common(P_SHADOW, now, sweep, edge, scan); gl.uniform1f(u.uRiseT, rT); gl.uniform2fv(u.uSun, [0.55, -0.35]); gl.uniform1f(u.uSA, dark ? 0 : .42);
  if (!dark){ gl.bindVertexArray(vShadow); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, homes.length); }
  // walk ribbon
  u = common(P_RIB, now, sweep, edge, scan); gl.uniform1f(u.uWalkLen, walkLen);
  gl.bindVertexArray(vRib); gl.drawArrays(gl.TRIANGLES, 0, nRib);
  // columns (opaque)
  gl.disable(gl.BLEND); gl.depthMask(true);
  u = common(P_COL, now, sweep, edge, scan); gl.uniform1f(u.uRiseT, rT); gl.uniform3fv(u.uEye, eye);
  gl.bindVertexArray(vCol); gl.drawArraysInstanced(gl.TRIANGLES, 0, gCyl.length/6, homes.length);
  // zone hex prisms (translucent)
  gl.enable(gl.BLEND); gl.depthMask(false);
  if (dark) gl.blendFunc(gl.SRC_ALPHA, gl.ONE); else gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  u = common(P_HEX, now, sweep, edge, scan); gl.uniform1f(u.uRiseT, STILL ? 100 : (now - t0) - tCross - 0.4); gl.uniform1f(u.uHi, hiZone);
  gl.bindVertexArray(vHex); gl.drawArraysInstanced(gl.TRIANGLES, 0, gHex.length/6, nHex);
  // volumetric hail swath: stacked translucent slices
  u = common(P_GROUND, now, sweep, edge, scan); gl.uniform1f(u.uMode, 1); gl.uniform4fv(u.uHomes, homeU);
  gl.bindVertexArray(vGround);
  for (let i = 1; i <= 9; i++){ gl.uniform1f(u.uY, i*32); gl.uniform1f(u.uSlice, i/10); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
  gl.bindVertexArray(null); gl.depthMask(true);
}

renderAll();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
requestAnimationFrame(frame);
})();
</script>

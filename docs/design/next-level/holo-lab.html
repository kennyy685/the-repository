   ================================================================ */
window.LAB = {

    { dir: "holo-jarvis",   hue: "#5cc8ff", name: { en: "Blueprint Holo", es: "Holo Plano" },       pitch: { en: "", es: "" }, score: null },
    { dir: "holo-spectral", hue: "#b58cff", name: { en: "Spectral",       es: "Espectral" },        pitch: { en: "", es: "" }, score: null },
    { dir: "holo-neon",     hue: "#ff4fd8", name: { en: "Neon Grid",      es: "Cuadrícula Neón" },  pitch: { en: "", es: "" }, score: null },
    { dir: "holo-lidar",    hue: "#4dffa6", name: { en: "LiDAR Scan",     es: "Escaneo LiDAR" },    pitch: { en: "", es: "" }, score: null },
    { dir: "holo-ember",    hue: "#ffb547", name: { en: "Ember Gold",     es: "Oro Brasa" },        pitch: { en: "", es: "" }, score: null }

};

<style>
@font-face{font-family:"Geist L";src:url(shared/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(shared/fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(shared/fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(shared/fonts/GeistMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Bricolage L";src:url(shared/fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}

/* Layout: one cinematic hero (real Fremont street hologram, the Jul 1 hail swath replaying over it),
   then a 3-column contest grid (winner takes 2x2 when crowned), then a quiet source footer.
   Deliberately dark-only: a hologram lab. */
:root{
  color-scheme:dark;
  --page:#07080a;--panel:#0d0f12;--panel-2:#13161a;--rule:#1d2026;--rule-2:#2a2e36;
  --text:#f2f3f5;--text-2:#b9bcc4;--muted:#83868f;--faint:#565a62;
  --acc:#f5883a;--acc-ink:#ffab70;--acc-deep:#1a0d04;--acc-soft:rgba(245,136,58,.14);
  --holo:#9fc4ff;--h1:#f2c14e;--h15:#f5883a;--h2:#ff4f5a;
  --sans:"Geist","Geist L",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono","Geist Mono L",ui-monospace,Menlo,Consolas,monospace;
  --disp:"Bricolage Grotesque","Bricolage L","Geist L",ui-sans-serif,system-ui,sans-serif;
  --gut:clamp(16px,4.2vw,64px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:3px;border-radius:6px}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.mono{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase}

/* ---------- top bar ---------- */
.bar{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-block:calc(20px + env(safe-area-inset-top,0px)) 0}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark svg{width:30px;height:30px;flex:none}
.mark b{font:700 21px/1 var(--disp);letter-spacing:-.02em}
.mark span{color:var(--muted);padding-left:12px;border-left:1px solid var(--rule-2)}
.lang{display:flex;padding:3px;border:1px solid var(--rule-2);border-radius:999px;background:rgba(13,15,18,.6);backdrop-filter:blur(10px)}
.lang button{all:unset;cursor:pointer;font:500 12px/1 var(--mono);letter-spacing:.08em;padding:8px 13px;border-radius:999px;color:var(--muted);transition:color .2s,background .2s}
.lang button[aria-pressed="true"]{background:var(--text);color:var(--page)}
.lang button:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;min-height:clamp(600px,86svh,800px);display:flex;align-items:flex-end;overflow:hidden;
  padding-block:120px clamp(40px,7vh,72px)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 22%,#000 78%,transparent 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,var(--page) 0%,rgba(7,8,10,.86) 26%,rgba(7,8,10,.25) 52%,rgba(7,8,10,0) 70%)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--rule-2) 20%,var(--rule-2) 80%,transparent)}
.hero-in{width:100%;display:grid;gap:30px;position:relative}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--acc-ink)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--acc-soft),0 0 16px var(--acc)}
h1{margin:0;font:720 clamp(52px,8.6vw,136px)/.9 var(--disp);letter-spacing:-.038em}
h1 em{font-style:normal;color:transparent;background:linear-gradient(100deg,var(--text) 0%,var(--holo) 45%,var(--acc-ink) 100%);-webkit-background-clip:text;background-clip:text}
.sub{margin:0;font:400 clamp(17px,1.55vw,22px)/1.45 var(--sans);color:var(--text-2);max-width:40ch}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px}
.go{position:relative;display:inline-flex;align-items:center;gap:18px;text-decoration:none;
  font:650 clamp(21px,1.9vw,27px)/1 var(--disp);white-space:nowrap;letter-spacing:-.015em;color:var(--acc-deep);
  background:var(--acc);padding:26px 26px 26px 38px;border-radius:999px;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset,0 18px 50px -12px rgba(245,136,58,.65),0 0 90px -20px rgba(245,136,58,.8);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.go .arr{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--acc-deep);color:var(--acc);transition:transform .25s var(--ease)}
.go .arr svg{width:20px;height:20px}
.go:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 24px 60px -12px rgba(245,136,58,.8),0 0 120px -20px rgba(245,136,58,.9)}
.go:hover .arr{transform:translateX(4px)}
.go:focus-visible{outline:3px solid var(--text);outline-offset:5px;border-radius:999px}
.jump{color:var(--text-2);text-decoration:none;display:inline-flex;gap:8px;align-items:center;padding-block:10px}
.jump:hover{color:var(--text)}
.legend{position:absolute;right:var(--gut);bottom:clamp(40px,7vh,72px);z-index:2;display:grid;gap:8px;justify-items:end;text-align:right;color:var(--muted)}
.legend .ramp{display:flex;align-items:center;gap:8px}
.legend .ramp i{display:block;width:120px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--h1),var(--h15),var(--h2))}
.legend b{color:var(--text-2);font-weight:500}
.legend .live{display:inline-flex;gap:8px;align-items:center}
.legend .live i{width:6px;height:6px;border-radius:50%;background:var(--h1);box-shadow:0 0 10px var(--h1);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* entrance: starts visible-ish, runs once on load (never waits on scroll) */
.rise{animation:rise .9s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}}

/* ---------- contest ---------- */
.contest{padding-block:clamp(64px,10vh,112px) 40px}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:16px 40px;margin-bottom:40px}
.head h2{margin:10px 0 0;font:700 clamp(40px,4.6vw,68px)/.95 var(--disp);letter-spacing:-.035em}
.head p{margin:18px 0 0;color:var(--text-2);font-size:clamp(16px,1.3vw,19px);max-width:52ch}
.head .kicker{color:var(--muted)}
.tally{display:flex;gap:28px}
.tally div{display:grid;gap:2px}
.tally b{font:650 44px/1 var(--disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tally span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;grid-auto-flow:dense}
.card{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:20px;overflow:hidden;
  transition:border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{border-color:color-mix(in srgb,var(--hue) 55%,transparent);transform:translateY(-3px);
  box-shadow:0 30px 70px -30px color-mix(in srgb,var(--hue) 55%,transparent)}
.card:focus-within{border-color:var(--hue)}
.shot{position:relative;aspect-ratio:16/10;max-width:100%;background:var(--panel-2);overflow:hidden;border-bottom:1px solid var(--rule)}
.shot img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:transform .6s var(--ease),opacity .5s var(--ease)}
.shot img.ok{opacity:1}
.card:hover .shot img{transform:scale(1.03)}
.ph{position:absolute;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(120% 90% at 70% 110%,color-mix(in srgb,var(--hue) 40%,transparent),transparent 60%),
    repeating-linear-gradient(0deg,color-mix(in srgb,var(--hue) 16%,transparent) 0 1px,transparent 1px 28px),
    repeating-linear-gradient(90deg,color-mix(in srgb,var(--hue) 16%,transparent) 0 1px,transparent 1px 28px),
    var(--panel-2)}
.ph span{padding:8px 12px;border:1px solid color-mix(in srgb,var(--hue) 50%,transparent);border-radius:999px;color:var(--hue);background:rgba(7,8,10,.6)}
.shot.noimg img{display:none}
.chips{z-index:2;position:absolute;inset:14px 14px auto 14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:rgba(7,8,10,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);color:var(--text-2)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--hue);box-shadow:0 0 10px var(--hue)}
.score b{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.card[data-score=""] .score b{color:var(--muted)}
.win{display:none;background:var(--acc);color:var(--acc-deep);border-color:transparent}
.body{display:grid;gap:10px;padding:20px 22px 22px;flex:1;align-content:start}
.body h3{margin:0;font:680 clamp(22px,1.7vw,27px)/1.1 var(--disp);letter-spacing:-.02em}
.pitch{margin:0;color:var(--text-2);font-size:15px;min-height:1.55em}
.pitch.pending{color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:10px;border-top:1px solid var(--rule)}
.foot .mono{color:var(--faint);overflow-wrap:anywhere}
.open{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 var(--sans);text-decoration:none;color:var(--text);padding:9px 14px;border-radius:999px;border:1px solid var(--rule-2);white-space:nowrap;transition:background .2s,border-color .2s}
.open::after{content:"";position:absolute;inset:0;border-radius:20px}
.open svg{width:14px;height:14px}
.card:hover .open{border-color:var(--hue);background:color-mix(in srgb,var(--hue) 14%,transparent)}
/* winner */
.card[data-winner]{grid-column:span 2;grid-row:span 2;border-color:color-mix(in srgb,var(--acc) 70%,transparent);
  box-shadow:0 0 0 1px var(--acc-soft),0 40px 100px -40px rgba(245,136,58,.7);order:-1}
.card[data-winner] .win{display:inline-flex}
.card[data-winner] .body{padding:26px 28px 26px}
.card[data-winner] .body h3{font-size:clamp(28px,2.6vw,40px)}
.card[data-winner] .pitch{font-size:17px}
/* 6th slot: the grafted build */
.build{position:relative;display:grid;align-content:space-between;gap:24px;min-width:0;padding:26px;border-radius:20px;overflow:hidden;
  background:radial-gradient(120% 80% at 100% 100%,rgba(245,136,58,.26),transparent 60%),var(--panel);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--rule))}
.build h3{margin:10px 0 0;font:700 clamp(26px,2.2vw,34px)/1.02 var(--disp);letter-spacing:-.025em}
.build ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.build li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:baseline;color:var(--text-2);font-size:15px;counter-increment:s}
.build li::before{content:counter(s);font:500 11px/1 var(--mono);color:var(--acc-ink);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.build .go{font-size:19px;padding:14px 14px 14px 24px;gap:14px;justify-self:start}
.build .go .arr{width:34px;height:34px}
.build .kicker{color:var(--acc-ink)}

/* ---------- footer ---------- */
footer{padding-block:48px calc(56px + env(safe-area-inset-bottom,0px))}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;padding-top:28px;border-top:1px solid var(--rule)}
.foot-in p{margin:0;color:var(--text-2);max-width:62ch;font-size:15px}
.foot-in .mono{color:var(--faint)}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card[data-winner]{grid-row:span 1}
  .grid.has-winner .build{grid-column:span 2}
}
@media (max-width:760px){
  .hero{flex-direction:column;align-items:stretch;justify-content:flex-end;gap:22px;min-height:clamp(640px,92svh,760px);padding-block:96px 36px}
  h1{font-size:clamp(40px,11.4vw,60px)}
  .hero::before{background:linear-gradient(180deg,rgba(7,8,10,.1) 0%,rgba(7,8,10,.35) 38%,rgba(7,8,10,.94) 70%,var(--page) 100%)}
  .legend{position:static;justify-items:start;text-align:left;padding-inline:var(--gut)}
  .legend .ramp i{width:90px}
  .go{padding:22px 22px 22px 30px}
  .head{grid-template-columns:minmax(0,1fr)}
  .tally b{font-size:34px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card[data-winner],.grid.has-winner .build{grid-column:auto}
  .mark span{display:none}
}
@media (prefers-reduced-motion:reduce){
  .rise,.legend .live i{animation:none}
  .card,.card:hover,.shot img,.go{transition:none;transform:none}
}
.still .rise{animation:none}
</style>

<script>
(() => {
/* ---------------- strings ---------------- */
const T = {
  en: {
    lab: "Holo Lab", eyebrow: "Hologram walk · Fremont, NE",
    h1: "Your walk,<br><em>as a hologram.</em>",
    sub: "Fremont. Real streets, real hail, 25 doors.",
    enter: "Enter the walk", seeContest: "See the contest",
    replay: "Replay · Jul 1, 2026 hail · max 1.17 in", srcHero: "Streets: Nebraska GIS · Hail: NOAA/MRMS",
    kicker: "Five concepts, one walk", contest: "The contest",
    explain: "5 designers, 3 judges, 1 builder grafted the best ideas from all five, testers tried to break it.",
    tDesigners: "Designers", tJudges: "Judges", tBuild: "Build",
    score: "Score", pending: "Pending", winner: "Winner", open: "Open", shotPending: "Shot pending",
    pitchPending: "Pitch lands after judging.",
    buildKicker: "The final build", buildTitle: "The best of all five, in one walk.",
    steps: ["5 designers built a hologram walk each", "3 judges scored them", "1 builder grafted the best ideas", "Testers tried to break it"],
    buildGo: "Enter the walk",
    footer: "Homes are samples until knocking starts. Hail and streets are real (NOAA/MRMS, Nebraska GIS).",
    footMark: "Aldaba · Holo Lab · 2026"
  },
  es: {
    lab: "Holo Lab", eyebrow: "Ruta en holograma · Fremont, NE",
    h1: "Tu ruta,<br><em>en holograma.</em>",
    sub: "Fremont. Calles reales, granizo real, 25 puertas.",
    enter: "Entrar a la ruta", seeContest: "Ver el concurso",
    replay: "Repetición · granizo del 1 jul 2026 · máx. 1.17 in", srcHero: "Calles: Nebraska GIS · Granizo: NOAA/MRMS",
    kicker: "Cinco conceptos, una ruta", contest: "El concurso",
    explain: "5 diseñadores y 3 jueces; 1 constructor juntó las mejores ideas de los cinco y los testers intentaron romperlo.",
    tDesigners: "Diseñadores", tJudges: "Jueces", tBuild: "Versión final",
    score: "Puntaje", pending: "Pendiente", winner: "Ganador", open: "Abrir", shotPending: "Captura pendiente",
    pitchPending: "La propuesta llega después de la evaluación.",
    buildKicker: "La versión final", buildTitle: "Lo mejor de los cinco, en una sola ruta.",
    steps: ["5 diseñadores hicieron cada uno su ruta en holograma", "3 jueces les pusieron puntaje", "1 constructor juntó las mejores ideas", "Los testers intentaron romperla"],
    buildGo: "Entrar a la ruta",
    footer: "Las casas son de muestra hasta que empecemos a tocar puertas. El granizo y las calles son reales (NOAA/MRMS, Nebraska GIS).",
    footMark: "Aldaba · Holo Lab · 2026"
  }
};
const Q = new URLSearchParams(location.search);
const STILL = Q.has("still");
if (STILL) document.documentElement.classList.add("still");
let lang = Q.get("lang");
if (!lang) { try { lang = localStorage.getItem("holoLab.lang"); } catch (e) {} }
if (lang !== "es") lang = "en";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const withLang = href => lang === "es" ? href + "?lang=es" : href;

/* ---------------- cards ---------------- */
const grid = document.getElementById("grid");
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
function renderCards() {
  const L = window.LAB || { winner: "", concepts: [] }, t = T[lang];
  const win = Q.get("winner") || L.winner || "";
  grid.classList.toggle("has-winner", !!win && L.concepts.some(c => c.dir === win));
  grid.innerHTML = L.concepts.map(c => {

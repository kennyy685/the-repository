<!doctype html>
<!--
  Direction "LiDAR Scan" - the HOLOGRAM WALK (HMP App / Aldaba). Mockup, not the live app.
  The pick's walk (Fremont: E 12th St & E Linden Ave, Jul 1 2026 hail) rebuilt as a LiDAR point cloud (~375k seeded returns):
  a scanner on the car at the parking spot sweeps once to paint the street (ground returns in concentric range rings, curbs,
  neighbours, back-yard trees), the 25 SAMPLE homes are dense clouds coloured by the hail at that home (cool->hot scale),
  per-point depth of field, points breathe a few cm, a slow rotating beam leaves an afterglow. Hail also sits calmly on the
  ground as contour lines. Walk routed door to door (rank order) on real Fremont streets.
  Click a house: hail size + roof age in huge type first, then why this door.
  Built on the holo-jarvis UI shell (HUD, card, tour, camera springs). Borrowed ideas:
  - Spinning automotive LiDAR ring pattern + intensity colouring: Velodyne / Ouster sample clouds, Waymo Open Dataset viewer
  - Per-point circle-of-confusion depth of field: Potree point renderer (Markus Schuetz) https://github.com/potree/potree
  - Anti-aliased contour lines with fwidth(): Ben Golus, "The Best Darn Grid Shader (Yet)"
  - Hail sizes as everyday objects: NWS hail size chart https://www.weather.gov/abr/hailsize
  - Critically damped camera springs: Game Programming Gems 4, 1.10
  Data: ../shared/data.js + ../shared/data-fremont.js. Homes are FAKE samples, no owner names. Neighbours and trees are generic, not data.
  three.js r170 vendored in ../shared/vendor (no network).
-->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aldaba LiDAR Walk</title>
<meta name="color-scheme" content="dark">
<style>
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(../shared/fonts/GeistMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Bricolage L";src:url(../shared/fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --void:#01050a;--panel:rgba(2,9,16,.80);--panel-solid:#030b13;--edge:rgba(120,225,255,.16);--edge-2:rgba(140,232,255,.34);
  --text:#eaf9ff;--text-2:#a6c6d4;--muted:#6a8ea1;--faint:#40606f;
  --ice:#e2fbff;--cy:#66e4ff;--cy-2:#2bb6e0;--cy-soft:rgba(102,228,255,.11);
  --acc:#f5883a;--acc-ink:#ffab70;--acc-soft:rgba(245,136,58,.15);
  --h1:#f2c14e;--h15:#f5883a;--h2:#ff4f5a;--gold:#ffd27a;
  --sans:"Geist","Geist L",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono","Geist Mono L",ui-monospace,Menlo,monospace;
  --disp:"Bricolage Grotesque","Bricolage L","Geist L",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --g:16px;--top:70px;--sh:88px;--lw:clamp(270px,20.5vw,298px);--cw:clamp(336px,26.5vw,386px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--text);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1;letter-spacing:-.01em}
canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
body.hovering canvas#gl{cursor:pointer}
body.dragging canvas#gl{cursor:grabbing}

/* ---------- in-scene labels (projected every frame) ---------- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.lb.off{visibility:hidden}
.lb:not(.bd){opacity:var(--lo,1)}
.lb.far{opacity:calc(var(--lo,1) * var(--fo,1))}
.lb.hid > *{opacity:0;transition:opacity .2s}
.bdg{pointer-events:auto;cursor:pointer;position:relative;display:grid;place-items:center;min-width:23px;height:20px;padding:0 5px;border-radius:5px;transform:translate(-50%,-100%);
  font:600 10.5px/1 var(--mono);letter-spacing:.02em;color:var(--ice);background:rgba(2,12,22,.84);
  border:1px solid rgba(140,232,255,.5);box-shadow:0 0 12px rgba(102,228,255,.25),inset 0 0 8px rgba(102,228,255,.08);
  transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),opacity .3s var(--ease),transform .3s var(--ease)}
.bdg::after{content:"";position:absolute;left:50%;bottom:-5px;width:1px;height:5px;background:rgba(160,236,255,.6)}
.bdg.top5{border-color:rgba(255,210,122,.75);color:#fff2d6;box-shadow:0 0 14px rgba(255,210,122,.3)}
.bdg.top5::before{content:"";position:absolute;right:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.bdg.vis{border-color:rgba(245,136,58,.75);color:var(--acc-ink)}
.bdg.hov{background:var(--ice);color:#021019;border-color:var(--ice)}
.bdg.sel{background:var(--acc);color:#1a0b01;border-color:#ffc79c;box-shadow:0 0 18px rgba(245,136,58,.6)}
.bdg.dim{opacity:.4}
.bdg.pre{opacity:0;transform:translate(-50%,-60%) scale(.6)}
.st{font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(150,220,245,.5);transform-origin:0 0}
.st.w{color:rgba(226,251,255,.9);font-size:10.5px;text-shadow:0 0 10px rgba(102,228,255,.55)}
.rim{font:600 11px/1 var(--mono);color:rgba(150,225,250,.6);letter-spacing:.1em;transform:translate(-50%,-50%)}
.rim.n{color:var(--ice);text-shadow:0 0 10px var(--cy)}
.rim.t{font-size:9px;letter-spacing:.18em;color:rgba(140,210,235,.42)}
.ctr{font:600 9.5px/1 var(--mono);letter-spacing:.02em;padding:2px 4px;border-radius:3px;background:rgba(10,6,0,.62);color:#ffd88f;transform:translate(-50%,-50%);border:1px solid rgba(242,193,78,.25)}
.stm{font:600 9.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#ffc970;text-shadow:0 0 10px rgba(242,193,78,.45);transform-origin:0 0}
.pk{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border-radius:7px;background:rgba(26,11,1,.86);transform:translate(-50%,-50%);
  border:1px solid rgba(245,136,58,.8);box-shadow:0 0 18px rgba(245,136,58,.35);font:600 10px/1 var(--mono);letter-spacing:.08em;color:#ffd2b0;text-transform:uppercase}
.pk b{display:grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--acc);color:#1a0b01;font:700 12px/1 var(--sans)}
.comet{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(245,136,58,.55),0 0 22px 6px rgba(245,136,58,.7);transform:translate(-50%,-50%)}

/* ---------- hover tag + floating readout ---------- */
#tag{position:fixed;left:0;top:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .12s;padding:7px 10px 8px;border-radius:8px;
  background:rgba(2,10,18,.92);border:1px solid var(--edge-2);box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 16px rgba(102,228,255,.16);white-space:nowrap}
#tag.on{opacity:1}
#tag .k{font:600 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--cy);text-transform:uppercase}
#tag .a{font:600 13.5px/1.2 var(--sans);margin-top:4px}
#tag .m{font:500 10.5px/1 var(--mono);color:var(--text-2);margin-top:5px}
#lead{position:fixed;inset:0;width:100vw;height:100vh;z-index:3;pointer-events:none;overflow:visible;opacity:0;transition:opacity .35s var(--ease)}
#lead.on{opacity:1}
#lead path{fill:none;stroke:rgba(200,245,255,.8);stroke-width:1}
#lead circle.o{fill:none;stroke:var(--acc);stroke-width:1.5}
#lead circle.i{fill:var(--acc)}
#readout{position:fixed;left:0;top:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .35s var(--ease);width:232px;padding:10px 12px 11px;
  background:linear-gradient(180deg,rgba(102,228,255,.12),rgba(102,228,255,.035));border:1px solid rgba(140,232,255,.34);border-radius:2px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font:500 10.5px/1 var(--mono);color:var(--ice)}
#readout.on{opacity:1}
#readout::before,#readout::after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--ice)}
#readout::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
#readout::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
#readout .h{display:flex;justify-content:space-between;gap:8px;letter-spacing:.14em;color:var(--cy);font-size:9.5px;margin-bottom:9px;text-transform:uppercase}
#readout .h b{color:var(--ice);font-weight:600}
#readout .r{display:grid;grid-template-columns:46px 1fr 50px;align-items:center;gap:8px;margin-top:7px;letter-spacing:.08em;text-transform:uppercase}
#readout .r span:first-child{color:var(--text-2)}
#readout .r b{font-weight:500;color:var(--ice);text-align:right}
#readout .bar{height:3px;background:rgba(102,228,255,.16);position:relative}
#readout .bar i{position:absolute;inset:0 auto 0 0;background:var(--ice);box-shadow:0 0 6px var(--cy)}
#readout .bar i.w{background:linear-gradient(90deg,var(--h1),var(--h15));box-shadow:0 0 6px rgba(245,136,58,.8)}
#readout .ft{display:flex;justify-content:space-between;margin-top:9px;padding-top:7px;border-top:1px solid rgba(140,232,255,.2);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
#readout .ft b{color:var(--ice);font-weight:500}

/* ---------- viewport frame (JARVIS brackets) ---------- */
.frame{position:fixed;inset:8px;z-index:1;pointer-events:none}
.frame i{position:absolute;width:20px;height:20px;border:1px solid rgba(140,232,255,.26)}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

/* ---------- chrome ---------- */
.ui{position:fixed;z-index:5}
.fade{opacity:0;transform:translateY(6px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
body.ready .fade{opacity:1;transform:none}
.glass{position:relative;display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:rgba(8,22,34,.55);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border:1px solid rgba(160,235,255,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.2),0 6px 22px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 50%)}
.seg button{position:relative;padding:6px 11px;border-radius:999px;font:600 11px/1 var(--sans);letter-spacing:.04em;color:var(--text-2);transition:background .15s var(--ease),color .15s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--ice);color:#021019}
.seg button:hover{color:var(--text)}.seg button[aria-pressed="true"]:hover{color:#021019}

#topl{left:var(--g);top:var(--g);display:flex;align-items:center;gap:14px;height:40px}
#back{height:40px;padding:0 15px 0 11px;gap:7px;border-radius:999px;font:600 13px/1 var(--sans);color:var(--text)}
#back svg{width:16px;height:16px}
#back kbd{font:500 9.5px/1 var(--mono);color:var(--muted);border:1px solid var(--edge);border-radius:4px;padding:2px 4px;margin-left:3px}
#back:hover{border-color:rgba(160,235,255,.5)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:27px;height:27px;flex:none}
.brand .eb{display:block;font:600 9.5px/1 var(--mono);letter-spacing:.2em;color:var(--cy);text-transform:uppercase}
.brand b{display:block;font:650 15px/1.15 var(--disp);letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
#topr{right:var(--g);top:var(--g);display:flex;align-items:center;gap:12px;height:40px;padding-left:14px;border-radius:999px;background:linear-gradient(90deg,rgba(1,5,10,0),rgba(1,5,10,.55) 18%)}
.tele{display:flex;align-items:center;gap:12px;font:500 10px/1 var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tele b{color:var(--text-2);font-weight:500}
.tele .sb{display:flex;align-items:center;gap:6px}
.tele .sb i{display:block;height:6px;border:1px solid var(--text-2);border-top:0}
.sample{display:flex;align-items:center;gap:6px;font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sample::before{content:"";width:6px;height:6px;border-radius:50%;border:1px dashed var(--h1)}

/* panels: solid-ish body, cyan edge, JARVIS corner ticks */
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(200,245,255,.09),0 18px 50px rgba(0,0,0,.45)}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow .hi{color:var(--cy)} .eyebrow .or{color:var(--acc-ink)}

#hud{left:var(--g);top:var(--top);width:var(--lw);max-height:calc(100vh - var(--top) - var(--sh) - var(--g) * 2);overflow:auto;scrollbar-width:none;padding:16px 16px 14px}
#hud::-webkit-scrollbar{display:none}
#hud h1{margin:10px 0 3px;font:700 27px/1.02 var(--disp);letter-spacing:-.035em;font-variation-settings:"opsz" 96;text-wrap:balance}
#hud .sub{color:var(--text-2);font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;margin:13px 0 11px;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.kv > div{padding:8px 10px 8px;border-right:1px solid var(--edge);border-bottom:1px solid var(--edge);min-width:0}
.kv > div:nth-child(2n){border-right:0}.kv > div:nth-child(n+3){border-bottom:0}
.kv .k{font:600 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kv .v{font:650 21px/1.05 var(--disp);letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.kv .v small{font:500 11px var(--sans);letter-spacing:0;color:var(--text-2);margin-left:3px}
.kv .s{font:500 10px/1.2 var(--mono);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .v.hail{color:var(--h1);text-shadow:0 0 18px rgba(242,193,78,.35)}
.why0{color:var(--text-2);font-size:12px;line-height:1.45;margin:0 0 12px}
.go{display:flex;align-items:center;justify-content:space-between;width:100%;border-radius:10px;padding:12px 14px;background:var(--acc);color:#1a0b01;
  font:650 14px/1 var(--sans);letter-spacing:-.01em;box-shadow:0 8px 26px rgba(245,136,58,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s var(--ease),filter .15s var(--ease)}
.go:hover{filter:brightness(1.07)} .go:active{transform:scale(.985)}
.go .n{font:600 12px/1 var(--mono);opacity:.75}
.go svg{width:13px;height:13px;margin-right:8px;vertical-align:-1px}
.go2{display:none;gap:8px}
.go2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0;border-radius:10px;border:1px solid var(--edge-2);font:600 13px/1 var(--sans);color:var(--text)}
.go2 button.p{background:var(--acc);border-color:var(--acc);color:#1a0b01}
.go2 button:hover{filter:brightness(1.1)}
.go2 svg{width:12px;height:12px}
body.touring .go{display:none} body.touring .go2{display:flex}
.prog{margin-top:13px;padding-top:11px;border-top:1px solid var(--edge)}
.prog .bar{position:relative;height:6px;border-radius:3px;background:rgba(102,228,255,.10);margin:9px 0 7px;overflow:hidden}
.prog .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:linear-gradient(90deg,var(--acc),#ffc08f);box-shadow:0 0 10px rgba(245,136,58,.6);transition:width .3s linear}
.prog .bar em{position:absolute;top:0;bottom:0;width:1px;background:rgba(1,5,10,.8)}
.prog .t{display:flex;justify-content:space-between;gap:8px;font:500 10.5px/1 var(--mono);color:var(--text-2);white-space:nowrap}
.prog .t b{color:var(--text);font-weight:500}
.legend{margin-top:12px;padding-top:11px;border-top:1px solid var(--edge);display:grid;gap:7px;font-size:11.5px;color:var(--text-2)}
.legend .l{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:9px}
.legend .gr{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(242,193,78,.35),var(--h1) 40%,#f4a844)}
.legend .sc{display:flex;justify-content:space-between;font:500 9.5px/1 var(--mono);color:var(--muted);margin:2px 0 0 45px}
.legend .bm{justify-self:center;display:grid;place-items:center;min-width:20px;height:15px;border-radius:4px;border:1px solid rgba(140,232,255,.5);font:600 9px/1 var(--mono);color:var(--ice)}
.legend .bm.t{border-color:rgba(255,210,122,.75);color:#fff2d6}
.legend .bh{justify-self:center;width:20px;height:16px;filter:drop-shadow(0 0 3px rgba(102,228,255,.8))}
.legend .wk{height:3px;border-radius:2px;background:var(--ice);box-shadow:0 0 8px var(--cy)}
.legend .sm{height:0;border-top:1.5px dashed #ffc970;opacity:.85}
.src{margin-top:11px;font:500 9.5px/1.45 var(--mono);color:var(--faint);letter-spacing:.01em}

/* ---------- house card ---------- */
#card{right:var(--g);top:var(--top);width:var(--cw);max-height:calc(100vh - var(--top) - var(--sh) - var(--g) * 2);overflow:auto;scrollbar-width:none;padding:15px 18px 14px;
  opacity:0;transform:translateX(22px);pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
#card::-webkit-scrollbar{display:none}
body.card-open #card{opacity:1;transform:none;pointer-events:auto}
#card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:.75}
.chd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chd .eyebrow{justify-content:flex-start;gap:10px;color:var(--text-2)}
.chd .eyebrow b{color:var(--ice);font-weight:600}
.chd .smp{display:inline-flex;align-items:center;gap:5px;color:var(--muted);letter-spacing:.08em}
.chd .smp::before{content:"";width:5px;height:5px;border-radius:50%;border:1px dashed var(--h1)}
.chd .x{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:1px solid var(--edge);color:var(--text-2)}
.chd .x:hover{color:var(--text);border-color:var(--cy)}
.big{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.big > div{padding:13px 0 12px;min-width:0}
.big > div + div{padding-left:16px;border-left:1px solid var(--edge)}
.big .k{font:600 9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--text-2)}
.big .v{display:flex;align-items:baseline;margin-top:8px;font:750 70px/.86 var(--disp);letter-spacing:-.06em;font-variation-settings:"opsz" 96;white-space:nowrap}
.big .v small{font:650 19px/1 var(--disp);letter-spacing:-.02em;margin-left:5px}
.big .hail .v{color:#ffcf6a;text-shadow:0 0 30px rgba(245,160,58,.45)}
.big .hail .v small{color:#ffcf6a}
.big .v small.in{align-self:flex-start;font:650 40px/1 var(--disp);margin:-2px 0 0 3px;letter-spacing:0}
.big .roof .v{color:var(--ice);text-shadow:0 0 30px rgba(102,228,255,.4)}
.big .roof .v small{color:var(--text-2)}
.big .d{margin-top:8px;font-size:11px;color:var(--text-2);line-height:1.3;min-height:28px}
.meter{position:relative;height:4px;border-radius:2px;margin-top:10px}
.meter.h{background:linear-gradient(90deg,rgba(242,193,78,.25),var(--h1) 55%,#f4a844)}

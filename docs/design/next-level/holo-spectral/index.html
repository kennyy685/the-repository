<!doctype html>
<!--
  Hologram walk, direction "Spectral" (HMP App / Aldaba mockup, not the live app).
  When you pick a zone, the walk, the road and the 25 doors become iridescent thin-film holograms. Each house
  shimmers like a soap bubble; its base hue is the hail that hit it (full spectrum, legend on screen).
  Borrowed (and where from):
  - Thin-film interference color (soap bubble / holographic foil): optical path 2*n*d*cos(theta) per wavelength,
      Glassner "Soap Bubbles" (IEEE CG&A 2000) https://ieeexplore.ieee.org/document/820319 and Belcour & Barla,
      "A Practical Extension to Microfacet Theory for the Modeling of Varying Iridescence" (SIGGRAPH 2017)
      https://belcour.github.io/blog/research/publication/2017/05/01/brdf-thin-film.html
  - Spectrum-as-severity legend, calm contour lines instead of particles: USGS topographic contours +
      Windy "isolines" layer https://www.windy.com/-Show-add-more-layers/overlays
  - Screen-space thick lines (constant pixel width, round caps): Matt DesLauriers "Drawing Lines is Hard"
      https://mattdesl.svbtle.com/drawing-lines-is-hard
  - Critically damped camera follow (no overshoot, no glitch): Ryan Juckett "Damped Springs"
      https://www.ryanjuckett.com/damped-springs/
  - Glass only on the controls layer, text on solid, specular top edge: Apple "Meet Liquid Glass" (WWDC25)
      https://developer.apple.com/videos/play/wwdc2025/219/
  - Animate only transform/opacity, interruptible motion: Vercel Web Interface Guidelines https://vercel.com/design/guidelines
  Data: ../shared/data.js + ../shared/data-fremont.js (Fremont pick E 12th St & E Linden Ave, Jul 1 2026 hail; Nebraska GIS
  streets, NOAA SPC + MRMS storms, engine pick + walk). Homes are FAKE samples, no owner names.
  three.js r170 vendored in ../shared/vendor (no network).
-->
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aldaba Spectral Walk</title>
<meta name="color-scheme" content="dark">
<link rel="preload" href="../shared/fonts/BricolageGrotesque-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../shared/fonts/Geist-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Geist L";src:url(../shared/fonts/Geist-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Geist Mono L";src:url(../shared/fonts/GeistMono-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Bricolage L";src:url(../shared/fonts/BricolageGrotesque-var.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --page:#05030b;--panel:rgba(11,8,22,.9);--panel-solid:#0b0816;--rule:rgba(196,178,255,.13);--rule-2:rgba(196,178,255,.22);
  --text:#f5f2ff;--text-2:#c3bbdf;--muted:#8c84ab;--faint:#5a5376;
  --acc:#f5883a;--acc-ink:#ffa766;
  --s0:#7a5cff;--s1:#4f8bff;--s2:#22d3ee;--s3:#5ef2b0;--s4:#f7e35a;--s5:#ff9a3c;--s6:#ff3d8b;
  --hailscale:linear-gradient(90deg,#3d6bff,#22c7f0,#f7e35a,#ffb52e,#ff7a1f,#ff4436,#ff2d6f,#f02fb4,#c43cf5);
  --st-next:#3ff0ff;--st-done:#3ee89a;--st-skip:#8a86a6;--st-top:#c9a2ff;
  --spectrum:linear-gradient(90deg,var(--s0),var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6));
  --foil:conic-gradient(from var(--ang,0deg),#7a5cff,#4f8bff,#22d3ee,#5ef2b0,#f7e35a,#ff9a3c,#ff3d8b,#7a5cff);
  --glass:rgba(20,15,40,.5);--glass-edge:rgba(220,205,255,.16);--glass-hi:rgba(255,255,255,.22);
  --sans:"Geist","Geist L",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono","Geist Mono L",ui-monospace,Menlo,monospace;
  --disp:"Bricolage Grotesque","Bricolage L","Geist L",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --card-w:clamp(360px,28vw,408px);
  --zone-w:clamp(300px,24vw,352px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--text);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid #cbbcff;outline-offset:2px}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.ui{position:fixed;z-index:4}
.fade{opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:var(--d,0ms)}
.ready .fade{opacity:1;transform:none}
.still .fade,.rm .fade{transition:none!important}
/* scrims keep text on near-solid ground */
.scrim-l{position:fixed;left:0;top:0;bottom:0;width:calc(var(--zone-w) + 170px);z-index:3;pointer-events:none;
  background:linear-gradient(90deg,rgba(5,3,11,.9) 0%,rgba(5,3,11,.74) 52%,rgba(5,3,11,0) 100%);transition:opacity .5s var(--ease)}
.scrim-b{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:3;pointer-events:none;background:linear-gradient(0deg,rgba(5,3,11,.86),rgba(5,3,11,0))}
.scrim-t{position:fixed;left:0;right:0;top:0;height:110px;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(5,3,11,.72),rgba(5,3,11,0))}
body.detail .scrim-l{opacity:0}
/* Liquid Glass, controls only */
.glass{position:relative;display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(0,0,0,.25),0 8px 26px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 50%)}
/* top bar */
.top{left:18px;right:18px;top:16px;display:flex;align-items:center;gap:12px;height:40px;animation:topIn .6s var(--ease) both .15s}
@keyframes topIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.still .top{animation:none}
.back{height:38px;padding:0 15px 0 11px;gap:8px;font:600 13px var(--sans);letter-spacing:-.01em;color:var(--text)}
.back svg{width:17px;height:17px}
.back:hover{background:rgba(40,30,80,.62)}
.back kbd{font:500 10px var(--mono);color:var(--muted);border:1px solid var(--rule-2);border-radius:4px;padding:1px 4px;margin-left:2px}
.brand{display:flex;align-items:center;gap:8px;font:650 17px/1 var(--disp);letter-spacing:-.03em;font-variation-settings:"opsz" 96;padding-left:4px}
.brand svg{width:24px;height:24px}
.hud{display:flex;align-items:center;gap:0;height:36px;padding:0 4px;border-radius:999px;opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .4s var(--ease),transform .4s var(--ease)}
body.detail .hud{opacity:1;transform:none;pointer-events:auto}
.hud span{padding:0 12px;white-space:nowrap;color:var(--text-2);font-size:12.5px;border-left:1px solid var(--rule)}
.hud span:first-child{border-left:0;color:var(--text);font-weight:600}
.hud b{font:500 12.5px var(--mono);color:var(--text);font-weight:500}
.hud .hh{background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud .pgw{display:flex;align-items:center;width:112px;padding:0 12px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)) center/calc(100% - 24px) 4px no-repeat}
.hud .pgw i{display:block;height:4px;border-radius:2px;background:var(--spectrum);box-shadow:0 0 10px rgba(190,160,255,.6);min-width:4px;transition:width .3s linear}
.sp{flex:1}
.sample{display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--sans);color:var(--muted);padding:0 4px;cursor:help;white-space:nowrap}
.sample i{width:7px;height:7px;border-radius:2px;background:var(--foil);opacity:.8}
.seg button{padding:6px 12px;border-radius:999px;font:600 11.5px var(--sans);color:var(--text-2);letter-spacing:.02em;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--text);color:#0b0816}
.seg button:hover{color:var(--text)} .seg button[aria-pressed="true"]:hover{color:#0b0816}
/* zone panel */
.zone{left:26px;top:86px;width:var(--zone-w);transition:opacity .45s var(--ease),transform .45s var(--ease)}
body.detail .zone{opacity:0!important;transform:translateX(-16px)!important;pointer-events:none}
.eyebrow{font:600 10.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--foil);box-shadow:0 0 12px rgba(200,170,255,.7)}
.zone h1{margin:12px 0 0;font:720 clamp(40px,3.6vw,54px)/.94 var(--disp);letter-spacing:-.045em;font-variation-settings:"opsz" 96}
.zone h1 .l1,.zone h1 .l2{display:block;white-space:nowrap}
.zone h1 .l2{font-size:.74em;letter-spacing:-.035em;margin-top:.1em;color:var(--text)}
.zone h1 .amp{font-weight:420;color:var(--text-2)}
.zone .town{margin-top:8px;font:560 19px/1.2 var(--disp);letter-spacing:-.02em;color:var(--text-2);font-variation-settings:"opsz" 96}
.stats{display:grid;grid-template-columns:1fr 1fr;margin-top:20px;border-top:1px solid var(--rule)}
.stat{padding:11px 0 11px;border-bottom:1px solid var(--rule);min-width:0}
.stat:nth-child(odd){padding-right:12px;border-right:1px solid var(--rule)}
.stat:nth-child(even){padding-left:14px}
.stat .l{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:650 27px/1.05 var(--disp);letter-spacing:-.035em;margin-top:5px;white-space:nowrap;font-variation-settings:"opsz" 96}
.stat .v small{font:500 12px var(--sans);letter-spacing:0;color:var(--text-2);margin-left:4px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec-t{background:var(--spectrum);background-size:100% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.zone .why{margin:16px 0 18px;color:var(--text-2);font-size:13.5px;line-height:1.5}
.cta{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;padding:0 18px 0 20px;border-radius:14px;
  background:linear-gradient(180deg,#fbf9ff,#e6e0f7);color:#0e0a1c;font:650 16px var(--sans);letter-spacing:-.015em;isolation:isolate;
  box-shadow:0 10px 34px rgba(150,110,255,.28),inset 0 1px 0 #fff;transition:transform .15s var(--ease),filter .15s}
.cta::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:linear-gradient(100deg,#ffb066 0%,#ff7a59 18%,#ff4f9a 36%,#9b6bff 56%,#4fb6ff 76%,#5ef2c4 100%)}
.cta::after{content:"";position:absolute;inset:-8px;border-radius:22px;z-index:-2;filter:blur(18px);opacity:.42;
  background:linear-gradient(100deg,#ff9a3c,#ff3d8b,#7a5cff,#22d3ee,#5ef2b0)}
.cta span:first-child{text-shadow:0 1px 0 rgba(255,255,255,.25)}
.cta:hover{filter:brightness(1.04)} .cta:active{transform:scale(.985)}
.cta .n{font:600 12px var(--mono);color:#0b1a24;display:flex;align-items:center;gap:8px}
.cta .n svg{width:15px;height:15px}
.park{display:flex;align-items:center;gap:9px;margin-top:12px;color:var(--text-2);font-size:12.5px}
.park .pk{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1.5px solid #e9e4ff;font:700 11px var(--sans);color:#fff;box-shadow:0 0 12px rgba(200,190,255,.45)}
.park .m{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.park>span:nth-child(2){min-width:0;line-height:1.35}
.park .pk{flex:none}
/* legend */
.legend{right:26px;top:74px;width:248px;text-align:right;transition:right .5s var(--ease),opacity .4s var(--ease)}
body.detail .legend{opacity:0;pointer-events:none}
.legend .t{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}

.legend .bar{height:8px;border-radius:4px;background:var(--hailscale);margin:8px 0 5px;box-shadow:0 0 18px rgba(170,140,255,.35)}
.legend .tk{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--text-2)}
.legend .s{font-size:11px;color:var(--muted);margin-top:5px}
/* bottom strip */
.strip{left:calc(var(--zone-w) + 60px);right:26px;bottom:18px;display:flex;flex-direction:column;align-items:center;transition:left .55s var(--ease),right .55s var(--ease)}
body.detail .strip{left:26px;right:calc(var(--card-w) + 44px)}
.strip-h{display:flex;align-items:baseline;gap:12px;width:100%;max-width:760px;margin-bottom:8px}
.strip-h b{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.strip-h span{font-size:11.5px;color:var(--muted)}
.strip-h .prog{margin-left:auto;font:500 12px var(--mono);color:var(--text)}
.bars{display:grid;grid-template-columns:repeat(25,minmax(0,1fr));gap:5px;width:100%;max-width:760px;height:76px;align-items:end;position:relative}
.bars::before{content:"";position:absolute;left:0;right:0;bottom:17px;height:1px;background:var(--rule)}
.bar{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:4px;border-radius:4px}
.bar i{display:block;height:var(--h);border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 30%,transparent));
  opacity:.55;transition:opacity .2s var(--ease),transform .2s var(--ease),box-shadow .2s;transform-origin:bottom}
.bar span{font:500 10.5px/13px var(--mono);color:var(--muted);text-align:center}
.bar:hover i,.bar.on i{opacity:1;box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.bar.v i{opacity:.95}
.bar.on span,.bar:hover span,.bar.hv span{color:var(--text)}
.bar.hv i{opacity:1;box-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.bar.on::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.tourctl{display:none;gap:8px;margin-top:10px}
body.touring .tourctl{display:flex}
.tbtn{height:32px;padding:0 14px;gap:7px;font:600 12px var(--sans);color:var(--text)}
.tbtn svg{width:13px;height:13px}
/* hint + sources */
.hint{left:26px;bottom:20px;font-size:11.5px;color:var(--muted);max-width:var(--zone-w);line-height:1.5;transition:opacity .4s}
.hint .src{display:block;color:var(--faint);font-size:10.5px}
body.detail .hint{opacity:0}
/* 3D labels */
.lb{position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:pointer;transition:opacity .25s var(--ease)}
.pin{display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;transform:translate(-50%,-50%);
  background:rgba(8,6,18,.82);border:1.5px solid var(--c);color:#fff;font:600 11.5px var(--mono);
  box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--c) 25%,transparent);transition:transform .2s var(--ease),background .2s}
.lb.hov .pin,.lb.sel .pin{transform:translate(-50%,-50%) scale(1.22);background:var(--c);color:#07040f;border-color:#fff}
.lb.dim{opacity:.26}
.lb.dim .pin{transform:translate(-50%,-50%) scale(.82)}
.lb.hide{opacity:0;pointer-events:none}
.st{position:absolute;left:0;top:0;pointer-events:none;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(214,204,255,.62);white-space:nowrap;
  text-shadow:0 0 8px rgba(5,3,11,.9);will-change:transform}
.st.w{color:rgba(240,236,255,.9)}
.pk3{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;transform:translate(-50%,-50%);border:1.5px solid #fff;background:rgba(8,6,18,.8);
  color:#fff;font:700 12px var(--sans);box-shadow:0 0 16px rgba(220,210,255,.6)}
/* HMP office beacon + storm core label */
.hqL{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:7px;white-space:nowrap;padding:4px 9px;border-radius:999px;background:rgba(20,9,4,.62);border:1px solid rgba(245,136,58,.4);
  font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#ffc59a;text-shadow:0 0 10px rgba(5,3,11,.95)}
.hqL i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.hqL span{transform:translateY(-1px)}
.hqL::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:linear-gradient(#ffb27a,transparent)}
.hqL.up::after{display:none}
.hqL.up i{width:0;height:0;border-radius:0;background:none;box-shadow:none;border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:7px solid var(--acc);filter:drop-shadow(0 0 6px var(--acc))}
.st.sw{color:rgba(206,198,255,.78);letter-spacing:.16em;transform-origin:0 0}
/* callouts on the chosen house */
.coSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;transition:opacity .2s}
.coSvg path{fill:none;stroke:color-mix(in srgb,var(--cc,#fff) 55%,#fff);stroke-width:1;opacity:.85}
.coSvg circle{fill:#fff;filter:drop-shadow(0 0 4px var(--cc,#fff))}
.co{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;gap:1px;padding:7px 11px 8px;border-radius:11px;white-space:nowrap;
  background:rgba(9,6,20,.8);border:1px solid rgba(220,205,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);will-change:transform,opacity}
.co b{font:600 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.co .v{font:700 22px/1.05 var(--disp);letter-spacing:-.03em;font-variation-settings:"opsz" 96;color:var(--text)}
.co .s{font:500 11px var(--sans);color:var(--text-2)}
.co-hail .v{color:var(--cc,#fff);text-shadow:0 0 18px color-mix(in srgb,var(--cc,#fff) 50%,transparent)}
.co-door{flex-direction:row;align-items:baseline;gap:8px;padding:6px 10px}
.co-door .v{font-size:16px}
body.detail .lb.sel{opacity:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .15s var(--ease)}
.tag.on{opacity:1}
.tag .in{transform:translate(-50%,calc(-100% - 22px));padding:8px 11px 9px;border-radius:10px;background:rgba(10,7,22,.92);border:1px solid var(--rule-2);
  box-shadow:0 10px 30px rgba(0,0,0,.45);white-space:nowrap}
.tag .a{font:600 13.5px var(--sans);letter-spacing:-.01em}
.tag .k{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.tag .m{font:500 11.5px var(--mono);color:var(--text-2);margin-top:3px}
.tag .m em{font-style:normal;color:var(--c)}
/* the card */
.card{right:20px;top:72px;max-height:calc(100vh - 92px);width:var(--card-w);border-radius:22px;background:var(--panel-solid);display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);opacity:0;transform:translateX(24px);pointer-events:none;
  transition:opacity .38s var(--ease),transform .38s var(--ease);isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--foil);opacity:.55;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card::after{content:"";position:absolute;left:10%;right:10%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);pointer-events:none}
.card.on{opacity:1;transform:none;pointer-events:auto}
.c-in{flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:18px 22px 16px;display:flex;flex-direction:column}
.c-top{display:flex;align-items:center;gap:10px}
.c-door{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.c-door .st2{color:var(--muted)}
.cpin{display:grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:999px;font:600 12px var(--mono);font-style:normal;color:#07040f;background:var(--hc);box-shadow:0 0 16px color-mix(in srgb,var(--hc) 60%,transparent)}
.c-smp{font:500 10.5px var(--sans);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.c-smp i{width:6px;height:6px;border-radius:2px;background:var(--foil)}
.c-x{margin-left:auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--rule-2)}
.c-x:hover{color:var(--text);background:rgba(255,255,255,.06)}
.c-x svg{width:13px;height:13px}
.c-status{margin-top:10px;font:500 11.5px var(--mono);color:var(--acc-ink);display:none;align-items:center;gap:8px}
body.touring .c-status{display:flex}
.c-status i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.c-big{display:grid;grid-template-columns:1.15fr 1fr;margin-top:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.big{padding:14px 0 14px}
.big+.big{padding-left:18px;border-left:1px solid var(--rule)}
.big .lbl{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.big .lbl em{font-style:normal;color:var(--muted)}
.big .num{font:760 clamp(66px,5.9vw,86px)/.86 var(--disp);letter-spacing:-.055em;font-variation-settings:"opsz" 96;margin-top:10px;white-space:nowrap}
.big .num small{font:600 .34em var(--disp);letter-spacing:-.01em;margin-left:.08em;color:var(--text-2);vertical-align:.95em}
.big.hail .num{background:linear-gradient(115deg,#fff 0%,var(--hc) 38%,var(--hc2) 78%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px color-mix(in srgb,var(--hc) 45%,transparent))}
.big.hail .num small{-webkit-text-fill-color:var(--text-2)}
.big .sub{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.big .sub b{font-weight:500;color:var(--text-2)}
.c-scale{margin-top:14px}
.c-scale .rail{position:relative;height:6px;border-radius:3px;background:var(--hailscale);opacity:.9}
.c-scale .dots{position:absolute;inset:0}
.c-scale .dots i{position:absolute;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:rgba(5,3,11,.55)}
.c-scale .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--panel-solid);box-shadow:0 0 0 1.5px #fff,0 0 14px #fff;transition:left .45s var(--ease)}
.c-scale .tk{display:flex;justify-content:space-between;font:500 10.5px var(--mono);color:var(--muted);margin-top:7px}
.c-scale .tk b{color:var(--text-2);font-weight:500}
.c-why{margin-top:18px}
.k2{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.c-why .vh{margin:7px 0 0;font:650 21px/1.18 var(--disp);letter-spacing:-.025em;font-variation-settings:"opsz" 96;color:var(--text)}
.c-why ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.c-why li{display:grid;grid-template-columns:22px 1fr;align-items:start;gap:8px;font:500 13.5px/1.35 var(--sans);color:var(--text-2)}
.c-why li i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.05);border:1px solid var(--rule);color:var(--text-2);margin-top:-2px}
.c-why li.hail i{color:var(--hc);border-color:color-mix(in srgb,var(--hc) 45%,transparent);background:color-mix(in srgb,var(--hc) 12%,transparent)}
.c-why li i svg{width:13px;height:13px}
.c-why li em{font-style:normal;font-family:var(--mono);color:var(--hc)}
.c-addr{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.c-addr h2{margin:0;font:680 27px/1 var(--disp);letter-spacing:-.035em;font-variation-settings:"opsz" 96}
.c-addr .ct{margin-top:5px;color:var(--text-2);font-size:12.5px}
.facts{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.facts .dn{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.facts .lg{font:500 12px var(--mono);color:var(--muted)}
.c-sp{flex:0 0 18px}
.c-nav{display:grid;grid-template-columns:.8fr 1.4fr;gap:8px}
.nb.nx .d{white-space:nowrap}
.nb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule-2);background:rgba(255,255,255,.025);text-align:left;min-width:0;
  transition:background .15s var(--ease),border-color .15s var(--ease)}
.nb:hover{background:rgba(255,255,255,.06);border-color:rgba(220,205,255,.35)}
.nb:disabled{opacity:.35;cursor:default}
.nb .d{font:600 12.5px var(--sans);display:flex;align-items:center;gap:6px}
.nb .d svg{width:13px;height:13px}
.nb small{font:500 11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb.nx{align-items:flex-end;text-align:right}
.c-foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font:500 10px var(--mono);color:var(--faint);white-space:nowrap}
kbd{font:inherit}
.nogl{position:fixed;inset:0;display:none;place-items:center;color:var(--text-2);z-index:9}
@media (max-height:820px){
  .zone{top:74px}.zone h1{font-size:42px}.stats{margin-top:14px}.stat{padding:8px 0}.stat .v{font-size:23px}.zone .why{margin:12px 0 14px;font-size:12.5px}
  .bars{height:64px}.big .num{font-size:68px}.c-why .vh{font-size:19px}.c-why li{font-size:12.5px}.c-why ul{gap:5px;margin-top:9px}.c-addr h2{font-size:23px}.c-big{margin-top:12px}.c-why{margin-top:14px}.c-addr{margin-top:14px;padding-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}

/* hail range of this walk on the absolute legend + door-state key */
.legend{--lw:248px}
.legend .rng{position:absolute;top:21px;height:14px;margin-left:0;border:1.5px solid #fff;border-radius:5px;box-shadow:0 0 12px rgba(255,255,255,.55);pointer-events:none}
.legend .sts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);font:500 11px var(--sans);color:var(--text-2)}
.legend .sts .t{width:100%;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend .sts span:not(.t){display:inline-flex;align-items:center;gap:5px}
.legend .sts i{width:10px;height:10px;border-radius:50%;border:2px solid var(--k);background:rgba(8,6,18,.8)}
.legend .sn i{--k:var(--st-next);box-shadow:0 0 8px var(--st-next)} .legend .sd i{--k:var(--st-done);background:var(--st-done)}
.legend .sk i{--k:var(--st-skip);border-style:dashed} .legend .s5 i{--k:var(--st-top);border-radius:2px;transform:rotate(45deg) scale(.85)}
/* door states on 3D pins */
.lb.s-top .pin::after{content:"";position:absolute;right:-4px;top:-4px;width:8px;height:8px;background:var(--st-top);transform:rotate(45deg);border-radius:1.5px;box-shadow:0 0 8px var(--st-top)}
.lb.s-done .pin{--c:var(--st-done);background:color-mix(in srgb,var(--st-done) 26%,rgba(8,6,18,.85))}
.lb.s-skip .pin{--c:var(--st-skip);border-style:dashed;color:var(--st-skip);text-decoration:line-through;opacity:.8}
.lb.s-next .pin{--c:var(--st-next);border-width:2px;box-shadow:0 0 0 3px rgba(63,240,255,.18),0 0 20px var(--st-next)}
.lb.s-next .pin::before{content:"";position:absolute;inset:-7px;border-radius:999px;border:1.5px solid var(--st-next);opacity:.0;animation:nxp 1.8s ease-out infinite}
@keyframes nxp{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.lb.s-next .pin::before{animation:none;opacity:.5}}
.pin{position:relative}
.bar.nx span{color:var(--st-next)!important;font-weight:600}
.bar.nx::before{content:"";position:absolute;left:3px;right:3px;top:-5px;height:2px;border-radius:1px;background:var(--st-next);box-shadow:0 0 8px var(--st-next)}
.bar.v span{color:var(--st-done)} .bar.v i{box-shadow:inset 0 -3px 0 var(--st-done)}
.bar.sk i{opacity:.22!important} .bar.sk span{color:var(--st-skip);text-decoration:line-through}
/* the ONE next move */
.nb.nx{background:linear-gradient(135deg,rgba(63,240,255,.16),rgba(122,92,255,.14));border-color:rgba(63,240,255,.55);box-shadow:0 0 22px rgba(63,240,255,.18)}
.nb.nx .d{color:#dffcff;font-size:13.5px}
.nb.nx:hover{background:linear-gradient(135deg,rgba(63,240,255,.26),rgba(122,92,255,.2))}
.c-status{font:700 20px/1.1 var(--disp)!important;letter-spacing:-.02em;color:#dffcff!important;margin-top:12px!important}
.c-status i{background:var(--st-next)!important;box-shadow:0 0 12px var(--st-next)!important;width:10px!important;height:10px!important}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="3D hologram of the walk: 25 sample homes, their streets and the route"></canvas>
<div id="labels"></div>
<div class="scrim-t"></div><div class="scrim-l"></div><div class="scrim-b"></div>

<header class="ui top">
  <button class="glass back" id="back"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg><span id="backT"></span><kbd>Esc</kbd></button>
  <div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 19 24 8 39 19" fill="none" stroke="#f5f2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="17" r="3" fill="#f5f2ff"/><circle cx="24" cy="31.5" r="10" fill="none" stroke="#f5883a" stroke-width="5"/></svg>Aldaba</div>
  <div class="glass hud" id="hud"></div>
  <div class="sp"></div>
  <span class="sample" id="sample"><i></i><span id="sampleT"></span></span>
  <div class="glass seg" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="es" aria-pressed="false">ES</button></div>
</header>

<section class="ui zone" id="zone" aria-labelledby="zTitle">
  <div class="eyebrow fade" style="--d:80ms"><span class="dot"></span><span id="zEyebrow"></span></div>
  <h1 class="fade" style="--d:140ms" id="zTitle"></h1>
  <div class="town fade" style="--d:180ms" id="zTown"></div>
  <div class="stats fade" style="--d:240ms" id="zStats"></div>
  <p class="why fade" style="--d:300ms" id="zWhy"></p>
  <div class="fade" style="--d:360ms"><button class="cta" id="start"><span id="startT"></span><span class="n" id="startN"></span></button></div>
  <div class="park fade" style="--d:400ms"><span class="pk">P</span><span id="parkT"></span><span class="m" id="parkM"></span></div>
</section>

<div class="ui legend fade" style="--d:300ms" id="legend"></div>

<footer class="ui strip fade" style="--d:420ms" id="strip">
  <div class="strip-h"><b id="stripT"></b><span id="stripS"></span><span class="prog" id="prog"></span></div>
  <div class="bars" id="bars"></div>
  <div class="tourctl"><button class="glass tbtn" id="pause"></button><button class="glass tbtn" id="skip"></button><button class="glass tbtn" id="stop"></button></div>
</footer>

<div class="ui hint fade" style="--d:480ms" id="hint"></div>

<aside class="ui card" id="card" role="dialog" aria-labelledby="cAddr">
  <div class="c-in">
    <div class="c-top"><span class="c-door" id="cDoor"></span><span class="c-smp"><i></i><span id="cSmp"></span></span>
      <button class="c-x" id="cClose"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg></button></div>
    <div class="c-status" id="cStatus"><i></i><span></span></div>
    <div class="c-big">
      <div class="big hail"><div class="lbl" id="cHailL"></div><div class="num" id="cHail"></div><div class="sub" id="cHailS"></div></div>
      <div class="big roof"><div class="lbl" id="cRoofL"></div><div class="num" id="cRoof"></div><div class="sub" id="cRoofS"></div></div>
    </div>
    <div class="c-scale"><div class="rail"><div class="dots" id="cDots"></div><div class="mk" id="cMk"></div></div><div class="tk" id="cTk"></div></div>
    <div class="c-why"><div class="k2" id="cWhyK"></div><div id="cWhy"></div></div>
    <div class="c-addr"><h2 id="cAddr"></h2><div class="ct" id="cCity"></div>
      <div class="facts" id="cFacts"></div></div>
    <div class="c-sp"></div>
    <div class="c-nav"><button class="nb" id="cPrev"></button><button class="nb nx" id="cNext"></button></div>
    <div class="c-foot"><span id="cKeys"></span><span id="cSrc"></span></div>
  </div>
</aside>
<div class="nogl" id="nogl"></div>

<script src="../shared/data.js"></script>
<script src="../shared/data-fremont.js"></script>
<script type="importmap">{"imports":{"three":"../shared/vendor/three/three.module.min.js","three/addons/":"../shared/vendor/three/addons/"}}</script>
<script type="module" src="./spectral.js"></script>
</body>
</html>

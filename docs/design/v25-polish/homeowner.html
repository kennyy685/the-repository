<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HMP App v25 · Homeowner</title>
<!-- MOCKUP (Designer, 2026-09-27). FilthE's pick B "Daylight report", rebuilt on the v25 system (ds.css, icons.js,
     walkmap.js). What he shows the family at the kitchen table, in round 40's order: damage map -> photos -> plain words
     -> 3 options -> what happens next -> leave-behind. Phone and tablet from one page: the layout follows the frame's
     width (container query at 900 px).
     States from the hash, joined with "-": dark, light, es, p1..p4 (chapter), f1..f5 (photo), tablet, exit, flat
     (flat = no stage around the frame, for screenshots). Example: homeowner.html#tablet-dark-p3
     SAMPLE: the house is a real lot from the engine's Columbus basemap (Aug 8 hail, 1.64 in); the findings and photos
     are stand-ins, the prices are market ranges (docs/research/2026-09-26-market-prices.md), not HMP's.
     Legal (CLAUDE.md): never "insurance will pay", no deductible talk (the fixed 44-8607 notice lives in the contract),
     3-day cancel shown at the contract step, "registered" never "licensed", registration # left blank. -->
<link rel="stylesheet" href="ds.css">
<style>
:root{--on-photo:#ffffff;--photo-scrim:rgba(16,17,19,.6)}
/* ---------- frame: 390 phone, or 1180 x 820 tablet (landscape) ---------- */
.ho{container:ho/inline-size;width:390px;max-width:100%;min-height:844px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:clip}
.ho.tab{width:1180px;height:820px;min-height:0}
@media (min-width:500px){body.stage{padding:24px 16px}.ho{border-radius:28px;box-shadow:0 0 0 1px var(--line-2),0 30px 60px -20px rgba(24,25,28,.35)}.ho.tab{border-radius:20px}}
html.flat body.stage{padding:0;background:var(--bg)}html.flat .ho{border-radius:0;box-shadow:none}
@container ho (min-width:900px){.only-phone{display:none!important}}
@container ho (max-width:899.98px){.only-tab{display:none!important}}

/* ---------- top bar ---------- */
.htop{display:flex;align-items:center;gap:var(--s3);height:56px;padding:0 var(--s4);flex:none}
.brand{flex:1;font-size:var(--t-body);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.htop .x{border:1px solid var(--line);background:var(--card)}
.who{flex:1;min-width:0;display:grid}
.who b{font-size:var(--t-row);font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:var(--t-cap);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htop .steps{width:460px;flex:none}
.hhead{display:grid;gap:2px;padding:var(--s1) 0 var(--s4)}
.hhead h1{font-size:var(--t-title);font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-top:var(--s1)}
.steps button{white-space:nowrap}

/* ---------- body ---------- */
.hmain{flex:1;padding:0 var(--s4) var(--s6)}
.chead{margin:var(--s5) 0 var(--s3)}
.chead h2{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.12;text-wrap:balance}
.sect{margin-top:var(--s6)}
.stack{display:grid;gap:var(--s3)}
.pnum{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:var(--t-cap);font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.pnum.sm{width:22px;height:22px;font-size:11.5px}
.pnum.on{background:var(--hmp);color:var(--on-hmp)}
.tile{width:36px;height:36px;border-radius:var(--r-md);background:var(--soft);color:var(--ink-2);display:grid;place-items:center;flex:none}
button.row{width:100%;text-align:left}
.rows .row .end .i{width:18px;height:18px}

/* ---------- 1 · damage map ---------- */
.dmap{position:relative;height:300px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.dmap>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.compass{position:absolute;left:10px;top:10px;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--e2);display:grid;place-items:center;color:var(--ink)}
.compass svg{width:22px;height:22px}
.mkey{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:var(--r-pill);background:var(--card);box-shadow:var(--e2);font-size:12px;font-weight:500;color:var(--ink-2)}
.mkey i{width:14px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--hmp) 0 1.5px,var(--hmp-bg) 1.5px 4px);box-shadow:inset 0 0 0 1px var(--hmp)}
.mscale{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:500 10px var(--f);color:var(--map-label)}
.mscale i{display:block;height:5px;border:1.5px solid var(--map-label);border-top:0}
.finds{margin-top:var(--s3)}
.finds .row{min-height:56px;padding-block:10px}
.hail{overflow:hidden}
.hmap{position:relative;height:128px;border-bottom:1px solid var(--line);background:var(--map-land)}
.hmap>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hpin{position:absolute;transform:translate(-50%,calc(-100% - 12px));display:flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 7px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--e2)}
.hpin .i{width:14px;height:14px}
.hpin::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:1.5px;z-index:-1}
.hmap .chip{position:absolute;left:8px;bottom:8px;box-shadow:var(--e2)}
.hbody{padding:var(--s4);display:grid;gap:var(--s3)}
.hfig{display:flex;align-items:center;gap:var(--s4)}
.hfig>b{font-size:52px;font-weight:600;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.hfig>b small{font-size:28px;letter-spacing:0;color:var(--muted);font-weight:500;margin-left:2px}
.hfig div{display:grid;gap:2px}
.hfig strong{font-size:var(--t-body);font-weight:600}
.hfig span{font-size:var(--t-cap);color:var(--muted)}
.note{display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--t-cap);color:var(--ink-2)}
.note .i{width:16px;height:16px;color:var(--muted);margin-top:1px}
.src{font-size:12px;color:var(--muted)}

/* ---------- 2 · photos ---------- */
.photo{position:relative;margin:0;aspect-ratio:4/3;max-width:100%;border-radius:var(--r-lg);overflow:hidden;background:var(--stage)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo svg.rings{position:absolute;inset:0;width:100%;height:100%}
.pover{position:absolute;display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--photo-scrim);color:var(--on-photo);font-size:12px;font-weight:500;backdrop-filter:blur(6px)}
.pover.count{left:10px;top:10px;font-variant-numeric:tabular-nums}
.pover.tag{left:10px;bottom:10px}
.pover.hits{right:10px;top:10px;background:var(--hmp);color:var(--on-hmp);font-weight:600;backdrop-filter:none}
.pnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:var(--e2);display:grid;place-items:center}
.pnav.prev{left:10px}.pnav.next{right:10px}
.pnav.prev .i{transform:scaleX(-1)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);margin-top:var(--s3)}
.strip button{position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.strip img{display:block;width:100%;height:100%;object-fit:cover}
.strip b{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--photo-scrim);color:var(--on-photo);font-size:10.5px;font-weight:600;display:grid;place-items:center}
.strip [aria-current="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.strip [aria-current="true"] b{background:var(--hmp);color:var(--on-hmp)}
.capcard{display:grid;grid-template-columns:112px 1fr;gap:var(--s4);padding:var(--s3);margin-top:var(--s3);align-items:center}
.loc{position:relative;height:84px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.loc svg{width:100%;height:100%;display:block}
.ctext{display:grid;gap:4px;min-width:0}
.ctext .tt{display:flex;align-items:center;gap:var(--s2)}
.ctext b{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ctext p{font-size:var(--t-body);color:var(--ink-2)}
.shead h2{font-size:var(--t-row)}
.plain .row{align-items:flex-start;min-height:0;padding-block:14px}
.plain .pins{display:flex;gap:3px;padding-top:1px;flex:none;min-width:47px}
.plain p{font-size:var(--t-body);color:var(--ink);flex:1}
.ins{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);padding:var(--s4);margin-top:var(--s3)}
.ins b{display:block;font-size:var(--t-row);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.ins p{font-size:var(--t-body);color:var(--ink-2);margin-top:4px}

/* ---------- 3 · options ---------- */
.cmp{overflow:hidden}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto auto auto auto}
.tier{grid-row:span 5;display:grid;grid-template-rows:subgrid;gap:4px;padding:var(--s3) var(--s2) var(--s4);text-align:center;justify-items:center;align-content:start}
.tier+.tier{border-left:1px solid var(--line)}
.tier.rec{background:var(--hmp-bg);box-shadow:inset 0 3px 0 var(--hmp)}
.tier .chip{height:22px;font-size:11.5px;visibility:hidden}
.tier.rec .chip{visibility:visible}
.tier .label{color:var(--muted)}
.tier .tm{font-size:var(--t-body);font-weight:600;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.tier .tr{font-size:12px;color:var(--muted);line-height:1.3;text-wrap:balance}
.tier .tp{display:grid;margin-top:var(--s2);font-size:var(--t-row);font-weight:600;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.corner{display:none}
.band{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft);font-size:var(--t-cap);color:var(--ink-2)}
.band .i{width:16px;height:16px;color:var(--muted)}
.band b{font-weight:600;color:var(--ink)}
.frow{display:grid;grid-template-columns:repeat(3,1fr)}
.frow+.frow{border-top:1px solid var(--line)}
.flabel{grid-column:1/-1;padding:8px var(--s3) 0;font-size:12.5px;font-weight:500;color:var(--ink-2);background:linear-gradient(90deg,transparent 33.333%,var(--hmp-bg) 33.333% 66.666%,transparent 66.666%)}
.cell{display:grid;place-items:center;min-height:38px;padding:4px 6px 8px;text-align:center;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.cell+.cell{border-left:1px solid var(--line)}
.cell.rec{background:var(--hmp-bg)}
.cell .i{width:20px;height:20px;color:var(--ink);stroke-width:2.1}
.cell .no{width:12px;height:2px;border-radius:1px;background:var(--line-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.meta{margin-top:var(--s3)}
.meta .row{min-height:60px}
.meta .row .t b{white-space:normal}
.sw{display:flex;gap:2px;flex:none}
.sw i{width:10px;height:28px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(24,25,28,.12)}

/* ---------- 4 · next steps ---------- */
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{position:relative;display:grid;grid-template-columns:28px 1fr;gap:var(--s3);padding-bottom:var(--s5)}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13.25px;top:30px;bottom:2px;width:1.5px;background:var(--line-2)}
.tl .node{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);display:grid;place-items:center;font-size:var(--t-cap);font-weight:600;font-variant-numeric:tabular-nums}
.tl li.now .node{background:var(--hmp);border-color:var(--hmp);color:var(--on-hmp)}
.tl .tt{display:flex;align-items:center;gap:var(--s2);min-height:28px}
.tl b{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.25}
.tl p{font-size:var(--t-body);color:var(--ink-2);margin-top:2px}
.cancel{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);display:grid;grid-template-columns:auto 1fr;gap:var(--s3)}
.cancel .tile{width:32px;height:32px;background:var(--soft)}
.cancel b{font-size:var(--t-body)}
.cancel p{font-size:var(--t-cap);color:var(--ink-2);margin-top:4px}
.cancel p.how{color:var(--muted)}
.contact{padding:var(--s4) var(--s4) var(--s2)}
.contact h3{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;margin-bottom:var(--s1)}
.crow{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow div{flex:1;display:grid}
.crow span{font-size:var(--t-cap);color:var(--muted)}
.crow b{font-size:var(--t-addr);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--ink);flex:none;background:var(--card)}
.keep{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);margin-top:var(--s3)}
.keep b{display:block;font-size:var(--t-body);font-weight:600}
.keep span{font-size:var(--t-cap);color:var(--muted)}
.legal{margin-top:var(--s4);font-size:12px;color:var(--muted);line-height:1.6}
.legal .blank{display:inline-block;width:92px;border-bottom:1px solid var(--muted);transform:translateY(-3px)}

/* ---------- bottom bar ---------- */
.hbar{position:sticky;bottom:0;flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:2}
.hbar .back{width:var(--hit);padding:0}
.hbar .back .i{transform:scaleX(-1)}
.hbar .back span{display:none}
.hbar .nextb{flex:1}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:28px;height:4px;border-radius:2px;background:var(--line-2)}
.dots i.done{background:var(--ink)}.dots i.on{background:var(--hmp)}

/* ---------- leave-behind check (salesman) ---------- */
.exit{position:absolute;inset:0;z-index:5}
.ho.held{height:844px;min-height:0}.ho.held .hmain{overflow:hidden}
.xsheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--e2);padding:0 var(--s4) calc(var(--s6) + env(safe-area-inset-bottom,0px))}
.xsheet header{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s4) 0 var(--s3)}
.xsheet header div{flex:1}
.xsheet h3{font-size:var(--t-title);font-weight:600;letter-spacing:-.015em}
.xsheet .xclose{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink-2)}
.xsheet .rows{margin-bottom:var(--s4)}
.box{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.box.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.box .i{width:16px;height:16px;stroke-width:2.2}
.xsheet .row{align-items:flex-start;padding-block:14px}
.xsheet .row .t b,.xsheet .row .t span{white-space:normal}
.xsheet .row .t b{font-size:var(--t-body)}

/* ---------- tablet (landscape, shown to the family) ---------- */
@container ho (min-width:900px){
  .htop{height:72px;padding:0 var(--s8);gap:var(--s4);border-bottom:1px solid var(--line);background:var(--card)}
  .htop .mark{margin-right:var(--s1)}
  .hmain{overflow:auto;padding:var(--s5) var(--s8)}
  .chead{margin:0 0 var(--s3)}
  .ch{display:grid;grid-template-columns:1fr 392px;gap:var(--s6);align-items:start}
  .ch1 .dmap{height:632px}
  .ch1 .finds{margin-top:0}
  .ch1 .finds .row{min-height:52px;padding-block:8px}
  .ch1 .hail{margin-top:var(--s4)}
  .ch1 .hmap{height:108px}
  .ch1 .hbody{padding:var(--s3) var(--s4) var(--s4);gap:10px}
  .ch2 .capcard{margin-top:0;grid-template-columns:132px 1fr}
  .ch2 .loc{height:100px}
  .ch2 .sect{margin-top:var(--s4)}
  .ch3{display:block}
  .ch3 .tiers{grid-template-columns:260px repeat(3,1fr)}
  .corner{display:flex;flex-direction:column;justify-content:space-between;grid-row:span 5;padding:var(--s1) var(--s4) var(--s4) 0;gap:var(--s3)}
  .corner h2{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.12}
  .ch3 .tier{padding:var(--s4) var(--s3) var(--s4)}
  .ch3 .tier .tm{font-size:var(--t-row)}
  .ch3 .tier .tr{font-size:var(--t-cap)}
  .ch3 .tier .tp{font-size:var(--t-addr);letter-spacing:-.025em;line-height:1.15}
  .ch3 .corner+.tier{border-left:1px solid var(--line)}
  .ch3 .cmp{padding-left:var(--s5)}
  .ch3 .band{margin-left:calc(var(--s5) * -1);padding-left:var(--s5)}
  .ch3 .frow{grid-template-columns:260px repeat(3,1fr)}
  .ch3 .flabel{grid-column:auto;background:none;padding:0 var(--s4) 0 0;display:flex;align-items:center;font-size:var(--t-cap)}
  .ch3 .cell{min-height:47px;padding:6px}
  .ch3 .cell:nth-child(2){border-left:1px solid var(--line)}
  .ch3 .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);background:none;border:0;box-shadow:none;margin-top:var(--s4)}
  .ch3 .meta .row{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
  .ch3 .meta .row+.row{border-top:1px solid var(--line)}
  .ch4 .contact{margin-top:0}
  .hbar{padding:var(--s3) var(--s8);gap:var(--s4)}
  .hbar .back{width:auto;padding:0 var(--s5)}
  .hbar .back span{display:inline}
  .hbar .nextb{flex:none;min-width:280px}
  .xsheet{left:50%;right:auto;bottom:50%;width:520px;transform:translate(-50%,50%);border-radius:var(--r-xl);padding-top:var(--s2)}
  .xsheet .grab{display:none}
}
</style></head>
<body class="stage">
<script src="icons.js"></script>
<div class="ho" id="ho"></div>
<script src="data/columbus.js"></script>
<script src="walkmap.js"></script>
<script>
/* Content for one inspection. In the app this comes from the lead's inspection (photos, pins, notes) and the job's
   tiers; the house and hail come from the engine. Everything the homeowner reads exists in English and Spanish. */
const HO = {
  report: { en: 'Inspection report', es: 'Informe de inspección' },
  date: { en: 'Sat, Sep 26, 2026', es: 'sáb 26 sept 2026' },
  address: '3908 22nd St', street: '22nd St',
  city: { en: 'Columbus, NE · Kenny Cruz, HMP Siding & Roofing', es: 'Columbus, NE · Kenny Cruz, HMP Siding & Roofing' },
  cityShort: { en: 'Columbus, NE · inspected Sep 26, 2026', es: 'Columbus, NE · inspección 26 sept 2026' },
  steps: [{ en: 'Your home', es: 'Su casa' }, { en: 'Photos', es: 'Fotos' }, { en: 'Options', es: 'Opciones' }, { en: 'Next steps', es: 'Qué sigue' }],
  titles: [{ en: '5 spots we found', es: 'Encontramos 5 puntos con daño' }, { en: 'What we saw up close', es: 'Lo que vimos de cerca' },
    { en: '3 ways to fix it', es: '3 maneras de arreglarlo' }, { en: 'What happens next', es: 'Qué sigue' }],
  next: [{ en: 'Next: Photos', es: 'Sigue: Fotos' }, { en: 'Next: Options', es: 'Sigue: Opciones' }, { en: 'Next: What happens next', es: 'Sigue: Qué sigue' }, { en: 'Done', es: 'Listo' }],
  back: { en: 'Back', es: 'Atrás' },
  mapKey: { en: 'Damage we found', es: 'Daño encontrado' },
  finds: [
    { n: 1, kind: 'slope', at: [-.45, -.5], img: 'img/ho-roof.jpg', marks: [[31.3, 41.7, 7.6], [58.3, 58.3, 6.4], [71.9, 34.7, 7]],

      const [x, y] = P.xy(home.lon, home.lat), pin = document.getElementById('hlpin'); pin.style.left = x + 'px'; pin.style.top = y + 'px'; }
    const ml = document.getElementById('ml');
    if (ml) { const b = ml.getBoundingClientRect(); renderHomeMap(ml, w, { width: b.width, height: b.height, home, finds: HO.finds, ppm: b.width / 21, mini: true, active: S.f + 1, toward: 0 }); }
  }

  function go(p) { S.p = Math.max(1, Math.min(4, p)); render(); const m = ho.querySelector('.hmain'); if (m) m.scrollTop = 0; }
  function render() {
    root.lang = S.lang; ho.classList.toggle('held', S.exit && !ho.classList.contains('tab'));   // a sheet docks to the screen, not the page
    ho.innerHTML = top() + `<main class="hmain">${head()}${[ch1, ch2, ch3, ch4][S.p - 1]()}</main>` + bar() + exit();
    ho.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go(+b.dataset.p));
    ho.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.f = +b.dataset.f; S.p = 2; render(); });
    ho.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.f = (S.f + +b.dataset.go + 5) % 5; render(); });
    document.getElementById('lang').onclick = () => { S.lang = S.lang === 'en' ? 'es' : 'en'; render(); };
    document.getElementById('back').onclick = () => go(S.p - 1);
    document.getElementById('next').onclick = () => { if (S.p === 4) { S.exit = true; render(); } else go(S.p + 1); };
    document.getElementById('x').onclick = () => { S.exit = true; render(); };
    const xc = () => { S.exit = false; render(); };
    ['xclose', 'xscrim'].forEach(id => { const e = document.getElementById(id); if (e) e.onclick = xc; });
    draw();
  }
  render();
  window.addEventListener('hashchange', () => location.reload());
})();
</script>
</body></html>

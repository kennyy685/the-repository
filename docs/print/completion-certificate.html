<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMP Completion Certificate</title>
<!-- HMP Siding & Roofing: "Certificate of Completion" handed to the homeowner at the final walk-through. English + Spanish.
     Same look as estimate-sheet.html (HMP Pro print look: charcoal + silver, orange accents, Barlow Semi Condensed + Montserrat).
     HOW TO FILL: edit the JSON inside <script id="data">:
       homeowner_first_name (FIRST name only), address, city, job (one line, e.g. "New James Hardie lap siding + architectural
       shingle roof"), start_date + completion_date (YYYY-MM-DD), materials [{item, brand, color, swatch?}] (swatch = optional hex dot; kept for matching later),
       crew_lead, workmanship_warranty ("" = blank lines to write in by hand), manufacturer_warranty_note ("" = blank line),
       photos_note, lang ("en" | "es" | "both", default both).
       Optional: job_es / photos_note_es (Spanish versions of those two lines; else the English one is shown), registration_no
       ("" until the boss gives it), contact {en:{name,phone}, es:{name,phone}}, review_link + review_qr {n, d}.
     REVIEW QR: review_qr is the SVG path of a QR for review_link. Default = a Google search for "HMP Siding & Roofing Fremont NE".
       When the Google Business Profile's "Ask for reviews" short link exists, make a new path with:
       python3 -c "import qrcode,json,sys;q=qrcode.QRCode(error_correction=0,border=0);q.add_data(sys.argv[1]);q.make();m=q.get_matrix();print(json.dumps({'n':len(m),'d':''.join('M%d %dh1v1h-1z'%(x,y) for y,r in enumerate(m) for x,c in enumerate(r) if c)}))" "LINK"
     RULES: no insurance or deductible talk on this piece (Neb. 44-8604); no gifts, discounts or entries for reviews and the
       review line asks everyone, not just happy customers (FTC reviews rule, Google policy); "registered" never "licensed";
       warranty terms only as written by HMP, blank lines otherwise.
     PRINT: Letter, EN page then ES page. PHONE: web page with an EN/ES switch. ?sample=roof swaps in a roof-only sample.
     PDF: chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=completion-certificate.pdf file://.../completion-certificate.html -->
<style>
@font-face { font-family:"Barlow Semi Condensed"; font-weight:700; src:url(fonts/BarlowSemiCondensed-700.woff) format("woff"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:800; src:url(fonts/BarlowSemiCondensed-800.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:500; src:url(fonts/Montserrat-500.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:600; src:url(fonts/Montserrat-600.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:700; src:url(fonts/Montserrat-700.woff) format("woff"); }

@page { size: letter; margin: 0; }

:root {
  --char:#404145; --char-dk:#2a2b2f; --ink:#1f2023; --orange:#f5883a; --orange-ink:#b4561a; --silver:#c9ccd1;
  --line:#dcdee2; --mist:#f2f3f5; --muted:#62656c; --paper:#ffffff; --peach:#fdf1e7;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--char-dk); }
body { background:var(--char-dk); font-family:"Montserrat", sans-serif; color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.defs { position:absolute; width:0; height:0; overflow:hidden; }
b, strong { font-weight:700; }

/* ---------- screen toolbar (never printed) ---------- */
.bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:#232427; border-bottom:1px solid #3a3b40; }
.bar .name { font:700 15px/1 "Barlow Semi Condensed"; letter-spacing:.06em; text-transform:uppercase; color:var(--silver); margin-right:auto; }
.bar .name span { color:var(--orange); }
.seg { display:flex; border:1px solid #55575d; border-radius:8px; overflow:hidden; }
.seg button { font:700 14px/1 "Montserrat"; padding:9px 14px; background:transparent; color:var(--silver); border:0; cursor:pointer; min-width:48px; }
.seg button[aria-pressed=true] { background:var(--silver); color:var(--char-dk); }
.bar .print { font:700 14px/1 "Montserrat"; padding:9px 14px; border-radius:8px; border:0; background:var(--orange); color:#1b1b1d; cursor:pointer; }

/* ---------- the page ---------- */
.page { width:8.5in; min-height:11in; margin:24px auto; background:var(--paper); display:flex; flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.45); }
.page[hidden] { display:none; }

.top { position:relative; height:1.14in; flex:none; background:linear-gradient(180deg,#4a4b50 0%,#404145 45%,#2f3034 100%); overflow:hidden; }
.top::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4pt; background:var(--orange); }
.top .rib { position:absolute; inset:0; width:100%; height:100%; }
.top .logo { position:absolute; left:0.4in; top:0.13in; width:1.78in; height:0.88in; }
.top .ttl { position:absolute; left:2.6in; right:0.45in; top:0.2in; }
.top .kick { font:700 7.5pt/1 "Montserrat"; letter-spacing:.18em; text-transform:uppercase; color:var(--silver); }
.top h1 { margin-top:0.07in; font:800 28pt/0.92 "Barlow Semi Condensed"; text-transform:uppercase; color:#fff; }
.top h1 span { color:var(--orange); }

.body { flex:1; padding:0.14in 0.45in 0.12in; display:flex; flex-direction:column; gap:0.1in; }
.label { display:flex; align-items:center; gap:0.08in; font:700 7.4pt/1 "Montserrat"; letter-spacing:.15em; text-transform:uppercase; color:var(--char); }
.label::after { content:""; flex:1; height:0.75pt; background:var(--line); }
.label em { font-style:normal; color:var(--orange-ink); }

/* property strip */
.prop { display:grid; grid-template-columns:0.8fr 1.9fr 0.9fr 0.9fr; border-top:1.5pt solid var(--char); border-bottom:0.75pt solid var(--line); }
.prop > div { padding:0.08in 0.14in 0.08in 0; min-width:0; }
.prop > div + div { padding-left:0.14in; border-left:0.75pt solid var(--line); }
.prop .k { font:700 6.8pt/1 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.prop .v { margin-top:0.04in; font:800 15pt/1.02 "Barlow Semi Condensed"; color:var(--ink); }
.prop .v small { display:block; margin-top:0.03in; font:600 8.6pt/1.2 "Montserrat"; color:var(--muted); }
.prop .v.s { font-size:14pt; white-space:nowrap; }
.prop .v.done { color:var(--orange-ink); }

/* hero: the work, plus the seal */
.hero { display:grid; grid-template-columns:minmax(0,1fr) 1.36in; gap:0.2in; align-items:stretch; }
.work { background:var(--mist); border-left:5pt solid var(--orange); border-radius:0 5px 5px 0; padding:0.12in 0.2in 0.11in; display:flex; flex-direction:column; }
.work .job { margin-top:0.06in; font:800 20pt/1.02 "Barlow Semi Condensed"; color:var(--char-dk); }
.work .meta { margin-top:auto; padding-top:0.08in; display:flex; flex-wrap:wrap; gap:0.05in 0.28in; font:600 8.4pt/1.35 "Montserrat"; color:var(--char); }
.work .meta b { color:var(--ink); }
.work .meta span { display:flex; gap:0.06in; align-items:flex-start; }
.work .meta svg { flex:none; width:0.15in; height:0.15in; margin-top:0.005in; }
.seal { display:flex; align-items:center; justify-content:center; }
.seal svg { width:1.34in; height:1.34in; }

/* materials */
.mat table { width:100%; border-collapse:collapse; margin-top:0.06in; table-layout:fixed; }
.mat th { font:700 6.8pt/1 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; text-align:left; padding:0.05in 0.1in; color:#fff; background:var(--char); }
.mat th:first-child { width:30%; } .mat th:last-child { width:26%; }
.mat td { padding:0.045in 0.1in; border-bottom:0.75pt solid var(--line); vertical-align:top; font:600 8.8pt/1.3 "Montserrat"; color:var(--ink); }
.mat td:first-child { font:800 11.5pt/1.15 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.015em; }
.mat td.c { font-weight:700; }
.mat td.c i { display:inline-block; width:0.13in; height:0.13in; border-radius:2px; margin-right:0.06in; vertical-align:-0.02in; box-shadow:inset 0 0 0 0.75pt rgba(0,0,0,.25); }
.mat tr:nth-child(even) td { background:#f7f7f8; }
.mat .keep { margin-top:0.06in; font:500 7.6pt/1.35 "Montserrat"; color:var(--muted); }
.mat .keep b { color:var(--char); }

/* warranty + care */
.two { display:grid; grid-template-columns:1fr 1fr; gap:0.26in; align-items:start; }
.war { list-style:none; margin-top:0.07in; }
.war li { padding:0.06in 0 0.07in; border-bottom:0.75pt solid var(--line); }
.war .t { font:800 11.5pt/1.1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.015em; color:var(--ink); }
.war .v { margin-top:0.03in; font:600 8.6pt/1.38 "Montserrat"; color:var(--char); }
.war .blank { display:block; height:0.24in; border-bottom:0.75pt solid #8a8d93; }
.war .hint { margin-top:0.03in; font:500 6.8pt/1.3 "Montserrat"; color:var(--muted); }
.care { list-style:none; margin-top:0.07in; }
.care li { display:grid; grid-template-columns:0.24in 1fr; gap:0.04in; padding:0.05in 0; border-bottom:0.75pt solid var(--line); font:500 8.2pt/1.38 "Montserrat"; color:var(--char); }
.care li b { color:var(--ink); }
.care li .n { width:0.2in; height:0.2in; border-radius:50%; background:var(--char); color:#fff; font:800 10pt/0.2in "Barlow Semi Condensed"; text-align:center; }

/* walk-through sign-off */
.sign { border:1.5pt solid var(--char); border-radius:5px; display:grid; grid-template-columns:2.2in 1fr; overflow:hidden; }
.sign .h { background:var(--char); color:#fff; padding:0.08in 0.14in; display:flex; flex-direction:column; justify-content:center; gap:0.04in; }
.sign .h b { font:800 14pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; }
.sign .h span { font:600 7.4pt/1.3 "Montserrat"; color:var(--silver); }
.sign .f { display:flex; align-items:flex-end; gap:0.22in; padding:0.06in 0.18in 0.08in; }
.sign .fld { flex:1; display:flex; flex-direction:column; gap:0.04in; }
.sign .fld i { display:block; height:0.26in; border-bottom:1pt solid var(--ink); }
.sign .fld span { font:700 6.8pt/1.2 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.sign .fld.sm { flex:0.8; }

/* review */
.rev { display:flex; align-items:center; gap:0.2in; background:var(--peach); border-radius:5px; padding:0.08in 0.2in; }
.rev .qr { flex:none; width:0.76in; height:0.76in; background:#fff; padding:0.06in; border-radius:4px; box-shadow:0 0 0 0.75pt #ecd6c4; }
.rev .qr svg { display:block; width:100%; height:100%; }
.rev .tx { flex:1; min-width:0; }
.rev .tx .h { font:800 16pt/1.05 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.015em; color:var(--char-dk); }
.rev .tx .h span { color:var(--orange-ink); }
.rev .tx .p { margin-top:0.05in; font:600 8.6pt/1.4 "Montserrat"; color:var(--char); }
.rev .tx .p b { color:var(--ink); }

/* contact band: the boldest thing on the page */
.foot { flex:none; background:linear-gradient(180deg,#404145,#2c2d31); color:#fff; padding:0.14in 0.45in 0.11in; position:relative; }
.foot::before { content:""; position:absolute; left:0; right:0; top:0; height:4pt; background:var(--orange); }
.foot .row { display:flex; align-items:center; gap:0.26in; }
.foot .cta { flex:1; min-width:0; }
.foot .cta .k { font:700 8pt/1.2 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); }
.foot .cta .who { margin-top:0.05in; font:700 11pt/1.2 "Montserrat"; color:#fff; }
.foot .cta .ph { white-space:nowrap; display:block; margin-top:0.02in; font:800 38pt/0.95 "Barlow Semi Condensed"; color:#fff; letter-spacing:.01em; text-decoration:none; }
.foot .cta .alt { margin-top:0.05in; font:600 8.2pt/1.3 "Montserrat"; color:var(--silver); }
.foot .co { flex:none; width:2.75in; font:600 7.8pt/1.45 "Montserrat"; color:var(--silver); border-left:0.75pt solid #5b5d63; padding-left:0.2in; }
.foot .co b { display:block; font:800 11.5pt/1.1 "Barlow Semi Condensed"; letter-spacing:.03em; text-transform:uppercase; color:#fff; margin-bottom:0.04in; }
.foot .co .reg { display:block; margin-top:0.04in; }
.foot .co .reg i { display:inline-block; min-width:0.7in; border-bottom:0.75pt solid #8a8d93; font-style:normal; color:#fff; }

/* ---------- print ---------- */
@media print {
  html, body { background:var(--paper); }
  .bar { display:none; }
  .page { margin:0; box-shadow:none; height:11in; overflow:hidden; break-after:page; }
  .page:last-of-type { break-after:auto; }
  body.print-both .page[hidden] { display:flex; }
}

/* ---------- phones ---------- */
@media screen and (max-width: 760px) {
  .page { width:100%; min-height:0; margin:0 0 12px; box-shadow:none; }
  .top { height:auto; padding:14px 16px 18px; }
  .top .rib { opacity:.8; }
  .top .logo { position:relative; left:auto; top:auto; width:150px; height:74px; display:block; }
  .top .ttl { position:relative; left:auto; right:auto; top:auto; margin-top:10px; }
  .top .kick { font-size:11px; }
  .top h1 { font-size:34px; }
  .body { padding:18px 16px; gap:22px; }
  .label { font-size:11px; }
  .prop { grid-template-columns:1fr 1fr; }
  .prop > div { border-bottom:1px solid var(--line); }
  .prop > div:nth-child(odd) { border-left:0; padding-left:0; }
  .prop > div:nth-child(even) { padding-left:14px; border-left:1px solid var(--line); }
  .prop .k { font-size:10px; }
  .prop .v { font-size:22px; } .prop .v.s { font-size:19px; white-space:normal; } .prop .v small { font-size:13px; }
  .hero { grid-template-columns:1fr; }
  .work { padding:16px; } .work .job { font-size:28px; } .work .meta { font-size:13.5px; } .work .meta svg { width:18px; height:18px; }
  .seal { display:none; }
  .mat th { font-size:10px; } .mat td { font-size:13.5px; } .mat td:first-child { font-size:16px; } .mat .keep { font-size:12.5px; }
  .mat th:first-child { width:34%; }
  .two { grid-template-columns:1fr; gap:24px; }
  .war .t { font-size:17px; } .war .v { font-size:13.5px; } .war .hint { font-size:12px; }
  .care li { font-size:13.5px; grid-template-columns:30px 1fr; } .care li .n { width:24px; height:24px; line-height:24px; font-size:14px; }
  .sign { grid-template-columns:1fr; } .sign .h b { font-size:19px; } .sign .h span { font-size:12px; }
  .sign .f { flex-wrap:wrap; padding:14px 16px; } .sign .fld { flex:1 1 40%; } .sign .fld span { font-size:10.5px; }
  .rev { padding:14px 16px; } .rev .qr { display:none; } .rev .tx .h { font-size:21px; } .rev .tx .p { font-size:13.5px; }
  .foot { padding:22px 16px 16px; }
  .foot .row { flex-wrap:wrap; gap:16px; }
  .foot .cta { flex:1 1 100%; }
  .foot .cta .k { font-size:12px; } .foot .cta .who { font-size:16px; } .foot .cta .ph { font-size:46px; } .foot .cta .alt { font-size:13px; }
  .foot .co { width:auto; flex:1 1 100%; border-left:0; padding-left:0; border-top:1px solid #5b5d63; padding-top:12px; font-size:12px; }
  .foot .co b { font-size:16px; }
}
</style>
</head>

      '<div><div class="k">' + t.done + '</div><div class="v done">' + dateCell(D.completion_date, l) + '</div></div></section>';

    var meta = [];
    if (D.crew_lead) meta.push('<span>' + CHECK + '<span>' + t.lead + ' <b>' + esc(D.crew_lead) + '</b></span></span>');
    var ph = pick(D, "photos_note", l);
    if (ph) meta.push('<span>' + CAM + '<span><b>' + t.photos + '</b> ' + esc(ph) + '</span></span>');
    var hero = '<section class="hero"><div class="work"><div class="label">' + t.workLbl + ' <em>' + t.workEm + '</em></div>' +
      '<div class="job">' + esc(pick(D, "job", l)) + '</div>' + (meta.length ? '<div class="meta">' + meta.join("") + '</div>' : '') + '</div>' +
      seal(l, t) + '</section>';

    var mats = (D.materials || []).filter(function (m) { return m && (m.item || m.brand); });
    var mat = mats.length ? '<section class="mat"><div class="label">' + t.matLbl + ' <em>' + t.matEm + '</em></div>' +
      '<table><thead><tr><th>' + t.thItem + '</th><th>' + t.thBrand + '</th><th>' + t.thColor + '</th></tr></thead><tbody>' +
      mats.map(function (m) {
        var sw = /^#[0-9a-f]{3,8}$/i.test(m.swatch || "") ? '<i style="background:' + m.swatch + '"></i>' : '';
        return '<tr><td>' + esc(pick(m, "item", l)) + '</td><td>' + esc(pick(m, "brand", l)) + '</td><td class="c">' + sw + esc(pick(m, "color", l)) + '</td></tr>';
      }).join("") + '</tbody></table><div class="keep">' + t.keep + '</div></section>' : '';

    var ww = pick(D, "workmanship_warranty", l), mw = pick(D, "manufacturer_warranty_note", l);
    var war = '<div><div class="label">' + t.warLbl + '</div><ul class="war">' +
      '<li><div class="t">' + t.wWork + '</div>' + (ww ? '<div class="v">' + esc(ww) + '</div>' :
        '<span class="blank"></span><span class="blank"></span><div class="hint">' + t.hintBlank + '</div>') + '</li>' +
      '<li><div class="t">' + t.wMfr + '</div>' + (mw ? '<div class="v">' + esc(mw) + '</div>' : '<span class="blank"></span>') + '</li>' +
      '</ul></div>';
    var care = '<div><div class="label">' + t.careLbl + ' <em>' + t.careEm + '</em></div><ul class="care">' +
      tipKeys.map(function (k, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + TIPS[k][l] + '</span></li>'; }).join("") + '</ul></div>';
    var two = '<section class="two">' + war + care + '</section>';

    var sign = '<section class="sign"><div class="h"><b>' + t.signH + '</b><span>' + t.signS + '</span></div><div class="f">' +
      '<div class="fld"><i></i><span>' + t.fOwner + '</span></div>' +
      '<div class="fld"><i></i><span>' + t.fHmp + '</span></div>' +
      '<div class="fld sm"><i></i><span>' + t.fDate + '</span></div></div></section>';

    var q = (D.review_qr && D.review_qr.d) ? D.review_qr : DEFAULT_QR;   // no own QR yet -> the Google search QR
    var rev = '<section class="rev"><div class="qr"><svg viewBox="0 0 ' + q.n + ' ' + q.n + '" shape-rendering="crispEdges" role="img" aria-label="' + esc(t.revQr) + '">' +
      '<path d="' + q.d + '" fill="#1b1c1f"/></svg></div><div class="tx"><div class="h">' + t.revH + '</div><div class="p">' + t.revP + '</div></div></section>';

    return '<section class="page" lang="' + l + '">' +
      '<header class="top"><svg class="rib" viewBox="0 0 816 125" preserveAspectRatio="none" aria-hidden="true"><rect width="816" height="125" fill="url(#rib)" opacity=".55"/></svg>' +
      '<svg class="logo" role="img" aria-label="H.M.P Siding &amp; Roofing LLC"><use href="#hmp-logo"/></svg>' +
      '<div class="ttl"><div class="kick">' + t.kick + '</div><h1>' + t.h1 + '</h1></div></header>' +
      '<main class="body">' + prop + hero + mat + two + sign + rev + '</main>' +
      '<footer class="foot"><div class="row"><div class="cta"><div class="k">' + t.ctaK + '</div><div class="who">' + esc(f(t.ctaWho, {n: c.name})) + '</div>' +
        '<a class="ph" href="tel:+1' + esc(String(c.phone).replace(/\D/g, "")) + '">' + esc(c.phone) + '</a><div class="alt">' + t.alt + '</div></div>' +
        '<div class="co"><b>HMP Siding &amp; Roofing LLC</b>2600 Laverna St, Apt 50<br>Fremont, NE 68025 &middot; 402-889-3385<br>' + t.co +
          '<span class="reg">' + t.reg + ' <i>' + esc(D.registration_no || "") + '</i></span></div></div></footer>' +
      '</section>';
  }

  var root = document.getElementById("pages");
  root.innerHTML = page("en") + page("es");
  var pages = root.querySelectorAll(".page");

  // one Letter page per language: if a long materials list overflows, drop the least important bits until it fits
  function fit(pg) {
    var FULL = 10.88 * 96;
    var steps = [
      function () { var c = pg.querySelector(".war .hint"); if (c) { c.remove(); return true; } },
      function () { var r = pg.querySelectorAll(".care li"); if (r.length > 3) { r[r.length - 1].remove(); return true; } },
      function () { var c = pg.querySelector(".mat .keep"); if (c) { c.remove(); return true; } },
      function () { var r = pg.querySelectorAll(".care li"); if (r.length > 2) { r[r.length - 1].remove(); return true; } },
      function () { var r = pg.querySelectorAll(".mat tbody tr"); if (r.length > 6) { r[r.length - 1].remove(); return true; } }
    ];
    pg.style.minHeight = "0";
    for (var guard = 0; guard < 30 && pg.offsetHeight > FULL; guard++) {
      if (!steps.some(function (st) { return st(); })) break;
    }
    pg.style.minHeight = "";
  }
  function settle() {
    var cur = document.documentElement.lang;
    pages.forEach(function (p) { p.hidden = false; });
    if (window.innerWidth > 760 && !want0.has("nofit")) pages.forEach(fit);
    if (want0.has("debug")) {
      var dbg = document.getElementById("dbg") || document.body.appendChild(document.createElement("pre"));
      dbg.id = "dbg"; dbg.style.color = "#fff";
      dbg.textContent = Array.prototype.map.call(pages, function (pg) {
        pg.style.minHeight = "0";
        var out = pg.lang + " page " + (pg.offsetHeight / 96).toFixed(2);
        pg.style.minHeight = "";
        return out;
      }).join("\n");
    }
    show(cur === "es" ? "es" : "en");
  }
  var want = (want0.get("lang") || D.lang || "both").toLowerCase();
  if (want === "both") document.body.classList.add("print-both");
  function show(l) {
    pages.forEach(function (p) { p.hidden = p.lang !== l; });
    document.documentElement.lang = l;
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.l === l)); });
    document.querySelector(".bar .print").textContent = l === "es" ? "Imprimir" : "Print";
    document.querySelector(".bar .name").innerHTML = "HMP <span>&middot;</span> " + T[l].bar;
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { document.body.classList.remove("print-both"); show(b.dataset.l); });
  });
  show(want === "es" ? "es" : "en");
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle); else settle();
})();
</script>
</body></html>

<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMP Estimate Range</title>
<!-- HMP Siding & Roofing: "Estimate range for your home" leave-behind (homeowner-facing), English + Spanish.
     Mainly for CASH (non-insurance) siding and roofing on older houses, after a quick look.
     HOW TO FILL: replace the JSON inside <script id="data"> with the exact output of `python3 hh.py estimate --json job.json`
     (hailhunter/estimate.py: low, high, using_reference, lines[], adders, quantities, rough_squares, minimum_applied,
     summary, insurance_note, warnings[]), then add the optional extras:
       "lang" ("en" | "es" | "both", default both), "address", "prepared_on" (YYYY-MM-DD), "homeowner_first_name" (FIRST name
       only), "valid_days" (e.g. 30), "insurance_job" (true = hide every dollar amount and show insurance_note only),
       "options" [{tier "good"|"better", material "vinyl"|"hardie", name {en,es}, low, high}] (run the estimate once per
       material; 2 options show side by side instead of the single range), "registration_no" (leave "" until the boss gives
       it), "contact" {en:{name,phone}, es:{name,phone}}.
     NOT printed on purpose: `summary` and `warnings` (crew notes). The plain-word item names, the Vinyl vs Hardie facts and
     the fine print are fixed in this file (docs/research/2026-09-26-round-5.md, 2026-09-26-market-prices.md).
     SAMPLES: ?sample=hardie (Hardie 22 squares) and ?sample=roof (roof 24 squares, 8/12) swap in the sample JSON below.
     RULES: estimate range, never a final price. Market-reference prices are never called HMP's prices. Nothing about
     deductibles (Neb. 44-8604), never says insurance pays, no financing or 0% offers, "registered" not "licensed".
     PRINT: Letter, 1 page per language (EN page, then ES page). PHONE: web page with an EN/ES switch.
     Fonts: fonts/ (local, free Google Fonts). Logo: <symbol id="hmp-logo"> (same as door-hanger.html). QR codes open a
     text to Kenny (EN, 402-936-2709) / Alex (ES, 402-889-3385), same as hail-report.html.
     Goes with cancel-notice.html (Buyer's right to cancel) in the cash-job packet: estimate-packet.pdf.
     PDF: chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=estimate-sheet.pdf file://.../estimate-sheet.html -->
<style>
@font-face { font-family:"Barlow Semi Condensed"; font-weight:700; src:url(fonts/BarlowSemiCondensed-700.woff) format("woff"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:800; src:url(fonts/BarlowSemiCondensed-800.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:500; src:url(fonts/Montserrat-500.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:600; src:url(fonts/Montserrat-600.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:700; src:url(fonts/Montserrat-700.woff) format("woff"); }

@page { size: letter; margin: 0; }

:root {
  --char:#404145; --char-dk:#2a2b2f; --ink:#1f2023; --orange:#f5883a; --orange-ink:#b4561a; --silver:#c9ccd1;
  --line:#dcdee2; --mist:#f2f3f5; --muted:#62656c; --paper:#ffffff; --peach:#fdf1e7;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--char-dk); }
body { background:var(--char-dk); font-family:"Montserrat", sans-serif; color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.defs { position:absolute; width:0; height:0; overflow:hidden; }
b, strong { font-weight:700; }

/* ---------- screen toolbar (never printed) ---------- */
.bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:#232427; border-bottom:1px solid #3a3b40; }
.bar .name { font:700 15px/1 "Barlow Semi Condensed"; letter-spacing:.06em; text-transform:uppercase; color:var(--silver); margin-right:auto; }
.bar .name span { color:var(--orange); }
.seg { display:flex; border:1px solid #55575d; border-radius:8px; overflow:hidden; }
.seg button { font:700 14px/1 "Montserrat"; padding:9px 14px; background:transparent; color:var(--silver); border:0; cursor:pointer; min-width:48px; }
.seg button[aria-pressed=true] { background:var(--silver); color:var(--char-dk); }
.bar .print { font:700 14px/1 "Montserrat"; padding:9px 14px; border-radius:8px; border:0; background:var(--orange); color:#1b1b1d; cursor:pointer; }

/* ---------- the page ---------- */
.page { width:8.5in; min-height:11in; margin:24px auto; background:var(--paper); display:flex; flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.45); }
.page[hidden] { display:none; }

.top { position:relative; height:1.14in; flex:none; background:linear-gradient(180deg,#4a4b50 0%,#404145 45%,#2f3034 100%); overflow:hidden; }
.top::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4pt; background:var(--orange); }
.top .rib { position:absolute; inset:0; width:100%; height:100%; }
.top .logo { position:absolute; left:0.4in; top:0.13in; width:1.78in; height:0.88in; }
.top .ttl { position:absolute; left:2.6in; right:0.45in; top:0.2in; }
.top .kick { font:700 7.5pt/1 "Montserrat"; letter-spacing:.18em; text-transform:uppercase; color:var(--silver); }
.top h1 { margin-top:0.07in; font:800 28pt/0.92 "Barlow Semi Condensed"; text-transform:uppercase; color:#fff; }
.top h1 span { color:var(--orange); }

.body { flex:1; padding:0.17in 0.45in 0.15in; display:flex; flex-direction:column; gap:0.13in; }
.label { display:flex; align-items:center; gap:0.08in; font:700 7.4pt/1 "Montserrat"; letter-spacing:.15em; text-transform:uppercase; color:var(--char); }
.label::after { content:""; flex:1; height:0.75pt; background:var(--line); }
.label em { font-style:normal; color:var(--orange-ink); }

/* property strip */
.prop { display:grid; grid-template-columns:0.8fr 1.4fr 1.4fr 0.68fr; border-top:1.5pt solid var(--char); border-bottom:0.75pt solid var(--line); }
.prop.nofor { grid-template-columns:1.8fr 1.4fr 0.68fr; }
.prop > div { padding:0.08in 0.14in 0.08in 0; min-width:0; }
.prop > div + div { padding-left:0.14in; border-left:0.75pt solid var(--line); }
.prop .k { font:700 6.8pt/1 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.prop .v { margin-top:0.045in; font:800 16pt/1.02 "Barlow Semi Condensed"; color:var(--ink); }
.prop .v small { display:block; margin-top:0.03in; font:600 8.6pt/1.2 "Montserrat"; color:var(--muted); }
.prop .v.s { font-size:13.5pt; white-space:nowrap; }

/* hero: the range */
.hero { display:grid; grid-template-columns:minmax(0,1fr) 2.2in; gap:0.18in; }
.range { background:var(--mist); border-left:5pt solid var(--orange); border-radius:0 5px 5px 0; padding:0.14in 0.2in 0.14in; display:flex; flex-direction:column; }
.range .num { margin-top:0.08in; font:800 47pt/0.92 "Barlow Semi Condensed"; color:var(--char-dk); letter-spacing:-0.005em; white-space:nowrap; }
.range .num i { font-style:normal; color:var(--orange); padding:0 0.04in; }
.range .job { margin-top:0.07in; font:700 11pt/1.25 "Montserrat"; color:var(--ink); }
.range .ins { margin-top:0.08in; font:800 24pt/1.02 "Barlow Semi Condensed"; color:var(--char-dk); }
.notfinal { margin-top:auto; padding-top:0.09in; font:700 9.6pt/1.35 "Montserrat"; color:var(--char-dk); }
.notfinal b { color:var(--orange-ink); }

.counted { border:1pt dashed #b9bcc2; border-radius:5px; padding:0.13in 0.15in; display:flex; flex-direction:column; gap:0.06in; }
.counted ul { list-style:none; display:flex; flex-direction:column; gap:0.055in; margin-top:0.03in; }
.counted li { display:flex; gap:0.07in; align-items:flex-start; font:600 8.6pt/1.25 "Montserrat"; color:var(--ink); }
.counted li svg { flex:none; width:0.15in; height:0.15in; margin-top:0.005in; }
.counted .sq { margin-top:auto; padding-top:0.06in; border-top:0.75pt solid var(--line); font:600 7.6pt/1.35 "Montserrat"; color:var(--muted); }
.counted .sq b { color:var(--char); }

/* hero with 2 options (good / better) */
.opts { display:grid; grid-template-columns:1fr 1fr; gap:0.16in; }
.opt { background:var(--mist); border-radius:5px; padding:0.1in 0.18in 0.11in; border-top:5pt solid var(--silver); }
.opt.better { border-top-color:var(--orange); }
.opt .tier { display:inline-block; font:700 6.8pt/1 "Montserrat"; letter-spacing:.16em; text-transform:uppercase; padding:0.035in 0.07in; border-radius:2px; background:var(--char); color:#fff; }
.opt.better .tier { background:var(--orange); color:#1b1b1d; }
.opt .nm { margin-top:0.07in; font:800 15pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--char); }
.opt .num { margin-top:0.04in; font:800 35pt/0.95 "Barlow Semi Condensed"; color:var(--char-dk); white-space:nowrap; }
.opt .num i { font-style:normal; color:var(--orange); padding:0 0.03in; }
.optnote { display:flex; align-items:baseline; gap:0.18in; justify-content:space-between; margin-top:0.02in; }
.optnote .notfinal { margin-top:0; padding-top:0; }
.optnote .cnt { flex:none; max-width:3.2in; text-align:right; font:600 7.8pt/1.35 "Montserrat"; color:var(--muted); }
.optnote .cnt b { color:var(--char); }

/* included + could change */
.two { display:grid; grid-template-columns:1.3fr 1fr; gap:0.24in; align-items:start; }
.inc { list-style:none; margin-top:0.06in; }
.inc li { display:grid; grid-template-columns:0.22in 1fr; gap:0.04in; padding:0.055in 0; border-bottom:0.75pt solid var(--line); align-items:start; }
.inc li svg { width:0.16in; height:0.16in; margin-top:0.01in; }
.inc .t { font:800 11pt/1.1 "Barlow Semi Condensed"; color:var(--ink); text-transform:uppercase; letter-spacing:.015em; }
.inc .q { margin-left:0.08in; font:800 11pt/1.1 "Barlow Semi Condensed"; color:var(--orange-ink); text-transform:none; white-space:nowrap; }
.inc .q small { font:600 7.4pt/1 "Montserrat"; color:var(--muted); letter-spacing:0; }
.inc .d { margin-top:0.02in; font:500 8pt/1.35 "Montserrat"; color:var(--char); }
.chg { list-style:none; margin-top:0.06in; }
.chg li { position:relative; padding:0.06in 0 0.06in 0.2in; border-bottom:0.75pt solid var(--line); font:500 8.2pt/1.38 "Montserrat"; color:var(--char); }
.chg li::before { content:""; position:absolute; left:0.03in; top:0.11in; width:0.07in; height:0.07in; border-radius:50%; background:var(--orange); }
.chg li b { color:var(--ink); }

/* vinyl vs hardie */
.cmp table { width:100%; border-collapse:collapse; margin-top:0.06in; table-layout:fixed; }
.cmp th { font:800 11.5pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.03em; text-align:left; padding:0.05in 0.1in; color:#fff; background:var(--char); }
.cmp th:first-child { width:0.95in; background:transparent; }
.cmp th.hd { background:var(--char-dk); border-left:2pt solid #fff; }
.cmp th small { font:600 7.2pt/1 "Montserrat"; text-transform:none; letter-spacing:0; color:var(--silver); margin-left:0.05in; }
.cmp td { font:500 7.7pt/1.3 "Montserrat"; color:var(--ink); padding:0.04in 0.1in; border-bottom:0.75pt solid var(--line); vertical-align:top; }
.cmp td:first-child { font:700 6.6pt/1.3 "Montserrat"; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-left:0; padding-top:0.055in; }
.cmp td + td + td { border-left:2pt solid #fff; }
.cmp tr:nth-child(even) td:not(:first-child) { background:#f7f7f8; }
.cmp td b { font-weight:700; }
.cmp .src { margin-top:0.05in; font:500 6.6pt/1.35 "Montserrat"; color:var(--muted); }

/* roof at a glance (roof-only jobs) */
.facts { display:grid; grid-template-columns:1.55in repeat(4,1fr); border:1pt solid var(--line); border-radius:5px; overflow:hidden; }
.facts .head { background:var(--char); color:#fff; padding:0.12in 0.14in; display:flex; flex-direction:column; justify-content:center; gap:0.06in;
  font:800 12.5pt/1.02 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.01em; }
.facts .head svg { width:0.8in; height:0.4in; }
.facts .stat { padding:0.14in 0.14in; border-left:0.75pt solid var(--line); display:flex; flex-direction:column; justify-content:center; }
.facts .stat .v { font:800 26pt/1 "Barlow Semi Condensed"; color:var(--char-dk); white-space:nowrap; }
.facts .stat .v small { font:700 11pt/1 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--char); }
.facts .stat .k { margin-top:0.05in; font:600 7.4pt/1.3 "Montserrat"; color:var(--muted); }

/* next steps */
.steps { display:grid; grid-template-columns:0.95fr 1.2fr 0.95fr; gap:0; margin-top:0.07in; border:1pt solid var(--line); border-radius:5px; overflow:hidden; }
.step { padding:0.09in 0.14in 0.1in; }
.step + .step { border-left:0.75pt solid var(--line); }
.step .h { display:flex; align-items:center; gap:0.08in; font:800 12pt/1.05 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--ink); }
.step .n { flex:none; width:0.26in; height:0.26in; border-radius:50%; background:var(--char); color:#fff; font:800 12pt/0.26in "Barlow Semi Condensed"; text-align:center; }
.step:first-child .n { background:var(--orange); color:#1b1b1d; }
.step .p { margin-top:0.05in; font:500 7.6pt/1.35 "Montserrat"; color:var(--char); }
.step .p b { color:var(--ink); }

/* contact band: the boldest thing on the page */
.foot { flex:none; background:linear-gradient(180deg,#404145,#2c2d31); color:#fff; padding:0.15in 0.45in 0.1in; position:relative; }
.foot::before { content:""; position:absolute; left:0; right:0; top:0; height:4pt; background:var(--orange); }
.foot .row { display:flex; align-items:center; gap:0.24in; }
.foot .cta { flex:1; min-width:0; }
.foot .cta .k { font:700 8pt/1.2 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); }
.foot .cta .who { margin-top:0.05in; font:700 11pt/1.2 "Montserrat"; color:#fff; }
.foot .cta .ph { white-space:nowrap; display:block; margin-top:0.02in; font:800 38pt/0.95 "Barlow Semi Condensed"; color:#fff; letter-spacing:.01em; text-decoration:none; }
.foot .cta .alt { margin-top:0.05in; font:600 8.2pt/1.3 "Montserrat"; color:var(--silver); }
.foot .qrbox { flex:none; width:1.3in; text-align:center; }
.foot .qr { display:block; margin:0 auto; width:0.95in; height:0.95in; background:#fff; padding:0.06in; border-radius:4px; }
.foot .qrbox .cap { white-space:nowrap; margin-top:0.05in; font:700 6.2pt/1.2 "Montserrat"; letter-spacing:.05em; text-transform:uppercase; color:var(--silver); }
.foot .co { flex:none; width:2.25in; font:600 7.6pt/1.45 "Montserrat"; color:var(--silver); border-left:0.75pt solid #5b5d63; padding-left:0.18in; }
.foot .co b { display:block; font:800 11pt/1.1 "Barlow Semi Condensed"; letter-spacing:.03em; text-transform:uppercase; color:#fff; margin-bottom:0.04in; }
.foot .co .reg { display:block; margin-top:0.04in; }
.foot .co .reg i { display:inline-block; min-width:0.75in; border-bottom:0.75pt solid #8a8d93; font-style:normal; color:#fff; }
.foot .fine { margin-top:0.08in; padding-top:0.05in; border-top:0.75pt solid #55575d; font:500 6.6pt/1.4 "Montserrat"; color:#b3b6bc; }
.foot .fine b { color:#e4e6e9; font-weight:700; }

/* ---------- print ---------- */
@media print {
  html, body { background:var(--paper); }
  .bar { display:none; }
  .page { margin:0; box-shadow:none; height:11in; overflow:hidden; break-after:page; }
  .page:last-of-type { break-after:auto; }
  body.print-both .page[hidden] { display:flex; }
}

/* ---------- phones ---------- */
@media screen and (max-width: 760px) {
  .page { width:100%; min-height:0; margin:0 0 12px; box-shadow:none; }
  .top { height:auto; padding:14px 16px 18px; }
  .top .rib { opacity:.8; }
  .top .logo { position:relative; left:auto; top:auto; width:150px; height:74px; display:block; }
  .top .ttl { position:relative; left:auto; right:auto; top:auto; margin-top:10px; }
  .top .kick { font-size:11px; }
  .top h1 { font-size:34px; }
  .body { padding:18px 16px; gap:22px; }
  .label { font-size:11px; display:block; line-height:1.35; }
  .label::after { display:none; }
  .label em { display:block; }
  .prop, .prop.nofor { grid-template-columns:1fr 1fr; }
  .prop > div { border-bottom:1px solid var(--line); }
  .prop > div:nth-child(odd) { border-left:0; padding-left:0; }
  .prop > div:nth-child(even) { padding-left:14px; border-left:1px solid var(--line); }
  .prop .addr { grid-column:1 / -1; border-left:0 !important; padding-left:0 !important; }
  .prop.nofor > div:nth-child(2) { border-left:0; padding-left:0; }
  .prop.nofor > div:nth-child(3) { border-left:1px solid var(--line); padding-left:14px; }
  .prop:not(.nofor) > div:nth-child(3) { border-left:0; padding-left:0; }
  .prop:not(.nofor) > div:nth-child(4) { border-left:1px solid var(--line); padding-left:14px; }
  .prop .k { font-size:10px; }
  .prop:not(.nofor) > div:first-child { grid-column:1 / -1; }
  .prop .v { font-size:22px; } .prop .v.s { font-size:18px; white-space:normal; } .prop .v small { font-size:13px; }
  .hero { grid-template-columns:1fr; }
  .range { padding:16px 16px 16px; }
  .range .num { font-size:44px; white-space:normal; }
  .range .job { font-size:15px; } .range .ins { font-size:28px; }
  .notfinal { font-size:14.5px; }
  .counted { padding:14px 16px; } .counted li { font-size:14px; } .counted li svg { width:18px; height:18px; } .counted .sq { font-size:12.5px; }
  .opts { grid-template-columns:1fr; gap:12px; }
  .opt { padding:14px 16px; } .opt .tier { font-size:10px; } .opt .nm { font-size:20px; } .opt .num { font-size:40px; }
  .optnote { display:block; } .optnote .cnt { max-width:none; text-align:left; margin-top:8px; font-size:12.5px; }
  .two { grid-template-columns:1fr; gap:24px; }
  .inc li { grid-template-columns:26px 1fr; gap:4px; }
  .inc li svg { width:18px; height:18px; }
  .inc .t, .inc .q { font-size:17px; } .inc .d { font-size:13px; } .inc .q small { font-size:11.5px; }
  .chg li { font-size:13.5px; padding-left:22px; } .chg li::before { top:14px; }
  .cmp table, .cmp thead, .cmp tbody, .cmp tr, .cmp td, .cmp th { display:block; width:auto; }
  .cmp thead { display:none; }
  .cmp tr { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .cmp td { border:0 !important; background:none !important; font-size:13px; padding:4px 0; }
  .cmp td:first-child { grid-column:1 / -1; font-size:10.5px; padding:0 0 4px; }
  .cmp td[data-h]::before { content:attr(data-h); display:block; font:800 14px/1.2 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--orange-ink); letter-spacing:.03em; margin-bottom:2px; }
  .cmp .src { font-size:11px; }
  .facts { grid-template-columns:1fr 1fr; }
  .facts .head { grid-column:1 / -1; flex-direction:row; align-items:center; font-size:18px; }

  .facts .stat .v { font-size:30px; } .facts .stat .k { font-size:12px; }
  .steps { grid-template-columns:1fr; }
  .step { padding:14px 16px; } .step + .step { border-left:0; border-top:1px solid var(--line); }
  .step .n { width:30px; height:30px; font-size:17px; line-height:30px; }
  .step .h { font-size:18px; } .step .p { font-size:13.5px; }
  .foot { padding:22px 16px 16px; }
  .foot .row { flex-wrap:wrap; gap:16px; }
  .foot .cta { flex:1 1 100%; }
  .foot .cta .k { font-size:12px; } .foot .cta .who { font-size:16px; } .foot .cta .ph { font-size:46px; } .foot .cta .alt { font-size:13px; }
  .foot .qrbox { display:none; }
  .foot .co { width:auto; flex:1 1 100%; border-left:0; padding-left:0; border-top:1px solid #5b5d63; padding-top:12px; font-size:12px; }
  .foot .co b { font-size:16px; }
  .foot .fine { font-size:11px; }
}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <!-- metal siding ribs (like the wall behind HMP's sign) -->
    <pattern id="rib" width="40.8" height="10" patternUnits="userSpaceOnUse" x="-6">
      <rect x="0" width="1.1" height="10" fill="#5c5d63"/><rect x="1.1" width="1.7" height="10" fill="#26272a"/>
      <rect x="20.4" width="0.7" height="10" fill="#36373b"/>
    </pattern>
  </defs>
  <symbol id="hmp-logo" viewBox="-72.6 -92.0 493.6 243.0">

    document.querySelector(".bar .print").textContent = l === "es" ? "Imprimir" : "Print";
    document.querySelector(".bar .name").innerHTML = "HMP <span>&middot;</span> " + (l === "es" ? "Rango estimado" : "Estimate range");
  }
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { document.body.classList.remove("print-both"); show(b.dataset.l); });
  });
  show(want === "es" ? "es" : "en");
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle); else settle();
})();
</script>
</body></html>

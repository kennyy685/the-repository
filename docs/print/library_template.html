<title>HMP Print Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Geist:wght@400;500;600&display=swap">
<style>
/* One deliberate look: the Aldaba graphite ground with HMP's knocker orange (quality bar, CLAUDE.md). */
:root{
  color-scheme:dark;
  --ground:#111214; --panel:#191a1e; --panel-2:#212227; --line:#2c2e34; --line-2:#3a3c43;
  --silver:#eceef1; --text:#d9dbe0; --muted:#9b9ea6; --orange:#f5883a; --orange-ink:#ffb27a; --on-orange:#1b1206;
  --paper:#f4f2ee;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --gut:16px;
}
html,body{background:var(--ground)}
body{color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:var(--gut);padding-block:28px 64px}
.eyebrow{margin:0;color:var(--orange);font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
h1{margin:10px 0 6px;color:var(--silver);font:700 clamp(40px,8vw,64px)/.95 var(--display);letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:60ch}
.lede b{color:var(--silver);font-weight:500;font-variant-numeric:tabular-nums}
.roof{display:block;width:74px;height:14px;margin-bottom:14px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:22px calc(-1*var(--gut)) 8px;padding:12px var(--gut);
  background:linear-gradient(var(--ground) 78%,rgba(17,18,20,0));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);
  font:500 14px/1 var(--body);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.chip .n{margin-left:6px;opacity:.7;font-variant-numeric:tabular-nums}
section{margin-top:26px}
h2{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;color:var(--silver);font:700 24px/1.1 var(--display);letter-spacing:.01em;text-transform:uppercase}
h2 span{color:var(--muted);font:500 13px/1 var(--body);letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:10px 10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  color:inherit;text-align:left;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.card:hover{border-color:var(--line-2);background:var(--panel-2);transform:translateY(-2px)}
.card:focus-visible,.chip:focus-visible,.x:focus-visible,.nav button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.sheet{position:relative;aspect-ratio:3/4;border-radius:9px;background:var(--paper);overflow:hidden;display:grid;place-items:center}
.sheet img{width:100%;height:100%;object-fit:contain}
.count{position:absolute;right:8px;bottom:8px;padding:3px 8px;border-radius:999px;background:rgba(17,18,20,.82);color:var(--silver);
  font:500 12px/1.2 var(--body);font-variant-numeric:tabular-nums}
.card h3{margin:0 2px;color:var(--silver);font:600 15px/1.25 var(--body)}
.card p{margin:0 2px;color:var(--muted);font-size:13px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px}
.tag{padding:3px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font:500 11.5px/1.2 var(--body)}
.tag.draft{border-color:rgba(245,136,58,.45);color:var(--orange-ink)}
footer{margin-top:40px;color:var(--muted);font-size:13px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--ground)}
.viewer[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--gut) 10px;border-bottom:1px solid var(--line);background:var(--ground)}
.bar .t{flex:1;min-width:0}
.bar h3{margin:0;color:var(--silver);font:700 22px/1.1 var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar p{margin:2px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:8px}
.nav button,.x{width:44px;height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--silver);
  display:grid;place-items:center;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.pages{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px var(--gut) calc(40px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:18px}
.pg{width:100%;max-width:900px;display:flex;flex-direction:column;gap:6px}
.pg img{width:100%;height:auto;border-radius:6px;background:var(--paper);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.pg span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <svg class="roof" viewBox="0 0 74 14" aria-hidden="true"><path d="M2 13 L37 2 L72 13" fill="none" stroke="#f5883a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <p class="eyebrow">HMP Siding &amp; Roofing</p>
  <h1>Print Kit</h1>
  <p class="lede" id="lede"></p>
  <nav class="filters" id="filters" aria-label="Filter by use"></nav>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="bar">
    <div class="t"><h3 id="vTitle"></h3><p id="vMeta"></p></div>
    <div class="nav">
      <button type="button" id="prev" aria-label="Previous piece"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button type="button" id="next" aria-label="Next piece"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <button type="button" class="x" id="close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script>
(() => {
  const DATA = /*DATA*/null;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const items = DATA.items, byId = new Map(items.map(i => [i.id, i]));
  let filter = 'all';
  try { filter = localStorage.getItem('printkit-filter') || 'all'; } catch (e) { /* storage blocked */ }
  if (filter !== 'all' && !DATA.groups.some(g => g.id === filter)) filter = 'all';

  $('#lede').innerHTML = `Every printed piece in one place. Tap one to read every page. <b>${items.length}</b> pieces, <b>${DATA.pages}</b> pages.`;
  $('#foot').textContent = `Built ${DATA.built} from the print files. Papers marked Draft wait for the attorney review before the first signature.`;

  function chips() {
    const all = [{id:'all', name:'All', n:items.length}].concat(DATA.groups.map(g => ({...g, n: items.filter(i => i.group === g.id).length})));
    $('#filters').innerHTML = all.map(g => `<button type="button" class="chip" data-g="${g.id}" aria-pressed="${g.id === filter}">${esc(g.name)}<span class="n">${g.n}</span></button>`).join('');
  }
  function card(i) {
    const tags = [i.es ? '<span class="tag">Español</span>' : '', i.draft ? '<span class="tag draft">Draft</span>' : ''].join('');
    return `<button type="button" class="card" data-id="${i.id}" aria-label="Open ${esc(i.title)}">
      <span class="sheet"><img src="${i.thumb}" alt="" loading="lazy" decoding="async"><span class="count">${i.pages.length} ${i.pages.length === 1 ? 'page' : 'pages'}</span></span>
      <h3>${esc(i.title)}</h3>${i.note ? `<p>${esc(i.note)}</p>` : ''}${tags ? `<span class="tags">${tags}</span>` : ''}
    </button>`;
  }
  function list() {
    $('#list').innerHTML = DATA.groups.filter(g => filter === 'all' || g.id === filter).map(g => {
      const its = items.filter(i => i.group === g.id);
      return `<section><h2>${esc(g.name)}<span>${its.length}</span></h2><div class="grid">${its.map(card).join('')}</div></section>`;
    }).join('');
  }
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    filter = b.dataset.g; try { localStorage.setItem('printkit-filter', filter); } catch (err) { /* storage blocked */ }
    chips(); list();
  });

  let open = null, lastFocus = null;
  const order = () => items.filter(i => filter === 'all' || i.group === filter);
  function show(id) {
    const i = byId.get(id); if (!i) return;
    open = id; if (!lastFocus) lastFocus = document.activeElement;
    $('#vTitle').textContent = i.title;
    $('#vMeta').textContent = `${i.pages.length} ${i.pages.length === 1 ? 'page' : 'pages'}${i.note ? ' · ' + i.note : ''}`;
    $('#pages').innerHTML = i.pages.map((p, n) => `<figure class="pg" style="margin:0"><img src="${p.src}" width="${p.w}" height="${p.h}" alt="${esc(i.title)}, page ${n + 1}" loading="${n < 2 ? 'eager' : 'lazy'}" decoding="async"><span>Page ${n + 1} of ${i.pages.length}</span></figure>`).join('');
    $('#pages').scrollTop = 0;
    const o = order(), k = o.findIndex(x => x.id === id);
    $('#prev').disabled = k <= 0; $('#next').disabled = k < 0 || k >= o.length - 1;
    $('#viewer').hidden = false; document.body.style.overflow = 'hidden';
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    $('#close').focus();
  }
  function hide() {
    open = null; $('#viewer').hidden = true; document.body.style.overflow = '';
    history.replaceState(null, '', location.pathname + location.search);
    if (lastFocus && lastFocus.focus) lastFocus.focus(); lastFocus = null;
  }
  function step(d) { const o = order(), k = o.findIndex(x => x.id === open); if (o[k + d]) show(o[k + d].id); }
  $('#list').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) show(c.dataset.id); });
  $('#close').addEventListener('click', hide);
  $('#prev').addEventListener('click', () => step(-1));
  $('#next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => {
    if (!open) return;
    if (e.key === 'Escape') hide(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });

  chips(); list();
  const h = location.hash.slice(1); if (h && byId.has(h)) show(h);
})();
</script>

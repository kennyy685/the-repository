<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMP Walk Sheet</title>
<!-- HMP Siding & Roofing: "Today's knock" WALK SHEET, the paper backup of the HMP App's Today tab for when the phone dies
     or has no signal. Crew-only clipboard page (Kenny / Alex), not a leave-behind.
     HOW TO FILL: replace the JSON inside <script id="data"> with the exact output of `python3 hh.py todaywalk --doors 25`
     (the app's `today/walk` doc, hailhunter/todaywalk.py): date, area, why{en,es}, goal_doors, kind, stops[{address, city,
     pass, come_back?, year_built?, sqft?, house_line?{en,es}}], est_minutes, walk_mi, drive_from_home_mi, best_time{en,es,
     start,end}, who, spanish_share, stale_note?, evidence_note?, rough_note?, none_reason? (empty walk). Then add:
       "lang": "en" | "es" (default en; ?lang=es in the URL and the EN/ES buttons override it).
     Every field but address is optional: missing ones are simply left off the sheet.
     SAMPLE: ?sample=rich = a real run with a come-back door, pass 2, rough siding prices and the hail-marks note
     (hh.py todaywalk --date 2026-08-20 --results ... on a hud.json with house sizes).
     LAYOUT: Letter, black-and-white safe (all meaning in black ink; orange is decoration only). Houses in walking order,
     grouped by street, with 4 tick boxes (Not home / No / Interested / Booked) and a notes space. Pages are built by the
     script: it fills each page, repeats the street header on the next page, and puts the tally box + "Tell the app later"
     on the last page. 25 doors = 2 pages; long walks switch to tighter rows to stay on 2 pages when they can.
     ?debug shows the page count and row density.
     RULES: nothing about deductibles or what insurance pays (rough_note is printed exactly as the engine writes it).
     Fonts: fonts/ (local, free Google Fonts). Logo: <symbol id="hmp-logo"> (same as estimate-sheet.html).
     PDF: chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer --virtual-time-budget=10000
          --print-to-pdf=walk-sheet.pdf file://.../walk-sheet.html -->
<style>
@font-face { font-family:"Barlow Semi Condensed"; font-weight:700; src:url(fonts/BarlowSemiCondensed-700.woff) format("woff"); }
@font-face { font-family:"Barlow Semi Condensed"; font-weight:800; src:url(fonts/BarlowSemiCondensed-800.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:500; src:url(fonts/Montserrat-500.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:600; src:url(fonts/Montserrat-600.woff) format("woff"); }
@font-face { font-family:"Montserrat"; font-weight:700; src:url(fonts/Montserrat-700.woff) format("woff"); }

@page { size: letter; margin: 0; }

:root {
  --char:#404145; --char-dk:#2a2b2f; --ink:#1f2023; --orange:#f5883a; --orange-ink:#b4561a; --silver:#c9ccd1;
  --line:#dcdee2; --rule:#9b9ea4; --mist:#eceef0; --muted:#5c5f66; --paper:#ffffff;
  --cols: 0.3in 2.1in repeat(4, 0.7in) 1fr;
}
* { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--char-dk); }
body { background:var(--char-dk); font-family:"Montserrat", sans-serif; color:var(--ink);
  -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.defs { position:absolute; width:0; height:0; overflow:hidden; }
b, strong { font-weight:700; }

/* ---------- screen toolbar (never printed) ---------- */
.bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:#232427; border-bottom:1px solid #3a3b40; }
.bar .name { font:700 15px/1 "Barlow Semi Condensed"; letter-spacing:.06em; text-transform:uppercase; color:var(--silver); margin-right:auto; }
.bar .name span { color:var(--orange); }
.seg { display:flex; border:1px solid #55575d; border-radius:8px; overflow:hidden; }
.seg button { font:700 14px/1 "Montserrat"; padding:9px 14px; background:transparent; color:var(--silver); border:0; cursor:pointer; min-width:48px; }
.seg button[aria-pressed=true] { background:var(--silver); color:var(--char-dk); }
.bar .print { font:700 14px/1 "Montserrat"; padding:9px 14px; border-radius:8px; border:0; background:var(--orange); color:#1b1b1d; cursor:pointer; }
#dbg { color:#fff; font:12px/1.4 monospace; padding:8px 16px; }

/* ---------- the page ---------- */
#pages { transform-origin:top left; }
.page { width:8.5in; height:11in; margin:24px auto; background:var(--paper); display:flex; flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,.45); overflow:hidden; }

/* page 1 header: same family as the estimate sheet, a little shorter */
.top { position:relative; height:0.92in; flex:none; background:linear-gradient(180deg,#4a4b50 0%,#404145 45%,#2f3034 100%); overflow:hidden; }
.top::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4pt; background:var(--orange); }
.top .rib { position:absolute; inset:0; width:100%; height:100%; }
.top .logo { position:absolute; left:0.36in; top:0.1in; width:1.48in; height:0.73in; }
.top .ttl { position:absolute; left:2.1in; right:2.05in; top:0.15in; }
.top .kick { font:700 7.2pt/1 "Montserrat"; letter-spacing:.16em; text-transform:uppercase; color:var(--silver); }
.top h1 { margin-top:0.07in; font:800 23pt/0.95 "Barlow Semi Condensed"; text-transform:uppercase; color:#fff; letter-spacing:.005em; }
.top h1.m { font-size:19pt; } .top h1.s { font-size:16pt; }
.top h1 span { color:var(--orange); }
.top .date { position:absolute; right:0.4in; top:0.17in; text-align:right; color:#fff; }
.top .date .wd { font:700 7.2pt/1 "Montserrat"; letter-spacing:.16em; text-transform:uppercase; color:var(--silver); }
.top .date .d { margin-top:0.06in; font:800 20pt/0.95 "Barlow Semi Condensed"; text-transform:uppercase; white-space:nowrap; }

/* pages 2+: a slim white header (saves toner) */
.top2 { flex:none; height:0.5in; margin:0 0.4in; display:flex; align-items:flex-end; gap:0.14in; padding-bottom:0.07in;
  border-bottom:2pt solid var(--char-dk); position:relative; }
.top2::after { content:""; position:absolute; left:0; bottom:-5pt; width:1.1in; height:3pt; background:var(--orange); }
.top2 .mk { font:800 15pt/1 "Barlow Semi Condensed"; letter-spacing:.04em; color:var(--char-dk); }
.top2 .t { font:700 8pt/1.2 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--char); flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top2 .t b { color:var(--ink); }
.top2 .d { font:800 12pt/1 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--ink); white-space:nowrap; }

.body { flex:1; min-height:0; overflow:hidden; padding:0.15in 0.4in 0.1in; display:flex; flex-direction:column; }
.top2 + .body { padding-top:0.14in; }

/* summary strip: why / goal / best time */
.strip { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr); border-top:1.5pt solid var(--char-dk);
  border-bottom:0.75pt solid var(--rule); flex:none; }
.strip > div { padding:0.07in 0.14in 0.08in 0; min-width:0; }
.strip > div + div { padding-left:0.14in; border-left:0.75pt solid var(--rule); }
.strip .k { font:700 6.6pt/1 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.strip .why { margin-top:0.05in; font:600 9pt/1.32 "Montserrat"; color:var(--ink); }
.strip .v { margin-top:0.045in; font:800 21pt/1 "Barlow Semi Condensed"; color:var(--ink); white-space:nowrap; }
.strip .v small { font:700 11pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--char); }
.strip .v.s { font-size:15pt; white-space:normal; line-height:1.05; }
.strip .sub { margin-top:0.04in; font:600 7.4pt/1.3 "Montserrat"; color:var(--muted); }

.notes { list-style:none; margin-top:0.07in; display:flex; flex-direction:column; gap:0.035in; flex:none; }
.notes li { display:flex; gap:0.07in; align-items:flex-start; font:600 7.5pt/1.35 "Montserrat"; color:var(--char); }
.notes li svg { flex:none; width:0.14in; height:0.14in; margin-top:0.005in; }
.notes li.warn { font-weight:700; color:var(--ink); }
.notes li.fine { font:500 6.8pt/1.35 "Montserrat"; color:var(--muted); }

.none { margin-top:0.12in; border:1.5pt solid var(--char-dk); border-radius:5px; padding:0.12in 0.16in; flex:none; }
.none h2 { font:800 17pt/1 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--ink); }
.none p { margin-top:0.05in; font:600 9pt/1.35 "Montserrat"; color:var(--char); }

/* the list: street bands + one row per house */
.rows { flex:none; margin-top:0.12in; }
.top2 + .body .rows { margin-top:0; }
.band, .row { display:grid; grid-template-columns:var(--cols); align-items:end; }
.band { margin-top:0.08in; padding:0.05in 0 0.045in; background:var(--mist); border-top:1.5pt solid var(--char-dk); border-bottom:0.75pt solid var(--char-dk); }
.rows > .band:first-child { margin-top:0; }
.band .st { grid-column:1 / 3; padding-left:0.08in; font:800 13pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.band .st small { font:700 6.8pt/1 "Montserrat"; letter-spacing:.1em; color:var(--muted); margin-left:0.05in; }
.band .ch { text-align:center; font:700 6.2pt/1.1 "Montserrat"; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); padding:0 0.02in; }
.band .ch small { display:block; margin-top:0.02in; font:600 5.8pt/1 "Montserrat"; letter-spacing:0; text-transform:none; color:var(--muted); }
.band .ch.nt { text-align:left; padding-left:0.12in; }

.row { align-items:center; min-height:0.4in; padding:0.045in 0; border-bottom:0.75pt solid var(--rule); break-inside:avoid; }
.row .seq { align-self:center; font:700 7.4pt/1 "Montserrat"; color:var(--muted); text-align:center; }
.row .addr { min-width:0; padding-right:0.06in; display:flex; align-items:center; gap:0.08in; }
.row .num { flex:none; font:800 19pt/0.95 "Barlow Semi Condensed"; color:var(--ink); letter-spacing:.01em; }
.row .num.full { flex:1 1 auto; min-width:0; font-size:12pt; line-height:1.05; }
.row .meta { flex:1 1 0; min-width:0; }
.row .addr.full { flex-wrap:wrap; row-gap:0.02in; }
.row .addr.full .num { flex:1 1 100%; }
.row .l1 { display:flex; align-items:center; gap:0.04in; flex-wrap:wrap; }
.row .city { font:700 7pt/1 "Montserrat"; text-transform:uppercase; letter-spacing:.08em; color:var(--char); }
.row .tag { display:inline-flex; align-items:center; gap:0.03in; font:700 6.3pt/1 "Montserrat"; letter-spacing:.08em; text-transform:uppercase;
  padding:0.03in 0.055in; border-radius:2px; white-space:nowrap; }
.row .tag.pass { background:var(--ink); color:#fff; }
.row .tag.cb { border:1pt solid var(--ink); color:var(--ink); }
.row .tag svg { width:0.09in; height:0.09in; }
.row .l1 + .hl { margin-top:0.025in; }
.row .hl { font:500 6.6pt/1.25 "Montserrat"; color:var(--muted); }
.row .bx { display:flex; justify-content:center; }
.row .bx i { display:block; width:0.21in; height:0.21in; border:1.2pt solid var(--ink); border-radius:2px; background:#fff; }
.row .nt { align-self:stretch; border-left:0.75pt solid var(--rule); margin-left:0.06in; }
.row.blank .num { display:block; width:1.9in; height:0.2in; }
.row.pass .seq { color:var(--ink); }

/* tighter rows for long walks */
.dense .row { min-height:0.3in; padding:0.03in 0; }
.dense .row .num { font-size:15pt; }
.dense .row .num.full { font-size:11pt; }
.dense .row .hl { font-size:6pt; }
.dense .row .bx i { width:0.18in; height:0.18in; }
.dense .band { margin-top:0.06in; padding:0.04in 0 0.035in; }
.dense .band .st { font-size:12pt; }

/* tally + tell the app (last page, pinned to the bottom) */
.tally { margin-top:auto; padding-top:0.14in; flex:none; }
.tbox { border:1.5pt solid var(--char-dk); border-radius:5px; overflow:hidden; }
.tgrid { display:grid; grid-template-columns:1.12in repeat(4, 1fr); }
.tgrid .h { background:var(--char-dk); color:#fff; padding:0.1in 0.12in; display:flex; flex-direction:column; justify-content:center; gap:0.04in;
  font:800 14pt/0.98 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; }
.tgrid .h small { font:600 6.4pt/1.3 "Montserrat"; text-transform:none; letter-spacing:0; color:var(--silver); }
.tgrid .c { padding:0.08in 0.12in 0.07in; border-left:0.75pt solid var(--rule); display:flex; flex-direction:column; }
.tgrid .c .k { font:700 7.4pt/1 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
.tgrid .c .w { height:0.44in; border-bottom:1pt solid var(--ink); margin:0.03in 0.05in 0.05in 0; }
.tgrid .c .hint { font:600 6.2pt/1.25 "Montserrat"; color:var(--muted); }
.tell { display:flex; align-items:center; gap:0.14in; padding:0.09in 0.14in 0.1in; border-top:1pt solid var(--char-dk); background:var(--mist); }
.tell svg { flex:none; width:0.34in; height:0.34in; }
.tell .k { font:700 7.4pt/1 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
.tell .say { margin-top:0.035in; font:800 15pt/1 "Barlow Semi Condensed"; color:var(--ink); }
.tell .sub { margin-left:auto; max-width:2.5in; font:600 7pt/1.35 "Montserrat"; color:var(--char); text-align:right; }

/* footer: light, every page */
.foot { flex:none; height:0.36in; margin:0 0.4in; display:flex; align-items:center; gap:0.2in; border-top:0.75pt solid var(--rule);
  font:600 7pt/1.2 "Montserrat"; color:var(--muted); }
.foot b { font-weight:700; color:var(--ink); }
.foot .ph { margin-left:auto; }
.foot .pg { font:800 10pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); }

/* ---------- phones: the script scales the Letter pages down to fit ---------- */
@media screen and (max-width: 860px) {
  .bar { padding:8px 12px; gap:8px; }
  .bar .name { font-size:13px; }
  .seg button, .bar .print { padding:8px 11px; font-size:13px; min-width:0; }
  .page { margin:12px auto; }
}

/* ---------- print ---------- */
@media print {
  html, body { background:var(--paper); }
  .bar, #dbg { display:none; }
  #pages { transform:none !important; height:auto !important; }
  .page { margin:0; box-shadow:none; break-after:page; }
  .page:last-of-type { break-after:auto; }
}
</style>
</head>

        var n = 0; for (var j = i; j < stops.length && split(stops[j].address).key === a.key; j++) n++;
        cur = {key: a.key, name: a.n ? esc(a.st) : t.other, n: n};
        out.push({street: cur, band: true, html: band(t, cur.name, t.count(n)) + row(s, i, l, t)});
      } else out.push({street: cur, band: false, html: row(s, i, l, t)});
    });
    return out;
  }
  function frag(html) { var d = document.createElement("div"); d.innerHTML = html; return Array.prototype.slice.call(d.children); }

  var root = document.getElementById("pages");
  function paginate(l, dense) {
    var t = T[l];
    root.innerHTML = "";
    root.className = dense ? "dense" : "";
    var pages = [];
    function newPage(first) {
      var sec = document.createElement("section");
      sec.className = "page"; sec.lang = l;
      sec.innerHTML = (first ? header(l, t) : header2(l, t)) + '<main class="body">' +
        (first ? strip(l, t) + notes(l, t) + (stops.length ? "" : '<div class="none"><h2>' + t.noneH + '</h2><p>' +
          esc(tx(D.none_reason, l)) + (D.none_reason ? " " : "") + t.noneP + '</p></div>') : "") +
        '<div class="rows"></div></main>' + foot(t);
      root.appendChild(sec);
      var pg = {sec: sec, body: sec.querySelector(".body"), rows: sec.querySelector(".rows"), units: []};
      pages.push(pg);
      return pg;
    }
    function over(pg) { return pg.body.scrollHeight > pg.body.clientHeight + 1; }
    function put(pg, u, cont) {
      var html = u.html;
      if (cont) html = band(t, u.street.name, t.cont) + html;
      var els = frag(html);
      els.forEach(function (e) { pg.rows.appendChild(e); });
      pg.units.push({u: u, els: els});
      return els;
    }
    function take(pg) { var x = pg.units.pop(); x.els.forEach(function (e) { e.remove(); }); return x.u; }

    var pg = newPage(true);
    units(l, t).forEach(function (u) {
      put(pg, u, false);
      if (over(pg) && pg.units.length > 1) {
        take(pg);
        // don't leave a street's band with just one house at the bottom of a page
        var last = pg.units[pg.units.length - 1].u, carry = !u.band && last.band && last.street === u.street && pg.units.length > 1;
        if (carry) take(pg);
        pg = newPage(false);
        if (carry) { put(pg, last, false); put(pg, u, false); } else put(pg, u, !u.band);
      }
    });
    // tally on the last page; if it doesn't fit, carry the last few houses over with it
    var tel = frag(tally(l, t))[0];
    pg.body.appendChild(tel);
    if (over(pg)) {
      tel.remove();
      var moved = [];
      for (var k = 0; k < 3 && pg.units.length > 1; k++) moved.unshift(take(pg));
      pg = newPage(false);
      moved.forEach(function (u, i) { put(pg, u, i === 0 && !u.band); });
      pg.body.appendChild(tel);
    }
    // spare room on the last page: blank rows for doors added on the spot (or the whole list on an empty day)
    var ex = document.createElement("div");
    ex.className = "rows extra";
    pg.body.insertBefore(ex, tel);
    ex.innerHTML = stops.length ? band(t, t.extra, t.extraSub) : band(t, t.writeIn, t.extraSub);
    var maxBlank = stops.length ? 5 : 30, added = 0;
    if (over(pg)) ex.remove();
    else {
      while (added < maxBlank) {
        var b = frag(blankRow())[0]; ex.appendChild(b);
        if (over(pg)) { b.remove(); break; }
        added++;
      }
      if (added < (stops.length ? 2 : 1)) ex.remove();
    }
    pages.forEach(function (p, i) { p.sec.querySelector(".pg").innerHTML = t.page(i + 1, pages.length); });
    return pages.length;
  }

  var lang = (Q.get("lang") || D.lang || "en").toLowerCase() === "es" ? "es" : "en";
  function render(l) {
    lang = l;
    var n = paginate(l, false), dense = false;
    if (n > 2 && stops.length <= 70) {           // long walk: try tighter rows before adding a 3rd page
      var n2 = paginate(l, true);
      if (n2 < n) { n = n2; dense = true; } else paginate(l, false);
    }
    document.documentElement.lang = l;
    document.querySelectorAll(".seg button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.l === l)); });
    document.querySelector(".bar .print").textContent = T[l].print;
    document.querySelector(".bar .name").innerHTML = "HMP <span>&middot;</span> " + T[l].bar;
    document.title = "HMP " + (l === "es" ? "Hoja de ruta" : "Walk Sheet");
    fitScreen();
    if (Q.has("debug")) {
      var dbg = document.getElementById("dbg") || document.body.insertBefore(document.createElement("pre"), root);
      dbg.id = "dbg";
      dbg.textContent = l + ": " + stops.length + " stops, " + n + " page(s), " + (dense ? "tight rows" : "normal rows");
    }
  }
  // phones: shrink the Letter pages to the screen width (print is unaffected)
  function fitScreen() {
    var w = document.documentElement.clientWidth, full = 8.5 * 96 + 32;
    if (w < full) { var s = (w - 16) / (8.5 * 96); root.style.transform = "scale(" + s + ")"; root.style.width = (8.5 * 96) + "px";
      root.style.height = (root.scrollHeight * s) + "px"; root.style.marginLeft = "8px"; }
    else { root.style.transform = ""; root.style.width = ""; root.style.height = ""; root.style.marginLeft = ""; }
  }
  document.querySelectorAll(".seg button").forEach(function (b) { b.addEventListener("click", function () { render(b.dataset.l); }); });
  window.addEventListener("resize", fitScreen);
  render(lang);                                   // right away (fallback fonts), then again once the real fonts are in
  var faces = ['800 19px "Barlow Semi Condensed"', '700 19px "Barlow Semi Condensed"', '500 10px "Montserrat"', '600 10px "Montserrat"', '700 10px "Montserrat"'];
  if (document.fonts && document.fonts.load) Promise.all(faces.map(function (f) { return document.fonts.load(f); })).then(function () { render(lang); }, function () {});
})();
</script>

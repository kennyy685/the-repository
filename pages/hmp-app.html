/* ================= v24 layer (Option B "Next step" + theme A "Ledger"): shell, Now, Knock, sheets. Tokens only: a new theme swaps :root ================= */
body{font:400 var(--t-md)/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
.app{max-width:760px;padding-block:0 calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));gap:var(--s-5)}
body.rh-on .app{padding-bottom:calc(var(--nav-h) + 54px + 32px + env(safe-area-inset-bottom,0px))}   /* v24.1: room for the Right Hand strip */
/* Ledger flattening: hairlines, no shadows, one radius family */
.a-card,.a-sec,.box,.knock,.panel,.money,.a-empty,.chase,.b-num,.b-sec,.k-now,.ns,.est-sec,.est-res,.ord-list,.nowcard,.zstart,.due,.k-map,.howmore{border-width:var(--bw)!important;box-shadow:none!important}
.ns,.est-res,.ord-list{border-color:var(--line)}
.btn{background:var(--panel);border:var(--bw) solid var(--line2);min-height:var(--tap);border-radius:var(--r-sm);font:500 var(--t-md)/1.1 var(--f-body)!important;letter-spacing:0!important;color:var(--ink);padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.go{background:var(--hmp);border-color:var(--hmp);color:var(--on-accent);font-weight:600!important}
.btn.ghost{background:transparent}
.k-eb,.sh-eyebrow,.eyebrow,.ns-of,.ns-lb,.dg-h,.k-now-l,.say b,.ns-say b,.ns-must b,.ns-tip b,.ns-info b,.flip-h b,.tile .k,.c-money .k,.a-next .lbl > b,.k-l,.pay .k{font:500 var(--t-xs)/1.3 var(--f-label)!important;letter-spacing:var(--track-label)!important;text-transform:uppercase;color:var(--mute)}
.ah,.k-area,.c-addr,.sheet-head h2,.ns-name,.nc-t,.zname,.box h3,.b-top h2,.b-sec h3{font-family:var(--f-display);font-weight:var(--w-head);letter-spacing:var(--track-head)}
.door-a b,.tile .v,.c-money .v,.lrow .a,.pay .v,.b-num .v,.est-range,.kbig b{font-family:var(--f-display);font-weight:var(--w-head);letter-spacing:var(--track-head);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--hmp);outline-offset:2px}
.a-quiet{color:var(--mute);font-size:var(--t-md);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3) 0 var(--s-2);background:var(--bar-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-inline:-16px;padding-inline:16px}
.bar .mark{display:flex;flex-direction:column;align-items:center;line-height:1;color:var(--hmp)}
.bar .mark svg{width:32px;height:9px}
.bar .mark b{font:600 var(--t-sm)/1 var(--f-display);letter-spacing:.08em;color:var(--ink)}
.bar .ctx{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s-2);color:var(--mute);font-size:var(--t-sm)}
.bar .ctx b{font-weight:500;color:var(--ink2);white-space:nowrap}
.bar .live{border:0;background:none;padding:0;min-height:0;gap:6px;font:400 var(--t-xs)/1.2 var(--f-body);color:var(--mute)}
.bar .live[data-state="on"] #liveText{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar .live[data-state="on"] .dot{animation:none;background:var(--m-in)}
.bar .sync{min-height:var(--tap);padding:4px 10px;font:500 var(--t-xs)/1.2 var(--f-body);border-width:var(--bw);border-radius:var(--r-sm)}
.bar .lang{border:var(--bw) solid var(--line);border-radius:var(--r-sm);background:var(--panel)}
.bar .lang button{min-width:44px;min-height:var(--tap);background:transparent;color:var(--mute);font:500 var(--t-sm)/1 var(--f-body)!important}
.bar .lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.iconbtn{width:var(--tap);height:var(--tap);flex:none;border-radius:50%;border:var(--bw) solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px;fill:currentColor}

/* bottom tab bar + the + button */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:var(--bw) solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar > button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font:500 var(--t-xs)/1.1 var(--f-body);color:var(--mute);cursor:pointer;padding:4px 0}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar > button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabbar .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:var(--r-pill);font:600 11px/18px var(--f-body);font-style:normal;background:var(--panel2);color:var(--ink2)}
.tabbar .bd:empty{display:none}
.tabbar .bd.crit{background:var(--crit);color:var(--on-crit)}
.tabbar .plus i{width:48px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center;color:var(--on-ink)}
.tabbar .plus svg{stroke-width:2.4;width:22px;height:22px}
@media (min-width:800px){.tabbar{left:50%;transform:translateX(-50%);width:760px;border-inline:var(--bw) solid var(--line);border-radius:var(--r) var(--r) 0 0}}
/* the Right Hand: one button on every screen */
/* v24.1: the Right Hand is a strip docked on top of the tab bar (part of the bar, like a chat box), never a pill floating over cards */
.tabbar > .fab{grid-column:1 / -1;flex-direction:row;justify-content:flex-start;gap:var(--s-2);min-height:var(--tap);margin:0 4px 6px;padding:0 14px;border:var(--bw) solid var(--line2);border-radius:var(--r-pill);background:var(--panel);color:var(--ink);font:600 var(--t-md)/1 var(--f-body);text-align:left}
.tabbar > .fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.tabbar > .fab small{font:400 var(--t-sm)/1.2 var(--f-body);color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tally .t-rh{width:var(--tap);min-height:var(--tap);display:grid;place-items:center;border:var(--bw) solid var(--line2);border-radius:var(--r-sm);background:var(--panel);color:var(--ink);cursor:pointer}
.tally .t-rh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.tally .t-acts.rh{grid-template-columns:auto 1fr auto auto!important}
body.bossmode .tabbar,body.bossmode .fab,body.bossmode .tabp,body.bossmode .bar .lang,body.bossmode #appBanner{display:none!important}

/* shared: folds, lists, chips */
details.fold{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:0 var(--s-4)}
details.fold > summary{cursor:pointer;min-height:var(--tap);display:flex;align-items:center;gap:var(--s-2);font:600 var(--t-md)/1.2 var(--f-display);list-style:none}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"+";margin-left:auto;font:400 var(--t-xl)/1 var(--f-body);color:var(--mute)}
details.fold[open] > summary::after{content:"\2212"}
details.fold[open]{padding-bottom:var(--s-4)}
.n{font:500 var(--t-xs)/1 var(--f-label);color:var(--mute)}
.dg-h{margin:var(--s-2) 0 var(--s-2)}
.a-chip{border-radius:var(--r-sm);font:500 var(--t-xs)/1.2 var(--f-label);letter-spacing:.02em}
.a-chip.crit::before{content:""}

/* NOW: hot zones map */
.zones{display:grid;gap:var(--s-3)}
.zmap{position:relative;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--map-bg);min-height:220px}
.zsvg{display:block;width:100%;height:auto;max-height:46vh}
.zbg{fill:var(--map-bg)}
.zst{fill:none;stroke:var(--map-street);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.zhs{fill:var(--map-house)}
.zone{cursor:pointer}
.zone circle,.zone polygon{fill-opacity:.38;stroke-width:2}
.zone.h1 circle,.zone.h1 polygon{fill:var(--heat-1);stroke:var(--heat-1)} .zone.h2 circle,.zone.h2 polygon{fill:var(--heat-2);stroke:var(--heat-2)}
.zone.h3 circle,.zone.h3 polygon{fill:var(--heat-3);stroke:var(--heat-3)} .zone.h4 circle,.zone.h4 polygon{fill:var(--heat-4);stroke:var(--heat-4)}
.zone.h5 circle,.zone.h5 polygon{fill:var(--heat-5);stroke:var(--heat-5)}
.zone.on circle,.zone.on polygon{stroke:var(--ink);stroke-width:3;fill-opacity:.5}
.zone:focus-visible{outline:none}.zone:focus-visible circle,.zone:focus-visible polygon{stroke:var(--ink);stroke-width:4}
.zlbl{fill:var(--map-label);font:600 15px var(--f-body);paint-order:stroke;stroke:var(--map-bg);stroke-width:4px;stroke-linejoin:round}
.zyou circle{fill:var(--map-you);stroke:var(--panel);stroke-width:3}.zyou text{fill:var(--map-label);font:600 13px var(--f-body)}
.znorth{fill:var(--map-label)}
.zcap{display:flex;justify-content:space-between;gap:var(--s-2);padding:6px var(--s-3);font:500 var(--t-xs)/1.3 var(--f-label);letter-spacing:.04em;color:var(--mute);border-top:var(--bw) solid var(--line);background:var(--panel)}
.zleaf{position:absolute;inset:0 0 29px 0;z-index:2}
.zmap.leaf .zsvg{visibility:hidden}
.zlt{font:600 12px var(--f-body)}
.zstart{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--s-4);display:grid;gap:var(--s-2)}
.zname{margin:0;font-size:var(--t-2xl);line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.zline{margin:0;color:var(--ink2);font-size:var(--t-md);overflow-wrap:anywhere}
.zwhy{margin:0;color:var(--mute);font-size:var(--t-sm);max-width:62ch}
.zacts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);margin-top:var(--s-2)}
.zacts .go{flex:1 1 180px;min-height:52px;font-size:var(--t-lg)!important}
.zapple{min-height:var(--tap);display:inline-flex;align-items:center;padding:0 var(--s-2);font-size:var(--t-sm);color:var(--mute)}
.zlist{list-style:none;margin:0;padding:0;display:grid}
.zrow{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:var(--s-3);min-height:56px;padding:var(--s-2) 0;border:0;border-top:var(--bw) solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.zrow i{width:12px;height:12px;border-radius:50%;background:var(--heat-3)}
.zrow.h1 i{background:var(--heat-1)}.zrow.h2 i{background:var(--heat-2)}.zrow.h4 i{background:var(--heat-4)}.zrow.h5 i{background:var(--heat-5)}
.zrow b{display:block;font-weight:600;overflow-wrap:anywhere}.zrow small{color:var(--mute);font-size:var(--t-sm)}
.zrow em{font-style:normal;font:500 var(--t-xs)/1 var(--f-label);color:var(--mute)}

/* NOW: the one next thing + Due */
.nowcard{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--s-4);display:grid;gap:var(--s-3)}
.nowcard .k-eb{color:var(--hmp2)!important}
.nc-t{margin:0;font-size:var(--t-3xl);line-height:1.08;text-wrap:balance;overflow-wrap:anywhere}
.nc-acts{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.nc-acts .btn{flex:1 1 140px}
.gcol-l{margin:0;font-size:var(--t-md);color:var(--ink2)}
.due{background:transparent;display:grid;gap:var(--s-2)}
.due .ah{font-size:var(--t-xl);display:flex;align-items:baseline;gap:var(--s-2)}
.dgrp{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--s-3) var(--s-4) var(--s-2);margin-bottom:var(--s-2)}
.dgrp .dg-h{margin:0 0 var(--s-1)}
.due-l{list-style:none;margin:0;padding:0;display:grid}
.drow,.fu button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s-3);align-items:start;padding:var(--s-3) 0;border:0;border-top:var(--bw) solid var(--line);background:none;min-height:56px;cursor:pointer;color:var(--ink);border-radius:0}
.due-l li:first-child .drow{border-top:0}
.drow .addr{font-weight:600;font-size:var(--t-md);overflow-wrap:anywhere}
.drow .kind{margin-left:var(--s-2);font:500 var(--t-xs)/1 var(--f-label);letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.drow .what{grid-column:1 / -1;color:var(--mute);font-size:var(--t-sm);overflow-wrap:anywhere}
.drow .rem{font-style:normal;font:500 var(--t-xs)/1.2 var(--f-label);color:var(--hmp2);white-space:nowrap}
.dlater{margin-top:var(--s-1)}

/* the ES ⇄ flip on every Sale Guide script line */
.flipb{display:grid;gap:var(--s-2)}
.flip-h{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.flip-h b{margin:0!important}
.flip{min-height:var(--tap);min-width:56px;padding:2px 10px;border:var(--bw) solid var(--line2);border-radius:var(--r-sm);background:var(--panel);font:500 var(--t-xs)/1 var(--f-label);color:var(--mute);cursor:pointer}
.flip[aria-pressed="true"]{border-color:var(--hmp);color:var(--hmp2)}
.ns-say q{font-size:var(--t-lg);line-height:1.45}
.ns-say{background:var(--bg);border-left:3px solid var(--hmp)}
.law{border-left-color:var(--warn)!important}
.gcol{margin:0;padding-left:18px;display:grid;gap:4px}
.ns-ref{display:grid;gap:var(--s-2)}
.ns-lb2{margin:0 0 4px;font-size:var(--t-sm);color:var(--mute)}

/* KNOCK: B's big door count, the next door as an offer card */
.knock{border:0!important;background:transparent;overflow:visible}
.k-head{padding:0;gap:var(--s-1)}
.k-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.kmenu{position:relative}
.kmenu > summary{list-style:none;width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%;border:var(--bw) solid var(--line);background:var(--panel);cursor:pointer;font:600 var(--t-xl)/1 var(--f-body);color:var(--ink2)}
.kmenu > summary::-webkit-details-marker{display:none}
.kmenu-in{position:absolute;right:0;top:calc(100% + 6px);z-index:12;width:min(320px,80vw);background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);padding:var(--s-3);box-shadow:var(--lift);display:grid;gap:var(--s-2)}
.kbig{display:flex;align-items:baseline;gap:var(--s-2);margin:0}
.kbig b{font-size:var(--t-big);line-height:.95;letter-spacing:-.04em}
.kbig span{font:600 var(--t-xl)/1 var(--f-display);color:var(--mute)}
.k-bar{height:8px;border-radius:var(--r-pill);overflow:hidden;background:var(--track)}
.kline{display:flex;flex-wrap:wrap;gap:4px var(--s-4);margin:var(--s-1) 0 0;color:var(--ink2);font-size:var(--t-md)}
.kline b{font-weight:600;font-variant-numeric:tabular-nums}
.k-area{margin:var(--s-2) 0 0;font-size:var(--t-lg);color:var(--mute);font-weight:500}
.k-now{margin:var(--s-3) 0 0;padding:var(--s-4);background:var(--panel);border:var(--bw) solid var(--line)!important;border-radius:var(--r);gap:var(--s-3)}
.k-now .door-a b{font-size:var(--t-3xl)}
.k-now .door-a span{font-size:var(--t-lg);color:var(--ink)}
.k-now .d-why{color:var(--ink2);font:500 var(--t-md)/1.35 var(--f-body)}
.k-coach{margin:0;padding:var(--s-2) var(--s-3);border-left:3px solid var(--hmp);background:var(--bg);font-size:var(--t-md);color:var(--ink)}
.d-btns{gap:var(--s-2)}
.d-btns button{border:var(--bw) solid var(--line2);background:var(--panel);border-radius:var(--r-sm);font:600 var(--t-lg)/1.1 var(--f-body)!important;color:var(--ink)}
.k-now .d-btns{grid-template-columns:repeat(2,minmax(0,1fr))}
.k-now .d-btns button{min-height:var(--tap-lg);font-size:19px!important}
.d-btns .b-int{border-color:var(--line2);color:var(--ink)}
.d-btns .b-book{background:var(--hmp);border-color:var(--hmp);color:var(--on-accent)}
.d-btns .b-book small{color:var(--on-accent);opacity:.8}
.wts{width:100%;min-height:52px;border-color:var(--hmp)!important;color:var(--hmp2)!important;font-weight:600!important}
.k-normal{margin:var(--s-2) 0 0;padding:var(--s-2) var(--s-3);background:var(--m-in-soft);border-radius:var(--r-sm);color:var(--m-in);font-size:var(--t-sm);font-weight:600}
.kviews{margin-top:var(--s-4)}
.seg{border:var(--bw) solid var(--line2)!important;border-radius:var(--r-sm);background:var(--panel)}
.seg button{background:transparent;min-height:var(--tap);font:500 var(--t-md)/1.1 var(--f-body)!important;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink)!important;color:var(--on-ink)!important;box-shadow:none!important}
.seg button small{color:inherit;opacity:.75}
.kviews button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.kviews svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kthen{margin-top:var(--s-3)}
.kup-l{list-style:none;margin:0;padding:0;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r)}
.kup{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s-3);align-items:baseline;padding:var(--s-3) var(--s-4);border-top:var(--bw) solid var(--line)}
.kup:first-child{border-top:0}
.kup-n{font:600 var(--t-xl)/1 var(--f-display);font-variant-numeric:tabular-nums}
.kup-t b{display:block;font-weight:600}.kup-t small{color:var(--mute);font-size:var(--t-sm)}
.k-list{margin-top:var(--s-3);background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden}
.k-street h3{background:var(--bg2)}
.k-map{margin-top:var(--s-3);border-radius:var(--r)}
.k-map svg rect:first-child{fill:var(--map-bg)}
.kabout{margin-top:var(--s-4)}
.k-txt{padding-top:var(--s-2)}
.k-foot{border:0;padding:var(--s-3) 0 0}
.tally{position:sticky;bottom:calc(var(--nav-h) + 8px + env(safe-area-inset-bottom,0px));display:block;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--lift);padding:var(--s-2)}
.tally .t-acts{display:grid!important;grid-template-columns:auto 1fr auto!important;gap:var(--s-2);align-items:center;padding:0;border:0!important}
.tally .t-next{min-height:var(--tap);background:var(--panel);color:var(--ink);border:var(--bw) solid var(--line2);border-radius:var(--r-sm);font:500 var(--t-md)/1.1 var(--f-body)!important}
.tally .t-cb{min-height:var(--tap);color:var(--crit);font:500 var(--t-sm)/1.2 var(--f-body)!important;text-align:center}
.tally .t-cb.none{color:var(--mute)}
.tally .t-done{min-height:var(--tap);background:var(--ink);color:var(--on-ink);border-radius:var(--r-sm);font:600 var(--t-md)/1.1 var(--f-body)!important}
#weekBox{margin-top:var(--s-2)}
.wk-lw{color:var(--label);font-size:var(--t-xs)}

/* sheets: a bottom sheet on phones, a side panel on wide screens */
.sheet{background:var(--bg)}
.sheet-head{background:var(--bg);border-bottom:var(--bw) solid var(--line)}
.sheet-head h2{font-size:var(--t-2xl)}
@media (max-width:640px){
  .sheet{top:auto;left:0;right:0;width:100%;max-height:92%;border-radius:var(--r) var(--r) 0 0;border-left:0;box-shadow:var(--shadow-sheet);animation:up .2s ease-out}
  .sheet-head{padding-top:14px;border-radius:var(--r) var(--r) 0 0}
  .sheet-head::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line2);margin:-6px auto 4px}
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-2)}
.actb{display:grid;gap:4px;align-content:start;justify-items:start;text-align:left;min-height:96px;padding:var(--s-3);background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink)}
.actb svg{width:22px;height:22px;fill:none;stroke:var(--hmp);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.actb b{font:600 var(--t-lg)/1.15 var(--f-display)}
.actb span{font-size:var(--t-sm);color:var(--mute)}
.mlist{list-style:none;margin:0;padding:0;background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--r)}
.mrow{width:100%;display:flex;align-items:center;gap:var(--s-3);min-height:60px;padding:var(--s-3) var(--s-4);border:0;border-top:var(--bw) solid var(--line);background:none;text-align:left;color:var(--ink);text-decoration:none;cursor:pointer}
.mlist li:first-child .mrow{border-top:0}

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const locale = () => (lang === 'es' ? 'es-US' : 'en-US');
const numv = v => { if (typeof v === 'number' && isFinite(v)) return v; if (typeof v === 'string') { const s = v.replace(/[$,\s]/g, ''); if (s !== '' && isFinite(+s)) return +s; } return null; };
const dayOf = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : null);
const yesv = v => v === true || (typeof v === 'string' && v.trim() !== '' && !/^(false|no|0)$/i.test(v.trim()));
const strv = v => (typeof v === 'string' ? v.trim() : typeof v === 'number' ? String(v) : '');
// v23: one formatter per locale + options, reused (building an Intl formatter on every date or dollar was the top cost of a redraw)
const FMTS = new Map(), fmtr = (kind, loc, o) => { const k = kind + loc + JSON.stringify(o); let f = FMTS.get(k); if (!f) { f = kind === 'n' ? new Intl.NumberFormat(loc, o) : new Intl.DateTimeFormat(loc, o); FMTS.set(k, f); } return f; };
const usd = n => fmtr('n', locale(), {style: 'currency', currency: 'USD', maximumFractionDigits: 0}).format(n || 0);
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const toDate = d => new Date(d + 'T12:00:00');
const fmtDay = (d, weekday) => { const o = {month: 'short', day: 'numeric'}; if (weekday) o.weekday = 'short'; if (d.slice(0, 4) !== String(new Date().getFullYear())) o.year = 'numeric'; return fmtr('d', locale(), o).format(toDate(d)); };
const daysFromToday = d => Math.round((toDate(d) - toDate(todayStr())) / 86400000);
const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? '' : fmtr('d', locale(), {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}).format(d); };
const txl = o => (o && typeof o === 'object' ? strv(o[lang]) || strv(o.en) || strv(o.es) : strv(o));
const slugOf = a => String(a || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
const pidSafe = p => String(p || '').replace(/[^A-Za-z0-9_\-.~:@+]/g, '-').slice(0, 120);
function isoWeek(dstr){   // ISO week id "2026-39"
  const d = toDate(dstr); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day + 3);
  const y = d.getFullYear(); const jan4 = new Date(y, 0, 4, 12); const w = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${y}-${pad2(w)}`;
}
const weekRange = dstr => { const d = toDate(dstr); const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const sun = new Date(mon); sun.setDate(mon.getDate() + 6); return `${fmtDay(ymd(mon))} – ${fmtDay(ymd(sun))}`; };
const splitAddr = a => { const m = String(a || '').trim().match(/^(\d+[A-Za-z]?)\s+(.+)$/); return m ? {no: m[1], street: m[2]} : {no: '', street: String(a || '').trim()}; };

  if (b.id === 'tCb') { setTab('now'); requestAnimationFrame(() => { const f = $('#dueS'); if (f) f.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: 'start'}); }); }

function goNext(at, afterI){   // auto-advance: bring the next untapped door into view and put focus on its first button
  requestAnimationFrame(() => {
    let tgt = null;
    if (at === 'list') { const rows = [...document.querySelectorAll('#knock .k-list .door:not(.done)')]; tgt = rows.find(r => +r.dataset.i > (afterI == null ? -1 : afterI)) || rows[0] || null; }
    if (!tgt) tgt = $('#kNow');
    if (!tgt) return;
    const view = at !== 'list' && $('.cbask') ? $('.cbask') : tgt;   // keep the "Come back…" question in view too
    view.scrollIntoView({behavior: RM ? 'auto' : 'smooth', block: at === 'list' ? 'center' : 'start'});
    const f = tgt.querySelector('.d-btns button:not([disabled])'); if (f) f.focus({preventScroll: true});
    if (!RM) { tgt.classList.remove('flash'); void tgt.offsetWidth; tgt.classList.add('flash'); }

const focusSoon = sel => requestAnimationFrame(() => { const f = document.querySelector(sel); if (f) f.focus(); });
$('#knock').addEventListener('click', async ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (longFired) { longFired = false; ev.preventDefault(); return; }   // the long press already opened "Don't knock again"
  const at = b.closest('#kNow') ? 'now' : 'list';
  if (b.dataset.r) {
    if (b.dataset.r === 'booked') { bookingPid = b.dataset.pid; bookingAt = at; booking = {day: null, time: null}; dnkAsk = null; renderKnock(); focusSoon('.book button'); return; }
    await tapDoor(b.dataset.pid, b.dataset.r, null, at);
  } else if (b.dataset.undo) await undoDoor(b.dataset.undo);
  else if (b.dataset.proof) openSheet('proof:' + b.dataset.proof, b);
  else if (b.dataset.more) { dnkAsk = {pid: b.dataset.more, at}; bookingPid = null; renderKnock(); focusSoon('.dnkask button'); }
  else if (b.dataset.dnk === 'go') await markDnk(b.dataset.pid);
  else if (b.dataset.dnk === 'cancel') { dnkAsk = null; renderKnock(); }
  else if (b.dataset.dnkUndo) await undoDnk();
  else if (b.dataset.cb) await comeBack(b.dataset.cb);
  else if (b.dataset.kview) { kView = b.dataset.kview; try { localStorage.setItem('hmp-app-kview', kView); } catch (e) { /* fine */ } renderKnock(); focusSoon('#kView' + kView[0].toUpperCase() + kView.slice(1)); }
  else if (b.id === 'kAsk') openRH(K().emptyQ, true);
  else if (b.id === 'kPrint') PrintWalk.open(b);
  else if (b.closest('[data-pick]')) { const k = b.closest('[data-pick]').dataset.pick; booking[k] = b.dataset.v; renderKnock(); focusSoon(`.book [data-pick="${k}"] [data-v="${b.dataset.v}"]`); }
  else if (b.dataset.book === 'cancel') { bookingPid = null; renderKnock(); }
  else if (b.dataset.book === 'save' && booking.day && booking.time) { const pid = bookingPid; bookingPid = null; await tapDoor(pid, 'booked', {...booking}, bookingAt); }
});

function refused(e){ return e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked'); }
const LORDER = s => LEAD_STAGES.indexOf(s);
function noteQueued(msg){ const n = Date.now(); if (n - queuedToastAt > 45000) { queuedToastAt = n; appToast(msg || V().queuedTap); } }
async function tapDoor(pid, result, book, at){
  const m = walkModel(); if (!m || !DB) return;
  const i = m.stops.findIndex(s => s.pid === pid); if (i < 0) return;
  const s = m.stops[i], x = m.st[i], date = m.date, ts = nowIso();
  const prev = doorDocs[pid] || null;
  const hist = Array.isArray(prev && prev.history) ? prev.history.slice(-8) : [];
  const pass = x.attempt > 3 ? 3 : x.attempt;
  const k = K(), kind = m.kind;
  const when = book ? `${toDate(book.day).toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'}).replace(',', '')}, ${(() => { const h = +book.time.slice(0, 2); return (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'); })()}` : '';
  const body = {date, pid, address: s.address, city: s.city, result, pass, at: ts, by: 'FilthE', history: [...hist, {result, pass, at: ts}], goal: Math.round(numv(m.w.goal_doors) || m.stops.length)};
  if (when) body.when = when;
  setLocalDoor(pid, body);
  cbAsk = result === 'not_home' && x.attempt < 3 ? {pid, address: s.address, city: s.city, kind} : null; dnkAsk = null;
  renderKnock(); goNext(at, i);     // show the tap at once and move on to the next door
  try {
    const r1 = await save({op: 'set', path: `doors/${date}_${pid}`, body});
    const rec = {lead: null, prevLead: undefined}; let r2 = 'saved';
    if (result === 'interested' || result === 'booked') {
      const slug = slugOf(s.address); const old = leads.find(l => l.id === slug) || null;
      const src = kind === 'everyday' ? 'everyday' : 'storm';
      const stage = result === 'booked' ? 'inspection_set' : 'contacted';
      const nb = k.nextBook[kind], ni = k.nextInt[kind];
      const esWhen = book ? `${toDate(book.day).toLocaleDateString('es-US', {weekday: 'short', day: 'numeric', month: 'short'}).replace(',', '')}, ${when.split(' ').slice(-2).join(' ')}` : '';
      const next = result === 'booked' ? {en: `${nb[0]} ${when}`, es: `${nb[1]} ${esWhen}`, due: book.day} : {en: ni[0], es: ni[1], due: addDays(todayStr(), 1)};
      const lead = old ? clone(old) : {address: s.address, city: s.city, source: src, type: src === 'storm' ? 'insurance' : 'cash', stage: 'not_contacted', notes: '', doors_visits: [], created_at: ts};
      delete lead.id;
      if (LORDER(stage) > LORDER(lead.stage) || lead.stage === 'lost' || !LEAD_STAGES.includes(lead.stage)) lead.stage = stage;
      lead.next_step = next; lead.doors_visits = [...(Array.isArray(lead.doors_visits) ? lead.doors_visits : []), {date, result, pass, at: ts}].slice(-20);
      lead.last_contact = ts; lead.updated_at = ts; lead.updated_by = 'Today’s knock';
      if (result === 'booked' && book) lead.appt = {kind: kind === 'everyday' ? 'estimate' : 'inspection', day: book.day, time: book.time || null, at: ts};   // v22: the calendar reads it
      r2 = await save({op: 'set', path: 'leads/' + slug, body: lead});
      rec.lead = slug; rec.prevLead = old ? (({id, ...rest}) => rest)(old) : null;
    }
    const u = undoLog.get(pid) || []; u.push(rec); undoLog.set(pid, u);
    const q = r1 === 'queued' || r2 === 'queued';
    if (rec.lead) { if (q) queuedToastAt = Date.now();   // v17: price it; v22: a booking also offers "Add to calendar"
      const lb = leads.find(x => x.id === rec.lead) || {}, ap = result === 'booked' && book ? {kind: kind === 'everyday' ? 'estimate' : 'inspection', day: book.day, time: book.time || null} : null;
      appToast(q ? V().queuedTap : V().nudge(shortAddr(s.address), result), [{label: L().estNew, open: 'est:' + rec.lead}, ...(ap ? [{label: CT().add, href: gcalUrl(ap, Object.assign({}, lb, {address: s.address, city: s.city})), kind: 'cal'}] : [])]); }
    else if (q) noteQueued();
  } catch (e) {
    setLocalDoor(pid, prev); cbAsk = null; renderKnock();
    if (refused(e)) { CAN_EDIT = false; appToast(k.readOnly); renderKnock(); } else appToast(k.saveFail);
  }
}
async function undoDoor(pid){
  const m = walkModel(); if (!m || !DB) return;
  const prev = doorDocs[pid]; if (!prev) return;
  const hist = Array.isArray(prev.history) ? prev.history.slice(0, -1) : [];
  const back = hist.length ? Object.assign({}, prev, hist[hist.length - 1], {history: hist}) : null;
  if (back) delete back.when;
  setLocalDoor(pid, back); if (cbAsk && cbAsk.pid === pid) cbAsk = null; renderKnock();
  try {
    let r = await save(back ? {op: 'set', path: `doors/${m.date}_${pid}`, body: back} : {op: 'delete', path: `doors/${m.date}_${pid}`});
    const u = undoLog.get(pid) || []; const rec = u.pop();
    if (rec && rec.lead) r = await save(rec.prevLead ? {op: 'set', path: 'leads/' + rec.lead, body: rec.prevLead} : {op: 'delete', path: 'leads/' + rec.lead});
    if (r === 'queued') noteQueued();
  } catch (e) { setLocalDoor(pid, prev); renderKnock(); appToast(refused(e) ? K().readOnly : K().saveFail); }
}
async function comeBack(key){   // "Come back at…" after a Not home: a follow-up that shows in call-backs

  if (!o) { renderKnock(); return; }
  const slug = slugOf(a.address), old = leads.find(l => l.id === slug) || null, ts = nowIso();
  const lead = old ? clone(old) : {address: a.address, city: a.city, source: a.kind === 'everyday' ? 'everyday' : 'storm', type: a.kind === 'everyday' ? 'cash' : 'insurance', stage: 'not_contacted', notes: '', doors_visits: [], created_at: ts};
  delete lead.id;
  lead.next_step = {en: `Come back ${o.label.en} (not home last time)`, es: `Regresar ${o.label.es} (no estaba la última vez)`, due: o.due};
  lead.doors_visits = [...(Array.isArray(lead.doors_visits) ? lead.doors_visits : []), {date: todayStr(), result: 'not_home', at: ts}].slice(-20);
  lead.updated_at = ts; lead.updated_by = 'Today’s knock';
  renderKnock();
  try { const r = await save({op: 'set', path: 'leads/' + slug, body: lead}); appToast(V().cbSaved(shortAddr(a.address), o.label[lang])); if (r === 'queued') noteQueued(); renderAppSoon(); }
  catch (e) { appToast(refused(e) ? K().readOnly : K().saveFail); }
}
async function markDnk(pid){   // "Don't knock again": stored in dnk/<address-slug>, hidden from every walk after this
  const m = walkModel(); const s = m && m.stops.find(x => x.pid === pid); dnkAsk = null;

  const slug = slugOf(s.address), body = {address: s.address, city: s.city, at: nowIso(), by: 'FilthE', list_id: strv(m.w.list_id)};
  lastDnk = slug; bookingPid = null; if (cbAsk && cbAsk.pid === pid) cbAsk = null;
  try { const r = await save({op: 'set', path: 'dnk/' + slug, body}); appToast(V().dnkSaved(shortAddr(s.address))); if (r === 'queued') noteQueued(); }
  catch (e) { lastDnk = null; appToast(refused(e) ? K().readOnly : K().saveFail); }

}
async function undoDnk(){

  try { const r = await save({op: 'delete', path: 'dnk/' + slug}); if (r === 'queued') noteQueued(); } catch (e) { lastDnk = slug; appToast(refused(e) ? K().readOnly : K().saveFail); }

}

function makePrintWalk(){   // v23: built on the first "Print today's walk" tap, not at load

    const A = clock(a), B = clock(b); if (!A || !B) return '';

    return A[2] === B[2] ? t1(A) + '&ndash;' + t1(B) + '&nbsp;' + ap(B[2], l) : t1(A) + '&nbsp;' + ap(A[2], l) + '&ndash;' + t1(B) + '&nbsp;' + ap(B[2], l);
  }
  const oneTime = (h, l) => { const c = clock(h); return c ? t1(c) + '&nbsp;' + ap(c[2], l) : ''; };
  function btNote(bt, l){
    const s = tx(bt, l), i = s.indexOf(': '); if (i < 0) return '';
    const rest = s.slice(i + 2), m = l === 'es' ? /[ap]\.\s?m\.\s+(.+)$/.exec(rest) : /(?:AM|PM)\.?\s+(.+)$/.exec(rest);
    return m ? m[1] : '';

/* ---------- v16: this week's quick estimates, the same rule as hailhunter/weekly.py estimates() ---------- */

const estDay = e => { const ok = d => (/^\d{4}-\d{2}-\d{2}$/.test(d) && ymd(toDate(d)) === d ? d : null);

let fuRules;   // db system/followups (hh.py followups --export-rules): undefined = loading, null = missing
const FU_DEFAULT = Object.freeze({"version": 1, "touch_days": [2, 5, 10], "early_ok_days": 1, "touch_stages": ["not_contacted", "contacted", "inspection_set"], "booked_stages": ["inspection_set"], "created_stages": ["contacted", "inspection_set"], "closed": ["done", "lost"]});   // the engine's exported rules (no test cases): used until system/followups is written or when it fails its self-check

}

    rows.set('lead:' + it.id, {kind: 'lead', id: it.id, address: strv(it.address) || it.id, text: it.kind === 'touch' ? txl(it.reason) : txl(l && l.next_step) || txl(it.reason),

  }
  for (const x of lateLeads()) { const key = 'lead:' + x.l.id, o = rows.get(key) || {kind: 'lead', id: x.l.id, address: strv(x.l.address) || x.l.id, text: txl(x.l.next_step) || V().lateWhat, due: t0};
    o.late = x.days; if (o.due > t0) o.due = t0; rows.set(key, o); }
  for (const c of claims) { if (['paid', 'lost'].includes(c.stage)) continue; const ns = c.next_step && typeof c.next_step === 'object' ? c.next_step : null, d = ns && dayOf(ns.due);

    for (const r of receipts) rcs.append(rcLine(!r.ok ? 'no' : r.q ? 'q' : '', (r.ok ? (r.q ? '↻ ' : '✓ ') : '! ') + r.text + (r.q ? ' · ' + V().onPhone : '')));
    if (rcs.children.length) li.append(rcs);
    if (retry) appToast(V().kingResent);
    if (receipts.length) renderAppSoon();
    kcTurns.push({role: 'assistant', content: reply + (done.length ? ' [Did: ' + done.join('; ') + ']' : '')});
    kcSet(false, '');
  } catch (e) {
    const code = e && e.code; if (kcTurns.length && kcTurns[kcTurns.length - 1].role === 'user') kcTurns.pop();
    if (!KING_SOFT.includes(code) && !(e && e.text)) {   // no signal: keep the message on this phone and resend it later
      const tries = ((retry && retry.tries) || 0) + 1;
      if (tries <= 3) { outbox.push({op: 'king', path: 'king', text: message, tries, id: 'k' + Date.now().toString(36), queuedAt: (retry && retry.queuedAt) || nowIso()}); obSave(); kingNextAt = Date.now() + [15000, 45000, 120000][tries - 1]; flushSoon(); p.textContent = V().queuedKing; }
      else { p.textContent = V().kingGaveUp; $('#kcInput').value = message; }
    } else {
      const why = code === 'cancelled' ? L().kcStopped : kingErr(e);
      p.textContent = (e && e.text) ? e.text + ' (' + why + ')' : why;
    }
    kcSet(false, '');
  } finally { kcBusy = false; }
}

async function connect(){
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { prices = null; takeoffRules = null; dbState = 'off'; appState = 'off'; setLive('off', L().live.preview); renderApp(); return; }
  let db = null; try { db = await cl.use('db'); } catch (e) { db = null; }
  if (!db) { prices = null; takeoffRules = null; dbState = 'off'; appState = 'off'; setLive('off', L().live.na); renderApp(); return; }
  setLive('wait', L().live.loading); DB = db;
  try {
    subscribeApp(db);
  } catch (e) { dbState = 'off'; appState = 'err'; setLive('off', L().live.na); renderApp(); return; }
  try { const u = await cl.use('user'); CAN_EDIT = u ? await u.canEdit() : false; } catch (e) { CAN_EDIT = false; }
  try { SAMPLE = await cl.use('sample'); } catch (e) { SAMPLE = null; }
  try { ASSETS = CAN_EDIT ? await cl.use('assets') : null; } catch (e) { ASSETS = null; }
  $('#kingChat').hidden = !(SAMPLE && CAN_EDIT); $('#rhBtn').hidden = !(SAMPLE && CAN_EDIT); document.body.classList.toggle('rh-on', !!(SAMPLE && CAN_EDIT));   // v24: one Right Hand button on every screen (v24.1: docked on the tab bar)
  renderAppSoon();   // v23: joins the first data snapshots in one redraw instead of drawing the empty page again
  if (outbox.length) flushSoon(400);   // taps saved on this phone during a bad signal go out now
}
function subscribeApp(db){
  const fail = () => { if (appState !== 'on') { appState = 'err'; dbState = 'off'; setLive('off', L().live.lost); } renderAppSoon(); };
  const ok = () => { if (appState !== 'on') { appState = 'on'; dbState = 'on'; refreshLive(); } };
  const list = snap => snap.docs.filter(d => d.exists).map(d => Object.assign({}, d.data(), {id: d.id}));
  const sig = {}, changed = (k, v) => { const j = JSON.stringify(v); if (sig[k] === j) return false; sig[k] = j; return true; };   // identical snapshots redraw nothing
  const bump = () => { dataVer++; renderAppSoon(); };
  db.collection('leads').onSnapshot(s => { ok(); leadsSeen = true; const v = list(s); if (changed('leads', v)) { leadsRaw = v; applyOverlay(); } else renderAppSoon(); }, fail);
  db.collection('claims').onSnapshot(s => { ok(); const v = list(s); if (changed('claims', v)) { claimsRaw = v; applyOverlay(); } else renderAppSoon(); }, fail);
  db.doc('today/walk').onSnapshot(s => { ok(); const v = s.exists ? s.data() : null; if (changed('walk', v)) { todayWalkDoc = v; refreshWalk(); bump(); } else renderAppSoon(); }, fail);
  // v24: hot zones (hh.py zones) and one walk per zone; today/walk stays the fallback
  db.doc('zones/current').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('zones', v)) { zonesDoc = v; refreshWalk(); bump(); } }, () => {});
  db.collection('walks').onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && Array.isArray(v.stops)) o[d.id] = v; } if (changed('walks', o)) { walksById = o; refreshWalk(); bump(); } }, () => {});
  db.doc('reviews/' + todayStr()).onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('review', v)) { reviewDoc = v; bump(); } }, () => {});
  db.doc('system/followups').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('fu', v)) { fuRules = v; bump(); } }, () => { if (fuRules === undefined) fuRules = null; });
  { const mon = weekMonday(todayStr()), sun = addDays(mon, 6);   // v18: this ISO week's taps, for the answer rate (today's come from doorDocs); v19: 8 weeks back, for the streak
    db.collection('doors').where('date', '>=', addDays(mon, -56)).where('date', '<=', sun).onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && v.pid) o[d.id] = v; } if (changed('wkdoors', o)) { weekDoorRaw = o; bump(); } }, () => {}); }
  db.collection('doors').where('date', '==', todayStr()).onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && v.pid) o[pidSafe(v.pid)] = v; } if (changed('doors', o)) { doorRaw = o; mergeDoors(); bump(); } }, () => {});
  db.collection('dnk').onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v) o[d.id] = v; } if (changed('dnk', o)) { dnkRaw = o; applyOverlay(); } }, () => {});
  db.collection('evidence').onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && numv(v.hail_in) != null) o[d.id] = v; } if (changed('ev', o)) { evidence = o; bump(); } }, () => {});
  const t0 = todayStr();
  db.doc('stats/week-' + isoWeek(t0)).onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('wk', v)) { weekDoc = v; bump(); } }, () => {});
  db.doc('stats/week-' + isoWeek(addDays(t0, -7))).onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('lw', v)) { lastWeekDoc = v; bump(); } }, () => {});
  db.doc('stats/streak').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('streak', v)) { streakDoc = v; bump(); } }, () => {});   // v19
  db.doc('system/prices').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('prices', v)) { prices = v; if (openRef && openRef.startsWith('est:')) renderSheet(); if (HO.isOpen()) HO.render(); } },
    () => { if (prices === undefined) { prices = null; if (openRef && openRef.startsWith('est:')) renderSheet(); } });
  db.doc('system/takeoff').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('takeoff', v)) { takeoffRules = v; if (openRef && openRef.startsWith('ord:')) renderSheet(); } },   // v22
    () => { if (takeoffRules === undefined) { takeoffRules = null; if (openRef && openRef.startsWith('ord:')) renderSheet(); } });
  db.doc('system/supplements').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('supp', v)) { suppDoc = v; if (openRef && openRef.startsWith('claim:')) renderSheet(); } }, () => {});   // v24 · T85 (optional)
  db.doc('system/city_rules').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('city', v)) { cityDoc = v; bump(); } }, () => {});   // v24 · T123 (optional)
  db.doc('system/followup_scripts').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('fs', v)) { fsDoc = v; bump(); } }, () => {});   // v24 · T134 (optional)
  db.doc('meta/guide').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('guide', v)) { guideDoc = v; bump(); } }, () => {});
}

if (bossOn) { document.body.classList.add('bossmode'); $('#boss').hidden = false; if (lang !== 'es') { bossPrevLang = lang; lang = 'es'; applyStatic(); } }

renderSync();
setInterval(() => { if (!document.hidden) { renderApp(false); refreshLive(); } }, 30000);   // due dates, "x min ago"
})();

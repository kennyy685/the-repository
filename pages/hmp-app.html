<title>HMP App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" media="print" id="hmpFonts">
<script>/* v23: the brand fonts never hold up the first paint on a bad signal: the page shows in the phone's own font, then swaps */(()=>{const l=document.getElementById('hmpFonts');if(!l)return;const on=()=>{l.media='all'};if(l.sheet)on();else{l.addEventListener('load',on);l.addEventListener('error',on);}})();</script>
<style>
:root{
  /* ================= THEME TOKENS: the whole look lives here (v24: FilthE's pick, direction A "Ledger": light, quiet, hairlines,
     orange only on the one button that matters; docs/design/references/direction-a.html). Swap these values for a new theme. ================= */
  color-scheme: light;
  /* type */
  --font-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-display:var(--font-ui); --f-body:var(--font-ui); --f-label:var(--font-mono);
  --w-head:600; --track-head:-.02em; --track-label:.06em;
  --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:17px; --t-xl:20px; --t-2xl:24px; --t-3xl:28px; --t-big:72px;
  /* space + shape (4 px steps; 14 px cards, 8 px controls; 1 px hairlines, no shadows) */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:32px;
  --r:14px; --r-sm:8px; --r-pill:999px; --bw:1px; --tap:48px; --tap-lg:64px; --nav-h:64px;
  --shadow:transparent; --lift:0 12px 32px rgba(24,25,28,.14); --shadow-sheet:0 -8px 30px rgba(24,25,28,.12);
  /* color */
  --bg:#f6f7f8; --bg2:#eef0f2; --panel:#ffffff; --panel2:#eef0f2; --line:#e3e5e8; --line2:#c9ccd1; --hover:#e6e8eb;
  --ink:#18191c; --ink2:#3d3f45; --mute:#6c6f77; --label:#5f626a;
  --hmp:#f5883a; --hmp2:#a4520f; --hmp-soft:rgba(245,136,58,.12); --hmp-line:rgba(245,136,58,.5);
  --on-accent:#1b1206; --on-ok:#ffffff; --on-crit:#ffffff; --on-warn:#1d1403; --on-ink:#ffffff;
  --crit:#c2362b; --crit-soft:#fdecea; --warn:#8f5b00; --warn-soft:#fdf3e0;
  --m-in:#1f7a4d; --m-in-soft:#e6f4ec; --m-mort:#8a6100; --m-mort-soft:#fbf1dc;
  --chat2:var(--hmp); --board:#f5883a; --board-soft:rgba(245,136,58,.13);
  --working:#1f7a4d; --idle:#8a8d94; --sleeping:#8a8d94; --waiting:#8f5b00; --blocked:#c2362b; --done:#1f7a4d;
  --track:#e3e5e8; --scrim:rgba(24,25,28,.42); --ph-cap:rgba(24,25,28,.72); --ph-cap-ink:#ffffff;
  --nav-bg:color-mix(in srgb,#ffffff 94%,transparent); --bar-bg:color-mix(in srgb,#f6f7f8 90%,transparent);
  /* maps: hot-zone heat (1 = warm, 5 = hottest), streets, you */
  --map-bg:#eef0f2; --map-street:#c3c6cc; --map-label:#3d3f45; --map-you:#2f6fd6; --map-house:#6c6f77;
  --heat-1:#f3d9b8; --heat-2:#f2b77f; --heat-3:#f5883a; --heat-4:#e0602b; --heat-5:#c2362b;
}
/* the earlier "HMP Pro Dark" look, kept only for a viewer who picks dark explicitly (light is FilthE's default) */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1f2024; --bg2:#26272b; --panel:#2a2b2f; --panel2:#35363b; --line:#3b3c41; --line2:#55575e; --hover:#404145;
  --ink:#f2f3f5; --ink2:#d6d8dc; --mute:#b9bcc2; --label:#c9ccd2;
  --hmp2:#ffa766; --hmp-soft:rgba(245,136,58,.15); --on-ok:#08130f; --on-crit:#1b0806; --on-ink:#18191c;   /* v24.1: --ink is near-white here, so text on it is dark */
  --crit:#ef5d50; --crit-soft:rgba(239,93,80,.15); --warn:#f5b53a; --warn-soft:rgba(245,181,58,.13);
  --m-in:#4cc38a; --m-in-soft:rgba(76,195,138,.15); --m-mort:#d9a53a; --m-mort-soft:rgba(217,165,58,.15);
  --working:#4cc38a; --waiting:#f5b53a; --blocked:#ef5d50; --done:#4cc38a;
  --track:#3b3c41; --scrim:rgba(10,10,12,.7); --lift:0 14px 36px rgba(0,0,0,.5); --shadow-sheet:0 -8px 30px rgba(0,0,0,.5);
  --nav-bg:#18191c; --bar-bg:#1f2024; --map-bg:#1a1b1e; --map-street:#55575e; --map-label:#d6d8dc; --map-you:#7fb2ff; --map-house:#b9bcc2;
}
/* v24.1: a phone or Mac set to dark (and no explicit pick) gets the same dark tokens */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#1f2024; --bg2:#26272b; --panel:#2a2b2f; --panel2:#35363b; --line:#3b3c41; --line2:#55575e; --hover:#404145;
  --ink:#f2f3f5; --ink2:#d6d8dc; --mute:#b9bcc2; --label:#c9ccd2;
  --hmp2:#ffa766; --hmp-soft:rgba(245,136,58,.15); --on-ok:#08130f; --on-crit:#1b0806; --on-ink:#18191c;
  --crit:#ef5d50; --crit-soft:rgba(239,93,80,.15); --warn:#f5b53a; --warn-soft:rgba(245,181,58,.13);
  --m-in:#4cc38a; --m-in-soft:rgba(76,195,138,.15); --m-mort:#d9a53a; --m-mort-soft:rgba(217,165,58,.15);
  --working:#4cc38a; --waiting:#f5b53a; --blocked:#ef5d50; --done:#4cc38a;
  --track:#3b3c41; --scrim:rgba(10,10,12,.7); --lift:0 14px 36px rgba(0,0,0,.5); --shadow-sheet:0 -8px 30px rgba(0,0,0,.5);
  --nav-bg:#18191c; --bar-bg:#1f2024; --map-bg:#1a1b1e; --map-street:#55575e; --map-label:#d6d8dc; --map-you:#7fb2ff; --map-house:#b9bcc2;
}}
html,body{background:var(--bg);}
body{color:var(--ink);font:15px/1.5 var(--f-body);}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.eyebrow{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;padding:7px 10px;background:var(--bg2);border:2px solid var(--line);color:var(--ink2)}
.live .dot{width:8px;height:8px;background:var(--mute);flex:none}
.live[data-state="on"] .dot{background:var(--working);animation:blink 1.4s steps(2,end) infinite}
.live[data-state="off"] .dot{background:var(--blocked)}
@keyframes blink{50%{opacity:.25}}




.btn{background:var(--panel2);border:2px solid var(--line2);padding:7px 12px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.btn:hover{background:var(--hover)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.sm{padding:4px 8px;box-shadow:none}
:focus-visible{outline:2px solid var(--chat2);outline-offset:2px}


.panel{background:var(--panel);border:2px solid var(--line);padding:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 .src{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--mute)}
.now{background:var(--bg2);border-left:3px solid var(--c);padding:8px 10px}



/* answers, receipts, memory */
/* talk to the King */
.kingchat{display:grid;gap:10px;border-color:var(--hmp-line)}
.kingchat h2{color:var(--hmp);margin:0}
.kc-log{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:320px;overflow:auto}
.kc-log:empty{display:none}
.kc-log li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;font-size:14px}
.kc-log .who{font-family:var(--f-label);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding-top:3px;color:var(--mute)}
.kc-log li.king .who{color:var(--hmp)}
.kc-log p{margin:0;color:var(--ink)}
.kc-log .did{grid-column:2;font-size:12px;color:var(--done)}
.kc-form{display:flex;gap:8px;flex-wrap:wrap}
.kc-form input{flex:1 1 220px;min-width:0;background:var(--bg);border:2px solid var(--line2);color:var(--ink);padding:8px 10px;font:inherit;font-size:15px}
.kc-status{font-size:13px;color:var(--mute);min-height:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= HMP App shell: header, language, tabs ================= */
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hmpmark{display:inline-flex;flex-direction:column;align-items:stretch;margin-right:.2em;vertical-align:bottom}
.hmpmark svg{display:block;width:100%;height:.32em;overflow:visible;margin-bottom:.05em}
.hmpmark b{font-weight:700;letter-spacing:.05em}
h1 .w-app{color:var(--hmp)}
.lang{display:inline-flex;border:2px solid var(--line)}
.lang button{min-width:48px;min-height:40px;background:var(--bg2);border:0;font-family:var(--f-label);font-size:12px;letter-spacing:.04em;cursor:pointer;color:var(--ink2)}
.lang button+button{border-left:2px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--hmp)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;background:var(--bg2);border:0;border-right:2px solid var(--line);font:700 15px/1.1 var(--f-body);color:var(--ink2);cursor:pointer;min-width:0}
.tabs button:last-child{border-right:0}
@media (max-width:460px){.tabs button{font-size:14px;padding-inline:2px}}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hmp)}
.tabs .bd{font:400 11px/1 var(--f-label);letter-spacing:.03em;color:var(--mute);min-height:11px;white-space:nowrap}
.tabs .bd.hot{color:var(--board)} .tabs .bd.crit{color:var(--crit)}
.tabp{display:grid;gap:14px;min-width:0}
.kslot{display:contents}
.a-banner{padding:10px 14px;background:var(--bg2);border-left:3px solid var(--line2);font-size:14px;color:var(--ink2)}
.a-banner.bad{border-left-color:var(--crit)}
.kc-form input{min-height:48px}
.kc-form .btn{min-height:48px;padding-inline:16px}
.kc-log .did.no{color:var(--warn)}

/* ================= app building blocks ================= */
.a-sec{background:var(--panel);border:2px solid var(--line);padding:14px;display:grid;gap:12px;min-width:0;align-content:start}
.ah{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.ah .n{font:700 12px/1 var(--f-body);padding:4px 8px;background:var(--panel2);color:var(--ink2)}
.ah .n:empty{display:none}
.ah small{font:400 13px/1.3 var(--f-body);color:var(--mute)}
.a-chip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--f-body);padding:5px 8px;white-space:nowrap;letter-spacing:.02em;background:var(--hmp-soft);color:var(--hmp2);flex:none}
.a-chip.crit{background:var(--crit-soft);color:var(--crit)}
.a-chip.warn{background:var(--warn-soft);color:var(--warn)}
.a-chip.plain{background:var(--track);color:var(--ink2)}
.a-chip.paid{background:var(--m-in-soft);color:var(--m-in)}
.a-chip.lost{background:var(--track);color:var(--mute)}
.a-chip.src{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2);font-weight:600}
.linkbtn{background:none;border:0;color:var(--hmp2);font-weight:700;font-size:15px;padding:10px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.say{display:grid;gap:6px;justify-items:start;background:var(--bg2);border-left:3px solid var(--hmp);padding:10px 12px;max-width:62ch}
.say b{font-family:var(--f-label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--hmp);font-weight:400}
.say q{font-size:16px;color:var(--ink)}
.say .btn{min-height:40px}
.a-empty{background:var(--panel);border:2px dashed var(--line2);padding:18px 16px;display:grid;gap:14px}
.a-empty h3{margin:0;font:700 24px/1.1 var(--f-display);text-wrap:balance}
.a-empty p{margin:0;color:var(--ink2);max-width:60ch;font-size:16px}
.a-quiet{margin:0;color:var(--mute);font-size:15px}

/* today */
.t-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.t-date{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.t-sum{font-size:15px;color:var(--ink2)}
.t-sum b{color:var(--ink)} .t-sum b.crit{color:var(--crit)} .t-sum b.hot{color:var(--board)}
.today{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.today{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.t-col{display:grid;gap:14px;min-width:0}
.fu{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fu button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--bg2);border:2px solid var(--line);padding:10px 12px;min-height:56px;cursor:pointer}
.fu button:hover{border-color:var(--line2)}
.fu .addr{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.fu .kind{font-family:var(--f-label);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-left:8px}
.fu .what{grid-column:1 / -1;font-size:15px;color:var(--ink2);overflow-wrap:anywhere}
.fu.later button{min-height:0;border-style:dashed}
.wk{display:grid;gap:10px}
.wk-row{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) 48px;gap:10px;align-items:center}
.wk-l{font-size:15px;color:var(--ink2)}
.wk-b{height:14px;background:var(--track);position:relative}
.wk-b i{position:absolute;left:0;top:0;bottom:0;background:var(--hmp);border-radius:0 4px 4px 0}
.wk-v{font:700 24px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.wk-sub{grid-column:1 / -1;margin:-6px 0 0;font-size:12px;line-height:1.3;color:var(--label);text-align:right;font-variant-numeric:tabular-nums}
.wk-sub .mk{white-space:nowrap} .wk-sub b{color:var(--warn);font-weight:700}
.wk-b .wk-norm{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--mute);border-right:1px dashed var(--mute);pointer-events:none}   /* v18: the 20-40% normal band */
.wk-note{grid-column:1 / -1;margin:-6px 0 0;font-size:12px;line-height:1.35;color:var(--mute);text-wrap:pretty}
.go{display:grid;gap:8px}
.go a{display:grid;gap:2px;padding:12px 14px;background:var(--bg2);border:2px solid var(--line);color:var(--ink);text-decoration:none;min-height:60px;align-content:center}
.go a:hover{border-color:var(--hmp)}
.go a b{font-size:16px} .go a b::after{content:" ↗";color:var(--hmp)}
.go a span{font-size:13px;color:var(--mute)}

/* leads */
.fbar{display:grid;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:2px solid var(--line)}
.seg button{min-height:48px;background:var(--bg2);border:0;border-right:2px solid var(--line);font:700 15px/1.1 var(--f-body);color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--hmp)}
.seg button small{font:400 11px/1 var(--f-label);color:var(--mute);margin-left:6px}
.srcf{display:flex;flex-wrap:wrap;gap:6px}
.srcf button{min-height:42px;padding:6px 14px;background:var(--bg2);border:2px solid var(--line);font:600 14px/1 var(--f-body);color:var(--ink2);cursor:pointer}
.srcf button[aria-pressed="true"]{border-color:var(--hmp);color:var(--ink);background:var(--hmp-soft)}
.a-cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:860px){.a-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:fl}
.flow li{counter-increment:fl;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px 4px 4px;background:var(--bg2);color:var(--ink2)}
.flow li::before{content:counter(fl);width:20px;height:20px;display:grid;place-items:center;font:700 12px/1 var(--f-display);background:var(--track);color:var(--ink2)}

/* cards (leads, claims, cash jobs) */
.a-card{display:grid;gap:10px;align-content:start;text-align:left;width:100%;cursor:pointer;background:var(--panel);border:2px solid var(--line);padding:14px;color:var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.a-card:hover{border-color:var(--line2)}
.a-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.a-card > span{display:block;min-width:0}
.c-top{display:flex!important;justify-content:space-between;align-items:flex-start;gap:10px}
.c-top > span:first-child{min-width:0}
.c-addr{display:block;font:700 21px/1.1 var(--f-display);overflow-wrap:anywhere}
.c-meta{display:block;font-size:14px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.c-meta:empty{display:none}
.c-meta .clm{color:var(--ink2);font-weight:700}
.c-meta .nw{white-space:nowrap}
.c-tags{display:flex!important;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.a-card.compact{gap:8px;padding-block:12px}
.a-card.compact .c-addr{font-size:18px}
.c-line{font-size:14px;color:var(--mute)}
.c-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.a-track{display:grid!important;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:3px}
.a-track i{display:block;height:8px;background:var(--track)}
.a-track i.done{background:var(--ink2)}
.a-track i.now{background:var(--hmp);box-shadow:0 0 0 2px var(--hmp-soft)}
.a-track.paid i{background:var(--m-in)}
.a-track.lost i{background:var(--track)}
.track-lbl{display:flex!important;justify-content:space-between;gap:4px 8px;font-size:13px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.track-lbl b{color:var(--ink)}
.a-next{display:grid!important;gap:6px;background:var(--bg2);padding:10px 12px;border-left:3px solid var(--line2)}
.a-next.overdue{background:var(--crit-soft);border-left-color:var(--crit)}
.a-next .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.a-next .lbl > b{font:400 10px/1.4 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.a-next .txt{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.a-next .txt.none{color:var(--mute);font-style:italic}
.c-money{display:grid!important;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;border-top:1px solid var(--line);padding-top:10px}
.c-money.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.c-money .k{display:flex;align-items:center;gap:6px;font:400 10px/1.4 var(--f-label);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.c-money .v{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.c-money .parts{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.c-money .none{grid-column:1 / -1;font-size:14px;color:var(--mute)}

/* money totals (ported from the Claim Tracker) */
.money{background:var(--panel);border:2px solid var(--line);display:grid;box-shadow:4px 4px 0 var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:14px 16px 12px;display:grid;gap:4px;min-width:0;align-content:start}
.tile + .tile{border-left:1px solid var(--line)}
.tile .k{font:400 10px/1.4 var(--f-label);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.tile .v{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--mute)}
.msw{width:10px;height:10px;flex:none;display:inline-block}
.msw.in{background:var(--m-in)}
.msw.hand{background:repeating-linear-gradient(135deg,var(--m-in) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--m-in)}
.msw.mort{background:var(--m-mort)}
.msw.owed{background:var(--track);box-shadow:inset 0 0 0 1px var(--mute)}
.moneybar-wrap{padding:12px 16px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.moneybar{display:flex;gap:2px;height:14px}
.moneybar > span{display:block;height:100%;min-width:3px}
.moneybar .in{background:var(--m-in)}
.moneybar .hand{background:repeating-linear-gradient(135deg,var(--m-in) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--m-in)}
.moneybar .mort{background:var(--m-mort)}
.moneybar .owed{background:var(--track)}
.moneynote{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute)}
.moneynote span{display:inline-flex;align-items:center;gap:6px}
.moneynote b{color:var(--ink)}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3){border-left:0}
  .tile:nth-child(n+3){border-top:1px solid var(--line)}
  .tile .v{font-size:26px}
}
.a-tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px;background:var(--hmp-soft);font-size:15px}
.a-tip b{font:400 11px/1.6 var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--hmp2)}
.a-tip p{margin:0}
.a-how{display:grid;gap:10px}
.a-how h3{margin:0;font:600 18px/1.1 var(--f-display)}
.a-how .hsub{margin:0;font-size:14px;color:var(--mute)}
.strip{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));counter-reset:st}
.strip li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 10px;padding:10px 12px;background:var(--bg2);align-content:start}
.strip li::before{content:counter(st);grid-row:span 2;width:24px;height:24px;display:grid;place-items:center;font:700 14px/1 var(--f-display);background:var(--ink2);color:var(--bg)}
.strip b{font-size:15px}
.strip span{font-size:14px;color:var(--mute);line-height:1.35}
.canrow{display:grid;gap:6px;font-size:14px}
.canrow p{margin:0;max-width:75ch}
details.howmore{background:var(--panel);border:2px solid var(--line);padding:12px 16px}
details.howmore summary{cursor:pointer;font:600 16px/1.3 var(--f-display);min-height:28px}
details.howmore[open] summary{margin-bottom:12px}
.a-rules{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:12px;margin:0;max-width:90ch}

/* detail sheet (ported from the Claim Tracker) */
.sheet-wrap{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--lift);border-left:2px solid var(--line);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;background:var(--panel);border-bottom:2px solid var(--line);display:grid;gap:10px}
.sh-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-eyebrow{font:400 11px/1.4 var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.sheet-head h2{margin:2px 0 0;font:700 26px/1.05 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.sh-sub{font-size:14px;color:var(--mute);margin-top:2px}
.sh-row .btn{min-height:44px;flex:none}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 36px);display:grid;gap:14px;align-content:start}
.box{background:var(--panel);border:2px solid var(--line);padding:14px 16px;display:grid;gap:10px;min-width:0}
.box h3{margin:0;font:600 17px/1.1 var(--f-display)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.steps li{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px 4px 4px;background:var(--bg2);color:var(--mute)}
.steps li i{font-style:normal;width:20px;height:20px;display:grid;place-items:center;font:700 12px/1 var(--f-display);background:var(--track);color:var(--mute)}
.steps li.done{color:var(--ink2)} .steps li.done i{background:var(--ink2);color:var(--bg)}
.steps li.now{background:var(--hmp-soft);color:var(--hmp2);font-weight:700} .steps li.now i{background:var(--hmp);color:var(--on-accent)}
.ledger{display:grid}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.lrow:first-child{border-top:0;padding-top:0}
.lrow .l{font-size:15px}
.lrow .a{font:700 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.lrow .st{grid-column:1 / -1;font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lrow .st .ok{color:var(--m-in);font-weight:700} .lrow .st .wait{color:var(--m-mort);font-weight:700}
.lrow.total .l{font-weight:700} .lrow.total .a{font-size:24px}
.lrow.sub .l{padding-left:14px;color:var(--ink2)} .lrow.sub .st{padding-left:14px}
.hopays{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--bg2);padding:10px 12px;font-weight:700}
.hopays .a{font:700 20px/1 var(--f-display);font-variant-numeric:tabular-nums}
.facts{margin:0;display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr)}
.facts dt,.facts dd{padding:8px 0;border-top:1px solid var(--line);margin:0}
.facts dt{font-size:13px;color:var(--mute);padding-right:12px}
.facts dd{font-size:15px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.facts dt:first-of-type,.facts dd:first-of-type{border-top:0;padding-top:0}
.facts .none{color:var(--mute)}
.copy{margin-left:8px;border:1px solid var(--line2);background:var(--bg2);padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:32px}
.tlx{list-style:none;margin:0;padding:0;display:grid}
.tlx li{display:grid;grid-template-columns:72px 16px minmax(0,1fr);gap:10px;align-items:start;padding-bottom:12px;position:relative}
.tlx li::after{content:"";position:absolute;left:89px;top:14px;bottom:0;width:2px;background:var(--line)}
.tlx li:last-child::after{display:none}
.tlx .d{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
.tlx .dot{width:12px;height:12px;background:var(--ink2);margin-top:4px;justify-self:center;position:relative;z-index:1}
.tlx .t{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.tlx li.cash .dot{background:var(--m-in)}
.tlx li.future .dot{background:var(--bg);box-shadow:inset 0 0 0 2px var(--hmp)}
.tlx li.future .t{color:var(--ink2)}
.tlx li.future .t small{display:block;font:400 10px/1.5 var(--f-label);color:var(--hmp2);text-transform:uppercase;letter-spacing:.06em}
.tlx li.late .dot{box-shadow:inset 0 0 0 2px var(--crit)}
.tlx li.late .t small{color:var(--crit)}
.notes{margin:0;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}
.stamp{font-size:13px;color:var(--mute);margin:0}
.taps{display:flex;flex-wrap:wrap;gap:8px}
.tap{border:2px solid var(--m-in);color:var(--m-in);background:var(--bg2);padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.tap.armed{background:var(--m-in);color:var(--on-ok)}
.tap:disabled{opacity:.5;cursor:default}
.taps-note{font-size:13px;color:var(--mute);margin:0}
.sheet-acts{display:flex;flex-wrap:wrap;gap:8px}
.sheet-acts .btn{min-height:44px}
.app-toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:700;font-size:14px;box-shadow:var(--lift);max-width:calc(100% - 32px)}

/* ================= O0 Today's knock ================= */
.knock{background:var(--panel);border:2px solid var(--hmp);box-shadow:4px 4px 0 var(--shadow);display:grid;min-width:0}
.k-txt{display:grid;gap:10px;min-width:0;align-content:start}
.k-eb{font:400 11px/1.3 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--hmp2)}
.k-area{margin:0;font:700 clamp(28px,6vw,36px)/1.02 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.k-why{margin:0;font-size:17px;line-height:1.45;color:var(--ink);max-width:52ch}
.k-facts{display:flex;flex-wrap:wrap;gap:6px}
.k-fact{font:700 14px/1 var(--f-body);padding:8px 10px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line)}
.k-fact b{color:var(--ink)}
.k-prog{display:grid;gap:6px}
.k-bar{height:12px;background:var(--track);display:flex}
.k-bar i{display:block;height:100%}
.k-bar .talk{background:var(--hmp)} .k-bar .nh{background:var(--line2)}
.k-prog span{font-size:14px;color:var(--mute)}
.k-prog span b{color:var(--ink)}
.k-map{background:var(--map-bg);border:2px solid var(--line);min-width:0}
.k-map svg{display:block;width:100%;height:auto}
.k-map figcaption{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.k-list{display:grid;gap:0}
.k-street{border-top:2px solid var(--line)}
.k-street:first-child{border-top:0}
.k-street h3{margin:0;padding:10px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;font:600 17px/1.1 var(--f-display);color:var(--ink2);background:var(--bg2)}
.k-street h3 small{font:400 11px/1 var(--f-label);letter-spacing:.04em;color:var(--mute)}
.door{display:grid;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.door:first-of-type{border-top:0}
.door-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;min-width:0}
.door-a{flex:1 1 14ch}
.door-a{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.door-a b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.door-a span{font-size:15px;color:var(--ink2);overflow-wrap:break-word}
.door-a small{font:400 10px/1.4 var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--hmp2);background:var(--hmp-soft);padding:3px 6px}
.door.next{background:linear-gradient(90deg,var(--hmp-soft),transparent 70%);box-shadow:inset 4px 0 0 var(--hmp)}
.d-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.d-btns button{min-height:56px;padding:6px 4px;border:2px solid var(--line2);background:var(--bg2);color:var(--ink);font:700 15px/1.1 var(--f-body);cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;text-align:center}
.d-btns button small{font:400 11px/1.1 var(--f-body);color:var(--mute)}
.d-btns button:active{transform:translate(1px,1px)}
.d-btns .b-no{color:var(--ink2)}
.d-btns .b-int{border-color:var(--hmp);color:var(--hmp2)}
.d-btns .b-book{border-color:var(--m-in);color:var(--m-in)}
.d-btns button:disabled{opacity:.45;cursor:default}
@media (max-width:520px){.d-btns{grid-template-columns:repeat(2,minmax(0,1fr))}.d-btns button{min-height:52px}}
.door.done{padding-block:8px}
.door.done .door-a b{font-size:18px;color:var(--ink2)}
.door.done .door-a span{color:var(--mute)}
.d-res{display:inline-flex;align-items:center;gap:6px;font:700 13px/1.2 var(--f-body);padding:5px 8px}
.d-res.not_home{background:var(--track);color:var(--ink2)}
.d-res.no{background:var(--track);color:var(--mute)}
.d-res.interested{background:var(--hmp-soft);color:var(--hmp2)}
.d-res.booked{background:var(--m-in-soft);color:var(--m-in)}
.d-right{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-left:auto}
.undo{min-height:40px;min-width:60px;flex:none;padding:6px 10px;background:none;border:2px solid var(--line2);color:var(--ink2);font:700 13px/1 var(--f-body);cursor:pointer}
.book{display:grid;gap:10px;background:var(--bg2);border:2px solid var(--m-in);padding:12px}
.book p{margin:0;font-weight:700;font-size:15px}
.book .k-l{font:400 10px/1.4 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pickrow{display:flex;flex-wrap:wrap;gap:6px}
.pickrow button{min-height:44px;min-width:56px;padding:6px 10px;border:2px solid var(--line2);background:var(--panel);color:var(--ink);font:700 14px/1.1 var(--f-body);cursor:pointer}
.pickrow button[aria-pressed="true"]{background:var(--m-in);border-color:var(--m-in);color:var(--on-ok)}
.book-acts{display:flex;gap:8px;flex-wrap:wrap}
.book-acts button{min-height:48px;padding:8px 16px;font:700 15px/1 var(--f-body);cursor:pointer;border:2px solid var(--line2);background:var(--panel);color:var(--ink)}
.book-acts .go-save{background:var(--m-in);border-color:var(--m-in);color:var(--on-ok)}
.book-acts .go-save:disabled{opacity:.45}
.k-passnote{margin:0;padding:10px 16px;background:var(--bg2);font-size:15px;color:var(--ink2);border-top:2px solid var(--line)}
.k-foot{padding:10px 16px;font-size:13px;color:var(--mute);border-top:2px solid var(--line)}
.k-empty{padding:20px 16px;display:grid;gap:12px;justify-items:start}
.k-empty h2{margin:0;font:700 26px/1.1 var(--f-display);text-wrap:balance}
.k-empty q{font-size:18px;color:var(--ink)}
.k-empty .btn{min-height:48px;padding-inline:16px}
.tally{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:15;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:0;background:var(--panel2);border:2px solid var(--hmp);box-shadow:0 -6px 18px rgba(0,0,0,.45)}
.tally .tn{display:grid;justify-items:center;align-content:center;padding:6px 4px;border-right:1px solid var(--line2);min-width:0}
.tally .tn b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tally .tn span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tally .t-acts{display:grid;gap:4px;padding:6px;align-content:center}
.tally .t-cb{background:none;border:0;color:var(--warn);font:700 12px/1.2 var(--f-body);cursor:pointer;padding:2px;min-height:24px;text-align:center}
.tally .t-cb.none{color:var(--mute)}
.tally .t-done{min-height:42px;padding:6px 12px;background:var(--hmp);color:var(--on-accent);border:0;font:700 14px/1.1 var(--f-body);cursor:pointer;white-space:nowrap}
@media (max-width:560px){.tally{grid-template-columns:repeat(4,minmax(0,1fr))}.tally .t-acts{grid-column:1 / -1;grid-template-columns:1fr auto;border-top:1px solid var(--line2);align-items:center}.tally .t-cb{text-align:left}}

/* ================= v14: sun-readable labels (QA 4): labels bright and plain, color only on values ================= */
.k-eb,.sh-eyebrow,.tile .k,.c-money .k,.a-next .lbl > b,.book .k-l,.k-street h3 small,.fu .kind,.say b,.ah small,.tally .tn span,.d-btns button small,.facts dt,.track-lbl,.lrow .st,.k-prog span,.c-line,.stamp,.a-quiet{color:var(--label)}
.k-eb,.sh-eyebrow,.tile .k,.c-money .k,.a-next .lbl > b,.book .k-l,.fu .kind,.say b{font-size:11px;letter-spacing:.07em}
/* phone: a "Step 7 of 10" chip instead of the thin segmented bar (QA 5) */
.stepchip{display:inline-block;font:700 12px/1 var(--f-body);padding:4px 7px;background:var(--panel2);color:var(--ink);margin-right:6px;white-space:nowrap}
@media (max-width:560px){.a-track{display:none!important}.track-lbl{margin-top:0}}
@media (min-width:561px){.stepchip{background:none;padding:0;color:inherit;font:inherit;margin:0 8px 0 0}}

/* header: sync chip + boss toggle */
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:flex-end}
.sync{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 10px;background:var(--warn-soft);border:2px solid var(--warn);color:var(--warn);font:700 13px/1.15 var(--f-body);cursor:pointer;text-align:left}
.sync::before{content:"";width:8px;height:8px;background:currentColor;flex:none;animation:blink 1.4s steps(2,end) infinite}
.sync.ok{background:var(--m-in-soft);border-color:var(--m-in);color:var(--m-in)}
.sync.ok::before{animation:none}
.bossbtn{min-height:36px;padding:6px 12px;background:var(--bg2);border:2px solid var(--line2);color:var(--ink);font:700 13px/1 var(--f-body);cursor:pointer}
.bossbtn[aria-pressed="true"]{background:var(--hmp);border-color:var(--hmp);color:var(--on-accent)}

/* today's knock v14: honest header, current door first, pins legend */
.k-head{display:grid;gap:6px;padding:14px 16px 10px}
.k-upd{font-size:13px;color:var(--label)}
.k-stale{margin:0;padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);color:var(--ink);font-size:15px;display:grid;gap:8px;justify-items:start}
.k-stale b{color:var(--warn)}
.k-stale .btn{min-height:40px}
.k-now{margin:0 16px 14px;padding:14px;background:var(--bg2);border:2px solid var(--hmp);display:grid;gap:10px;scroll-margin-top:84px}
.k-now-l{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;font:700 12px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.k-now .door-a b{font-size:34px}
.k-now .door-a span{font-size:18px;color:var(--ink)}
.k-now .d-btns button{min-height:64px;font-size:16px}
.k-alldone{margin:0 16px 14px;padding:14px;background:var(--m-in-soft);border-left:4px solid var(--m-in);font-size:16px}
.k-body{display:grid;gap:14px;padding:0 16px 16px;grid-template-columns:minmax(0,1fr);border-bottom:2px solid var(--line)}
@media (min-width:760px){.k-body{grid-template-columns:minmax(0,1.15fr) minmax(280px,1fr);align-items:start}}
.d-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proof{min-height:40px;padding:6px 10px;border:2px solid var(--idle);background:transparent;color:var(--idle);font:700 13px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.more{min-height:40px;min-width:40px;padding:0 8px;border:2px solid var(--line2);background:transparent;color:var(--ink2);font:700 18px/1 var(--f-body);cursor:pointer}
.cbask,.dnkask{display:grid;gap:8px;padding:12px;background:var(--panel2);border:2px solid var(--line2)}
.cbask p,.dnkask p{margin:0;font-weight:700;font-size:15px}
.cbask{margin:0 16px 12px}
.dnkask{border-color:var(--crit)}
.dnkask .go-dnk{background:var(--crit);border-color:var(--crit);color:var(--on-crit)}
.k-legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:6px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--label)}
.k-legend span{display:inline-flex;align-items:center;gap:5px}
.k-legend i{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid var(--c);background:var(--f,var(--c))}
.door.flash{animation:flash .9s ease-out}

#psView .ws-top2 .ws-d { font:800 12pt/1 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--ink); white-space:nowrap; }

#psView .ws-body { flex:1; min-height:0; overflow:hidden; padding:0.15in 0.4in 0.1in; display:flex; flex-direction:column; }
#psView .ws-top2 + .ws-body { padding-top:0.14in; }

/* summary strip: why / goal / best time */
#psView .ws-strip { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr) minmax(0,1fr); border-top:1.5pt solid var(--char-dk);
  border-bottom:0.75pt solid var(--rule); flex:none; }
#psView .ws-strip > div { padding:0.07in 0.14in 0.08in 0; min-width:0; }
#psView .ws-strip > div + div { padding-left:0.14in; border-left:0.75pt solid var(--rule); }
#psView .ws-strip .ws-k { font:700 6.6pt/1 "Montserrat"; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
#psView .ws-strip .ws-why { margin-top:0.05in; font:600 9pt/1.32 "Montserrat"; color:var(--ink); }
#psView .ws-strip .ws-v { margin-top:0.045in; font:800 21pt/1 "Barlow Semi Condensed"; color:var(--ink); white-space:nowrap; }
#psView .ws-strip .ws-v small { font:700 11pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--char); }
#psView .ws-strip .ws-v.ws-s { font-size:15pt; white-space:normal; line-height:1.05; }
#psView .ws-strip .ws-sub { margin-top:0.04in; font:600 7.4pt/1.3 "Montserrat"; color:var(--muted); }

#psView .ws-notes { list-style:none; margin-top:0.07in; display:flex; flex-direction:column; gap:0.035in; flex:none; }
#psView .ws-notes li { display:flex; gap:0.07in; align-items:flex-start; font:600 7.5pt/1.35 "Montserrat"; color:var(--char); }
#psView .ws-notes li svg { flex:none; width:0.14in; height:0.14in; margin-top:0.005in; }
#psView .ws-notes li.ws-warn { font-weight:700; color:var(--ink); }
#psView .ws-notes li.ws-fine { font:500 6.8pt/1.35 "Montserrat"; color:var(--muted); }

#psView .ws-none { margin-top:0.12in; border:1.5pt solid var(--char-dk); border-radius:5px; padding:0.12in 0.16in; flex:none; }
#psView .ws-none h2 { font:800 17pt/1 "Barlow Semi Condensed"; text-transform:uppercase; color:var(--ink); }
#psView .ws-none p { margin-top:0.05in; font:600 9pt/1.35 "Montserrat"; color:var(--char); }

/* the list: street bands + one row per house */
#psView .ws-rows { flex:none; margin-top:0.12in; }
#psView .ws-top2 + .ws-body .ws-rows { margin-top:0; }
#psView .ws-band, #psView .ws-row { display:grid; grid-template-columns:var(--cols); align-items:end; }
#psView .ws-band { margin-top:0.08in; padding:0.05in 0 0.045in; background:var(--mist); border-top:1.5pt solid var(--char-dk); border-bottom:0.75pt solid var(--char-dk); }
#psView .ws-rows > .ws-band:first-child { margin-top:0; }
#psView .ws-band .ws-st { grid-column:1 / 3; padding-left:0.08in; font:800 13pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#psView .ws-band .ws-st small { font:700 6.8pt/1 "Montserrat"; letter-spacing:.1em; color:var(--muted); margin-left:0.05in; }
#psView .ws-band .ws-ch { text-align:center; font:700 6.2pt/1.1 "Montserrat"; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); padding:0 0.02in; }
#psView .ws-band .ws-ch small { display:block; margin-top:0.02in; font:600 5.8pt/1 "Montserrat"; letter-spacing:0; text-transform:none; color:var(--muted); }
#psView .ws-band .ws-ch.ws-nt { text-align:left; padding-left:0.12in; }

#psView .ws-row { align-items:center; min-height:0.4in; padding:0.045in 0; border-bottom:0.75pt solid var(--rule); break-inside:avoid; }
#psView .ws-row .ws-seq { align-self:center; font:700 7.4pt/1 "Montserrat"; color:var(--muted); text-align:center; }
#psView .ws-row .ws-addr { min-width:0; padding-right:0.06in; display:flex; align-items:center; gap:0.08in; }
#psView .ws-row .ws-num { flex:none; font:800 19pt/0.95 "Barlow Semi Condensed"; color:var(--ink); letter-spacing:.01em; }
#psView .ws-row .ws-num.ws-full { flex:1 1 auto; min-width:0; font-size:12pt; line-height:1.05; }
#psView .ws-row .ws-meta { flex:1 1 0; min-width:0; }
#psView .ws-row .ws-addr.ws-full { flex-wrap:wrap; row-gap:0.02in; }
#psView .ws-row .ws-addr.ws-full .ws-num { flex:1 1 100%; }
#psView .ws-row .ws-l1 { display:flex; align-items:center; gap:0.04in; flex-wrap:wrap; }
#psView .ws-row .ws-city { font:700 7pt/1 "Montserrat"; text-transform:uppercase; letter-spacing:.08em; color:var(--char); }
#psView .ws-row .ws-tag { display:inline-flex; align-items:center; gap:0.03in; font:700 6.3pt/1 "Montserrat"; letter-spacing:.08em; text-transform:uppercase;
  padding:0.03in 0.055in; border-radius:2px; white-space:nowrap; }
#psView .ws-row .ws-tag.ws-pass { background:var(--ink); color:#fff; }
#psView .ws-row .ws-tag.ws-cb { border:1pt solid var(--ink); color:var(--ink); }
#psView .ws-row .ws-tag svg { width:0.09in; height:0.09in; }
#psView .ws-row .ws-l1 + .ws-hl { margin-top:0.025in; }
#psView .ws-row .ws-hl { font:500 6.6pt/1.25 "Montserrat"; color:var(--muted); }
#psView .ws-row .ws-bx { display:flex; justify-content:center; }
#psView .ws-row .ws-bx i { display:block; width:0.21in; height:0.21in; border:1.2pt solid var(--ink); border-radius:2px; background:#fff; }
#psView .ws-row .ws-nt { align-self:stretch; border-left:0.75pt solid var(--rule); margin-left:0.06in; }
#psView .ws-row.ws-blank .ws-num { display:block; width:1.9in; height:0.2in; }
#psView .ws-row.ws-pass .ws-seq { color:var(--ink); }

/* tighter rows for long walks */
#psView .ws-dense .ws-row { min-height:0.3in; padding:0.03in 0; }
#psView .ws-dense .ws-row .ws-num { font-size:15pt; }
#psView .ws-dense .ws-row .ws-num.ws-full { font-size:11pt; }
#psView .ws-dense .ws-row .ws-hl { font-size:6pt; }
#psView .ws-dense .ws-row .ws-bx i { width:0.18in; height:0.18in; }
#psView .ws-dense .ws-band { margin-top:0.06in; padding:0.04in 0 0.035in; }
#psView .ws-dense .ws-band .ws-st { font-size:12pt; }

/* tally + tell the app (last page, pinned to the bottom) */
#psView .ws-tally { margin-top:auto; padding-top:0.14in; flex:none; }
#psView .ws-tbox { border:1.5pt solid var(--char-dk); border-radius:5px; overflow:hidden; }
#psView .ws-tgrid { display:grid; grid-template-columns:1.12in repeat(4, 1fr); }
#psView .ws-tgrid .ws-h { background:var(--char-dk); color:#fff; padding:0.1in 0.12in; display:flex; flex-direction:column; justify-content:center; gap:0.04in;
  font:800 14pt/0.98 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.02em; }
#psView .ws-tgrid .ws-h small { font:600 6.4pt/1.3 "Montserrat"; text-transform:none; letter-spacing:0; color:var(--silver); }
#psView .ws-tgrid .ws-c { padding:0.08in 0.12in 0.07in; border-left:0.75pt solid var(--rule); display:flex; flex-direction:column; }
#psView .ws-tgrid .ws-c .ws-k { font:700 7.4pt/1 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
#psView .ws-tgrid .ws-c .ws-w { height:0.44in; border-bottom:1pt solid var(--ink); margin:0.03in 0.05in 0.05in 0; }
#psView .ws-tgrid .ws-c .ws-hint { font:600 6.2pt/1.25 "Montserrat"; color:var(--muted); }
#psView .ws-tell { display:flex; align-items:center; gap:0.14in; padding:0.09in 0.14in 0.1in; border-top:1pt solid var(--char-dk); background:var(--mist); }
#psView .ws-tell svg { flex:none; width:0.34in; height:0.34in; }
#psView .ws-tell .ws-k { font:700 7.4pt/1 "Montserrat"; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
#psView .ws-tell .ws-say { margin-top:0.035in; font:800 15pt/1 "Barlow Semi Condensed"; color:var(--ink); }
#psView .ws-tell .ws-sub { margin-left:auto; max-width:2.5in; font:600 7pt/1.35 "Montserrat"; color:var(--char); text-align:right; }

/* footer: light, every page */
#psView .ws-foot { flex:none; height:0.36in; margin:0 0.4in; display:flex; align-items:center; gap:0.2in; border-top:0.75pt solid var(--rule);
  font:600 7pt/1.2 "Montserrat"; color:var(--muted); }
#psView .ws-foot b { font-weight:700; color:var(--ink); }
#psView .ws-foot .ws-ph { margin-left:auto; }
#psView .ws-foot .ws-pg { font:800 10pt/1 "Barlow Semi Condensed"; text-transform:uppercase; letter-spacing:.04em; color:var(--ink); }#psView .ws-row.ws-did .ws-num{color:var(--muted)}

@media (max-width:860px){#psView .ws-page{margin:12px auto}}
@page wsheet{size:letter;margin:0}
@media print{
  body.ps-on > :not(#psView){display:none!important}
  html:has(body.ps-on),body.ps-on{background:#fff!important;overflow:visible!important;height:auto!important;padding:0!important}
  #psView{position:static;inset:auto;overflow:visible;background:#fff}
  #psView .ws-bar,#psView .ws-note,#psView .ws-shint{display:none!important}
  #psPages{transform:none!important;height:auto!important;width:auto!important;margin:0!important}
  #psView .ws-page{margin:0;box-shadow:none;break-after:page;page:wsheet}
  #psView .ws-page:last-child{break-after:auto}
}

/* ================= v19: Next-step coach, why this house, knock streak, estimate extras ================= */
.ns{background:var(--panel);border:2px solid var(--hmp);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.ns.fin{border-color:var(--m-in)}
.ns-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ns-of{font:600 12px/1.2 var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--label);font-variant-numeric:tabular-nums}
.ns.fin .ns-of{color:var(--m-in)}
.ns-finp{margin:0;color:var(--ink2);font-size:15px}
.ns-name{margin:0;font:700 26px/1.05 var(--f-display);text-wrap:balance}
.ns-lb,.ns-say b,.ns-must b,.ns-tip b,.ns-info b{display:block;font:600 11px/1.3 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--label);margin-bottom:4px}
.ns-say{background:var(--bg2);border-left:3px solid var(--hmp);border-radius:var(--r-sm);padding:10px 12px}
.ns-say q{display:block;font-size:17px;line-height:1.45;color:var(--ink);quotes:"“" "”"}
.ns-sec{display:grid;min-width:0}
.ns-ask{margin:0;padding:0 0 0 18px;display:grid;gap:6px;font-size:15px;line-height:1.4}
.ns-ask li::marker{color:var(--hmp)}
.ns-ask small{display:block;font-size:13px;color:var(--mute);font-style:italic}
.ns-tip{margin:0;padding:8px 12px;background:var(--bg2);border-radius:var(--r-sm);font-size:14px;line-height:1.4;color:var(--ink2)}
.ns-tip b{color:var(--hmp2)}
.ns-ck{list-style:none;margin:0;padding:0;display:grid}
.ns-it{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ns-it:first-child{border-top:0;padding-top:2px}
.ns-it .chk{width:36px;height:36px;font-size:18px}
.ns-it.on .chk{background:var(--m-in);border-color:var(--m-in)}
.ns-it:not(.on) .chk:disabled{opacity:.55}
.ns-it.must:not(.on) .chk{border-color:var(--warn)}
.ns-itt{display:grid;gap:4px;min-width:0;padding-top:7px;font-size:15px;line-height:1.35}
.ns-it.on .ns-itt > span:first-child{color:var(--ink2)}
.ns-val{font-size:13px;color:var(--label);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ns-hint{margin:0;font-size:13px;color:var(--mute)}
.ns-hint.warn{color:var(--warn);font-weight:700}
.ns-tell{padding:2px 0;min-height:32px;font-size:14px}
.ns-opt button{min-height:44px;min-width:72px}
.ns-it .ph-file{justify-self:start}
.ns-txt{display:grid;gap:6px;padding:10px 12px;background:var(--bg2);border-radius:var(--r-sm)}
.ns-txt b{font:600 12px/1.3 var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--label)}
.ns-ok{font-size:13px;color:var(--m-in);font-weight:700}
.ns-msg{margin:0;font-size:14px;line-height:1.4;color:var(--ink2);user-select:text;overflow-wrap:anywhere}
.ns-acts{display:flex;flex-wrap:wrap;gap:8px}
.ns-acts .btn{min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
.ns-info{margin:0;padding:8px 12px;border:1px dashed var(--line2);border-radius:var(--r-sm);font-size:14px;line-height:1.4;color:var(--ink2)}
.ns-cancel{border-style:solid;border-color:var(--line2);color:var(--ink);font-weight:600}
.ns-must{margin:0;padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:var(--r-sm);font-size:14px;line-height:1.45;color:var(--ink)}
.ns-must b{color:var(--warn)}
.ns-pick{display:grid;gap:8px;padding:12px;background:var(--bg2);border-radius:var(--r-sm)}
.ns-pick p{margin:0;font:700 17px/1.2 var(--f-display)}
.ns-pick .k-l{font:600 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.ns-done{width:100%;min-height:58px;padding:10px 16px;border:0;border-radius:var(--r-sm);background:var(--hmp);color:var(--on-accent);font:700 21px/1.1 var(--f-display);letter-spacing:.01em;cursor:pointer}
.ns-done:hover{background:var(--hmp2)}
.ns-done:disabled{background:var(--track);color:var(--mute);cursor:default}
.ns-done:focus-visible,.nm button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ns-then{margin:-4px 0 0;font-size:13px;color:var(--mute);text-align:center}
/* Today: your next moves */
.nm{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nm button{width:100%;text-align:left;display:grid;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;color:var(--ink)}
.nm button:hover{border-color:var(--hmp)}
.nm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--hmp);color:var(--on-accent);font:700 14px/1 var(--f-display);flex:none}
.nm-s{font:700 18px/1.1 var(--f-display);flex:1 1 auto}
.nm-a{font-size:15px;color:var(--ink2);overflow-wrap:anywhere}
.nm-do{font-size:13px;color:var(--label)}
/* Today's knock: why this house */
.d-why{flex-basis:100%;font:600 14px/1.3 var(--f-body);color:var(--hmp2);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.k-now .d-why{font-size:16px}
.door.done .d-why{color:var(--mute);font-weight:500}
/* week box: knock streak */
.wk-streak{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:0 0 12px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.st-now{display:flex;align-items:baseline;gap:10px;min-width:0}
.st-now b{font:700 40px/1 var(--f-display);color:var(--hmp);font-variant-numeric:tabular-nums}
.st-now span{font-size:15px;color:var(--ink2)}
.st-best{display:grid;justify-items:end;gap:2px}
.st-best span{font:600 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.st-best b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.st-sub{grid-column:1 / -1;margin:0;font-size:13px;line-height:1.35;color:var(--mute)}
/* quick estimate: extras (rules v2) + national price note */
.est-extras > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;min-height:28px}
.est-extras > summary::-webkit-details-marker{display:none}
.est-extras > summary::before{content:"+";font:700 20px/1 var(--f-display);color:var(--hmp);width:14px}
.est-extras[open] > summary::before{content:"–"}
.est-extras > summary small{font-size:13px;color:var(--mute)}
.est-exrows{display:grid;gap:10px;margin-top:10px}
.est-nat{margin:0;font-size:12px;line-height:1.4;color:var(--warn)}
/* ================= v21: homeowner screen, "Daylight report" (option B). A light, separate scope: the rest of the app stays Pro Dark ================= */
.ho-launch .el-go{color:var(--hmp)}
.ho-sum{margin:0;font-size:14px;color:var(--ink2)}
.ho-sum b{color:var(--ink)}
.est-show{display:grid;gap:4px;margin-top:4px}
.est-show .est-btn{justify-content:flex-start;gap:10px}
.est-show small{font-size:12px;color:var(--mute)}
#hoView{--h-paper:#f4f2ee;--h-card:#ffffff;--h-ink:#1f2023;--h-char:#404145;--h-char-dk:#2a2b2f;--h-muted:#5b5f67;--h-line:#e2dfd8;

#hoView .ho-wrap{max-width:820px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
#hoView h1{font:800 36px/1.02 "Barlow Semi Condensed","Arial Narrow",sans-serif;margin-top:16px;text-wrap:balance;letter-spacing:0}
#hoView .ho-sub{color:var(--h-muted);font-size:15px;margin-top:-8px}
#hoView .ho-card{background:var(--h-card);border-radius:14px;padding:16px;box-shadow:var(--h-shadow)}
#hoView .ho-lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--h-muted)}
/* photos with numbered circles */
#hoView .ho-plist{display:grid;gap:14px}
#hoView .ho-pcard{background:var(--h-card);border-radius:14px;overflow:hidden;box-shadow:var(--h-shadow);min-width:0}

#hoView .ho-ph .ho-gone{display:none}
#hoView .ho-ph.gone .ho-gone{display:block}
#hoView .ho-mk{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;pointer-events:none;padding:0;border:0;background:transparent}
#hoView .ho-mk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hoView .ho-mk b{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--h-orange);color:var(--h-ink);font:800 15px/24px "Barlow Semi Condensed",sans-serif;text-align:center;box-shadow:0 0 0 2px #fff}
#hoView.rep .ho-ph{cursor:crosshair;outline:3px dashed var(--h-orange);outline-offset:-3px}
#hoView.rep .ho-mk{pointer-events:auto;cursor:pointer}
#hoView .ho-cap{display:flex;gap:12px;padding:12px 14px 14px;align-items:flex-start}
#hoView .ho-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--h-char);color:#fff;font:800 17px/30px "Barlow Semi Condensed",sans-serif;text-align:center}
#hoView .ho-cap b{display:block;font:700 20px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-cap div > span{color:var(--h-muted);font-size:14px}
#hoView .ho-cap .ho-undo{margin-left:auto;flex:none}
#hoView .ho-empty{background:var(--h-card);border:2px dashed #d3cfc6;border-radius:14px;padding:18px;display:grid;gap:6px}
#hoView .ho-empty b{font:700 22px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-empty p{color:var(--h-muted)}
/* hail + insurance */
#hoView .ho-two{display:grid;gap:14px}
#hoView .ho-hail .ho-cols{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:8px}
#hoView .ho-big{font:800 60px/.9 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
#hoView .ho-big small{font-size:24px;color:var(--h-muted);margin-left:3px}
#hoView .ho-like{color:var(--h-muted);font-size:14px;margin-top:6px}
#hoView .ho-scale{width:118px;height:auto;display:block}
#hoView .ho-facts{margin-top:14px;display:grid;gap:8px}
#hoView .ho-facts div{background:var(--h-mist);border-radius:10px;padding:9px 12px;display:grid}
#hoView .ho-facts b{font:700 18px/1.2 "Barlow Semi Condensed",sans-serif}
#hoView .ho-facts em{font-style:normal;font-size:12px;color:var(--h-muted)}
#hoView .ho-src{color:var(--h-muted);font-size:12px;margin-top:10px}
#hoView .ho-caveat{margin-top:12px;padding:10px 12px;border-radius:10px;border:1.5px dashed #bdb8ae;font-size:13.5px;color:var(--h-char);display:flex;gap:10px}
#hoView .ho-caveat svg{flex:none;width:18px;height:18px;margin-top:1px}
#hoView .ho-ins{background:var(--h-char);color:#fff}
#hoView .ho-ins b{display:block;font:700 22px/1.18 "Barlow Semi Condensed",sans-serif;margin-bottom:6px}
#hoView .ho-ins p{color:#dcdee2;font-size:14px}
/* options */
#hoView .ho-cmp{background:var(--h-card);border-radius:14px;overflow:hidden;box-shadow:var(--h-shadow)}
#hoView .ho-cols3{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
#hoView .ho-col{padding:12px 6px 12px;text-align:center;border:0;border-right:1px solid var(--h-line);background:transparent;display:grid;align-content:start;justify-items:center;gap:3px;min-width:0}
#hoView .ho-col:last-child{border-right:0}
#hoView .ho-col.rec{background:var(--h-tint);box-shadow:inset 0 4px 0 var(--h-orange)}
#hoView .ho-col[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--h-char)}
#hoView .ho-col.rec[aria-pressed="true"]{box-shadow:inset 0 4px 0 var(--h-orange),inset 0 0 0 3px var(--h-char)}
#hoView .ho-rib{font:800 11px/1.2 "Barlow Semi Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--h-orange-ink);min-height:14px}
#hoView .ho-name{font:800 13.5px/1.1 "Barlow Semi Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--h-muted)}
#hoView .ho-what{font:700 16px/1.1 "Barlow Semi Condensed",sans-serif;min-height:36px;overflow-wrap:anywhere}
#hoView .ho-price{font:800 20px/1.08 "Barlow Semi Condensed",sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
#hoView .ho-price span{display:block;white-space:nowrap}
#hoView .ho-pick{font-size:11.5px;font-weight:700;color:var(--h-muted);margin-top:6px;min-height:16px}
#hoView .ho-col[aria-pressed="true"] .ho-pick{color:var(--h-ok)}
#hoView .ho-rng{text-align:center;font-size:12.5px;font-weight:700;color:var(--h-char);padding:9px 12px;border-top:1px solid var(--h-line);background:#faf9f6}
#hoView .ho-tbl{overflow-x:auto}
#hoView table{width:100%;border-collapse:collapse}
#hoView td{border-top:1px solid var(--h-line);padding:9px 6px;font-size:12.5px;text-align:center;vertical-align:middle;width:calc(100% / var(--n,3))}
#hoView td.rec{background:var(--h-tint)}
#hoView tr.sec td{text-align:left;font-size:12.5px;font-weight:700;color:var(--h-char);background:#faf9f6;padding:8px 12px 6px}
#hoView tr.grp td{text-align:left;font:800 12px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--h-orange-ink);background:var(--h-card);padding:12px 12px 4px;border-top:2px solid var(--h-line)}
#hoView td svg{width:18px;height:18px;vertical-align:middle}
#hoView td .no{color:#a19c93;font-weight:700}
#hoView td .txt{font-weight:600;line-height:1.25}
#hoView .ho-note{color:var(--h-muted);font-size:13.5px}
#hoView .ho-warr{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--h-char)}
#hoView .ho-warr svg{flex:none;width:22px;height:22px}
#hoView .ho-out{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--h-card);border:1.5px solid var(--h-char);border-radius:12px;color:var(--h-ink);text-decoration:none}
#hoView .ho-out .sw{display:flex;gap:3px;flex:none}
#hoView .ho-out .sw i{width:14px;height:28px;border-radius:3px}
#hoView .ho-out b{display:block;font:700 18px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-out span span{font-size:12.5px;color:var(--h-muted)}
#hoView .ho-out .arr{margin-left:auto;font:800 22px "Barlow Semi Condensed",sans-serif;color:var(--h-orange-ink)}
/* next steps */
#hoView .ho-stps{display:grid;gap:12px}
#hoView .ho-stp{background:var(--h-card);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;box-shadow:var(--h-shadow)}
#hoView .ho-stp .n{font:800 48px/.85 "Barlow Semi Condensed",sans-serif;color:var(--h-orange);width:30px}
#hoView .ho-stp b{display:block;font:800 23px/1.1 "Barlow Semi Condensed",sans-serif}
#hoView .ho-stp p{color:var(--h-muted);font-size:14.5px;margin-top:3px}
#hoView .ho-cancel{margin-top:10px;padding:11px 12px;border-radius:10px;background:var(--h-tint);border-left:4px solid var(--h-orange);font-size:13.5px;color:var(--h-char)}
#hoView .ho-cancel b{display:inline;font:700 16px "Barlow Semi Condensed",sans-serif;color:var(--h-ink)}
#hoView .ho-contact{background:var(--h-char);color:#fff;border-radius:16px;padding:16px;display:grid;gap:0}
#hoView .ho-contact .q{font:700 20px "Barlow Semi Condensed",sans-serif;margin-bottom:4px}
#hoView .ho-contact a{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
#hoView .ho-contact a:first-of-type{border-top:0}
#hoView .ho-contact .ic{width:46px;height:46px;border-radius:50%;background:var(--h-orange);display:grid;place-items:center;flex:none}
#hoView .ho-contact .ic svg{width:21px;height:21px}
#hoView .ho-contact .nm{font-size:13px;color:#dcdee2;font-weight:600}
#hoView .ho-contact .tel{font:800 30px/1 "Barlow Semi Condensed",sans-serif;margin-top:2px;font-variant-numeric:tabular-nums;user-select:text}
#hoView .ho-foot{color:var(--h-muted);font-size:12px;line-height:1.6}
#hoView .ho-foot .blank{display:inline-block;width:90px;border-bottom:1px solid var(--h-muted);margin-left:2px}
#hoView .ho-next{justify-self:stretch;min-height:54px;border:0;border-radius:12px;background:var(--h-orange);color:#1b1206;font:800 20px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.02em}
/* rep tools: only while the rep has them on */
#hoView .ho-rep{border:2px dashed var(--h-orange);background:#fff8f1;border-radius:14px;padding:12px 14px;display:grid;gap:10px;margin-top:14px}
#hoView .ho-rep h2{font:800 13px/1.2 "Barlow Semi Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--h-orange-ink);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
#hoView .ho-rep h2 small{font:600 12px/1.3 "Montserrat",sans-serif;letter-spacing:0;text-transform:none;color:var(--h-muted)}
#hoView .ho-rep p{font-size:13.5px;color:var(--h-char)}
#hoView .ho-rep .ho-rrow{display:grid;gap:6px}
#hoView .ho-rep .ho-rl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--h-muted)}
#hoView .ho-seg{display:flex;flex-wrap:wrap;gap:6px}
#hoView .ho-seg button{min-height:44px;padding:6px 12px;border:1.5px solid #b8b3aa;border-radius:10px;background:#fff;font:700 15px/1.1 "Barlow Semi Condensed",sans-serif;color:var(--h-ink)}
#hoView .ho-seg button small{display:block;font:500 11px/1.2 "Montserrat",sans-serif;color:var(--h-muted)}
#hoView .ho-seg button[aria-pressed="true"]{background:var(--h-char);border-color:var(--h-char);color:#fff}
#hoView .ho-seg button[aria-pressed="true"] small{color:#dcdee2}
#hoView .ho-seg button:disabled{opacity:.45;cursor:default}
#hoView .ho-sbtn{min-height:44px;padding:8px 14px;border:1.5px solid var(--h-char);border-radius:10px;background:#fff;font:700 15px/1.1 "Barlow Semi Condensed",sans-serif;color:var(--h-ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#hoView .ho-sbtn.go{background:var(--h-orange);border-color:var(--h-orange);color:#1b1206}
#hoView .ho-acts{display:flex;flex-wrap:wrap;gap:8px}
#hoView .ho-msg{background:#fff;border:1px solid var(--h-line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-line;user-select:text;overflow-wrap:anywhere}
#hoView .ho-status{font-size:13px;font-weight:700;color:var(--h-ok)}
#hoView .ho-status.bad{color:#a3321f}
@media (min-width:700px){
  #hoView .ho-in,#hoView .ho-wrap,#hoView .ho-steps .ho-sin{padding-left:28px;padding-right:28px}
  #hoView h1{font-size:46px}
  #hoView .ho-plist{grid-template-columns:1fr 1fr}
  #hoView .ho-plist .ho-pcard:first-child{grid-column:1 / -1}
  #hoView .ho-two{grid-template-columns:1.2fr 1fr;align-items:start}
  #hoView .ho-price{font-size:28px}
  #hoView .ho-what{font-size:20px;min-height:0}
  #hoView td{font-size:14px;padding:11px 10px}
  #hoView .ho-stps{grid-template-columns:repeat(3,minmax(0,1fr))}
  #hoView .ho-stp{grid-template-columns:1fr;gap:6px;align-content:start}
  #hoView .ho-contact{grid-template-columns:auto 1fr 1fr;gap:18px;align-items:center}
  #hoView .ho-contact .q{margin:0}
  #hoView .ho-contact a,#hoView .ho-contact a:first-of-type{border-top:0;padding:0}
  #hoView .ho-next{justify-self:end;min-width:280px}
}
@media (prefers-reduced-motion:reduce){#hoView{scroll-behavior:auto}}

/* ================= v22: material order list, calendar, next-step toasts, adjuster prep ================= */
.app-toast .t-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.app-toast .t-acts .t-act{margin-left:0}
.app-toast:has(.t-acts){width:min(460px,calc(100% - 32px))}
.app-toast .t-acts .t-act[data-nsundo]{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 2px var(--bg)}
.app-toast a.t-act{display:inline-flex;align-items:center;text-decoration:none;border-radius:var(--r-sm)}
.app-toast .t-act{border-radius:var(--r-sm)}
.ord{display:grid;gap:14px;min-width:0}
.ord-secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ord-secs .est-job{min-height:60px}
.ord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px 12px}
.ord-f{display:grid;grid-template-rows:auto 1fr auto;gap:2px;min-width:0;cursor:text}
.ord-fl{font-size:14px;font-weight:700;line-height:1.2}
.ord-fh{font-size:12px;line-height:1.25;color:var(--mute)}
.ord-f input{width:100%;min-width:0;min-height:50px;margin-top:4px;background:var(--bg);border:2px solid var(--line2);border-radius:var(--r-sm);color:var(--ink);font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:4px 12px}
.ord-f input:focus{outline:2px solid var(--hmp);outline-offset:0;border-color:var(--hmp)}
.ord-f input::placeholder{color:var(--line2)}
.ord-from{margin:0;font-size:13px;color:var(--ink2);padding:8px 12px;background:var(--bg2);border-radius:var(--r-sm)}
.ord-from.warn{color:var(--warn)}
.ord-list{border:2px solid var(--hmp);border-radius:var(--r);background:var(--panel);display:grid;min-width:0;overflow:hidden}
.ord-lhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ord-lhead h3{margin:0;font:700 22px/1.1 var(--f-display)}
.ord-lhead span{font-size:13px;color:var(--mute)}
.ord-g{padding:10px 16px 12px;border-top:1px solid var(--line);display:grid;gap:2px}
.ord-g:first-of-type{border-top:0}
.ord-g h4{margin:0 0 4px;font:600 12px/1.3 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--label)}
.ord-ln{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:0 12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.ord-g h4 + .ord-ln{border-top:0}
.ord-ln .q{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.ord-ln .n{font-size:15px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.ord-ln .n small{font-size:13px;color:var(--label);font-weight:600;margin-right:6px}
.ord-ln .h{grid-column:2;font-size:12px;line-height:1.35;color:var(--mute);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ord-how{justify-self:start;margin:0 16px 12px}
.ord-ask{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord-ask li{display:grid;gap:2px;padding:9px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:var(--r-sm)}
.ord-ask b{font-size:15px}
.ord-ask span{font-size:13px;color:var(--ink2)}
.ord-as{margin:0;padding:0 0 0 18px;display:grid;gap:5px;font-size:14px;line-height:1.4;color:var(--ink2)}
.ord-as li::marker{color:var(--mute)}
.ord-foot{margin:0;font-size:13px;color:var(--mute)}
.ord-eb{font:600 11px/1.3 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--label)}
.cal-box{gap:8px}
.cal-top{display:grid;gap:2px}
.cal-top b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.cal-a{text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.cal-a svg{width:18px;height:18px;flex:none}
.d-est .cal-a{margin-left:16px;text-decoration:underline;text-underline-offset:3px}
.ns-val .cal-a{margin-left:12px;padding:2px 0;min-height:32px;font-size:14px}
.adj{display:grid;gap:14px;min-width:0}
.adj .ns-it .ns-itt .btn{justify-self:start;min-height:44px}
.adj-bring{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font-size:15px;line-height:1.4}
.adj-bring li::marker{color:var(--hmp)}
.adj-pack{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border-radius:var(--r-sm)}
.adj-pack .chk{width:44px;height:44px;flex:none}
.adj-pack .chk[aria-checked="true"]{background:var(--m-in);border-color:var(--m-in)}
.adj-pack span{font-weight:700;font-size:15px}

/* ================= v23: every tap target 44px or more (gloves, sun, one thumb), and no clipped Spanish at 360px ================= */
.bossbtn,.lang button,.proof,.more,.undo,.btn.sm,.srcf button,.copy,.ph-file.sm,.tally .t-next,.tally .t-done,.tally .t-cb{min-height:44px}
.more{min-width:44px}
.chk,.ns-it .chk{width:44px;height:44px}
.slot{grid-template-columns:44px minmax(0,1fr) auto}
@media (max-width:420px){.slot{grid-template-columns:44px minmax(0,1fr)}}
.ns-it{grid-template-columns:44px minmax(0,1fr)}
.chase summary{min-height:44px;padding-block:10px}
details.howmore summary{min-height:44px;padding-block:8px}
.est-extras > summary{min-height:44px;align-items:center}
.ns-val .cal-a{min-height:44px}
#hoView .ho-langs button{min-height:44px}

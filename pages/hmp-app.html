<script>
/* T52 quick estimate math: docs/app/estimate.js pasted as-is inside a closure, so its top-level names (money, num,
   rate, stories...) can't collide with the app's. Re-paste the whole file when the Engine Mechanic changes it. */
const HMPEstimateMath = (() => {
/* HMP App quick estimate: a JavaScript copy of `hh.py estimate` (hailhunter/estimate.py).
 *
 * The page never hard-codes a price. It reads the rules doc `system/prices`, made by
 *   python3 hh.py estimate --export-rules --out prices.json
 * and calls estimate(job, rules). The math matches the Python exactly (same float steps, same rounding:
 * Python's round() goes half-to-even, JavaScript's Math.round does not, so pyRound below copies Python).
 * Self-check on load: selfCheck(rules) runs rules.test_cases (real Python results) and returns the failures.
 *
 * job = {type: siding|roof|gutters|mixed, siding_squares, roof_squares, gutter_ft, soffit_ft,
 *        material: vinyl|insulated_vinyl|hardie, pitch: low|std|steep or rise per 12 ("7/12"), stories: 1-3,
 *        layers: old layers (1 = normal), house_wrap (default true), permit (default true), footprint_sqft,
 *        add-ons (rules v2, each priced only when given): windows, ice_water_sq, ridge_vent_ft, chimney (true or a
 *        count), skylight_ft, gutter_guards_ft, downspouts_ft}
 * Returns {low, high, lines[], warnings[{en,es}], summary{en,es}, using_reference, minimum_applied, ...}.
 * Throws Error on a bad job (same cases as the Python ValueError).
 *
 * Ranges only. No deductible text (Nebraska 44-8604) and never "insurance will pay": the insurer's approved
 * scope sets the price on insurance jobs (rules.insurance_note). No dependencies.
 */
var RULES_VERSION = 2;
var TYPES = ["siding", "roof", "gutters", "mixed"];

function pyRound(x) {                         // Python round(x): nearest integer, exact .5 goes to the even one
  var r = Math.round(x);
  if (Math.abs(x % 1) === 0.5) r = 2 * Math.round(x / 2);
  return r;
}

function pyRound1(x) {                        // Python round(x, 1): correctly rounded, exact ties to even
  if (!isFinite(x)) return x;
  if (Number.isInteger(x * 4) && Math.abs(x * 4) % 2 === 1) {   // exact x.x5 tie (x ends in .25 or .75)
    var lo = Math.floor(x * 10), hi = lo + 1;
    return (lo % 2 === 0 ? lo : hi) / 10;
  }
  return parseFloat(x.toFixed(1));            // toFixed rounds the exact binary value, like Python
}

function truthy(v) {                          // Python truthiness for JSON values
  if (v === null || v === undefined || v === false || v === 0 || v === "" || (typeof v === "number" && isNaN(v))) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "object") return Object.keys(v).length > 0;
  return true;
}

function fmtG(x) {                            // Python f"{x:g}" for everyday sizes
  var e = x === 0 ? 0 : Math.floor(Math.log10(Math.abs(x)));
  if (e < -4 || e >= 6) {
    var s = x.toExponential(5).replace(/\.?0+e/, "e");
    return s.replace(/e([+-])(\d)$/, function (_, sign, d) { return "e" + sign + "0" + d; });
  }
  return String(Number(x.toPrecision(6)));
}

function money(x) {                           // Python f"${x:,.0f}"
  var s = String(pyRound(x));
  return "$" + s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function num(v, name, dflt) {
  if (v === null || v === undefined || v === "") return dflt === undefined ? 0 : dflt;
  if (typeof v === "object") throw new Error(name + " must be a number, got " + JSON.stringify(v));
  var x = typeof v === "boolean" ? (v ? 1 : 0) : Number(typeof v === "string" ? v.trim() : v);
  if (typeof v === "string" && v.trim() === "") x = NaN;
  if (typeof x !== "number" || isNaN(x)) throw new Error(name + " must be a number, got " + JSON.stringify(v));
  if (x < 0) throw new Error(name + " can't be negative");
  return x;
}

function pitchClass(pitch, rules) {
  var a = rules.adders.steep_pitch;
  if (pitch === null || pitch === undefined || pitch === "") return "std";
  var s = String(pitch).trim().toLowerCase();
  if (s === "standard" || s === "normal") return "std";
  if (s === "low" || s === "std" || s === "steep") return s;
  var m = /^(\d+(?:\.\d+)?)\s*(?:[\/:]\s*12)?$/.exec(s);
  if (!m) throw new Error("pitch must be low, std, steep or a rise per 12 like 7/12, got " + JSON.stringify(pitch));
  var rise = parseFloat(m[1]);
  return rise > a.steep_over ? "steep" : rise < a.low_under ? "low" : "std";
}

function stories(v) {
  var n = pyRound(num(v, "stories", 1));
  if (n < 1 || n > 3) throw new Error("stories must be 1, 2 or 3");
  return n;
}

function squaresFromFootprint(footprint, n, pc, rules) {
  var h = rules.rough_helper;
  var area = num(footprint, "footprint_sqft");
  if (area <= 0) throw new Error("footprint_sqft must be more than 0");
  var perimeter = 4 * Math.sqrt(area) * h.perimeter_factor;
  var wall = perimeter * h.story_height_ft * n * (1 - h.openings);
  return {siding_squares: pyRound1(wall / 100), roof_squares: pyRound1(area * h.pitch_factor[pc] / 100),
          perimeter_ft: pyRound(perimeter), wall_sqft: pyRound(wall), footprint_sqft: area, stories: n,
          pitch: pc, rough: true, note: {en: rules.rough_note.en, es: rules.rough_note.es}};
}

function rate(key, rules) {                   // {low, high, ref}; low null = no price anywhere
  var p = key === "min_job" || key === "min_job_roof" ? rules.adders[key] : rules.prices[key];
  if (!p) return {low: null, high: null, ref: true};
  return {low: p.low, high: p.high, ref: p.source !== "hmp", scope: p.scope || null};
}

function estimate(job, rules) {
  if (!rules || rules.version !== RULES_VERSION) throw new Error("price rules missing or wrong version (re-export system/prices)");
  if (!job || typeof job !== "object" || Array.isArray(job)) throw new Error("job must be a JSON object");
  var ad = rules.adders;
  var jtype = String(truthy(job.type) ? job.type : "").trim().toLowerCase();
  if (TYPES.indexOf(jtype) < 0) throw new Error("type must be one of " + TYPES.join(", ") + ", got " + JSON.stringify(job.type === undefined ? null : job.type));
  var material = String(truthy(job.material) ? job.material : "vinyl").trim().toLowerCase();
  if (["hardie", "james hardie", "fiber cement", "fibercement"].indexOf(material) >= 0) material = "hardie";
  else if (["insulated vinyl", "insulated-vinyl", "insulated"].indexOf(material) >= 0) material = "insulated_vinyl";
  else if (["shingle", "architectural", "architectural shingle"].indexOf(material) >= 0) material = "vinyl";
  if (!Object.prototype.hasOwnProperty.call(rules.materials, material)) throw new Error("material must be vinyl, insulated_vinyl or hardie (roofs are architectural shingle), got " + JSON.stringify(job.material));
  var pc = pitchClass(job.pitch, rules), n = stories(job.stories);
  var layers = pyRound(num(job.layers, "layers", 1)) || 1;
  var siding = num(job.siding_squares, "siding_squares"), roof = num(job.roof_squares, "roof_squares");
  var gutter = num(job.gutter_ft, "gutter_ft"), soffit = num(job.soffit_ft, "soffit_ft");
  var addonList = rules.addons || [], addons = {}, anyAddon = false;
  addonList.forEach(function (a) { addons[a.field] = num(job[a.field], a.field); if (addons[a.field]) anyAddon = true; });
  var warnings = [], rough = null;
  var wantsSiding = jtype === "siding" || jtype === "mixed", wantsRoof = jtype === "roof" || jtype === "mixed";

  if (truthy(job.footprint_sqft) && ((wantsSiding && !siding) || (wantsRoof && !roof))) {
    rough = squaresFromFootprint(job.footprint_sqft, n, pc, rules);
    if (wantsSiding && !siding) siding = rough.siding_squares;
    if (wantsRoof && !roof) roof = rough.roof_squares;
    warnings.push({en: rules.rough_note.en, es: rules.rough_note.es});
  }
  var tn = rules.type_notes;
  if (jtype === "siding" && roof) { roof = 0; warnings.push({en: tn.siding.en, es: tn.siding.es}); }
  if (jtype === "roof" && siding) { siding = 0; warnings.push({en: tn.roof.en, es: tn.roof.es}); }
  if (jtype === "gutters" && (siding || roof)) { siding = roof = 0; warnings.push({en: tn.gutters.en, es: tn.gutters.es}); }
  var need = {siding: siding, roof: roof, gutters: gutter, mixed: siding || roof || gutter || soffit || anyAddon}[jtype];
  if (!need) {
    var what = {siding: "siding_squares (or footprint_sqft)", roof: "roof_squares (or footprint_sqft)", gutters: "gutter_ft",
                mixed: "at least one of siding_squares, roof_squares, gutter_ft, soffit_ft"};
    throw new Error("a " + jtype + " job needs " + what[jtype]);
  }

  var story = ad.stories.story_adders[String(n)], steep = ad.steep_pitch.pitch_adders[pc];
  var lines = [], refItems = [];

  function add(key, qty, unit, en, es, roofItem, scale) {
    if (scale === undefined) scale = true;
    var r = rate(key, rules);
    if (r.low === null) throw new Error("no price for " + key + " in prices or prices_reference");
    if (r.ref) refItems.push(key);
    var aLo = (scale ? story.low : 0) + (roofItem ? steep.low : 0);
    var aHi = (scale ? story.high : 0) + (roofItem ? steep.high : 0);
    lines.push({key: key, en: en, es: es, qty: pyRound1(qty), unit: unit,
                unit_en: rules.units[unit].en, unit_es: rules.units[unit].es,
                rate: {low: r.low, high: r.high}, adder: {low: aLo, high: aHi},
                low: pyRound(qty * r.low * (1 + aLo)), high: pyRound(qty * r.high * (1 + aHi)), reference: r.ref});
  }
  function item(key) { return rules.prices[key] || {en: key, es: key}; }
  function addOns(where) {
    addonList.forEach(function (a) {
      if (a.after === where && addons[a.field]) add(a.item, addons[a.field], a.unit, item(a.item).en, item(a.item).es, a.roof_item);
    });
  }

  var extra = Math.max(0, layers - 1);
  var xl = item("extra_layer_sq");
  if (siding) {
    var mat = rules.materials[material];
    add(mat.item, siding, "sq", mat.en, mat.es);
    if (!("house_wrap" in job) || job.house_wrap === undefined || truthy(job.house_wrap))
      add("house_wrap_sq", siding, "sq", item("house_wrap_sq").en, item("house_wrap_sq").es);
    if (extra && !roof)
      add("extra_layer_sq", siding * extra, "sq", xl.en + " (walls, x" + extra + ")", xl.es + " (paredes, x" + extra + ")");
  }
  addOns("siding");
  if (roof) {
    add("shingle_roof_sq", roof, "sq", item("shingle_roof_sq").en, item("shingle_roof_sq").es, true);
    if (extra)
      add("extra_layer_sq", roof * extra, "sq", xl.en + " (roof, x" + extra + ")", xl.es + " (techo, x" + extra + ")", true);
  }
  addOns("roof");
  if (soffit) add("soffit_fascia_ft", soffit, "ft", item("soffit_fascia_ft").en, item("soffit_fascia_ft").es);
  if (gutter) add("gutters_ft", gutter, "ft", item("gutters_ft").en, item("gutters_ft").es);
  addOns("gutters");
  if (!("permit" in job) || job.permit === undefined || truthy(job.permit))
    add("permit", 1, "job", item("permit").en, item("permit").es, false, false);

  var low = 0, high = 0;
  lines.forEach(function (ln) { low += ln.low; high += ln.high; });
  // Roof jobs use the roof minimum, unless HMP set a general minimum but no roof one (then HMP's wins).
  var roofMin = rate("min_job_roof", rules), anyMin = rate("min_job", rules);
  var useRoof = !!roof && roofMin.low !== null && (!roofMin.ref || anyMin.ref);
  var minKey = useRoof ? "min_job_roof" : "min_job", m = useRoof ? roofMin : anyMin, minimum = null;
  if (m.low !== null && (low < m.low || high < m.high)) {
    minimum = {key: minKey, low: m.low, high: m.high, reference: m.ref};
    low = Math.max(low, m.low); high = Math.max(high, m.high);
    if (m.ref) refItems.push(minKey);
  }
  var step = ad.round_to;
  low = Math.floor(low / step) * step;
  high = Math.ceil(high / step) * step;

  refItems = refItems.filter(function (k, i) { return refItems.indexOf(k) === i; }).sort();
  var usingRef = refItems.length > 0;
  if (usingRef) {
    var allRef = lines.every(function (ln) { return ln.reference; });
    var w = {};
    ["en", "es"].forEach(function (lang) {
      var forItems = allRef ? "" : rules.reference_for_items[lang].replace("{items}", refItems.join(", "));
      w[lang] = rules.reference_warning_template[lang].replace("{for_items}", forItems);
    });
    warnings.unshift(w);
  }
  var national = lines.filter(function (ln) { return ln.reference && rate(ln.key, rules).scope === "national"; })
                      .map(function (ln) { return ln.key; });
  national = national.filter(function (k, i) { return national.indexOf(k) === i; }).sort();
  if (national.length) {
    var nw = {};
    ["en", "es"].forEach(function (lang) { nw[lang] = rules.national_warning_template[lang].replace("{items}", national.join(", ")); });
    warnings.splice(1, 0, nw);
  }

  var pEn = [], pEs = [], words = rules.materials[material].words;
  if (siding) { pEn.push(words.en + " siding (" + fmtG(siding) + " squares)");
                pEs.push("siding " + words.es + " (" + fmtG(siding) + " cuadros)"); }
  if (roof) { pEn.push("shingle roof (" + fmtG(roof) + " squares)"); pEs.push("techo de teja (" + fmtG(roof) + " cuadros)"); }
  if (soffit) { pEn.push("soffit + fascia (" + fmtG(soffit) + " ft)"); pEs.push("sofito + fascia (" + fmtG(soffit) + " pies)"); }
  if (gutter) { pEn.push("gutters (" + fmtG(gutter) + " ft)"); pEs.push("canaletas (" + fmtG(gutter) + " pies)"); }
  addonList.forEach(function (a) {
    var q = addons[a.field];
    if (!q) return;
    var plural = q === 1 ? "" : "s";
    pEn.push(a.words.en.replace("{q}", fmtG(q)).replace("{s}", plural));
    pEs.push(a.words.es.replace("{q}", fmtG(q)).replace("{s}", plural));
  });
  var sEn = [n + " stor" + (n === 1 ? "y" : "ies")], sEs = [n + " piso" + (n === 1 ? "" : "s")];
  if (roof) {
    sEn.push({low: "low pitch", std: "standard pitch", steep: "steep pitch"}[pc]);
    sEs.push({low: "poca pendiente", std: "pendiente normal", steep: "pendiente alta"}[pc]);
  }
  if (extra) { sEn.push(layers + " old layers"); sEs.push(layers + " capas viejas"); }
  var leadEn = usingRef ? "Rough estimate with MARKET REFERENCE prices (not HMP's)" : "Quick estimate";
  var leadEs = usingRef ? "Estimado aproximado con precios de REFERENCIA del mercado (no de HMP)" : "Estimado rápido";
  var summary = {
    en: leadEn + ": " + money(low) + " - " + money(high) + " for " + pEn.join(", ") + "; " + sEn.join(", ") +
        ". Final price after we measure and inspect. " + rules.insurance_note.en,
    es: leadEs + ": " + money(low) + " - " + money(high) + " por " + pEs.join(", ") + "; " + sEs.join(", ") +
        ". El precio final después de medir e inspeccionar. " + rules.insurance_note.es};
  if (minimum) {
    summary.en += " (Minimum job " + money(m.low) + " - " + money(m.high) + " applied.)";
    summary.es += " (Se aplicó el trabajo mínimo " + money(m.low) + " - " + money(m.high) + ".)";
  }
  return {low: low, high: high, currency: rules.currency || "USD", type: jtype,
          using_reference: usingRef, reference_items: refItems,
          reference_label: usingRef ? rules.reference_label : null,
          warnings: warnings, lines: lines, minimum_applied: minimum,
          adders: {pitch: pc, pitch_roof: steep, stories: n, stories_all: story, layers: layers},
          quantities: Object.assign({siding_squares: siding, roof_squares: roof, gutter_ft: gutter, soffit_ft: soffit,
                                     material: material}, addons),
          rough_squares: rough, summary: summary, insurance_note: {en: rules.insurance_note.en, es: rules.insurance_note.es}};
}

/* Runs rules.test_cases through estimate(); returns [] when the JS matches Python, else one message per miss.
 * The page should show "Price rules out of date" and hide the estimate if this is not empty. */
function selfCheck(rules) {
  var fails = [];
  (rules.test_cases || []).forEach(function (t) {
    var r;
    try { r = estimate(t.job, rules); } catch (err) { fails.push(t.name + ": error " + err.message); return; }
    var x = t.expect;
    if (r.low !== x.low || r.high !== x.high) fails.push(t.name + ": got " + r.low + "-" + r.high + ", expected " + x.low + "-" + x.high);
    if (x.using_reference !== undefined && r.using_reference !== x.using_reference) fails.push(t.name + ": using_reference differs");
    if (x.line_keys && r.lines.map(function (l) { return l.key; }).join() !== x.line_keys.join()) fails.push(t.name + ": lines differ");
    if (x.minimum !== undefined && ((r.minimum_applied || {}).key || null) !== x.minimum) fails.push(t.name + ": minimum differs");
    if (x.summary && (r.summary.en !== x.summary.en || r.summary.es !== x.summary.es)) fails.push(t.name + ": summary differs");
    if (x.warnings && JSON.stringify(r.warnings) !== JSON.stringify(x.warnings)) fails.push(t.name + ": warnings differ");
  });
  return fails;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {estimate: estimate, selfCheck: selfCheck, pitchClass: pitchClass, pyRound: pyRound,
                    pyRound1: pyRound1, fmtG: fmtG, RULES_VERSION: RULES_VERSION};
}

  return {estimate, selfCheck, RULES_VERSION};
})();
</script>
<script>
/* v22 material order list math: docs/app/takeoff.js pasted as-is inside a closure (its names up, fmt, num, fill... stay
   private). Re-paste the whole file when the Engine Mechanic changes it; the rules come from the db doc system/takeoff. */
const HMPTakeoff = (() => {
/* HMP App material takeoff: a JavaScript copy of `hh.py takeoff` (hailhunter/takeoff.py), O7 phase D.
 *
 * The page never hard-codes a rule or a word. It reads the rules doc `system/takeoff`, made by
 *   python3 hh.py takeoff --export-rules --out takeoff-rules.json
 * and calls takeoff(job, rules). compute() below follows the Python step for step (same float steps, same
 * round-up with a 1e-9 noise guard), so both give the same order list and text.
 * Self-check on load: selfCheck(rules) runs rules.test_cases (real Python results) and returns the failures;
 * if it's not empty the page should say "Material rules out of date" and not show the list.
 *
 * job = {kind: roof|siding|gutters|mixed, name,
 *        roof {squares, eave_ft, rake_ft, ridge_ft, hip_ft, valley_ft, penetrations, roof_type, pitch, overhang_in,
 *              ridge_vent},
 *        siding {material, wall_sqft | squares, openings | opening_perimeter_ft, wall_height_ft, outside_corners,
 *                inside_corners, bottom_ft, rake_ft, exposure_in},
 *        gutters {feet, runs, corners, snow (default true), height_ft}}
 * Returns {version, kind, name, material, lines[], groups[], ask_supplier[], assumptions[], text{en,es}}.
 * Throws Error on a bad job (same cases as the Python ValueError). Materials only: no prices. No dependencies.
 */
var TAKEOFF_RULES_VERSION = 1;
var EPS = 1e-9;

function up(x) { return Math.ceil(x - EPS) + 0; }            // + 0 turns -0 into 0

function pyRound(x) {                                        // Python round(x): exact .5 goes to the even one
  var r = Math.round(x);
  if (Math.abs(x % 1) === 0.5) r = 2 * Math.round(x / 2);
  return r;
}

function fmt(x) { return String(Number(x)); }                 // same as Python fmt() (shortest repr, 12.0 -> "12")

function pct(frac) { return fmt(pyRound(frac * 1000) / 10); }

function fill(tpl, vals) {
  Object.keys(vals).forEach(function (k) { tpl = tpl.split("{" + k + "}").join(vals[k]); });
  return tpl;
}

function truthy(v) {                                          // Python truthiness for JSON values
  if (v === null || v === undefined || v === false || v === 0 || v === "" || (typeof v === "number" && isNaN(v))) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === "object") return Object.keys(v).length > 0;
  return true;
}

function has(obj, k) { return Object.prototype.hasOwnProperty.call(obj, k); }

function num(v, name, dflt) {
  if (v === null || v === undefined || v === "") return dflt === undefined ? 0 : dflt;
  if (typeof v === "object") throw new Error(name + " must be a number, got " + JSON.stringify(v));
  var x = typeof v === "boolean" ? (v ? 1 : 0) : Number(typeof v === "string" ? v.trim() : v);
  if (typeof v === "string" && v.trim() === "") x = NaN;
  if (typeof x !== "number" || !isFinite(x)) throw new Error(name + " must be a number, got " + JSON.stringify(v));
  if (x < 0) throw new Error(name + " can't be negative");
  return x;
}

function section(job, key) {
  var s = job[key];
  if (s === null || s === undefined) return null;
  if (typeof s !== "object" || Array.isArray(s)) throw new Error(key + " must be an object like {\"feet\": 120}");
  return s;
}

function riseOf(pitch, rules) {
  if (pitch === null || pitch === undefined || pitch === "") return null;
  var s = String(pitch).trim().toLowerCase();
  var words = rules.config.pitch_words;
  if (s === "standard" || s === "normal") s = "std";
  if (has(words, s)) return Number(words[s]);
  var m = /^(\d+(?:\.\d+)?)\s*(?:[\/:]\s*12)?$/.exec(s);
  if (!m) throw new Error("pitch must be low, std, steep or a rise per 12 like 7/12, got " + JSON.stringify(pitch));
  return parseFloat(m[1]);
}

function compute(job, rules) {
  if (!job || typeof job !== "object" || Array.isArray(job)) throw new Error("job must be an object");
  var kind = String(truthy(job.kind) ? job.kind : truthy(job.type) ? job.type : "").trim().toLowerCase();
  if (rules.kinds.indexOf(kind) < 0) throw new Error("kind must be roof, siding, gutters or mixed");
  var c = rules.config, T = rules.items;
  var lines = [], ask = [], assume = [Object.assign({}, rules.assume.rounded)];

  function add(key, qty, vals) {
    if (qty <= 0) return;
    var it = T[key], u = rules.units[T[key].unit];
    lines.push({group: it.group, item: key, en: fill(it.en, vals), es: fill(it.es, vals), qty: qty, unit: it.unit,
                unit_en: qty === 1 ? u[0] : u[1], unit_es: qty === 1 ? u[2] : u[3],
                how: {en: fill(it.how_en, vals), es: fill(it.how_es, vals)}});
  }
  function note(key, vals) {
    var a = rules.assume[key];
    assume.push({en: fill(a.en, vals), es: fill(a.es, vals)});
  }
  function askFor(key, vals) {
    var a = rules.ask[key];
    ask.push({item: key, en: a.en, es: a.es, why: {en: fill(a.why_en, vals), es: fill(a.why_es, vals)}});
  }

  var want = kind === "mixed" ? rules.kinds.slice(0, 3) : [kind];
  var roof = want.indexOf("roof") >= 0 ? section(job, "roof") : null;
  var siding = want.indexOf("siding") >= 0 ? section(job, "siding") : null;
  var gutters = want.indexOf("gutters") >= 0 ? section(job, "gutters") : null;
  if (kind !== "mixed" && (kind === "roof" ? roof : kind === "siding" ? siding : gutters) === null)
    throw new Error("a " + kind + " job needs a \"" + kind + "\" object with measurements");
  if (roof === null && siding === null && gutters === null)
    throw new Error("a mixed job needs at least one of roof, siding, gutters");

  var v, w, roofRake = 0;
  if (roof !== null) {
    var sq = num(roof.squares, "roof.squares");
    var eave = num(roof.eave_ft, "roof.eave_ft");
    var rake = num(roof.rake_ft, "roof.rake_ft");
    roofRake = rake;
    var ridge = num(roof.ridge_ft, "roof.ridge_ft");
    var hip = num(roof.hip_ft, "roof.hip_ft");
    var valley = num(roof.valley_ft, "roof.valley_ft");
    var pen = up(num(roof.penetrations, "roof.penetrations"));
    var rtRaw = roof.roof_type, rtype, rtGiven;
    if (rtRaw === null || rtRaw === undefined || rtRaw === "") {
      rtype = hip > 0 ? "hip" : "gable";
      rtGiven = false;
    } else {
      rtype = String(rtRaw).trim().toLowerCase().replace(/[\s_-]+/g, "");
      rtGiven = true;
      if (!has(rules.roof_types, rtype)) throw new Error("roof_type must be gable, hip or cutup, got " + JSON.stringify(rtRaw));
    }
    var rise = riseOf(roof.pitch, rules);
    var pitchGiven = rise !== null;
    if (rise === null) rise = Number(c.default_pitch);
    var overhang = num(roof.overhang_in, "roof.overhang_in", Number(c.ice_water_overhang_in));
    w = c.waste[rtype];
    var names = rules.roof_types[rtype];
    v = {sq: fmt(sq), waste: pct(w), type_en: names[0], type_es: names[1],
         eave: fmt(eave), rake: fmt(rake), ridge: fmt(ridge), hip: fmt(hip), valley: fmt(valley)};
    if (sq > 0) {
      v.bps = fmt(c.bundles_per_square);
      add("shingles", up(sq * (1 + w) * c.bundles_per_square), v);
    }
    v.per = fmt(c.starter_ft_per_bundle);
    add("starter", up((eave + rake) / c.starter_ft_per_bundle), v);
    v.per = fmt(c.ridge_cap_ft_per_bundle);
    add("ridge_cap", up((ridge + hip) / c.ridge_cap_ft_per_bundle), v);
    v.extra = pct(c.drip_edge_extra);
    v.stick = fmt(c.drip_edge_stick_ft);
    add("drip_edge", up((eave + rake) * (1 + c.drip_edge_extra) / c.drip_edge_stick_ft), v);
    if (sq > 0) {
      v.per = fmt(c.underlayment_sq_per_roll);
      add("underlayment", up(sq / c.underlayment_sq_per_roll), v);
    }
    var width = c.ice_water_width_in;
    var stripIn = (overhang + c.ice_water_inside_wall_in) * Math.sqrt(1 + (rise / 12) * (rise / 12));
    var rows = 1 + up(Math.max(0, stripIn - width) / (width - c.ice_water_lap_in));
    Object.assign(v, {rows: fmt(rows), width: fmt(width), inside: fmt(c.ice_water_inside_wall_in),
                      overhang: fmt(overhang), pitch: fmt(rise), roll: fmt(c.ice_water_roll_ft)});
    add("ice_water", up((eave * rows + valley) / c.ice_water_roll_ft), v);
    if (sq > 0) {
      v.nps = fmt(c.nails_per_square);
      v.per = fmt(c.nails_per_box);
      add("roof_nails", up(sq * (1 + w) * c.nails_per_square / c.nails_per_box), v);
    }
    v.n = fmt(pen);
    add("pipe_boots", pen, v);
    if (truthy(roof.ridge_vent)) add("ridge_vent", up(ridge), v);
    var wv = {g: pct(c.waste.gable), h: pct(c.waste.hip), c: pct(c.waste.cutup), type_en: names[0], type_es: names[1],
              w: pct(w), nps: fmt(c.nails_per_square), inside: fmt(c.ice_water_inside_wall_in), pitch: fmt(rise)};
    if (sq > 0) { note("waste", wv); note("nails", wv); } else note("no_squares", wv);
    if (!rtGiven) note("roof_type", wv);
    if (!pitchGiven && (eave > 0 || valley > 0)) note("pitch", wv);
    if (eave > 0 || valley > 0) note("ice_water", wv);
  }

  var material = null;
  if (siding !== null) {
    var mRaw = siding.material;
    material = (mRaw === null || mRaw === undefined || mRaw === "") ? "vinyl"
      : String(mRaw).trim().toLowerCase().replace(/[\s-]+/g, "_");
    if (has(rules.material_aliases, material)) material = rules.material_aliases[material];
    if (!has(rules.materials, material))
      throw new Error("siding.material must be vinyl, insulated_vinyl or hardie, got " + JSON.stringify(mRaw));
    var area = num(siding.wall_sqft, "siding.wall_sqft");
    if (area === 0) area = num(siding.squares, "siding.squares") * 100;
    var nOpen = up(num(siding.openings, "siding.openings"));
    var openFt = num(siding.opening_perimeter_ft, "siding.opening_perimeter_ft");
    var fromCount = openFt === 0 && nOpen > 0;
    if (fromCount) openFt = nOpen * c.ft_per_opening;
    var h = num(siding.wall_height_ft, "siding.wall_height_ft");
    var hGiven = h > 0;
    if (!hGiven) h = Number(c.default_wall_height_ft);
    var outside = up(num(siding.outside_corners, "siding.outside_corners"));
    var inside = up(num(siding.inside_corners, "siding.inside_corners"));
    var bottom = num(siding.bottom_ft, "siding.bottom_ft");
    var sRake = num(siding.rake_ft, "siding.rake_ft", roofRake);
    w = c.siding_waste[material];
    var hardie = material === "hardie";
    var mnames = rules.materials[material];
    v = {area: fmt(area), waste: pct(w), open: fmt(openFt), rake: fmt(sRake), h: fmt(h), bottom: fmt(bottom),
         extra: pct(c.trim_extra)};
    var planks = 0;
    if (hardie) {
      var exposure = num(siding.exposure_in, "siding.exposure_in", Number(c.hardie_exposure_in));
      if (exposure <= 0) throw new Error("siding.exposure_in must be more than 0");
      var cov = exposure * c.hardie_plank_ft / 12;
      Object.assign(v, {exposure: fmt(exposure), len: fmt(c.hardie_plank_ft), cov: fmt(cov)});
      planks = up(area * (1 + w) / cov);
      add("hardie_planks", planks, v);
      v.planks = fmt(planks);
      v.per = fmt(c.hardie_nails_per_plank);
      add("hardie_nails", planks * c.hardie_nails_per_plank, v);
    } else {
      add(material + "_siding", up(area * (1 + w) / 100), v);
    }
    v.per = fmt(c.house_wrap_roll_sqft);
    v.extra = pct(c.house_wrap_extra);
    add("house_wrap", up(area * (1 + c.house_wrap_extra) / c.house_wrap_roll_sqft), v);
    v.extra = pct(c.trim_extra);
    var trimLen = hardie ? c.hardie_trim_ft : c.j_channel_ft;
    v.len = fmt(trimLen);
    var trim = up((openFt + sRake) * (1 + c.trim_extra) / trimLen);
    add(hardie ? "hardie_trim" : "j_channel", trim, v);
    var cornerLen = hardie ? c.hardie_corner_ft : c.corner_post_ft;
    var per = up(h / cornerLen);
    Object.assign(v, {len: fmt(cornerLen), per: fmt(per), n: fmt(outside)});
    add(hardie ? "hardie_outside_corners" : "outside_corners", outside * per * (hardie ? 2 : 1), v);
    v.n = fmt(inside);
    add(hardie ? "hardie_inside_corners" : "inside_corners", inside * per, v);
    v.len = fmt(c.starter_strip_ft);
    add("starter_strip", up(bottom / c.starter_strip_ft), v);
    var av = {w: pct(w), mat_en: mnames[0], mat_es: mnames[1], h: fmt(h), n: fmt(nOpen), per: fmt(c.ft_per_opening)};
    note("siding_waste", av);
    if (area === 0) note("no_area", av);
    if (!hGiven && (outside > 0 || inside > 0)) note("wall_height", av);
    if (fromCount) note("openings", av);
    if (hardie) {
      askFor("hardie_caulk", {planks: fmt(planks), trim: fmt(trim)});
      askFor("hardie_paint", {planks: fmt(planks)});
    } else if (area > 0) {
      askFor("vinyl_nails", {sq: fmt(up(area * (1 + w) / 100))});
    }
  }

  if (gutters !== null) {
    var feet = num(gutters.feet, "gutters.feet");
    var runs = up(num(gutters.runs, "gutters.runs", 1));
    if (feet > 0 && runs < 1) runs = 1;
    var corners = up(num(gutters.corners, "gutters.corners"));
    var snowRaw = gutters.snow;
    var snow = (snowRaw === null || snowRaw === undefined) ? true : truthy(snowRaw);
    var sp = c.hanger_spacing_in[snow ? "snow" : "no_snow"];
    var sn = rules.snow[snow ? "true" : "false"];
    var gh = num(gutters.height_ft, "gutters.height_ft");
    if (gh === 0 && siding !== null) gh = num(siding.wall_height_ft, "siding.wall_height_ft");
    v = {feet: fmt(feet), runs: fmt(runs), n: fmt(corners), sp: fmt(sp), snow_en: sn[0], snow_es: sn[1], h: fmt(gh),
         per: fmt(c.gutter_ft_per_downspout)};
    if (feet > 0) {
      add("gutter", up(feet), v);
      var d = Math.max(runs, up(feet / c.gutter_ft_per_downspout));
      add("downspouts", d, v);
      v.d = fmt(d);
      add("downspout_pipe", up(d * gh), v);
      v.per = fmt(c.elbows_per_downspout);
      add("elbows", d * c.elbows_per_downspout, v);
      add("outlets", d, v);
      add("hangers", up(feet * 12 / sp) + runs, v);
      add("end_caps", 2 * runs, v);
      add("miters", corners, v);
      note("hangers", v);
      if (gh === 0) note("no_height", v);
      askFor("gutter_sealant", {runs: fmt(runs), caps: fmt(2 * runs), miters: fmt(corners)});
    }
  }

  if (!lines.length)
    throw new Error("nothing to count: give measurements (roof squares/eave ft, siding wall_sqft, gutter feet)");

  var nameRaw = truthy(job.name) ? job.name : job.address;
  var name = (nameRaw === null || nameRaw === undefined || nameRaw === "") ? "" : String(nameRaw).trim();
  var groups = [];
  rules.groups.forEach(function (g) {
    var n = lines.filter(function (ln) { return ln.group === g.key; }).length;
    if (!n) return;
    var gg = {key: g.key, en: g.en, es: g.es, count: n};
    if (g.key === "siding") {
      gg.en = g.en + " (" + rules.materials[material][0] + ")";
      gg.es = g.es + " (" + rules.materials[material][1] + ")";
    }
    groups.push(gg);
  });
  var tx = rules.text, text = {};
  ["en", "es"].forEach(function (lang) {
    var out = [fill(tx["title_" + lang], {company: rules.company})];
    if (name) out.push(fill(tx["job_" + lang], {name: name}));
    groups.forEach(function (g) {
      out.push("");
      out.push(g[lang]);
      lines.forEach(function (ln) {
        if (ln.group === g.key) out.push("- " + fmt(ln.qty) + " " + ln["unit_" + lang] + " " + ln[lang]);
      });
    });
    if (ask.length) {
      out.push("");
      out.push(fill(tx["ask_" + lang], {items: ask.map(function (a) { return a[lang]; }).join(", ")}));
    }
    out.push("");
    out.push(tx["end_" + lang]);
    text[lang] = out.join("\n");
  });
  return {version: rules.version, kind: kind, name: name, material: material, lines: lines, groups: groups,
          ask_supplier: ask, assumptions: assume, text: text};
}

function takeoff(job, rules) {
  if (!rules || rules.version !== TAKEOFF_RULES_VERSION) throw new Error("material rules doc is missing or a different version");
  return compute(job, rules);
}

function canon(x) {                                           // key-order-free JSON for comparing results
  if (Array.isArray(x)) return "[" + x.map(canon).join(",") + "]";
  if (x && typeof x === "object") return "{" + Object.keys(x).sort().map(function (k) { return JSON.stringify(k) + ":" + canon(x[k]); }).join(",") + "}";
  return JSON.stringify(x);
}

/* Runs rules.test_cases through takeoff(); returns [] when the JS matches Python exactly, else one message per miss. */
function selfCheck(rules) {
  var fails = [];
  (rules.test_cases || []).forEach(function (t) {
    var r;
    try { r = takeoff(t.job, rules); } catch (err) { fails.push(t.name + ": error " + err.message); return; }
    if (canon(r) === canon(t.expect)) return;
    var x = t.expect;
    if (canon(r.lines) !== canon(x.lines)) fails.push(t.name + ": lines differ");
    if (canon(r.text) !== canon(x.text)) fails.push(t.name + ": text differs");
    if (canon(r.assumptions) !== canon(x.assumptions)) fails.push(t.name + ": assumptions differ");
    if (canon(r.ask_supplier) !== canon(x.ask_supplier)) fails.push(t.name + ": ask_supplier differs");
    if (!fails.length || fails[fails.length - 1].indexOf(t.name + ":") !== 0) fails.push(t.name + ": result differs");
  });
  return fails;
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {takeoff: takeoff, compute: compute, selfCheck: selfCheck, up: up, fmt: fmt, canon: canon,
                    TAKEOFF_RULES_VERSION: TAKEOFF_RULES_VERSION};
}

  return {takeoff, selfCheck, TAKEOFF_RULES_VERSION};
})();
</script>

const numv = v => { if (typeof v === 'number' && isFinite(v)) return v; if (typeof v === 'string') { const s = v.replace(/[$,\s]/g, ''); if (s !== '' && isFinite(+s)) return +s; } return null; };
const dayOf = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v) ? v.slice(0, 10) : null);
const yesv = v => v === true || (typeof v === 'string' && v.trim() !== '' && !/^(false|no|0)$/i.test(v.trim()));

const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const toDate = d => new Date(d + 'T12:00:00');
const fmtDay = (d, weekday) => { const o = {month: 'short', day: 'numeric'}; if (weekday) o.weekday = 'short'; if (d.slice(0, 4) !== String(new Date().getFullYear())) o.year = 'numeric'; return toDate(d).toLocaleDateString(locale(), o); };
const daysFromToday = d => Math.round((toDate(d) - toDate(todayStr())) / 86400000);
const fmtWhen = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(locale(), {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}); };

function isoWeek(dstr){   // ISO week id "2026-39"
  const d = toDate(dstr); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day + 3);
  const y = d.getFullYear(); const jan4 = new Date(y, 0, 4, 12); const w = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
  return `${y}-${pad2(w)}`;
}

/* ---------- v16: this week's quick estimates, the same rule as hailhunter/weekly.py estimates() ---------- */
// a lead counts once when its estimate's day falls in the ISO week, whatever its stage: estimate.day (the LOCAL calendar day,
// written since v16) when present, else estimate.at's first 10 characters (UTC; older estimates and ones written without day);
// value = the summed low/high ranges (bad numbers skipped); using_reference = any of them used market prices
const estDay = e => { const ok = d => (/^\d{4}-\d{2}-\d{2}$/.test(d) && ymd(toDate(d)) === d ? d : null);
  return (typeof e.day === 'string' && ok(e.day.trim())) || ok(String(e.at || '').slice(0, 10)); };

  for (const l of list || []) {
    const e = l && l.estimate; if (!e || typeof e !== 'object' || Array.isArray(e) || seen.has(l.id)) continue;
    const day = estDay(e);
    if (!day || isoWeek(day) !== wk) continue;
    seen.add(l.id);
    const lo = moneyOf(e.low), hi = moneyOf(e.high);
    if (lo != null && hi != null) { low += Math.min(lo, hi); high += Math.max(lo, hi); }
    ref = ref || !!e.using_reference;
  }
  const half = x => { const f = Math.floor(x), r = x - f; return r > 0.5 ? f + 1 : r < 0.5 ? f : f % 2 ? f + 1 : f; };   // Python round(): halves go to even

}

  const day = estDay(e); if (!day) return;
  const wk = isoWeek(day), est = e.low == null ? null : {low: e.low, high: e.high, at: e.at, day: e.day, using_reference: !!e.using_reference};
  const now = weekEstimates(leads.map(l => (l.id === id ? Object.assign({}, l, {estimate: est}) : l)), wk);
  const doc = wk === isoWeek(todayStr()) ? weekDoc : null, ev = doc && doc.estimates_value;
  if (doc && numv(doc.estimates) === now.n && ev && ev.low === now.low && ev.high === now.high && !!ev.using_reference === now.using_reference) return;
  save({op: 'stat', path: 'stats/week-' + wk, date: day, src: 'est', vals: {}, est: now, lead: est ? {id, estimate: est} : null, by: 'Quick estimate'}).catch(() => {});

/* ---------- v18: this week's answer rate, the same rule as hailhunter/weekly.py tally() contact_rate ---------- */
// every door tap this ISO week counts once (a doc per day + house); answered = No + Interested + Booked; not home (any spelling
// weekly.py's NOT_HOME accepts) and anything else only add to the doors. Today's taps come from doorDocs so a tap shows at once.
const WK_TALK = ['no', 'interested', 'booked'];
const WK_NOT_HOME = ['not_home', 'nothome', 'not home', 'not-home', 'no_home', 'no esta', 'no está'];

const HOUR = 3600e3;
const arr = v => (Array.isArray(v) ? v.filter(x => x && typeof x === 'object') : []);

function whyHouse(s, kind){

  const h = e && numv(e.hail_in) != null ? fmtIn(numv(e.hail_in)) : null;
  if (h && day) bits.push(es ? `Granizo de ${h}" el ${fmtDay(day)}` : `${h}" hail ${fmtDay(day)}`);
  else if (h) bits.push(es ? `Granizo de ${h}"` : `${h}" hail`);
  else if (day && kind === 'storm') bits.push(es ? `Tormenta del ${fmtDay(day)}` : `Storm ${fmtDay(day)}`);
  const y = yearOf(s); if (y) bits.push(es ? `construida en ${y}` : `built ${y}`);
  return {text: h || y ? bits.join(' · ') : '', hail: h, day, year: y};   // a storm day alone says nothing about this house: no line
}

const KING_APP_RULES = `
This page is the HMP App (tabs Today / Leads / Money). The chat box is FilthE's one inbox: when he (or the boss, or Alex) reports doors, homeowners, inspections, claims or money, LOG IT with these actions (they are checked before anything is saved):
- log_lead {address, city, first_name, phone, source, lead_type, stage, next_step, notes}: add a homeowner lead or update the one at that address. address = house number + street ("1418 Irving St"). source: storm | everyday | referral | sub. lead_type: insurance | cash. stage: not_contacted | contacted | inspection_set | damage_found | claim_filed | adjuster_meeting | approved | job_scheduled | done | lost. Leave out fields you don't know.
- update_lead {address, stage, next_step, notes, first_name, phone, lang, last_contact, contract_price, deposit, paid, payment}: change a lead already in LEADS (contract_price, deposit, paid are dollars for cash jobs; paid = total paid so far). payment {kind: deposit|progress|final, amount, due, paid_on} sets one of the 3 cash-job payments (paid_on YYYY-MM-DD once it is paid). last_contact = "now" (or YYYY-MM-DD) whenever he says he called, texted or talked with that homeowner. lang = "es" or "en", the homeowner's language.
- log_doors {doors, conversations, inspections, signed}: numbers to ADD to this week's totals. Only what he just reported, never the running total. Every door reported counts, even with no address. The app counts each day once: if he also tapped those doors in Today's knock, the bigger number counts, so just log what he said.
Estimates are not a log_doors number: the week counts one per lead when a quick estimate is saved on that lead (its estimate.at date), and none of these actions can set lead.estimate. When he says he gave an estimate, log the lead as usual and tell him to open that lead and tap "Make a quick estimate" ("Hacer un estimado rápido"), then Save to the lead.
- update_claim {address, city, homeowner_first_name, stage, insurer, claim_no, adjuster{name,phone}, date_of_loss, adjuster_date, scope_date, rcv, acv{amount,received,deposited}, depreciation_held, mortgage{company,amount,check_sent,check_returned}, materials{ordered,supplier,cost}, install{start,done}, completion_sent, depreciation_check{amount,date}, contract_price, deductible, next_step, notes, supplement{date,item,asked,approved}}: create or update an insurance claim (one per house). stage: inspected | claim_filed | adjuster_set | scope_in | signed | supplement | materials_ordered | installed | depreciation_requested | paid | lost. Money in dollars (numbers), dates YYYY-MM-DD (received/deposited/check_sent may also be true).
- add_followup {address, en, es, due}: set the next step for a lead or claim (due YYYY-MM-DD).
next_step is always {en, es, due}: one short line in English AND Spanish, e.g. {"en":"Inspection Tue Sep 29, 3 PM","es":"Inspección mar 29 sep, 3 PM","due":"2026-09-29"}. Put the time of day in the words.
Turn day names into real dates from NOW (next Tuesday = the coming Tuesday). "inspection at <house>" = stage inspection_set plus an inspection. "interested" = stage contacted with a call-back follow-up tomorrow. A house with an insurer or claim number also gets update_claim.
Example: "knocked 20, talked to 4, inspection at 1418 Irving Tuesday 3pm" -> [{"type":"log_doors","doors":20,"conversations":4,"inspections":1},{"type":"log_lead","address":"1418 Irving St","city":"Fremont","source":"storm","lead_type":"insurance","stage":"inspection_set","next_step":{"en":"Inspection Tue Sep 29, 3 PM","es":"Inspección mar 29 sep, 3 PM","due":"2026-09-29"}}]
The page shows FilthE a receipt for every write, so your reply can stay short. Never log that HMP covers, waives or discounts a deductible.`;

    const how = await save({op: 'set', path: 'leads/' + id, body: lead});

    return {text: (old ? R.updated : R.logged)(shortAddr(lead.address), lstageName(lead, lead.stage), extra), q: how === 'queued'};
  }
  if (type === 'log_doors') {
    // v16: estimates come only from leads (weekEstimates); a stray `estimates` here is ignored, never counted

    if (!Object.keys(add).length) bad(a.estimates != null && a.estimates !== '' ? R.why.est : R.why.nothing);
    const t0 = todayStr(), wk = isoWeek(t0), taps = weekDoc && weekDoc.walks && weekDoc.walks[t0];
    const how = await save({op: 'stat', path: 'stats/week-' + wk, date: t0, src: 'king', vals: add, est: weekEstimates(leads, wk), by: 'King (live)'});
    return {text: R.doors('+' + statLine(add), wk.slice(5).replace(/^0/, '')) + (taps && numv(taps.doors) ? ' · ' + V().dedupe : ''), q: how === 'queued'};
  }
  if (type === 'update_claim') {
    const address = vAddr(a.address); const old = findBy(claims, address);
    const c = old ? clone(old) : {address, stage: 'inspected', created_at: at}; const id = old ? old.id : slugOf(address); delete c.id;
    const bits = []; let changed = !old;
    for (const f of ['city', 'homeowner_first_name', 'insurer', 'claim_no']) if (a[f]) { c[f] = strv(a[f]).slice(0, 60); changed = true; if (f === 'insurer' || f === 'claim_no') bits.push(c[f]); }
    if (a.stage != null && a.stage !== '') { const s = normStage(a.stage); if (!CLAIM_STAGES.includes(s)) bad(R.why.stage(a.stage)); c.stage = s; changed = true; }
    for (const f of AMOUNT_KEYS) if (a[f] != null && a[f] !== '') { c[f] = vNum(a[f], f); changed = true; }
    for (const f of DATE_KEYS) if (a[f] != null && a[f] !== '') { c[f] = vDate(a[f], f); changed = true; }
    for (const [f, shape] of Object.entries(NESTED)) if (a[f] != null) {
      if (typeof a[f] !== 'object' || Array.isArray(a[f])) bad(R.why.obj(f));
      const o = c[f] && typeof c[f] === 'object' ? c[f] : {};
      for (const [k, t] of Object.entries(shape)) if (a[f][k] != null && a[f][k] !== '') { o[k] = t === 'n' ? vNum(a[f][k], `${f}.${k}`) : t === 'd' ? vDate(a[f][k], `${f}.${k}`) : strv(a[f][k]).slice(0, 60); changed = true; }
      c[f] = o;
    }
    if (a.supplement) { const s = a.supplement; if (typeof s !== 'object') bad(R.why.obj('supplement'));
      const row = {item: strv(s.item).slice(0, 120)}; if (s.date) row.date = vDate(s.date, 'supplement.date'); if (s.asked != null && s.asked !== '') row.asked = vNum(s.asked, 'supplement.asked');
      if (s.approved === true || s.approved === false) row.approved = s.approved; else if (s.approved != null && s.approved !== '') row.approved = vNum(s.approved, 'supplement.approved');
      c.supplements = [...(Array.isArray(c.supplements) ? c.supplements : []), row].slice(-20); changed = true; }
    if (a.next_step) { c.next_step = vNext(a.next_step); changed = true; bits.push(txl(c.next_step)); }
    if (a.notes) { const n = strv(a.notes).slice(0, 600); c.notes = c.notes && old ? `${c.notes}\n${n}`.slice(-1500) : n; changed = true; }
    if (!changed) bad(R.why.empty);
    c.updated_at = at; c.updated_by = 'King (live)';
    const how = await save({op: 'set', path: 'claims/' + id, body: c});
    return {text: R.claim(shortAddr(c.address), a.stage ? cStage(c.stage) : '', bits.join(' · ')), q: how === 'queued'};
  }
  if (type === 'add_followup') {
    const address = vAddr(a.address); const ns = vNext({en: a.en, es: a.es, due: a.due});
    if (!ns.due) bad(R.why.date('due'));
    const lead = findBy(leads, address), claim = findBy(claims, address);
    if (!lead && !claim) bad(R.why.none(address));
    const tgt = lead ? {col: 'leads', doc: lead} : {col: 'claims', doc: claim};
    const body = clone(tgt.doc); delete body.id; body.next_step = ns; body.updated_at = at; body.updated_by = 'King (live)';
    const how = await save({op: 'set', path: `${tgt.col}/${tgt.doc.id}`, body});
    return {text: R.follow(shortAddr(tgt.doc.address || address), txl(ns), fmtDay(ns.due, true)), q: how === 'queued'};
  }
  return null;
}

async function applyActions(actions){

  let hubAsked = false;
  for (const a of actions) {
    const type = String((a && a.type) || '');

      catch (e) { if (e instanceof Skip) receipts.push({ok: false, text: L().rc.skip(e.message)}); else { receipts.push({ok: false, text: L().rc.fail(String(a.address || type))}); if (refused(e)) CAN_EDIT = false; } }
    } else if (HUB_TYPES.includes(type) && !hubAsked) { hubAsked = true; receipts.push({ok: false, text: HB().hubOnly}); }

}
const KING_SOFT = ['cancelled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'rate_limited', 'session_expired', 'invalid_json', 'refused'];

async function askKing(message, quick, retry){
  if (!SAMPLE || !DB || kcBusy) { if (retry) { outbox.push(retry); obSave(); } return; }
  kcBusy = true; kcAdd('you', message);

  const li = kcAdd('king', L().kcThinking); const p = li.querySelector('p');

      {signal: kcCtl.signal, modelTier: quick ? 'quick' : 'default', cache: false});

function subscribeApp(db){

  const ok = () => { if (appState !== 'on') { appState = 'on'; dbState = 'on'; refreshLive(); } };
  const list = snap => snap.docs.filter(d => d.exists).map(d => Object.assign({}, d.data(), {id: d.id}));
  const sig = {}, changed = (k, v) => { const j = JSON.stringify(v); if (sig[k] === j) return false; sig[k] = j; return true; };   // identical snapshots redraw nothing
  const bump = () => { dataVer++; renderAppSoon(); };
  db.collection('leads').onSnapshot(s => { ok(); leadsSeen = true; const v = list(s); if (changed('leads', v)) { leadsRaw = v; applyOverlay(); } else renderAppSoon(); }, fail);
  db.collection('claims').onSnapshot(s => { ok(); const v = list(s); if (changed('claims', v)) { claimsRaw = v; applyOverlay(); } else renderAppSoon(); }, fail);
  db.doc('today/walk').onSnapshot(s => { ok(); const v = s.exists ? s.data() : null; if (changed('walk', v)) { walk = v; bump(); } else renderAppSoon(); }, fail);
  { const mon = weekMonday(todayStr()), sun = addDays(mon, 6);   // v18: this ISO week's taps, for the answer rate (today's come from doorDocs); v19: 8 weeks back, for the streak
    db.collection('doors').where('date', '>=', addDays(mon, -56)).where('date', '<=', sun).onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && v.pid) o[d.id] = v; } if (changed('wkdoors', o)) { weekDoorRaw = o; bump(); } }, () => {}); }
  db.collection('doors').where('date', '==', todayStr()).onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && v.pid) o[pidSafe(v.pid)] = v; } if (changed('doors', o)) { doorRaw = o; mergeDoors(); bump(); } }, () => {});
  db.collection('dnk').onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v) o[d.id] = v; } if (changed('dnk', o)) { dnkRaw = o; applyOverlay(); } }, () => {});
  db.collection('evidence').onSnapshot(s => { const o = {}; for (const d of s.docs) { const v = d.data(); if (v && numv(v.hail_in) != null) o[d.id] = v; } if (changed('ev', o)) { evidence = o; bump(); } }, () => {});
  const t0 = todayStr();
  db.doc('stats/week-' + isoWeek(t0)).onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('wk', v)) { weekDoc = v; bump(); } }, () => {});

  db.doc('stats/streak').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('streak', v)) { streakDoc = v; bump(); } }, () => {});   // v19
  db.doc('system/prices').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('prices', v)) { prices = v; if (openRef && openRef.startsWith('est:')) renderSheet(); if (HO.isOpen()) HO.render(); } },
    () => { if (prices === undefined) { prices = null; if (openRef && openRef.startsWith('est:')) renderSheet(); } });
  db.doc('system/takeoff').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('takeoff', v)) { takeoffRules = v; if (openRef && openRef.startsWith('ord:')) renderSheet(); } },   // v22
    () => { if (takeoffRules === undefined) { takeoffRules = null; if (openRef && openRef.startsWith('ord:')) renderSheet(); } });
  db.doc('hub/summary').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('hub', v)) { hub = v && typeof v === 'object' ? v : null; bump(); } }, () => {});   // v20: the AI hub's copy
  db.doc('meta/guide').onSnapshot(s => { const v = s.exists ? s.data() : null; if (changed('guide', v)) { guideDoc = v; bump(); } }, () => {});
}

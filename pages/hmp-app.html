<title>HMP App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  /* HMP Pro Dark: charcoal metal siding, silver type, HMP orange only for accents and main actions */
  --bg:#1f2024; --bg2:#26272b; --panel:#2a2b2f; --panel2:#35363b; --line:#3b3c41; --line2:#55575e; --shadow:transparent;
  --ink:#f2f3f5; --ink2:#d6d8dc; --mute:#b9bcc2; --label:#c9ccd2;
  --chat:#d6a84e; --chat2:#e9c57f; --chat-soft:rgba(214,168,78,.13);
  --code:#6cc0b5; --code2:#9ad7cf; --code-soft:rgba(108,192,181,.13);
  --board:#f5883a; --board-soft:rgba(245,136,58,.13);
  --working:#4cc38a; --idle:#aab0b8; --sleeping:#8d9097; --waiting:#f5b53a; --blocked:#ef5d50; --done:#4cc38a;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-label:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hmp:#f5883a; --hmp2:#ffa766; --hmp-soft:rgba(245,136,58,.15);
  --crit:#ef5d50; --crit-soft:rgba(239,93,80,.15); --warn:#f5b53a; --warn-soft:rgba(245,181,58,.13);
  --m-in:#4cc38a; --m-in-soft:rgba(76,195,138,.15); --m-mort:#d9a53a; --m-mort-soft:rgba(217,165,58,.15);
  --track:#3b3c41; --scrim:rgba(10,10,12,.7); --lift:0 14px 36px rgba(0,0,0,.5);
  --r:14px; --r-sm:10px;
}
html,body{background:var(--bg);}
body{color:var(--ink);font:15px/1.5 var(--f-body);}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.eyebrow{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1;margin:4px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 .w-chat{color:var(--chat)} h1 .w-code{color:var(--code)}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;padding:7px 10px;background:var(--bg2);border:2px solid var(--line);color:var(--ink2)}
.live .dot{width:8px;height:8px;background:var(--mute);flex:none}
.live[data-state="on"] .dot{background:var(--working);animation:blink 1.4s steps(2,end) infinite}
.live[data-state="off"] .dot{background:var(--blocked)}
@keyframes blink{50%{opacity:.25}}




.sq{display:inline-block;width:9px;height:9px;background:var(--c,var(--mute));flex:none}
.btn{background:var(--panel2);border:2px solid var(--line2);padding:7px 12px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.btn:hover{background:#3b3c41}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.sm{padding:4px 8px;box-shadow:none}
:focus-visible{outline:2px solid var(--chat2);outline-offset:2px}


.panel{background:var(--panel);border:2px solid var(--line);padding:14px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 .src{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:11px;letter-spacing:.04em;padding:3px 8px;border:2px solid var(--c);color:var(--c);background:rgba(0,0,0,.18);white-space:nowrap}
.now{background:var(--bg2);border-left:3px solid var(--c);padding:8px 10px}
.stale{color:var(--waiting)}


@keyframes fresh{from{background:rgba(245,181,58,.2)}to{background:transparent}}
.task{display:inline-block;font-family:var(--f-label);font-size:10px;letter-spacing:.03em;padding:0 5px;border:1px solid var(--line2);color:var(--ink2);margin-left:4px;vertical-align:1px}
.empty{color:var(--mute);font-size:14px;padding:8px 2px}
.tid{font-family:var(--f-label);font-size:11px;color:var(--mute);padding-top:2px}
.tt{font-size:14px}
.tmeta{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.tst{font-family:var(--f-label);font-size:10px;padding:0 6px;border:1px solid var(--c);color:var(--c)}
.s-doing{--c:var(--working)} .s-blocked{--c:var(--blocked)} .s-review{--c:var(--waiting)} .s-todo{--c:var(--mute)} .s-done{--c:var(--done)} .s-parked{--c:var(--sleeping)}

/* answers, receipts, memory */
/* talk to the King */
.kingchat{display:grid;gap:10px;border-color:rgba(245,136,58,.45)}
.kingchat h2{color:#f5883a;margin:0}
.kc-log{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:320px;overflow:auto}
.kc-log:empty{display:none}
.kc-log li{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;font-size:14px}
.kc-log .who{font-family:var(--f-label);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding-top:3px;color:var(--mute)}
.kc-log li.king .who{color:#f5883a}
.kc-log p{margin:0;color:var(--ink)}
.kc-log .did{grid-column:2;font-size:12px;color:var(--done)}
.kc-form{display:flex;gap:8px;flex-wrap:wrap}
.kc-form input{flex:1 1 220px;min-width:0;background:var(--bg);border:2px solid var(--line2);color:var(--ink);padding:8px 10px;font:inherit;font-size:15px}
.kc-status{font-size:13px;color:var(--mute);min-height:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ================= HMP App shell: header, language, tabs ================= */
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hmpmark{display:inline-flex;flex-direction:column;align-items:stretch;margin-right:.2em;vertical-align:bottom}
.hmpmark svg{display:block;width:100%;height:.32em;overflow:visible;margin-bottom:.05em}
.hmpmark b{font-weight:700;letter-spacing:.05em}
h1 .w-app{color:var(--hmp)}
.lang{display:inline-flex;border:2px solid var(--line)}
.lang button{min-width:48px;min-height:40px;background:var(--bg2);border:0;font-family:var(--f-label);font-size:12px;letter-spacing:.04em;cursor:pointer;color:var(--ink2)}
.lang button+button{border-left:2px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--hmp)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--bg);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;background:var(--bg2);border:0;border-right:2px solid var(--line);font:700 15px/1.1 var(--f-body);color:var(--ink2);cursor:pointer;min-width:0}
.tabs button:last-child{border-right:0}
@media (max-width:460px){.tabs button{font-size:14px;padding-inline:2px}}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -4px 0 var(--hmp)}
.tabs .bd{font:400 11px/1 var(--f-label);letter-spacing:.03em;color:var(--mute);min-height:11px;white-space:nowrap}
.tabs .bd.hot{color:var(--board)} .tabs .bd.crit{color:var(--crit)}
.tabp{display:grid;gap:14px;min-width:0}
.kslot{display:contents}
.a-banner{padding:10px 14px;background:var(--bg2);border-left:3px solid var(--line2);font-size:14px;color:var(--ink2)}
.a-banner.bad{border-left-color:var(--crit)}
.kc-form input{min-height:48px}
.kc-form .btn{min-height:48px;padding-inline:16px}
.kc-log .did.no{color:var(--warn)}

/* ================= app building blocks ================= */
.a-sec{background:var(--panel);border:2px solid var(--line);padding:14px;display:grid;gap:12px;min-width:0;align-content:start}
.ah{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.ah .n{font:700 12px/1 var(--f-body);padding:4px 8px;background:var(--panel2);color:var(--ink2)}
.ah .n:empty{display:none}
.ah small{font:400 13px/1.3 var(--f-body);color:var(--mute)}
.a-chip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--f-body);padding:5px 8px;white-space:nowrap;letter-spacing:.02em;background:var(--hmp-soft);color:var(--hmp2);flex:none}
.a-chip.crit{background:var(--crit-soft);color:var(--crit)}
.a-chip.warn{background:var(--warn-soft);color:var(--warn)}
.a-chip.plain{background:var(--track);color:var(--ink2)}
.a-chip.paid{background:var(--m-in-soft);color:var(--m-in)}
.a-chip.lost{background:var(--track);color:var(--mute)}
.a-chip.src{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2);font-weight:600}
.linkbtn{background:none;border:0;color:var(--hmp2);font-weight:700;font-size:15px;padding:10px 0;min-height:44px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.say{display:grid;gap:6px;justify-items:start;background:var(--bg2);border-left:3px solid #f5883a;padding:10px 12px;max-width:62ch}
.say b{font-family:var(--f-label);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#f5883a;font-weight:400}
.say q{font-size:16px;color:var(--ink)}
.say .btn{min-height:40px}
.a-empty{background:var(--panel);border:2px dashed var(--line2);padding:18px 16px;display:grid;gap:14px}
.a-empty h3{margin:0;font:700 24px/1.1 var(--f-display);text-wrap:balance}
.a-empty p{margin:0;color:var(--ink2);max-width:60ch;font-size:16px}
.a-quiet{margin:0;color:var(--mute);font-size:15px}

/* today */
.t-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.t-date{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.t-sum{font-size:15px;color:var(--ink2)}
.t-sum b{color:var(--ink)} .t-sum b.crit{color:var(--crit)} .t-sum b.hot{color:var(--board)}
.today{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.today{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.t-col{display:grid;gap:14px;min-width:0}
.asks-loud{background:var(--board-soft);border:2px solid var(--board);padding:14px;display:grid;gap:10px;box-shadow:4px 4px 0 var(--shadow)}
.asks-loud .ah{color:var(--board);font-size:22px}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qlist li{display:grid;gap:8px;padding:10px 12px;background:var(--bg2);border-left:3px solid var(--board)}
.qlist .qid{font-family:var(--f-label);font-size:11px;color:var(--mute);margin-right:6px}
.qlist .ans,.qlist .ans-done{grid-column:auto;margin-top:0}
.qlist .btn.sm{min-height:44px;padding:8px 14px;font-size:12px}
.qlist .ans input{min-height:44px;font-size:15px}
.fu{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fu button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--bg2);border:2px solid var(--line);padding:10px 12px;min-height:56px;cursor:pointer}
.fu button:hover{border-color:var(--line2)}
.fu .addr{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.fu .kind{font-family:var(--f-label);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-left:8px}
.fu .what{grid-column:1 / -1;font-size:15px;color:var(--ink2);overflow-wrap:anywhere}
.fu.later button{min-height:0;border-style:dashed}
.mytasks{list-style:none;margin:0;padding:0;display:grid}
.mytasks li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.mytasks li:last-child{border-bottom:0}
.mytasks .tt{font-size:15px}
.wk{display:grid;gap:10px}
.wk-row{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) 48px;gap:10px;align-items:center}
.wk-l{font-size:15px;color:var(--ink2)}
.wk-b{height:14px;background:var(--track);position:relative}
.wk-b i{position:absolute;left:0;top:0;bottom:0;background:var(--hmp);border-radius:0 4px 4px 0}
.wk-v{font:700 24px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.wk-last{font-size:13px;color:var(--mute);margin:0}
.wk-sub{grid-column:1 / -1;margin:-6px 0 0;font-size:12px;line-height:1.3;color:var(--label);text-align:right;font-variant-numeric:tabular-nums}
.wk-sub .mk{white-space:nowrap} .wk-sub b{color:var(--warn);font-weight:700}
.wk-b .wk-norm{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--mute);border-right:1px dashed var(--mute);pointer-events:none}   /* v18: the 20-40% normal band */
.wk-note{grid-column:1 / -1;margin:-6px 0 0;font-size:12px;line-height:1.35;color:var(--mute);text-wrap:pretty}
.go{display:grid;gap:8px}
.go a{display:grid;gap:2px;padding:12px 14px;background:var(--bg2);border:2px solid var(--line);color:var(--ink);text-decoration:none;min-height:60px;align-content:center}
.go a:hover{border-color:var(--hmp)}
.go a b{font-size:16px} .go a b::after{content:" ↗";color:var(--hmp)}
.go a span{font-size:13px;color:var(--mute)}

/* leads */
.fbar{display:grid;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:2px solid var(--line)}
.seg button{min-height:48px;background:var(--bg2);border:0;border-right:2px solid var(--line);font:700 15px/1.1 var(--f-body);color:var(--ink2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--hmp)}
.seg button small{font:400 11px/1 var(--f-label);color:var(--mute);margin-left:6px}
.srcf{display:flex;flex-wrap:wrap;gap:6px}
.srcf button{min-height:42px;padding:6px 14px;background:var(--bg2);border:2px solid var(--line);font:600 14px/1 var(--f-body);color:var(--ink2);cursor:pointer}
.srcf button[aria-pressed="true"]{border-color:var(--hmp);color:var(--ink);background:var(--hmp-soft)}
.a-cards{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:860px){.a-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:fl}
.flow li{counter-increment:fl;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px 4px 4px;background:var(--bg2);color:var(--ink2)}
.flow li::before{content:counter(fl);width:20px;height:20px;display:grid;place-items:center;font:700 12px/1 var(--f-display);background:var(--track);color:var(--ink2)}

/* cards (leads, claims, cash jobs) */
.a-card{display:grid;gap:10px;align-content:start;text-align:left;width:100%;cursor:pointer;background:var(--panel);border:2px solid var(--line);padding:14px;color:var(--ink);box-shadow:4px 4px 0 var(--shadow)}
.a-card:hover{border-color:var(--line2)}
.a-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.a-card > span{display:block;min-width:0}
.c-top{display:flex!important;justify-content:space-between;align-items:flex-start;gap:10px}
.c-top > span:first-child{min-width:0}
.c-addr{display:block;font:700 21px/1.1 var(--f-display);overflow-wrap:anywhere}
.c-meta{display:block;font-size:14px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.c-meta:empty{display:none}
.c-meta .clm{color:var(--ink2);font-weight:700}
.c-meta .nw{white-space:nowrap}
.c-tags{display:flex!important;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.a-card.compact{gap:8px;padding-block:12px}
.a-card.compact .c-addr{font-size:18px}
.c-line{font-size:14px;color:var(--mute)}
.c-line b{color:var(--ink);font-variant-numeric:tabular-nums}
.a-track{display:grid!important;grid-template-columns:repeat(var(--n,10),minmax(0,1fr));gap:3px}
.a-track i{display:block;height:8px;background:var(--track)}
.a-track i.done{background:var(--ink2)}
.a-track i.now{background:var(--hmp);box-shadow:0 0 0 2px var(--hmp-soft)}
.a-track.paid i{background:var(--m-in)}
.a-track.lost i{background:var(--track)}
.track-lbl{display:flex!important;justify-content:space-between;gap:4px 8px;font-size:13px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.track-lbl b{color:var(--ink)}
.a-next{display:grid!important;gap:6px;background:var(--bg2);padding:10px 12px;border-left:3px solid var(--line2)}
.a-next.overdue{background:var(--crit-soft);border-left-color:var(--crit)}
.a-next .lbl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.a-next .lbl > b{font:400 10px/1.4 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.a-next .txt{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.a-next .txt.none{color:var(--mute);font-style:italic}
.c-money{display:grid!important;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;border-top:1px solid var(--line);padding-top:10px}
.c-money.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.c-money .k{display:flex;align-items:center;gap:6px;font:400 10px/1.4 var(--f-label);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.c-money .v{display:block;font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.c-money .parts{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.c-money .none{grid-column:1 / -1;font-size:14px;color:var(--mute)}

/* money totals (ported from the Claim Tracker) */
.money{background:var(--panel);border:2px solid var(--line);display:grid;box-shadow:4px 4px 0 var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{padding:14px 16px 12px;display:grid;gap:4px;min-width:0;align-content:start}
.tile + .tile{border-left:1px solid var(--line)}
.tile .k{font:400 10px/1.4 var(--f-label);color:var(--mute);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.tile .v{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--mute)}
.msw{width:10px;height:10px;flex:none;display:inline-block}
.msw.in{background:var(--m-in)}
.msw.hand{background:repeating-linear-gradient(135deg,var(--m-in) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--m-in)}
.msw.mort{background:var(--m-mort)}
.msw.owed{background:var(--track);box-shadow:inset 0 0 0 1px var(--mute)}
.moneybar-wrap{padding:12px 16px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.moneybar{display:flex;gap:2px;height:14px}
.moneybar > span{display:block;height:100%;min-width:3px}
.moneybar .in{background:var(--m-in)}
.moneybar .hand{background:repeating-linear-gradient(135deg,var(--m-in) 0 3px,transparent 3px 6px);box-shadow:inset 0 0 0 1px var(--m-in)}
.moneybar .mort{background:var(--m-mort)}
.moneybar .owed{background:var(--track)}
.moneynote{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute)}
.moneynote span{display:inline-flex;align-items:center;gap:6px}
.moneynote b{color:var(--ink)}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile:nth-child(3){border-left:0}
  .tile:nth-child(n+3){border-top:1px solid var(--line)}
  .tile .v{font-size:26px}
}

.ph.gone::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font:700 22px/1 var(--f-display)}
.ph-add{display:grid;gap:8px}
.ph-add .pickrow button{min-height:40px}
.ph-file{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:8px 16px;background:var(--hmp);color:#1b1206;font:700 15px/1 var(--f-body);cursor:pointer;justify-self:start}
.ph-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.ph-file:focus-within{outline:3px solid var(--hmp2);outline-offset:2px}
.ph-status{font-size:14px;color:var(--ink2);margin:0}

.ph-h{display:flex!important;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ph-safety{margin:0;padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);font-size:14px;line-height:1.4;color:var(--ink)}
.slots{list-style:none;margin:0;padding:0;display:grid;gap:0}
.slot{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot.after{border-top:2px dashed var(--line2);margin-top:4px}
.chk{width:40px;height:40px;border:2px solid var(--line2);background:var(--bg2);color:#08130f;font:800 20px/1 var(--f-body);cursor:pointer;display:grid;place-items:center}
.slot.on .chk{background:var(--m-in);border-color:var(--m-in)}

.slot:not(.on) .chk:disabled{opacity:.5}
.sl-t{display:grid;gap:2px;min-width:0}

.sl-t > span{font-size:13px;color:var(--ink2);line-height:1.35}
.sl-ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sl-ph .ph{width:64px;height:64px}
.ph-file.sm{min-height:40px;padding:6px 10px;font-size:13px;white-space:nowrap}
@media (max-width:420px){.slot{grid-template-columns:40px minmax(0,1fr)}.slot .ph-file{grid-column:2;justify-self:start}}
.ph-pairw{display:grid;gap:6px}
.ph-view{display:grid;gap:8px;background:var(--bg2);border:2px solid var(--line2);padding:10px}
.ph-view img{width:100%;max-height:60vh;object-fit:contain;background:#000}
.ph-view .acts{display:flex;flex-wrap:wrap;gap:8px}
.ph-view .acts button{min-height:44px}

/* money: things to chase, words, staged cash payments */
.chase{background:var(--panel);border:2px solid var(--warn);padding:12px 14px;display:grid;gap:8px}
.chase details{border-top:1px solid var(--line);padding-top:8px}
.chase details:first-of-type{border-top:0;padding-top:0}
.chase summary{cursor:pointer;font:700 17px/1.3 var(--f-body);list-style-position:inside;min-height:32px}
.chase summary .n{font:800 22px/1 var(--f-display);margin-right:4px}
.chase .warn{color:var(--warn)} .chase .crit{color:var(--crit)}
.chase ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.chase li button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--bg2);border:1px solid var(--line);padding:8px 10px;cursor:pointer;min-height:44px}
.chase li .a{font-weight:700;overflow-wrap:anywhere}
.chase li .d{font:700 13px/1.2 var(--f-body);white-space:nowrap}
.chase li .w{grid-column:1 / -1;font-size:13px;color:var(--ink2)}
.gloss{margin:0;display:grid;gap:4px;font-size:14px;color:var(--ink2);background:var(--bg2);padding:10px 12px}
.gloss b{color:var(--ink)}
.defn{color:var(--label)}
.paytrack{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pay{display:grid!important;gap:2px;padding:8px;background:var(--bg2);border-top:4px solid var(--track);min-width:0}
.pay .k{font:700 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.pay .v{font:700 19px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.pay .s{font-size:12px;line-height:1.25;color:var(--ink2);overflow-wrap:anywhere}
.pay.paid{border-top-color:var(--m-in)} .pay.paid .s{color:var(--m-in)}
.pay.late{border-top-color:var(--warn)} .pay.late .s{color:var(--warn);font-weight:700}
.pay.late30{border-top-color:var(--crit);background:var(--crit-soft)} .pay.late30 .s{color:var(--crit);font-weight:700}

/* King chat receipts: one colored line each, full text on tap (QA 2) */
.kc-log .rcs{grid-column:2;display:grid;gap:4px}
.rc{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--m-in);background:var(--m-in-soft);color:var(--ink);padding:6px 8px;font:700 13px/1.3 var(--f-body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px}
.rc.q{border-left-color:var(--warn);background:var(--warn-soft)}
.rc.no{border-left-color:var(--crit);background:var(--crit-soft)}
.rc[aria-expanded="true"]{white-space:normal}
.kc-log p{font-size:15px}


@keyframes pulse{50%{transform:scale(1.18)}}

/* boss view (O6): Spanish only, big text */
.boss{display:grid;gap:16px}
body.bossmode .tabs,body.bossmode .tabp,body.bossmode .lang,body.bossmode #appBanner{display:none!important}
.b-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.b-top h2{margin:0;font:800 34px/1 var(--f-display)}
.b-top p{margin:4px 0 0;font-size:18px;color:var(--ink2)}
.b-exit{min-height:52px;padding:10px 18px;background:var(--panel2);border:2px solid var(--line2);color:var(--ink);font:700 18px/1 var(--f-body);cursor:pointer}
.b-money{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.b-num{background:var(--panel);border:2px solid var(--line);padding:16px;display:grid;gap:6px}
.b-num .k{font:700 18px/1.2 var(--f-body);color:var(--label)}
.b-num .v{font:800 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.b-num.in .v{color:var(--m-in)} .b-num.owed .v{color:var(--hmp2)} .b-num.mort .v{color:var(--m-mort)}
.b-num .s{font-size:16px;color:var(--ink2)}
.b-sec{background:var(--panel);border:2px solid var(--line);padding:16px;display:grid;gap:12px}
.b-sec h3{margin:0;font:800 26px/1.1 var(--f-display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.b-sec h3 small{font:700 18px/1 var(--f-body);color:var(--label)}
.b-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.b-list li{display:grid;gap:4px;padding:12px 14px;background:var(--bg2);border-left:5px solid var(--hmp)}
.b-list li.cash{border-left-color:var(--m-in)}
.b-list li.bad{border-left-color:var(--crit)}
.b-list .a{font:700 22px/1.15 var(--f-display);overflow-wrap:anywhere}
.b-list .s{font-size:18px;line-height:1.35;color:var(--ink)}
.b-list .m{font-size:17px;color:var(--ink2);font-variant-numeric:tabular-nums}
.b-empty{margin:0;font-size:19px;color:var(--ink2)}
.b-foot{font-size:15px;color:var(--label);margin:0}

/* ================= HMP Pro Dark: rounded, subtle, one accent ================= */

}

/* ================= T52 quick estimate (EstimateScreen) =================
   Uses the HMP App tokens (--bg --bg2 --panel --panel2 --line --line2 --ink --ink2 --mute --label --hmp --hmp2
   --hmp-soft --warn --warn-soft --m-in --f-display --f-label --f-body). Every class starts with .est */
.est{display:grid;gap:14px;min-width:0;position:relative}
.est-sec{background:var(--panel);border:2px solid var(--line);padding:14px 16px;display:grid;gap:12px;min-width:0}
.est-h{margin:0;font:600 17px/1.1 var(--f-display);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.est-h small{font:400 13px/1.3 var(--f-body);color:var(--mute)}
.est-lbl{font:400 11px/1.3 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--label)}

/* job picker: four big tiles */
.est-jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.est-jobs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.est-job{display:grid;gap:3px;align-content:center;justify-items:start;text-align:left;min-height:76px;min-width:0;padding:10px 12px;background:var(--bg2);border:2px solid var(--line);cursor:pointer;color:var(--ink2)}
.est-job b{font:700 clamp(19px,2.4vw + 8px,22px)/1 var(--f-display);color:var(--ink);letter-spacing:.01em;max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.est-job span{font-size:12px;line-height:1.25;color:var(--mute)}
.est-job:hover{border-color:var(--line2)}
.est-job[aria-pressed="true"]{background:var(--panel2);border-color:var(--hmp);box-shadow:inset 0 -4px 0 var(--hmp)}
.est-job[aria-pressed="true"] span{color:var(--ink2)}

/* segmented choices (material, size mode, pitch, stories, layers) */
.est-seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:2px solid var(--line)}
.est-seg button{min-height:48px;padding:6px 6px;background:var(--bg2);border:0;border-right:2px solid var(--line);font:700 15px/1.1 var(--f-body);color:var(--ink2);cursor:pointer;display:grid;gap:2px;align-content:center;justify-items:center}
.est-seg button:last-child{border-right:0}
.est-seg button small{font:400 11px/1.1 var(--f-body);color:var(--mute)}
.est-seg button[aria-pressed="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--hmp)}
.est-seg button[aria-pressed="true"] small{color:var(--ink2)}
.est-row{display:grid;gap:6px;min-width:0}

/* steppers */
.est-step{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.est-step:first-of-type{border-top:0;padding-top:2px}
.est-step .est-what{display:grid;gap:1px;min-width:0}
.est-step .est-what b{font-size:15px;font-weight:700}
.est-step .est-what span{font-size:12px;color:var(--mute)}
.est-ctl{display:flex;align-items:stretch;border:2px solid var(--line2);background:var(--bg)}
.est-ctl button{width:44px;min-height:52px;background:var(--bg2);border:0;font:700 22px/1 var(--f-display);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.est-ctl button.big{width:40px;font-size:14px;color:var(--ink2)}
.est-ctl button:hover{background:var(--panel2)}
.est-ctl button:active{background:var(--line2)}
.est-ctl button:disabled{opacity:.35;cursor:default}
.est-ctl input{width:74px;min-width:0;background:var(--bg);border:0;border-inline:2px solid var(--line);text-align:center;color:var(--ink);font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:0 2px}
.est-ctl input:focus{outline:2px solid var(--hmp);outline-offset:-2px}
@media (max-width:560px){.est-step{grid-template-columns:minmax(0,1fr)}.est-step .est-what{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}.est-ctl{justify-self:stretch}.est-ctl input{flex:1;width:auto}.est-ctl button{flex:none;width:52px}.est-ctl button.big{width:48px}}
.est-ctl .u{align-self:center;padding:0 8px 0 0;font:400 12px/1 var(--f-body);color:var(--mute);background:var(--bg);display:none}
.est-roughout{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--bg2);padding:10px 12px;font-size:14px;color:var(--ink2)}
.est-roughout b{font:700 18px/1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.est-tag{display:inline-flex;align-items:center;font:700 12px/1 var(--f-body);letter-spacing:.08em;padding:5px 8px;background:var(--warn);color:#1d1403;flex:none}
.est-hint{margin:0;font-size:13px;color:var(--mute)}

/* result: the one bordered-in-orange object on the screen */
.est-res{background:var(--panel);border:2px solid var(--hmp);display:grid;min-width:0}
.est-ref{display:grid;grid-template-columns:10px minmax(0,1fr);gap:1px 10px;padding:9px 14px;background:var(--warn-soft);border-bottom:1px solid var(--line);color:var(--ink2);font-size:13px;line-height:1.4}
.est-ref::before{content:"";width:10px;height:10px;background:var(--warn);margin-top:4px;grid-row:1 / span 2}
.est-ref b{color:var(--warn);font-size:14px;font-weight:700}
.est-ref span{grid-column:2}
.est-own{padding:8px 14px;font-size:13px;color:var(--m-in);border-bottom:1px solid var(--line)}
.est-res-in{padding:14px 16px 16px;display:grid;gap:10px}
.est-res-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.est-range{margin:0;font:800 clamp(40px,12vw,58px)/.95 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.005em;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .18em}
.est-range i{font-style:normal;color:var(--mute);font-weight:600}
.est-what-line{margin:0;font-size:15px;color:var(--ink2)}
.est-notfinal{margin:0;font-size:14px;color:var(--ink);font-weight:700}
.est-ins{margin:0;font-size:14px;color:var(--ink2);padding:8px 10px;background:var(--bg2)}
.est-rough-note{margin:0;font-size:13px;color:var(--warn)}
.est-math{border-top:1px solid var(--line);padding-top:6px}
.est-math summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--hmp2);list-style:none}
.est-math summary::-webkit-details-marker{display:none}
.est-math summary::before{content:"+";font:700 18px/1 var(--f-display);width:20px;text-align:center;color:var(--hmp)}
.est-math[open] summary::before{content:"\2212"}
.est-lines{display:grid}
.est-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.est-line:first-child{border-top:0}
.est-line .n{font-size:14px}
.est-line .a{font:700 17px/1.1 var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.est-line .h{grid-column:1 / -1;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.est-line .mk{font:700 10px/1 var(--f-body);letter-spacing:.05em;color:var(--warn);margin-left:6px}
.est-line.tot .n{font-weight:700}
.est-line.tot .a{font-size:20px}
.est-line.min .n{color:var(--warn)}

/* calm states */
.est-calm{background:var(--panel);border:2px dashed var(--line2);padding:18px 16px;display:grid;gap:8px}
.est-calm h3{margin:0;font:700 22px/1.1 var(--f-display)}
.est-calm p{margin:0;color:var(--ink2);font-size:15px;max-width:60ch}

/* text + save */
.est-msg{margin:0;background:var(--bg2);padding:12px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text;border-left:3px solid var(--line2)}
.est-acts{display:flex;flex-wrap:wrap;gap:8px}
.est-btn{min-height:48px;padding:10px 16px;background:var(--panel2);border:2px solid var(--line2);color:var(--ink);font:700 15px/1.1 var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.est-btn:hover{background:var(--line)}
.est-btn.go{background:var(--hmp);border-color:var(--hmp);color:#1b1206}
.est-btn.go:hover{background:var(--hmp2)}
.est-btn:disabled{opacity:.5;cursor:default}
.est-small{margin:0;font-size:13px;color:var(--mute)}
.est-lead{display:grid;gap:2px}
.est-lead b{font:700 20px/1.1 var(--f-display);overflow-wrap:anywhere}
.est-lead span{font-size:13px;color:var(--mute)}

/* phone: the range stays in sight while you change the inputs */

.est-peek .est-tag{font-size:11px;padding:4px 6px}

/* the v14 HMP Pro Dark finish: rounded, 1px card borders, buttons in the display face */

.est-res{overflow:hidden}

.est-btn{font-size:16px}
@media (prefers-reduced-motion:reduce){.est *{transition:none!important;animation:none!important}}

.est-saved{margin:0;font:700 18px/1.3 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.k-goalnote{margin:-4px 0 0;font-size:13px;line-height:1.4;color:var(--mute);max-width:60ch}
/* ================= v17: print today's walk (the layout of docs/print/walk-sheet.html, inside the app) ================= */
.k-print{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding-top:4px}
.k-print .btn{min-height:44px;padding-inline:14px;font-size:13px}

.d-est{padding:2px 0 0}
.d-est .linkbtn{padding:4px 0;min-height:40px;font-size:14px}
.app-toast .t-act{margin-left:10px;background:var(--hmp);color:#1b1206;border:0;padding:7px 10px;font:700 13px/1.2 var(--f-body);cursor:pointer;min-height:36px}
.app-toast .t-act:focus-visible{outline:2px solid var(--bg);outline-offset:2px}
#psView{--char:#404145; --char-dk:#2a2b2f; --ink:#1f2023; --orange:#f5883a; --orange-ink:#b4561a; --silver:#c9ccd1;
  --line:#dcdee2; --rule:#9b9ea4; --mist:#eceef0; --muted:#5c5f66; --paper:#ffffff; --cols: 0.3in 2.1in repeat(4, 0.7in) 1fr;
  position:fixed;inset:0;z-index:70;background:#2a2b2f;overflow:auto;overscroll-behavior:contain;color:var(--ink);

#psView .ws-bar .ws-seg button{background:transparent;color:var(--silver);border:0;border-radius:0;min-width:48px}
#psView .ws-bar .ws-seg button[aria-pressed="true"]{background:var(--silver);color:var(--char-dk)}
#psView .ws-go{background:var(--orange);color:#1b1b1d;border:0}
#psView button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- the page ---------- */

  box-shadow:0 10px 40px rgba(0,0,0,.45); overflow:hidden; }

  border-bottom:2pt solid var(--char-dk); position:relative; }

#psView .ws-rows > .ws-band:first-child { margin-top:0; }

  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#psView .ws-band .ws-st small { font:700 6.8pt/1 "Montserrat"; letter-spacing:.1em; color:var(--muted); margin-left:0.05in; }

/* ================= v19: Next-step coach, why this house, knock streak, estimate extras ================= */
.ns{background:var(--panel);border:2px solid var(--hmp);border-radius:var(--r);padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.ns.fin{border-color:var(--m-in)}
.ns-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ns-bar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;flex:1 1 120px;max-width:220px}
.ns-bar i{height:6px;border-radius:3px;background:var(--track)}
.ns-bar i.done{background:var(--ink2)} .ns-bar i.now{background:var(--hmp)}
.ns.fin .ns-bar i{background:var(--m-in)}
.ns-of{font:600 12px/1.2 var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--label);font-variant-numeric:tabular-nums}
.ns.fin .ns-of{color:var(--m-in)}
.ns-finp{margin:0;color:var(--ink2);font-size:15px}
.ns-name{margin:0;font:700 26px/1.05 var(--f-display);text-wrap:balance}
.ns-lb,.ns-say b,.ns-must b,.ns-tip b,.ns-info b{display:block;font:600 11px/1.3 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--label);margin-bottom:4px}
.ns-say{background:var(--bg2);border-left:3px solid var(--hmp);border-radius:var(--r-sm);padding:10px 12px}
.ns-say q{display:block;font-size:17px;line-height:1.45;color:var(--ink);quotes:"“" "”"}
.ns-sec{display:grid;min-width:0}
.ns-ask{margin:0;padding:0 0 0 18px;display:grid;gap:6px;font-size:15px;line-height:1.4}
.ns-ask li::marker{color:var(--hmp)}
.ns-ask small{display:block;font-size:13px;color:var(--mute);font-style:italic}
.ns-tip{margin:0;padding:8px 12px;background:var(--bg2);border-radius:var(--r-sm);font-size:14px;line-height:1.4;color:var(--ink2)}
.ns-tip b{color:var(--hmp2)}
.ns-ck{list-style:none;margin:0;padding:0;display:grid}
.ns-it{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ns-it:first-child{border-top:0;padding-top:2px}
.ns-it .chk{width:36px;height:36px;font-size:18px}
.ns-it.on .chk{background:var(--m-in);border-color:var(--m-in)}
.ns-it:not(.on) .chk:disabled{opacity:.55}
.ns-it.must:not(.on) .chk{border-color:var(--warn)}
.ns-itt{display:grid;gap:4px;min-width:0;padding-top:7px;font-size:15px;line-height:1.35}
.ns-it.on .ns-itt > span:first-child{color:var(--ink2)}
.ns-val{font-size:13px;color:var(--label);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ns-hint{margin:0;font-size:13px;color:var(--mute)}
.ns-hint.warn{color:var(--warn);font-weight:700}
.ns-tell{padding:2px 0;min-height:32px;font-size:14px}
.ns-opt button{min-height:40px;min-width:72px}
.ns-it .ph-file{justify-self:start}
.ns-txt{display:grid;gap:6px;padding:10px 12px;background:var(--bg2);border-radius:var(--r-sm)}
.ns-txt b{font:600 12px/1.3 var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--label)}
.ns-ok{font-size:13px;color:var(--m-in);font-weight:700}
.ns-msg{margin:0;font-size:14px;line-height:1.4;color:var(--ink2);user-select:text;overflow-wrap:anywhere}
.ns-acts{display:flex;flex-wrap:wrap;gap:8px}
.ns-acts .btn{min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
.ns-info{margin:0;padding:8px 12px;border:1px dashed var(--line2);border-radius:var(--r-sm);font-size:14px;line-height:1.4;color:var(--ink2)}
.ns-cancel{border-style:solid;border-color:var(--line2);color:var(--ink);font-weight:600}
.ns-must{margin:0;padding:10px 12px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:var(--r-sm);font-size:14px;line-height:1.45;color:var(--ink)}
.ns-must b{color:var(--warn)}
.ns-pick{display:grid;gap:8px;padding:12px;background:var(--bg2);border-radius:var(--r-sm)}
.ns-pick p{margin:0;font:700 17px/1.2 var(--f-display)}
.ns-pick .k-l{font:600 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.ns-done{width:100%;min-height:58px;padding:10px 16px;border:0;border-radius:var(--r-sm);background:var(--hmp);color:#1b1206;font:700 21px/1.1 var(--f-display);letter-spacing:.01em;cursor:pointer}
.ns-done:hover{background:var(--hmp2)}
.ns-done:disabled{background:var(--track);color:var(--mute);cursor:default}
.ns-done:focus-visible,.nm button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ns-then{margin:-4px 0 0;font-size:13px;color:var(--mute);text-align:center}
/* Today: your next moves */
.nm{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nm button{width:100%;text-align:left;display:grid;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;color:var(--ink)}
.nm button:hover{border-color:var(--hmp)}
.nm-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--hmp);color:#1b1206;font:700 14px/1 var(--f-display);flex:none}
.nm-s{font:700 18px/1.1 var(--f-display);flex:1 1 auto}
.nm-a{font-size:15px;color:var(--ink2);overflow-wrap:anywhere}
.nm-do{font-size:13px;color:var(--label)}
/* Today's knock: why this house */
.d-why{flex-basis:100%;font:600 14px/1.3 var(--f-body);color:var(--hmp2);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.k-now .d-why{font-size:16px}
.door.done .d-why{color:var(--mute);font-weight:500}
/* week box: knock streak */
.wk-streak{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:0 0 12px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.st-now{display:flex;align-items:baseline;gap:10px;min-width:0}
.st-now b{font:700 40px/1 var(--f-display);color:var(--hmp);font-variant-numeric:tabular-nums}
.st-now span{font-size:15px;color:var(--ink2)}
.st-best{display:grid;justify-items:end;gap:2px}
.st-best span{font:600 11px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--label)}
.st-best b{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.st-sub{grid-column:1 / -1;margin:0;font-size:13px;line-height:1.35;color:var(--mute)}
/* quick estimate: extras (rules v2) + national price note */
.est-extras > summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;min-height:28px}
.est-extras > summary::-webkit-details-marker{display:none}
.est-extras > summary::before{content:"+";font:700 20px/1 var(--f-display);color:var(--hmp);width:14px}
.est-extras[open] > summary::before{content:"–"}
.est-extras > summary small{font-size:13px;color:var(--mute)}
.est-exrows{display:grid;gap:10px;margin-top:10px}
.est-nat{margin:0;font-size:12px;line-height:1.4;color:var(--warn)}
/* ================= split (v20): the AI hub's copy of FilthE's tasks + questions (hub/summary), read-only ================= */
.hub-go{justify-self:start;display:inline-flex;align-items:center;min-height:44px;color:var(--hmp2);font:700 16px/1.2 var(--f-display);letter-spacing:.01em;text-decoration:underline;text-underline-offset:3px}
.hub-go:focus-visible{outline:2px solid var(--hmp2);outline-offset:2px}
.hub-foot{margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 14px;font-size:13px;color:var(--label)}
.hub-foot .old{color:var(--warn)}
.asks-loud .a-quiet{font-size:14px}
.mytasks .tst{margin-left:8px;vertical-align:1px;white-space:nowrap;border-radius:999px;padding:1px 8px}
/* ================= v21: homeowner screen, "Daylight report" (option B). A light, separate scope: the rest of the app stays Pro Dark ================= */
.ho-launch .el-go{color:var(--hmp)}
.ho-sum{margin:0;font-size:14px;color:var(--ink2)}
.ho-sum b{color:var(--ink)}
.est-show{display:grid;gap:4px;margin-top:4px}
.est-show .est-btn{justify-content:flex-start;gap:10px}
.est-show small{font-size:12px;color:var(--mute)}
#hoView{--h-paper:#f4f2ee;--h-card:#ffffff;--h-ink:#1f2023;--h-char:#404145;--h-char-dk:#2a2b2f;--h-muted:#5b5f67;--h-line:#e2dfd8;
  --h-orange:#f5883a;--h-orange-ink:#9c4a16;--h-tint:#fdf1e7;--h-mist:#efede8;--h-ok:#2f6b4f;--h-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  color-scheme:light;position:fixed;inset:0;z-index:75;overflow:auto;overscroll-behavior:contain;background:var(--h-paper);color:var(--h-ink);
  font:500 15px/1.45 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#hoView *{box-sizing:border-box}
#hoView :focus-visible{outline:3px solid var(--h-orange);outline-offset:2px}
#hoView button{font:inherit;color:inherit;cursor:pointer}
#hoView h1,#hoView h2,#hoView h3,#hoView p{margin:0}
#hoView .ho-head{background:linear-gradient(180deg,#46474c,#35363a);color:#fff;padding-top:env(safe-area-inset-top,0px)}
#hoView .ho-in{max-width:820px;margin:0 auto;padding:10px 16px 14px}
#hoView .ho-row{display:flex;align-items:center;gap:8px}
#hoView .ho-logo{display:inline-grid;justify-items:center;margin-right:auto;line-height:1}
#hoView .ho-logo svg{width:74px;height:12px;display:block}
#hoView .ho-logo b{font:800 25px/0.95 "Barlow Semi Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;color:#eef0f2;background:linear-gradient(180deg,#fff,#c9ccd1);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#hoView .ho-logo small{font:700 7.5px/1.2 "Montserrat",sans-serif;letter-spacing:.14em;color:#c9ccd1;border-top:2px solid var(--h-orange);padding-top:2px;margin-top:1px}
#hoView .ho-ic{min-width:44px;min-height:44px;display:grid;place-items:center;border:1px solid #6a6c73;border-radius:10px;background:rgba(255,255,255,.04);color:#e6e8eb;padding:0}
#hoView .ho-ic svg{width:20px;height:20px}
#hoView .ho-ic[aria-pressed="true"]{background:var(--h-orange);border-color:var(--h-orange);color:#1b1206}
#hoView .ho-langs{display:flex;background:rgba(0,0,0,.28);border-radius:10px;padding:3px}
#hoView .ho-langs button{min-width:44px;min-height:38px;border:0;border-radius:8px;background:transparent;color:#c9ccd1;font:700 15px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.04em}
#hoView .ho-langs button[aria-pressed="true"]{background:#fff;color:var(--h-ink)}
#hoView .ho-who{margin-top:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px;color:#c9ccd1}
#hoView .ho-who b{font:700 20px/1.1 "Barlow Semi Condensed",sans-serif;color:#fff;overflow-wrap:anywhere}
#hoView .ho-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#d9dbdf;background:rgba(255,255,255,.09);border-radius:99px;padding:3px 10px;flex-basis:100%;max-width:max-content}
#hoView .ho-chip svg{width:12px;height:12px}
#hoView .ho-steps{position:sticky;top:0;z-index:3;background:var(--h-paper);border-bottom:1px solid var(--h-line)}
#hoView .ho-steps .ho-sin{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;gap:6px}
#hoView .ho-steps button{flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 8px;border:0;border-radius:99px;background:var(--h-mist);color:var(--h-muted);font:700 15px/1.05 "Barlow Semi Condensed",sans-serif}
#hoView .ho-steps button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hoView .ho-steps i{font-style:normal;width:22px;height:22px;border-radius:50%;background:#cfccc4;color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
#hoView .ho-steps button[aria-current="step"]{background:var(--h-char);color:#fff}
#hoView .ho-steps button[aria-current="step"] i{background:var(--h-orange);color:var(--h-ink)}
#hoView .ho-steps button.done i{background:var(--h-char)}
#hoView .ho-wrap{max-width:820px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
#hoView h1{font:800 36px/1.02 "Barlow Semi Condensed","Arial Narrow",sans-serif;margin-top:16px;text-wrap:balance;letter-spacing:0}
#hoView .ho-sub{color:var(--h-muted);font-size:15px;margin-top:-8px}
#hoView .ho-card{background:var(--h-card);border-radius:14px;padding:16px;box-shadow:var(--h-shadow)}
#hoView .ho-lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--h-muted)}
/* photos with numbered circles */
#hoView .ho-plist{display:grid;gap:14px}
#hoView .ho-pcard{background:var(--h-card);border-radius:14px;overflow:hidden;box-shadow:var(--h-shadow);min-width:0}
#hoView .ho-ph{position:relative;background:#16171a;min-height:120px;touch-action:manipulation}
#hoView .ho-ph img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;margin:0 auto}
#hoView .ho-ph .ho-mks{position:absolute;inset:0;pointer-events:none}
#hoView .ho-ph.gone{display:grid;place-items:center;color:#c9ccd1;font-size:13px;padding:24px}
#hoView .ho-ph.gone img,#hoView .ho-ph.gone .ho-mks{display:none}
#hoView .ho-ph .ho-gone{display:none}
#hoView .ho-ph.gone .ho-gone{display:block}
#hoView .ho-mk{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;pointer-events:none;padding:0;border:0;background:transparent}
#hoView .ho-mk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hoView .ho-mk b{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--h-orange);color:var(--h-ink);font:800 15px/24px "Barlow Semi Condensed",sans-serif;text-align:center;box-shadow:0 0 0 2px #fff}
#hoView.rep .ho-ph{cursor:crosshair;outline:3px dashed var(--h-orange);outline-offset:-3px}
#hoView.rep .ho-mk{pointer-events:auto;cursor:pointer}
#hoView .ho-cap{display:flex;gap:12px;padding:12px 14px 14px;align-items:flex-start}
#hoView .ho-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--h-char);color:#fff;font:800 17px/30px "Barlow Semi Condensed",sans-serif;text-align:center}
#hoView .ho-cap b{display:block;font:700 20px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-cap div > span{color:var(--h-muted);font-size:14px}
#hoView .ho-cap .ho-undo{margin-left:auto;flex:none}
#hoView .ho-empty{background:var(--h-card);border:2px dashed #d3cfc6;border-radius:14px;padding:18px;display:grid;gap:6px}
#hoView .ho-empty b{font:700 22px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-empty p{color:var(--h-muted)}
/* hail + insurance */
#hoView .ho-two{display:grid;gap:14px}
#hoView .ho-hail .ho-cols{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:8px}
#hoView .ho-big{font:800 60px/.9 "Barlow Semi Condensed",sans-serif;font-variant-numeric:tabular-nums}
#hoView .ho-big small{font-size:24px;color:var(--h-muted);margin-left:3px}
#hoView .ho-like{color:var(--h-muted);font-size:14px;margin-top:6px}
#hoView .ho-scale{width:118px;height:auto;display:block}
#hoView .ho-facts{margin-top:14px;display:grid;gap:8px}
#hoView .ho-facts div{background:var(--h-mist);border-radius:10px;padding:9px 12px;display:grid}
#hoView .ho-facts b{font:700 18px/1.2 "Barlow Semi Condensed",sans-serif}
#hoView .ho-facts em{font-style:normal;font-size:12px;color:var(--h-muted)}
#hoView .ho-src{color:var(--h-muted);font-size:12px;margin-top:10px}
#hoView .ho-caveat{margin-top:12px;padding:10px 12px;border-radius:10px;border:1.5px dashed #bdb8ae;font-size:13.5px;color:var(--h-char);display:flex;gap:10px}
#hoView .ho-caveat svg{flex:none;width:18px;height:18px;margin-top:1px}
#hoView .ho-ins{background:var(--h-char);color:#fff}
#hoView .ho-ins b{display:block;font:700 22px/1.18 "Barlow Semi Condensed",sans-serif;margin-bottom:6px}
#hoView .ho-ins p{color:#dcdee2;font-size:14px}
/* options */
#hoView .ho-cmp{background:var(--h-card);border-radius:14px;overflow:hidden;box-shadow:var(--h-shadow)}
#hoView .ho-cols3{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
#hoView .ho-col{padding:12px 6px 12px;text-align:center;border:0;border-right:1px solid var(--h-line);background:transparent;display:grid;align-content:start;justify-items:center;gap:3px;min-width:0}
#hoView .ho-col:last-child{border-right:0}
#hoView .ho-col.rec{background:var(--h-tint);box-shadow:inset 0 4px 0 var(--h-orange)}
#hoView .ho-col[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--h-char)}
#hoView .ho-col.rec[aria-pressed="true"]{box-shadow:inset 0 4px 0 var(--h-orange),inset 0 0 0 3px var(--h-char)}
#hoView .ho-rib{font:800 11px/1.2 "Barlow Semi Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--h-orange-ink);min-height:14px}
#hoView .ho-name{font:800 13.5px/1.1 "Barlow Semi Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--h-muted)}
#hoView .ho-what{font:700 16px/1.1 "Barlow Semi Condensed",sans-serif;min-height:36px;overflow-wrap:anywhere}
#hoView .ho-price{font:800 20px/1.08 "Barlow Semi Condensed",sans-serif;margin-top:6px;font-variant-numeric:tabular-nums}
#hoView .ho-price span{display:block;white-space:nowrap}
#hoView .ho-pick{font-size:11.5px;font-weight:700;color:var(--h-muted);margin-top:6px;min-height:16px}
#hoView .ho-col[aria-pressed="true"] .ho-pick{color:var(--h-ok)}
#hoView .ho-rng{text-align:center;font-size:12.5px;font-weight:700;color:var(--h-char);padding:9px 12px;border-top:1px solid var(--h-line);background:#faf9f6}
#hoView .ho-tbl{overflow-x:auto}
#hoView table{width:100%;border-collapse:collapse}
#hoView td{border-top:1px solid var(--h-line);padding:9px 6px;font-size:12.5px;text-align:center;vertical-align:middle;width:calc(100% / var(--n,3))}
#hoView td.rec{background:var(--h-tint)}
#hoView tr.sec td{text-align:left;font-size:12.5px;font-weight:700;color:var(--h-char);background:#faf9f6;padding:8px 12px 6px}
#hoView tr.grp td{text-align:left;font:800 12px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--h-orange-ink);background:var(--h-card);padding:12px 12px 4px;border-top:2px solid var(--h-line)}
#hoView td svg{width:18px;height:18px;vertical-align:middle}
#hoView td .no{color:#a19c93;font-weight:700}
#hoView td .txt{font-weight:600;line-height:1.25}
#hoView .ho-note{color:var(--h-muted);font-size:13.5px}
#hoView .ho-warr{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--h-char)}
#hoView .ho-warr svg{flex:none;width:22px;height:22px}
#hoView .ho-out{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--h-card);border:1.5px solid var(--h-char);border-radius:12px;color:var(--h-ink);text-decoration:none}
#hoView .ho-out .sw{display:flex;gap:3px;flex:none}
#hoView .ho-out .sw i{width:14px;height:28px;border-radius:3px}
#hoView .ho-out b{display:block;font:700 18px/1.15 "Barlow Semi Condensed",sans-serif}
#hoView .ho-out span span{font-size:12.5px;color:var(--h-muted)}
#hoView .ho-out .arr{margin-left:auto;font:800 22px "Barlow Semi Condensed",sans-serif;color:var(--h-orange-ink)}
/* next steps */
#hoView .ho-stps{display:grid;gap:12px}
#hoView .ho-stp{background:var(--h-card);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;box-shadow:var(--h-shadow)}
#hoView .ho-stp .n{font:800 48px/.85 "Barlow Semi Condensed",sans-serif;color:var(--h-orange);width:30px}
#hoView .ho-stp b{display:block;font:800 23px/1.1 "Barlow Semi Condensed",sans-serif}
#hoView .ho-stp p{color:var(--h-muted);font-size:14.5px;margin-top:3px}
#hoView .ho-cancel{margin-top:10px;padding:11px 12px;border-radius:10px;background:var(--h-tint);border-left:4px solid var(--h-orange);font-size:13.5px;color:var(--h-char)}
#hoView .ho-cancel b{display:inline;font:700 16px "Barlow Semi Condensed",sans-serif;color:var(--h-ink)}
#hoView .ho-contact{background:var(--h-char);color:#fff;border-radius:16px;padding:16px;display:grid;gap:0}
#hoView .ho-contact .q{font:700 20px "Barlow Semi Condensed",sans-serif;margin-bottom:4px}
#hoView .ho-contact a{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
#hoView .ho-contact a:first-of-type{border-top:0}
#hoView .ho-contact .ic{width:46px;height:46px;border-radius:50%;background:var(--h-orange);display:grid;place-items:center;flex:none}
#hoView .ho-contact .ic svg{width:21px;height:21px}
#hoView .ho-contact .nm{font-size:13px;color:#dcdee2;font-weight:600}
#hoView .ho-contact .tel{font:800 30px/1 "Barlow Semi Condensed",sans-serif;margin-top:2px;font-variant-numeric:tabular-nums;user-select:text}
#hoView .ho-foot{color:var(--h-muted);font-size:12px;line-height:1.6}
#hoView .ho-foot .blank{display:inline-block;width:90px;border-bottom:1px solid var(--h-muted);margin-left:2px}
#hoView .ho-next{justify-self:stretch;min-height:54px;border:0;border-radius:12px;background:var(--h-orange);color:#1b1206;font:800 20px/1 "Barlow Semi Condensed",sans-serif;letter-spacing:.02em}
/* rep tools: only while the rep has them on */
#hoView .ho-rep{border:2px dashed var(--h-orange);background:#fff8f1;border-radius:14px;padding:12px 14px;display:grid;gap:10px;margin-top:14px}
#hoView .ho-rep h2{font:800 13px/1.2 "Barlow Semi Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--h-orange-ink);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}

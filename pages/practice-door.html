<title>Practice Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Practice Door v10 (2026-09-27): the HMP App v25 design system, theme A "Ledger" + "Ledger Night"
   (docs/design/v25-polish/ds.css, design-system.md, icons.js). Every color is a token; no #fff/white/black in
   components. Orange (--hmp) = the one "do this" button per screen. */
:root{
  color-scheme:light;
  --bg:#f6f7f8; --card:#ffffff; --soft:#eff1f3; --line:#e3e5e8; --line-2:#d3d6db;
  --ink:#18191c; --ink-2:#3d3f45; --muted:#6c6f77; --faint:#9a9da4;
  --hmp:#f5883a; --hmp-press:#e7762a; --hmp-ink:#a4520f; --hmp-bg:#fdf1e7; --on-hmp:#1b1206;
  --late:#c2362b; --late-bg:#fdecea; --late-line:#f1c7c2; --warn:#8a5a00; --warn-bg:#fbf2dc; --warn-line:#ecd9a8;
  --ok:#1f7a4d; --ok-bg:#e7f4ed; --you:#2f6fde;
  --on-ink:#ffffff; --bar:rgba(255,255,255,.94); --scrim:rgba(24,25,28,.38); --thumb:#ffffff;
  --me:#18191c; --on-me:#ffffff;
  --e1:0 1px 2px rgba(24,25,28,.05); --e2:0 16px 40px -12px rgba(24,25,28,.28),0 2px 6px rgba(24,25,28,.06);
  --f:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --t-label:12px; --t-cap:13px; --t-body:15px; --t-row:17px; --t-title:20px; --t-addr:26px; --t-hero:60px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;
  --hit:44px; --hit-md:48px; --hit-lg:56px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101113; --card:#191a1d; --soft:#232428; --line:#2b2d31; --line-2:#3a3c42;
  --ink:#f1f2f4; --ink-2:#c9cbd0; --muted:#8f929a; --faint:#6b6e75;
  --hmp-ink:#ffa766; --hmp-bg:rgba(245,136,58,.14);
  --late:#ff7166; --late-bg:rgba(255,113,102,.13); --late-line:rgba(255,113,102,.34); --warn:#f0b54a; --warn-bg:rgba(240,181,74,.12); --warn-line:rgba(240,181,74,.3);
  --ok:#4cc38a; --ok-bg:rgba(76,195,138,.13); --you:#5b8ff0;
  --on-ink:#101113; --bar:rgba(25,26,29,.94); --scrim:rgba(0,0,0,.55); --thumb:#f1f2f4;
  --me:#2e3036; --on-me:#f1f2f4;
  --e1:0 0 0 rgba(0,0,0,0); --e2:0 18px 48px -12px rgba(0,0,0,.7),0 0 0 1px #2b2d31;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101113; --card:#191a1d; --soft:#232428; --line:#2b2d31; --line-2:#3a3c42;
  --ink:#f1f2f4; --ink-2:#c9cbd0; --muted:#8f929a; --faint:#6b6e75;
  --hmp-ink:#ffa766; --hmp-bg:rgba(245,136,58,.14);
  --late:#ff7166; --late-bg:rgba(255,113,102,.13); --late-line:rgba(255,113,102,.34); --warn:#f0b54a; --warn-bg:rgba(240,181,74,.12); --warn-line:rgba(240,181,74,.3);
  --ok:#4cc38a; --ok-bg:rgba(76,195,138,.13); --you:#5b8ff0;
  --on-ink:#101113; --bar:rgba(25,26,29,.94); --scrim:rgba(0,0,0,.55); --thumb:#f1f2f4;
  --me:#2e3036; --on-me:#f1f2f4;
  --e1:0 0 0 rgba(0,0,0,0); --e2:0 18px 48px -12px rgba(0,0,0,.7),0 0 0 1px #2b2d31;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--t-body);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* icons: one set, 24 grid, 1.75 stroke, round joins */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}.i-lg{width:24px;height:24px}
.label,.eyebrow{font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.h2{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:var(--r-sm);font-size:12px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink-2)}
.chip .i{width:13px;height:13px;stroke-width:2}

/* ---------- frame + top bar ---------- */
.app{max-width:560px;margin:0 auto;padding-inline:var(--s4)}
.top{display:flex;align-items:center;gap:var(--s3);min-height:60px}
.mark{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
.mark svg{width:26px;height:8px;fill:none;stroke:var(--hmp);stroke-width:3.2;stroke-linejoin:round}
.mark b{font-weight:600;font-size:12px;letter-spacing:.1em}
.top h1{flex:1;min-width:0;font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{flex:none;display:flex;background:var(--soft);border-radius:var(--r-md)}
.lang button{min-width:48px;height:var(--hit);padding:0 var(--s2);border:3px solid var(--soft);border-radius:var(--r-md);font:500 12px/1 var(--mono);letter-spacing:.05em;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(24,25,28,.12)}

.screen{display:flex;flex-direction:column;gap:var(--s4);padding-bottom:var(--s8)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.actions{display:grid;gap:var(--s2)}

/* ---------- buttons: one orange per screen ---------- */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--hit-lg);padding:0 var(--s5);border-radius:var(--r-md);background:var(--hmp);color:var(--on-hmp);font-size:var(--t-row);font-weight:600;letter-spacing:-.01em}
.btn-primary:active{background:var(--hmp-press)}
.btn-ghost{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--hit-md);padding:0 var(--s4);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);color:var(--ink);font-size:var(--t-body);font-weight:600}
.btn-small{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);padding:0 var(--s3);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);color:var(--ink);font-size:var(--t-cap);font-weight:500;white-space:nowrap}
.btn-small .i{width:17px;height:17px}
.btn-ghost:active,.btn-small:active{background:var(--soft)}

/* ---------- setup ---------- */
#scrSetup{padding-bottom:0}
.intro{display:grid;gap:var(--s2);justify-items:start}
.lede{color:var(--ink-2);max-width:42ch}
.count{display:inline-flex;align-items:center;min-height:24px;padding:3px var(--s2);border-radius:var(--r-sm);background:var(--hmp-bg);color:var(--hmp-ink);font-size:12.5px;font-weight:500;line-height:1.35}
.practice{display:grid;gap:var(--s3)}
.focus{padding:var(--s4);display:grid;gap:var(--s2)}
.focus-t{font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.focus-how{color:var(--ink-2)}
.trend{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:var(--t-cap);color:var(--muted)}
.trend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2)}
.trend i.on{background:var(--ok);border-color:var(--ok)}
.trend span{margin-left:6px;font-variant-numeric:tabular-nums}
.prog{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3) var(--s4);margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line)}
.week{display:flex;gap:6px}
.week div{display:grid;justify-items:center;gap:5px;font:500 12px/1 var(--mono);color:var(--muted)}
.week i{width:22px;height:22px;border-radius:6px;background:var(--soft)}
.week i.on{background:var(--ink)}
.week .today{color:var(--ink)}
.week .today i{box-shadow:inset 0 0 0 1.5px var(--ink)}
.prog-nums{display:flex;gap:var(--s4)}
.stat{display:grid;gap:2px;align-content:start}
.stat b{font-size:var(--t-title);font-weight:600;line-height:1.1;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;line-height:1.25;color:var(--muted);max-width:12ch}
.store-note{flex-basis:100%;font-size:var(--t-cap);color:var(--warn)}
/* list rows (quick drill, skill drills) */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink)}
.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .t b{font-weight:600;font-size:var(--t-body);line-height:1.3}
.row .t span{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.row .chev{color:var(--faint);transition:transform .2s var(--ease)}
.lead{width:36px;height:36px;border-radius:var(--r-md);background:var(--soft);color:var(--ink-2);display:grid;place-items:center;flex:none}
.lead.hot{background:var(--hmp-bg);color:var(--hmp-ink)}
.skills summary{list-style:none;cursor:pointer}
.skills summary::-webkit-details-marker{display:none}
.skills[open] summary .chev{transform:rotate(180deg)}
.skill-list{display:grid;border-top:1px solid var(--line)}
.skill{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink)}
.skill + .skill{border-top:1px solid var(--line)}
.skill > span:not(.ks){flex:1;min-width:0;display:grid;gap:2px}
.skill .kt{font-weight:500;line-height:1.3}
.skill .kg{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.skill .kd{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2)}
.skill .kd.pass{background:var(--ok);border-color:var(--ok)}
.skill .kd.miss{background:var(--warn);border-color:var(--warn)}
.skill .ks{flex:none;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.skill .ks.pass{color:var(--ok)}.skill .ks.miss{color:var(--warn)}
/* practice street (offer card) */
.ticket{padding:var(--s4);display:grid;gap:var(--s3)}
.ticket .addr{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin-top:calc(var(--s1) * -1)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border:1px solid var(--line);border-radius:var(--r-md)}
.stats > div{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;min-width:0;padding:10px var(--s3)}
.stats > div + div{border-left:1px solid var(--line)}
.stats dt{font-size:var(--t-cap);color:var(--muted)}
.stats dd{margin:0;font-size:var(--t-title);font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .hail dd{color:var(--hmp-ink)}
.ago{display:flex;gap:6px;align-items:flex-start;font-size:var(--t-cap);color:var(--ink-2)}
.ago .i{width:16px;height:16px;margin-top:1px;color:var(--hmp-ink)}
/* rookie switch */
.rookie{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.rookie .t{flex:1;min-width:0;display:grid;gap:2px}
.rookie .rt{font-weight:600;line-height:1.3}
.rookie .rs{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:var(--r-pill);background:var(--line-2);transition:background .18s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s var(--ease)}
.rookie[aria-checked="true"] .sw{background:var(--ok)}
.rookie[aria-checked="true"] .sw::after{transform:translateX(20px)}
.rookie[aria-checked="true"] .lead{background:var(--ok-bg);color:var(--ok)}
/* homeowner cards */
.who-sec{display:grid;gap:var(--s3)}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.who-grp{grid-column:1/-1;margin-top:var(--s3)}
.who-grp:first-child{margin-top:0}
.who{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-areas:"ic ck" "name name" "tag tag" "chips chips";grid-template-rows:auto auto auto 1fr;row-gap:2px;align-content:start;min-width:0;min-height:var(--hit);padding:var(--s3);text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.who-ic{grid-area:ic;width:32px;height:32px;margin-bottom:6px;border-radius:var(--r-sm);background:var(--soft);color:var(--ink-2);display:grid;place-items:center}
.who-ic .i{width:18px;height:18px}
.who-ck{grid-area:ck;justify-self:end;align-self:start;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--on-ink)}
.who-ck .i{width:13px;height:13px;stroke-width:2.6;visibility:hidden}
.who-name{grid-area:name;font-weight:600;line-height:1.25}
.who-tag{grid-area:tag;font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.who-chips{grid-area:chips;align-self:end;display:flex;flex-wrap:wrap;gap:4px;padding-top:var(--s2)}
.who[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.who[aria-pressed="true"] .who-ck{background:var(--ink);border-color:var(--ink)}
.who[aria-pressed="true"] .who-ck .i{visibility:visible}
.who[aria-pressed="true"] .who-ic{background:var(--hmp-bg);color:var(--hmp-ink)}
.who-wide,.who-random{grid-column:1/-1;grid-template-columns:32px minmax(0,1fr) 22px;grid-template-areas:"ic name ck" "ic tag ck" "ic chips ck";grid-template-rows:auto auto 1fr;column-gap:var(--s3)}
.who-random{grid-template-areas:"ic name ck" "ic tag ck";grid-template-rows:auto auto;align-items:center}
.who-wide .who-ic,.who-random .who-ic{margin-bottom:0}
.lvl{display:inline-flex;align-items:flex-end;gap:2px;height:11px;margin-right:2px}
.lvl i{width:3px;border-radius:1px;background:var(--line-2)}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:8px}.lvl i:nth-child(3){height:11px}
.lvl i.on{background:currentColor}
.goal{padding:var(--s4);display:grid;gap:var(--s3)}
.goal-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:var(--s3);font-size:var(--t-cap)}
.goal-row .lbl{font-weight:500;color:var(--ink-2)}
.stones{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stones i{height:6px;border-radius:3px;background:var(--line)}
.stones i.on{background:var(--ink)}
.goal-row .n{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.field{padding:var(--s4);display:grid;gap:var(--s3)}
.field > label{font-size:var(--t-cap);color:var(--muted)}
.tbox{width:100%;resize:vertical;min-height:64px;padding:var(--s3);font:16px/1.4 var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md)}
.tbox:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--soft)}
.tbox::placeholder{color:var(--muted)}
.tbox:disabled{opacity:.7}
.field-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3)}
.field-status{font-size:var(--t-cap);font-weight:500;color:var(--ink-2)}
.field-status.bad{color:var(--late)}.field-status.ok{color:var(--ok)}
.field-list summary{display:flex;align-items:center;min-height:var(--hit);font-weight:500;cursor:pointer}
.field-list .objs{margin-top:var(--s1)}
.obj-x{justify-self:start;margin-top:var(--s1)}
.knock-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);margin-inline:calc(var(--s4) * -1);padding:var(--s3) var(--s4);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.knock-bar .btn-primary{white-space:nowrap;padding-inline:var(--s3)}
.knock-bar .btn-ghost{width:auto;min-height:var(--hit-lg);white-space:nowrap}

/* ---------- at the door: a messaging screen ---------- */
#scrDoor{gap:var(--s3);padding-bottom:128px}
.chat-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:grid;gap:var(--s2);margin-inline:calc(var(--s4) * -1);padding:var(--s2) var(--s4) var(--s3);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.ch-row,.ch-row2{display:flex;align-items:center;gap:var(--s3)}
.doorway{position:relative;flex:none;width:44px;height:44px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hmp-bg);color:var(--hmp-ink)}
.doorway::after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--faint);border:2.5px solid var(--card)}
.doorway.open::after{background:var(--ok)}
.doorway.knocking::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--hmp);animation:ring 1.3s var(--ease) infinite}
.doorway.knocking .av{animation:knock .9s ease-in-out 1}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes knock{0%,100%{transform:none}10%,40%,70%{transform:translateX(-2px)}25%,55%,85%{transform:translateX(2px)}}
.ch-who{flex:1;min-width:0;display:grid;gap:1px}
.porch-who{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.porch-addr{font-size:var(--t-cap);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pips{flex:1;min-width:0;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.pips i{flex:1;max-width:30px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ink)}
.pips span{margin-left:var(--s2);white-space:nowrap;font-variant-numeric:tabular-nums}
.divider{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s1)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider > span{display:inline-flex;align-items:center;gap:6px;font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  const keys = REAL.filter(k => k !== S.lastActual), tot = keys.reduce((a, k) => a + (w[k] || 1), 0);

  for (const k of keys) { r -= (w[k] || 1); if (r <= 0) return k; }
  return keys[keys.length - 1];
}

  [['“Why fix it if I’m selling?”', '“¿Para qué lo arreglo si voy a vender?”'], ["Buyers' inspectors check the roof and siding first. A free estimate tells you the cost, so you can fix it or price it in. Your call.", 'El inspector del comprador revisa primero el techo y el siding. Un estimado gratis le dice cuánto cuesta, y usted decide si lo arregla o lo descuenta del precio.'], 'selling'],

  [['“Is this legal? I’ve heard of scams.”', '“¿Esto es legal? He oído de estafas.”'], ["Good question. Here's my card: we're from Fremont, registered and insured. The look is free and I ask for no money today. You can also call Nebraska's Department of Insurance consumer line, 1-877-564-7323.", 'Buena pregunta. Aquí está mi tarjeta: somos de Fremont, registrados y asegurados. La revisión es gratis y hoy no le pido dinero. También puede llamar a la línea para consumidores del Departamento de Seguros de Nebraska: 1-877-564-7323.'], ['recien', 'checklist']],

  [['“The adjuster said no damage.”', '“El ajustador dijo que no hay daño.”'], ["I can't promise a check or argue with them. I can take free photos. If there's damage, you can ask for a re-inspection and I'll be there.", 'No le puedo prometer un cheque ni pelear con ellos. Le tomo fotos gratis. Si hay daño, usted pide otra inspección y yo voy a estar ahí.'], 'adjno'],

  /* Added 2026-09-26 (v5, research rounds 15-18). */
  [['“You’re one of those storm chasers.”', '“Usted es de esos que persiguen tormentas.”'], ["Fair question. I'm based right here in Fremont, not from out of state. We're registered with the state and insured. Here's my card with our local number. Mind if I take a free look?", 'Buena pregunta. Soy de aquí, de Fremont, no de otro estado. Estamos registrados con el estado y asegurados. Aquí está mi tarjeta con nuestro número local. ¿Le parece si reviso gratis?'], ['chaser', 'retiree']],
  [['“My insurance agent said to wait.”', '“Mi agente de seguros me dijo que espere.”'], ["That's fair, I won't tell you what to do about your policy. A free look just gets you photos you can show your agent. Looking isn't filing a claim.", 'Está bien, no le voy a decir qué hacer con su póliza. Una revisión gratis le da fotos para enseñarle a su agente. Revisar no es hacer un reclamo.'], 'agentwait'],
  [['“I already had a guy look at it.”', '“Ya me lo revisó alguien.”'], ["Good. What did he check, the vents and gutters too? Hail bruises can be hard to spot. A free second look with photos takes about 10 minutes.", 'Qué bueno. ¿Qué revisó, también los ventiladores y las canaletas? Los golpes de granizo a veces no se ven fácil. Una segunda revisión gratis, con fotos, toma unos 10 minutos.'], 'hadlook'],
  [['“Sorry, my English… ¿habla español?”', '“Perdón, mi inglés… ¿habla español?”'], ['Switch right away: “¡Claro que sí! Soy Kenny de HMP Siding & Roofing, una compañía de techos y siding de aquí de Fremont.” Then keep going in Spanish.', 'Cambia de inmediato: “¡Claro que sí! Soy Kenny de HMP Siding & Roofing, una compañía de techos y siding de aquí de Fremont.” Y sigue en español.'], ['rogelio', 'dad', 'recien']],
  [['“I rent. Want the owner’s cell?”', '“Yo rento. ¿Quiere el celular del dueño?”'], ["Thanks, the office line is best. Who owns the house, and what's the company's name?", 'Gracias, mejor el teléfono de la oficina. ¿Quién es el dueño y cómo se llama la compañía?'], ['rental', 'renter']],
  [['“If I sign today, can you start next week?”', '“Si firmo hoy, ¿empiezan la otra semana?”'], ["I'll write you an estimate range first, not the final price. If you sign, you get a 3-day cancel form, in writing, every time. Can I come back Saturday at 10 with it?", 'Primero le escribo un rango de estimado, no es el precio final. Si firma, siempre le doy la forma para cancelar en 3 días, por escrito. ¿Regreso el sábado a las 10 con eso?'], 'oldhouse'],
  [['“What do you give if I send my sister your way?”', '“¿Qué me dan si les mando a mi hermana?”'], ["Thank you, that means a lot. We don't do gifts, just a real thank-you, and we'll take great care of her.", 'Muchas gracias, eso vale mucho. No damos regalos, solo un agradecimiento de verdad, y la vamos a atender muy bien.'], 'oldhouse'],

  /* v9 (T153, data/objection_scripts_2.json): state facts, never coach a cancel, never disparage; honest no-damage; HOA = the association's claim. */
  [['“I already signed with another company.”', '“Ya firmé con otra compañía.”'], ["Good, you're moving on it. I'm not here to talk you out of anything. If you signed in the last 3 business days, Nebraska gives you the right to cancel, and that's your call. Either way, ask them who handles the warranty. Want a free second look at the scope?", 'Qué bien que ya está avanzando. No vengo a convencerlo de nada. Si firmó en los últimos 3 días hábiles, la ley de Nebraska le da derecho a cancelar, y eso lo decide usted. De todas formas, pregúnteles quién atiende la garantía. ¿Quiere una segunda revisión del alcance, gratis?'], 'signed'],
  [['“You didn’t find anything? My neighbor got a new roof.”', '“¿No encontró nada? A mi vecino le dieron techo nuevo.”'], ["Good news for you: I checked the slopes, vents and gutters and found no hail or wind damage. I won't file something that isn't there. Here are the photos. If a neighbor asks who checked your roof, I'd appreciate the introduction.", 'Buenas noticias: revisé las pendientes, los respiraderos y las canaletas y no encontré daño de granizo ni de viento. No voy a reportar algo que no existe. Aquí están las fotos. Si un vecino pregunta quién revisó su techo, le agradecería la recomendación.'], 'nodamage'],
  /* v9 (data/price_objections.json). */
  [['“Can you just give me a number over the phone?”', '“¿Me puede dar un número por teléfono?”'], ["I'd rather not guess. The real number depends on what I can only see up close: the ventilation, the decking, how many layers are up there. A phone guess that's wrong is worse for both of us. The look is free, about 20 minutes. Can I come by Saturday at 10?", 'Prefiero no adivinar. El número real depende de lo que solo se ve de cerca: la ventilación, la madera debajo de las tejas, cuántas capas tiene. Un número por teléfono que sale mal es peor para los dos. La revisión es gratis, unos 20 minutos. ¿Puedo pasar el sábado a las 10?'], 'phonequote'],
  [['“Should I even bother getting the other two bids?”', '“¿Para qué pido las otras dos cotizaciones?”'], ["Yes, get them, I'd do the same. When you have all three, line them up on scope and warranty, not just the bottom number. I'll leave you everything written out so it's easy to compare.", 'Sí, pídalas, yo haría lo mismo. Cuando tenga las tres, compárelas en el alcance y la garantía, no solo en el precio final. Le dejo todo por escrito para que sea fácil comparar.'], 'threebids'],
  [['“Who pays the deductible? Can you help with my claim?”', '“¿Quién paga el deducible? ¿Me ayuda con mi reclamo?”'], ["That's actually the association's claim, not yours. The roof is common property under the HOA's master policy, and the board decides. I can give the board a written roof report. Can I get the management company's office number?", 'Ese reclamo en realidad le toca a la asociación, no a usted. El techo es propiedad común bajo la póliza maestra de la HOA, y decide la junta. Le puedo dar a la junta un reporte por escrito del techo. ¿Me da el teléfono de la oficina de la compañía administradora?'], 'hoa'],

  [['“So insurance is paying for a new roof, right?”', '“¿Entonces el seguro me paga un techo nuevo?”'], ["Here's what I found, in the photos. Your insurance company decides what's covered, and the deductible is always your part. It's your claim and your call: if you file, you call them, and I can meet the adjuster and show what I found.", 'Esto es lo que encontré, en las fotos. Su aseguradora decide lo que cubre, y el deducible siempre es su parte. El reclamo es suyo y usted decide: si lo presenta, usted les llama, y yo puedo estar con el ajustador y enseñarle lo que encontré.'], 'founddmg'],
  [['“Can you knock the deductible off? Or throw in the gutters free?”', '“¿Me quita el deducible del precio? ¿O me regala las canaletas?”'], ["I can't. The deductible is always your part: Nebraska law says so, and it's printed in the contract. What I can do is go over the work on your insurance company's scope with you, line by line. Policy questions go to them.", 'No puedo. El deducible siempre es su parte: así lo dice la ley de Nebraska, y viene escrito en el contrato. Lo que sí puedo hacer es revisar con usted, punto por punto, el trabajo que aprobó su seguro. Las preguntas sobre su póliza, con ellos.'], 'deductShock'],
  [['“Can you bill my insurance directly? I’ll just pay the deductible.”', '“¿No le puede cobrar directo al seguro? Yo nomás pago el deducible.”'], ["We never go on your check or take over your claim. Your insurer pays you, and your mortgage company if it's on the policy, and you pay us on the written schedule. The deductible is always your part.", 'Nosotros nunca vamos en su cheque ni tomamos su reclamo. Su aseguradora le paga a usted, y a su banco hipotecario si aparece en la póliza, y usted nos paga según el calendario por escrito. El deducible siempre es su parte.'], 'checkday'],
  [['“Why is my mortgage company on the check?”', '“¿Por qué viene el banco hipotecario en el cheque?”'], ["That's normal when there's a mortgage: they sign it too. Call their loss-draft department (insurance claims) and ask for their steps. I'll give you the itemized list of the work and anything they need from us.", 'Es normal cuando hay hipoteca: ellos también lo firman. Llame al departamento de loss draft (reclamos de seguro) de su banco y pregunte qué pasos piden. Yo le doy la lista detallada del trabajo y lo que necesiten de nosotros.'], 'checkday'],
  [['“They only sent $6,200. That won’t buy a roof.”', '“Solo mandaron $6,200. Con eso no alcanza para un techo.”'], ["That first check is usually the actual cash value: the roof's age gets held back. Your deductible also comes out of that first check: that's your part. Ask your insurance company whether the held-back part comes after the work is done. I can't promise what they release, but I can go over the work on the scope with you.", 'Ese primer cheque casi siempre es el valor real en efectivo: le descuentan la edad del techo. Y de ese primer cheque ya le descontaron el deducible: esa es su parte. Pregúntele a su aseguradora si lo que descontaron por la edad llega después de terminar el trabajo. No le puedo prometer lo que van a liberar, pero sí puedo repasar con usted el trabajo que aprobó el seguro.'], 'checkday'],
  [['“Can you talk the adjuster into a whole roof?”', '“¿Puede convencer al ajustador de un techo completo?”'], ["I'll be here early and show him every hit, with photos and measurements. The adjuster decides, and the money side is between you and your insurance company. If something gets missed, we send it in writing with photos.", 'Llego temprano y le enseño cada golpe, con fotos y medidas. El ajustador decide, y lo del dinero es entre usted y su aseguradora. Si se les pasa algo, lo mandamos por escrito con fotos.'], 'adjmeet'],
  [['“So am I stuck with you now that they said no?”', '“¿Entonces ya estoy amarrada con ustedes?”'], ["You can ask your insurer for a re-inspection, and I'll be there with close-up photos. I can't argue it for you. And that letter matters: in Nebraska you have 3 business days after you got it to cancel our agreement if you want, in writing with a copy of the letter. That's your call.", 'Puede pedirle a su aseguradora otra inspección, y yo voy con fotos de cerca. Yo no puedo pelearlo por usted. Y esa carta cuenta: en Nebraska usted tiene 3 días hábiles después de recibirla para cancelar nuestro acuerdo si quiere, por escrito y con una copia de la carta. Eso lo decide usted.'], 'partial'],
  [['“If I cancel, do I lose my deposit?”', '“Si cancelo, ¿pierdo mi depósito?”'], ["No. If you cancel within your 3 business days, in writing, every dollar comes back within 10 days. That's the law, and it's your call. Nothing starts until those 3 days are over.", 'No. Si cancela dentro de sus 3 días hábiles, por escrito, se le regresa todo en 10 días. Así lo dice la ley, y usted decide. Nada empieza hasta que terminen esos 3 días.'], 'coldfeet'],
  [['“What do we get for a 5-star review?”', '“¿Qué nos dan por una reseña de 5 estrellas?”'], ["Just a big thank-you. An honest review, whatever you think, helps families like yours find us. Mind if our sign stays in the yard for a couple of weeks?", 'Solo un gran agradecimiento. Una reseña honesta, lo que usted piense, ayuda a que familias como la suya nos encuentren. ¿Nos permite dejar el letrero en su jardín un par de semanas?'], 'finaldone'],
  [['“The hail was last year. Isn’t it too late?”', '“El granizo fue el año pasado. ¿Ya no es muy tarde?”'], ["That depends on your policy, and some limits are short, so check it or call your insurance company this week. I can take dated photos today, so you have them either way.", 'Eso depende de su póliza, y algunos plazos son cortos, así que revísela o llame a su aseguradora esta semana. Hoy le puedo tomar fotos con fecha, para que las tenga de todos modos.'], 'latestorm'],
  [['“Hold on, let me look you up… only a few reviews?”', '“Permítame, lo busco en internet… ¿solo unas cuantas reseñas?”'], ["Please do. We're still building our reviews. What you can check tonight: our Nebraska contractor registration (search HMP Siding & Roofing), my City of Fremont permit, our business line, and a certificate of insurance we can send you.", 'Claro, búsquenos. Todavía estamos juntando reseñas. Lo que puede revisar hoy mismo: nuestro registro de contratista en Nebraska (busque HMP Siding & Roofing), mi permiso de la Ciudad de Fremont, el teléfono del negocio y un certificado de seguro que le podemos mandar.'], 'checklist'],
  /* Use only while the 30-day City of Fremont solicitor permit is current (data/city_rules.json). */
  [['“Do you even have a permit to knock here?”', '“¿Tiene permiso para tocar puertas aquí?”'], ["Yes, here's my City of Fremont solicitor permit, and our business line. Take your time looking.", 'Sí, aquí tiene mi permiso de la Ciudad de Fremont para vender de puerta en puerta, y el teléfono del negocio. Revíselo con calma.'], ['chaser', 'checklist', 'retiree']],
  /* Fremont can revoke the permit for knocking at a house posted "No Peddlers/Solicitors" (data/city_rules.json). */

    q: ['“Make it quick. What do you want?” (arms crossed)', '“Rápido. ¿Qué quiere?” (brazos cruzados)'],
    g: ['Stay warm and curious. Don’t match their sharp tone. No “you need to…”.', 'Quédate amable y curioso. No copies su tono. Nada de “tiene que…”.'],
    setup: 'The blunt or annoyed homeowner (existing 40s-annoyed or blunt-60s type).',
    goal: 'Homeowner starts short and dismissive. Kenny must stay warm and curious the whole time, never matching their sharpness or sounding authoritative/pushy.',
    crit: "Homeowner's warmth score improves by the end of the exchange and Kenny's lines contain no commanding/pressuring phrasing ('you need to', 'you have to act now'). In this one-line drill, judge whether his line would warm up an annoyed homeowner.",
    a: ["Sure, I'll be quick! I'm Kenny with HMP Siding & Roofing from Fremont. The hail hit this street, so we're doing free roof checks. Want me to take a quick look?", '¡Claro, rapidito! Soy Kenny de HMP Siding & Roofing, de Fremont. El granizo pegó en esta calle y estamos revisando techos gratis. ¿Quiere que le eche un vistazo rápido?'] },
  { id: 'drill-not-interested-recovery', t: ['Bouncing back from “not interested”', 'Recuperarse de “no me interesa”'], loc: null,
    q: ['“Not interested, thanks.” (starts closing the door)', '“No me interesa, gracias.” (empieza a cerrar la puerta)'],
    g: ['Say it’s fine, then one small ask (a card, a free look). No arguing, no pitch again.', 'Di que está bien y pide algo pequeño (una tarjeta, revisar gratis). Sin discutir, sin repetir.'],
    setup: 'A homeowner who opens with a flat "not interested, thanks" and starts to close the door.',
    goal: 'Kenny gets one more sentence in without being pushy: acknowledge it, then offer the smallest possible ask (a free look, a card) instead of arguing or repeating the same pitch louder.',
    crit: 'Kenny does not repeat his original pitch verbatim, does not argue, and offers exactly one low-pressure next step before accepting a no.',
    a: ['No problem at all. Can I leave my card, in case you spot anything after the storm? Have a good night.', 'No se preocupe. ¿Le dejo mi tarjeta, por si ve algo después de la tormenta? Que tenga buena noche.'] },
  { id: 'drill-morning-pitch-warmup', t: ['Say it out loud first', 'Dilo en voz alta primero'], loc: 'intro', solo: true,
    q: ['(No door yet. Type your whole opener from memory, like you’re saying it out loud. No notes.)', '(Todavía no hay puerta. Escribe tu saludo completo de memoria, como si lo dijeras en voz alta. Sin notas.)'],
    g: ['Your name, HMP and what you sell, in your own natural words.', 'Tu nombre, HMP y qué vendes, con tus propias palabras.'],
    setup: 'No homeowner - solo warmup before the first real roleplay of the session.',
    goal: 'Before facing any AI homeowner, type out (as if spoken aloud) the full opener once, from memory, with no notes.',
    crit: "The typed opener includes name, HMP, and what's being sold, in a natural (not word-for-word script-sounding) way, completed before starting the first homeowner.",
    a: ["Hi there! I'm Kenny with HMP Siding & Roofing, right here in Fremont. We do roofs and siding, and after the hail we're giving free roof checks on this street. Mind if I take a look?", '¡Buenas! Soy Kenny de HMP Siding & Roofing, aquí de Fremont. Hacemos techos y siding, y después del granizo estamos revisando techos gratis en esta calle. ¿Me deja echarle un vistazo?'] },
  { id: 'drill-photos-before-paper', t: ['Photos and scope before any signature', 'Fotos y alcance antes de firmar nada'], loc: 'photos',
    q: ['“Looks bad? Great, let’s sign right now so you can start.”', '“¿Se ve mal? Perfecto, firmemos ahorita para que empiecen.”'],
    g: ['Photos and what’s damaged first. Say which paper it is and what it does. Signing never means insurance pays.', 'Primero fotos y qué está dañado. Di qué papel es y para qué sirve. Firmar nunca quiere decir que el seguro paga.'],
    setup: 'A homeowner ready to move fast (e.g. the check-in-hand or fast-decision type).',
    goal: "Kenny shows/describes the photo evidence and a real scope of what's damaged before mentioning any paperwork, and is clear about exactly what document is being signed and why (inspection permission vs. contract) - never lets the homeowner think signing something now guarantees a price or a payout.",
    crit: "Kenny mentions photos/evidence and the specific document's purpose before any signature is discussed, and never implies a signature guarantees insurance payment.",
    a: ["Let's slow down. First I'll show you the photos and exactly what's damaged. Then you see the contract, with the work and the price, and you get 3 business days to cancel. Signing it doesn't decide what your insurance covers.", 'Vamos con calma. Primero le enseño las fotos y qué está dañado. Luego ve el contrato, con el trabajo y el precio, y tiene 3 días hábiles para cancelar. Firmarlo no decide lo que cubre su seguro.'] },
  { id: 'drill-say-it-out-loud-3day', t: ['Say the 3-day cancel right out loud', 'Di el derecho de 3 días en voz alta'], loc: 'cancel2',
    q: ['“Okay, where do I sign?”', '“Bueno, ¿dónde firmo?”'],
    g: ['Say it out loud, in English AND in Spanish: they have 3 days to cancel.', 'Dilo en voz alta, en inglés Y en español: tienen 3 días para cancelar.'],
    setup: 'Any homeowner who reaches the paperwork stage of the roleplay.',
    goal: 'Kenny must explicitly say (not just mention handing over a form) that the homeowner has 3 days to cancel, in both English and Spanish phrasing, before the roleplay ends.',
    crit: "Both an English and a Spanish sentence stating the 3-day cancel right appear in Kenny's lines before paperwork is considered done.",
    a: ["Before you sign: you have 3 business days to cancel, in writing, and here's the form. En español: usted tiene 3 días hábiles para cancelar, por escrito, y aquí está la forma.", 'Antes de firmar: usted tiene 3 días hábiles para cancelar, por escrito, y aquí está la forma. In English: you have 3 business days to cancel, in writing, and here is the form.'] },
  { id: 'drill-deductible-question', t: ['When they ask about the deductible', 'Cuando preguntan por el deducible'], loc: 'nodeduct',
    q: ['“Can you just cover my deductible?”', '“¿No me puede cubrir el deducible?”'],
    g: ['Warm and honest: the deductible is always their part. Never promise what insurance pays.', 'Amable y honesto: el deducible siempre es su parte, y no puedes prometer lo que paga el seguro.'],
    setup: 'A homeowner who asks directly: "Can you just cover my deductible?" or "Will insurance pay for everything?"',
    goal: "Kenny answers honestly that the deductible is always the homeowner's part and he can't promise what insurance will pay, without sounding evasive or cold.",
    crit: "Kenny's answer contains no offer, hint or implication of covering/waiving/rebating the deductible and no promise that insurance will pay; tone stays warm, not defensive.",
    a: ["Good question. By law the deductible is always your part, and I can't promise what insurance pays. What I can do is a free look with photos, so you have the facts.", 'Buena pregunta. Por ley el deducible siempre es su parte, y no le puedo prometer lo que paga el seguro. Lo que sí puedo hacer es revisar gratis con fotos, para que tenga los datos.'] },
  { id: 'drill-contingency-vs-contract', t: ['Which paper is this?', '¿Cuál papel es este?'], loc: 'paper',
    q: ['“What exactly am I signing right now?”', '“¿Qué es exactamente lo que estoy firmando ahorita?”'],
    g: ['Name it: permission to inspect, a contingency, or the job contract. Say what it does and doesn’t commit them to.', 'Dilo: permiso para revisar, una contingencia o el contrato del trabajo. Di a qué le compromete y a qué no.'],
    setup: 'A cautious homeowner who asks "What exactly am I signing right now?"',
    goal: "Kenny clearly names which of the three things is being signed at that moment - permission to inspect, a contingency tied to claim approval, or the final job contract - and what it does and doesn't commit the homeowner to.",
    crit: 'Kenny names the specific document type and states in plain words what it commits the homeowner to (or doesn\'t), with no vague "just paperwork" answer.',
    a: ["Right now it's only permission for me to get on your roof and take photos. It doesn't commit you to any work or any price. The job contract comes later, with the price and your 3 days to cancel.", 'Ahorita es solo el permiso para subirme a su techo y tomar fotos. No le compromete a ningún trabajo ni a ningún precio. El contrato del trabajo viene después, con el precio y sus 3 días para cancelar.'] },
  { id: 'drill-ratio-not-streak', t: ['Reframe a bad streak', 'Replantear una mala racha'], loc: 'ratio', solo: true,
    q: ['(Three doors in a row said no. Write one line about it.)', '(Tres puertas seguidas te dijeron que no. Escribe una línea sobre eso.)'],
    g: ['Use numbers (doors, no’s, yes’s), not feelings, and name one change for the next door.', 'Usa números (puertas, no, sí), no sentimientos, y di un cambio para la próxima puerta.'],
    setup: 'No homeowner - a reflection prompt shown after 3+ discouraging roleplay results in a row.',
    goal: 'Write one line reframing the losses as data (doors knocked vs. interested), not as personal failure, and name the one thing to try differently on the next door.',
    crit: 'The written reflection mentions a ratio or count (not just a feeling) and names one specific change for the next attempt.',
    a: ["3 no's is just 3 doors: the goal is about 1 yes in every 10 to 15. Next door I'll ask one question before I pitch.", 'Tres “no” son solo 3 puertas: la meta es como 1 sí de cada 10 a 15. En la próxima puerta hago una pregunta antes de ofrecer.'] },
  /* v7 (T135, research round 30): the title-holder question as a proper paperwork step (also in data/practice_drills.json). */
  { id: 'drill-whose-name', t: ['Whose name is on the house?', '¿A nombre de quién está la casa?'], loc: 'owner',
    q: ['“Okay, let’s do the paperwork. My wife’s at work, but I can sign.”', '“Bueno, hagamos los papeles. Mi esposa está en el trabajo, pero yo firmo.”'],
    g: ['Ask whose name is on the house (the owner on the title signs). Invite the other owner, never “both of you or no deal”.', 'Pregunta a nombre de quién está la casa (firma el dueño de la escritura). Invita al otro dueño, nunca “los dos o no hay trato”.'],
    setup: 'A homeowner ready to do paperwork while the spouse is away.',
    goal: 'Kenny treats "whose name is on the house?" as a normal paperwork step, so the owner(s) on the title are the ones who sign, and offers a no-pressure way to include a co-owner (a set time to come back, photos to share).',
    crit: 'Kenny asks whose name is on the house (title/deed) or who owns it before any signature, in a calm, normal way, and offers a no-pressure option for a co-owner. FAIL if he pressures with anything like "both spouses must be here or there\'s no deal" or "the price is only good if you both sign now", or lets someone who is not on the title sign.',
    a: ["Sure. Quick paperwork step first: whose name is on the house? The owner on the title signs. If your wife is on it too, I can come back Saturday at 10 so she can see the photos.", 'Claro. Primero un paso de los papeles: ¿a nombre de quién está la casa? Firma el dueño que aparece en la escritura. Si su esposa también aparece, regreso el sábado a las 10 para que vea las fotos.'] },
  /* v9 (T146, data/inspection_walk.json step 3): show the photos back on the phone before leaving the yard. */
  { id: 'drill-show-photos-phone', t: ['Show the photos before you leave the yard', 'Enseña las fotos antes de irte del patio'], loc: 'phone',
    q: ['(You’re off the roof. The homeowner is in the yard.) “So, what did you find up there?”', '(Ya bajaste del techo. El dueño está en el patio.) “¿Y qué encontró allá arriba?”'],
    g: ['Show the photos on your phone: a good spot next to a damaged one. Say what they show, not what a claim will do.', 'Enseña las fotos en tu teléfono: un área buena junto a una dañada. Di lo que muestran, no lo que hará un reclamo.'],
    setup: 'Any storm homeowner, right after the inspection, before Kenny leaves the yard.',
    goal: 'Before wrapping up, Kenny stands with the homeowner and flips through the photos he just took on his phone, side by side (an undamaged spot vs. a damaged spot), and lets them ask questions.',
    crit: "Kenny offers to show (or shows) the photos on his phone before leaving, compares a good area with a damaged one (or explains what a photo shows), and says only what the photos show: no 'this will get approved', no 'insurance will cover this', nothing about the deductible.",
    a: ["Before I go, let me show you on my phone. Here's a good spot, and here's the damaged one right next to it. See the difference? That's what an adjuster looks for too. Any questions about what you're seeing?", 'Antes de irme, déjeme enseñarle en mi teléfono. Aquí está un área en buen estado, y aquí la dañada justo al lado. ¿Ve la diferencia? Eso es lo que un ajustador también busca. ¿Tiene alguna pregunta de lo que está viendo?'] },
  /* v11 (2026-09-28, research: the rest of the sale). New locs: itemized (the list goes to both), nostart (nothing
     starts inside the 3 days, 69-1606(5)), probe (a question in the first two sentences). */
  { id: 'drill-doorbell-camera', t: ['Talk to the doorbell camera', 'Háblale a la cámara del timbre'], loc: 'intro',
    q: ['(Nobody opens. The doorbell speaker clicks on.) “Yeah? Who is it?”', '(Nadie abre. Se prende la bocina del timbre.) “¿Sí? ¿Quién es?”'],
    g: ['Look at the camera: your name, HMP, from Fremont, what you sell, one small ask. About 10 seconds.', 'Mira a la cámara: tu nombre, HMP, de Fremont, qué vendes y un paso pequeño. Unos 10 segundos.'],
    setup: 'Any storm homeowner who answers through a video doorbell instead of opening the door.',
    goal: 'Kenny speaks straight to the camera with the full opener (name, HMP, local, what HMP sells) and one small ask, short enough to finish before the homeowner closes the app.',
    crit: 'The line states name + HMP + what he sells first (69-1602 applies at the doorbell too), says Fremont/local, makes one low-pressure ask (a free look, or leaving a card), and stays under about 40 words.',
    a: ["Hi, I'm Kenny with HMP Siding & Roofing, a local roofing and siding company from Fremont. We're doing free roof checks on this street after the hail. Want a quick look? Either way, I'll leave my card.", 'Hola, soy Kenny de HMP Siding & Roofing, una compañía de techos y siding de aquí de Fremont. Estamos revisando techos gratis en esta calle por el granizo. ¿Quiere que revise el suyo? De todas formas le dejo mi tarjeta.'] },
  { id: 'drill-itemized-both', t: ['The itemized list goes to both', 'La lista detallada va para los dos'], loc: 'itemized',
    q: ['“Insurance approved it. Can’t you just start Monday?”', '“El seguro ya lo aprobó. ¿No pueden empezar el lunes?”'],
    g: ['Before any work: they AND their insurer get the same itemized list (work, materials, labor, fees, total).', 'Antes de cualquier trabajo: ellos Y su aseguradora reciben la misma lista detallada (trabajo, materiales, mano de obra, cargos, total).'],
    setup: 'An insurance homeowner whose claim was approved and who wants the work to start right away.',
    goal: 'Kenny explains the step that must happen before any insurance work: an itemized description of the work, materials, labor, fees and total, given to BOTH the homeowner and the insurer (Neb. 44-8606; skipping it voids the contract, 44-8608), then sets a start date after it.',
    crit: "Names both the homeowner and the insurance company as getting the itemized list, says it happens before work starts, and says what is in it (at least the work/materials/labor or the total). No promise about what insurance pays; no deductible talk except that it is the homeowner's part.",
    a: ["Almost. Before we start, you and your insurance company each get the same itemized list: the work, the materials, labor, fees and the total. That's Nebraska law, and it protects you. I'll send it this week, then we set the start date.", 'Casi. Antes de empezar, usted y su aseguradora reciben la misma lista detallada: el trabajo, los materiales, la mano de obra, los cargos y el total. Así lo pide la ley de Nebraska, y lo protege a usted. Se la mando esta semana y luego ponemos la fecha para empezar.'] },
  { id: 'drill-no-start-window', t: ['No work inside the 3 days', 'Nada de trabajo dentro de los 3 días'], loc: 'nostart',
    q: ['(Cash siding job, signed today, Monday.) “Great! Can your crew start tomorrow?”', '(Siding pagado por el dueño, firmado hoy lunes.) “¡Perfecto! ¿Su equipo puede empezar mañana?”'],
    g: ['Nothing starts until their 3 business days to cancel are over. Give the first real start date.', 'Nada empieza hasta que terminen sus 3 días hábiles para cancelar. Da la primera fecha real para empezar.'],
    setup: 'A cash (non-insurance) homeowner who just signed at the kitchen table and wants the work to start right away.',
    goal: 'Kenny says, warmly, that no work starts until the 3 business days to cancel are over (under Nebraska 69-1606(5) HMP gets no pay for any work done before a cancellation), restates the right as a fact, and names the first real start date after the window.',
    crit: 'Says work cannot start before the 3-business-day cancel window ends, states the cancel right as a plain fact (their call), and names a specific day after the window. FAIL if he agrees to start, tear off or do "just a little" before the window ends, or downplays the right.',
    a: ["Love the energy! Here's how it works: you have 3 business days to cancel, and nothing starts until those are over. Signed today, so the first day we can start is Friday. Want me to put you down for Friday at 8?", '¡Qué bueno que tiene ganas! Así funciona: usted tiene 3 días hábiles para cancelar, y nada empieza hasta que terminen. Firmó hoy, así que el primer día que podemos empezar es el viernes. ¿Lo anoto para el viernes a las 8?'] },
  { id: 'drill-probe-first', t: ['Ask before you answer', 'Pregunta antes de contestar'], loc: 'probe',
    q: ['“Honestly, that’s way more than I wanted to spend.”', '“La verdad, es mucho más de lo que quería gastar.”'],
    g: ['First line: one question to find the real reason. Don’t defend the price yet.', 'Primera línea: una pregunta para encontrar la razón real. Todavía no defiendas el precio.'],
    setup: 'A cash homeowner who pushes back on price after the estimate.',
    goal: 'Before explaining or defending anything, Kenny asks one short clarifying question (what part feels high, compared to what, the total or the monthly budget), because a strong answer to the wrong objection makes it worse.',
    crit: 'The reply leads with one clarifying question about the objection before any justification; no price cut, no pressure. FAIL if he defends or drops the price without asking first.',
    a: ['Fair enough. What part feels high: the total, or compared to another bid you got?', 'Está bien. ¿Qué parte le parece alta: el total, o comparado con otra cotización que tiene?'] },
  { id: 'drill-talk-to-decider', t: ['Answer the one who decides', 'Contéstale a quien decide'], loc: 'nodeduct',
    q: ['(The husband translates for his wife.) “She wants to know if you guys cover the deductible. So we pay nothing, right?”', '(El esposo le traduce a su esposa.) “Quiere saber si ustedes cubren el deducible. Entonces no pagamos nada, ¿verdad?”'],
    g: ['Turn to her and answer in Spanish, with usted: the deductible is always her part (“su parte”). Say it to him too.', 'Voltea hacia ella y contesta en español, de usted: el deducible siempre es su parte. Díselo a él también.'],
    setup: 'A bilingual couple at the door: the husband speaks English and translates loosely; the wife prefers Spanish and decides about money.',
    goal: 'Kenny answers the Spanish-speaking spouse directly in Spanish (usted), corrects the loose "we pay nothing", and gives the same honest answer in both languages.',
    crit: "A Spanish sentence to the wife, with usted, says the deductible is always their part and the insurer decides what is covered; the same answer appears in English; no hint of covering or reducing the deductible. FAIL if he only answers the husband or lets 'we pay nothing' stand.",
    a: ["Señora, con permiso: el deducible siempre es su parte, y su aseguradora decide lo que cubre. La revisión sí es gratis. Tony, same for you: the deductible is always your part, and the look is free.", 'Señora, con permiso: el deducible siempre es su parte, y su aseguradora decide lo que cubre. La revisión sí es gratis. Y a usted, Tony, lo mismo: el deducible siempre es su parte, y la revisión es gratis.'] },
];
/* v10 (round 47, data/door_lines_pro.json) + v11 (watch-from-the-yard): 23 pro door lines from real trainers, rewritten to HMP's rules, word
   for word ({name} = Kenny). g = group, l = a short label. The written-warranty line waits for the boss's answer on
   HMP's workmanship warranty (hub D15), so it stays off until PRO_ON_HOLD is emptied. tests/js/practice_door_rx_check.js
   keeps every line legalScan-clean and equal to the data file. */
const PRO = [
  { id: "courtesy-short-visit", g: 'open', l: ["Door opens: same breath as your opener", "Se abre la puerta: de corrido con tu saludo"], a: ["Hey there, sorry to bother — I'll just take one minute.", "Hola, disculpe la molestia — solo le quito un minuto."] },
  { id: "opener-compliant-general", g: 'open', l: ["Any street", "Cualquier calle"], a: ["Hi, I'm Kenny with HMP Siding & Roofing — we do siding and roof repair and replacement. I'm in the neighborhood checking roofs, no cost, no obligation. Mind if I take a quick look at yours?", "Hola, soy Kenny de HMP Siding & Roofing — hacemos reparación e instalación de techos y siding. Ando por el vecindario revisando techos, sin costo y sin compromiso. ¿Le importa si le echo un vistazo rápido?"] },
  { id: "opener-storm-neighbor", g: 'open', l: ["After a storm", "Después de una tormenta"], a: ["Hi, I'm Kenny with HMP Siding & Roofing — siding and roofing. We're out checking a few roofs on this street after the last storm; yours might have some hits too. Want me to take a quick look and show you what I find?", "Hola, soy Kenny de HMP Siding & Roofing — hacemos techos y siding. Andamos revisando algunos techos en esta calle después de la última tormenta; el suyo también podría tener algunos golpes. ¿Quiere que le eche un vistazo rápido y le muestre lo que encuentro?"] },
  { id: "opener-everyday-age", g: 'open', l: ["Older houses, no storm", "Casas viejas, sin tormenta"], a: ["Hi, I'm Kenny with HMP Siding & Roofing — siding and roof work. A lot of homes on this street are around the same age, and roofs and siding start wearing out about now. I'm doing free checks in the area — want me to take a look at yours?", "Hola, soy Kenny de HMP Siding & Roofing — hacemos techos y siding. Muchas casas en esta calle tienen más o menos la misma edad, y por estos años el techo y el siding empiezan a desgastarse. Estoy haciendo revisiones gratis por aquí — ¿quiere que revise el suyo?"] },
  { id: "courtesy-catch-good-time", g: 'open', l: ["They look busy (after your opener)", "Se ven ocupados (después de tu saludo)"], a: ["Did I catch you at an OK time? I can come back later if not.", "¿Le agarro en buen momento? Puedo regresar más tarde si no."] },
  { id: "transition-free-inspection-value", g: 'trust', l: ["Into the free look", "Pasar a la revisión gratis"], a: ["It only takes about 15 minutes — I'll check the roof, take photos, and show you exactly what's there before you decide anything.", "Solo toma unos 15 minutos — reviso el techo, tomo fotos, y le muestro exactamente lo que hay antes de que usted decida algo."] },
  { id: "rapport-bad-past-contractor", g: 'trust', l: ["Bad past contractor", "Les fue mal con otro contratista"], a: ["That's rough, I hear that a lot. One thing we do — we clean up fully every day, and I'll walk you through exactly what we find before we do anything.", "Qué mal, escucho eso seguido. Una cosa que hacemos — limpiamos todo diario, y le explico exactamente qué encontramos antes de hacer cualquier cosa."] },
  { id: "trust-local-stick-around", g: 'trust', l: ["Storm-chaser worry", "Miedo a los que persiguen tormentas"], a: ["We're local, based right here in Fremont — if a warranty question comes up next year, I'm not hard to find.", "Somos locales, de aquí mismo de Fremont — si hay una pregunta de garantía el próximo año, no es difícil encontrarme."] },
  { id: "trust-warranty-backed", g: 'trust', l: ["Warranty in writing", "Garantía por escrito"], a: ["We back our work with a written workmanship warranty — I'll give you that in writing, not just talk.", "Respaldamos nuestro trabajo con una garantía de mano de obra por escrito — se la doy por escrito, no solo de palabra."] },
  { id: "spanish-relationship-first", g: 'trust', l: ["Spanish-speaking family", "Familia que habla español"], a: ["I want to take care of your roof the way I'd want someone to take care of my own family's house.", "Quiero cuidar su techo como quisiera que alguien cuidara la casa de mi propia familia."] },
  { id: "watch-from-the-yard", g: 'trust', l: ["They want to watch", "Quieren ver la revisión"], a: ["Want to watch from the yard while I check? I'll show you every photo before I leave.", "¿Quiere ver desde el patio mientras reviso? Le enseño todas las fotos antes de irme."] },
  { id: "objection-spouse", g: 'obj', l: ["“I need to talk to my spouse”", "“Lo tengo que hablar con mi esposo/a”"], a: ["Of course — makes sense to look at it together. Can I text or email you the photos and what I find so you both have it to look at?", "Claro que sí — tiene sentido verlo juntos. ¿Le mando las fotos y lo que encuentro por texto o correo para que los dos lo vean?"] },
  { id: "objection-more-quotes", g: 'obj', l: ["“I want more quotes”", "“Quiero más cotizaciones”"], a: ["That's smart, get a few. Here's what I found and what I'd charge — happy to answer questions once you've compared.", "Eso es inteligente, consiga varias. Aquí está lo que encontré y lo que cobraría — con gusto respondo preguntas una vez que compare."] },

async function semanticCheck(sample, lines) {

async function addField() {
  if (S.fieldBusy) return;
  const heard = $('fieldBox').value.trim().slice(0, 300);
  if (!heard) { setFieldStatus('fieldEmpty', 'bad'); $('fieldBox').focus(); return; }
  const sample = await samplePromise;
  if (!sample) { goOff(); return; }
  S.fieldBusy = true; $('fieldAdd').disabled = true; $('fieldBox').disabled = true;
  setFieldStatus('fieldWriting', '');
  try {
    const fctl = new AbortController();
    const data = await timed(sample.json(fieldPrompt(heard, S.fieldAvoid), { cache: false, signal: fctl.signal }), fctl, QUICK_MS);
    if (!data || typeof data !== 'object' || data.not_objection === true) { setFieldStatus('fieldNot', 'bad'); return; }
    const str = (v, n) => (typeof v === 'string' ? v.trim().slice(0, n) : '');
    const q = [str(data.objection_en, 200), str(data.objection_es, 200)];
    const a = [str(data.answer_en, 400), str(data.answer_es, 400)];
    if (!a[0] || !a[1]) { setFieldStatus('err', 'bad', 'invalid_json'); return; }
    if (!q[0]) q[0] = heard;
    if (!q[1]) q[1] = q[0];
    const flags = legalScan(a[0]).concat(legalScan(a[1]));
    if (flags.length) { S.fieldAvoid = T['r_' + flags[0].type][0]; setFieldStatus('fieldBad', 'bad', flags[0].type); return; }
    S.fieldAvoid = null;

      const c2 = (e && e.code) || 'upstream_error';
      if (c2 === 'cancelled') { setFieldStatus(null); return; }
      if (HIDE.has(c2)) { goOff(); return; }
      setFieldStatus('fieldCheckErr', 'bad'); return;
    }
    if (!chk.ok) { const ty = chk.flags[0].type; S.fieldAvoid = T['r_' + ty][0]; setFieldStatus('fieldBad', 'bad', ty); return; }
    S.field.push({ id: 'f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), q, a, heard, added: today(), checked: 1 });
    if (S.field.length > 40) S.field = S.field.slice(-40);

}

async function askHomeowner() {
  const sid = S.sid;
  const sample = await samplePromise;
  if (sid !== S.sid) return;
  if (!sample) { goOff(); return; }
  clearChatErr();
  S.busy = true; syncComposer();
  const bubble = addHome();
  const ctl = new AbortController(); S.ctl = ctl;
  const input = [{ role: 'user', content: rulesText() }, ...S.turns];
  try {
    const res = await sample(input, {
      cache: false, modelTier: 'quick', signal: ctl.signal,
      onText: ({ text }) => {
        if (sid !== S.sid) return;
        const dw = $('doorway'); dw.classList.remove('knocking'); dw.classList.add('open');
        const shown = stripTags(text); if (shown) setHomeText(bubble, shown);
        scrollEnd();
      }
    });
    if (sid !== S.sid) return;
    const m = TAG_RX.exec(res.text);
    const clean = stripTags(res.text) || '…';
    setHomeText(bubble, clean);
    S.turns.push({ role: 'assistant', content: clean });
    if (m) finishDoor(m[1].toUpperCase() === 'YES' ? 'yes' : 'closed');
    else if (S.kenny >= MAX) finishDoor('time');
    else if (S.rookieOn) showHint(bubble, clean, sid, sample);
  } catch (e) {
    if (sid !== S.sid) return;
    const code = (e && e.code) || 'upstream_error';
    bubble.remove();
    if (code === 'cancelled') return;
    if (HIDE.has(code)) { goOff(); return; }
    if (code === 'refused' && S.turns.length && S.turns[S.turns.length - 1].role === 'user') {
      const last = S.turns.pop(); S.kenny = Math.max(0, S.kenny - 1);
      const kids = $('chat').querySelectorAll('.msg.kenny'); if (kids.length) kids[kids.length - 1].remove();
      $('box').value = last.content; grow(); renderPips();
      chatErr(code, false);
      return;
    }
    chatErr(code, code !== 'prompt_too_large');
  } finally {
    if (S.ctl === ctl) S.ctl = null;
    if (sid === S.sid) { S.busy = false; syncComposer(); }
  }
}

const NUM_RX = /\d|\b(?:one|two|three|four|five|six|seven|eight|nine|ten|twenty|thirty|fifty|half|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|veinte|treinta|cincuenta|mitad)\b/i;
function skillLocal(it, ans) {
  const txt = ans.replace(/\([^)]*\)/g, ' ');
  switch (it.loc) {
    case 'intro': { const miss = introMissing(txt).filter(i => i !== 2); return miss.length ? ['skIntro', miss.map(i => T.introParts[Li()][i]).join(', ')] : null; }
    case 'oneAsk': return VAGUE_RX.test(ans) ? ['skVague'] : null;
    case 'noPush': return PUSH_RX.test(ans) ? ['skPush'] : null;
    case 'photos': return !PHOTO_RX.test(ans) || !PAPER_RX.test(ans) ? ['skPhotos'] : null;
    case 'cancel2': return !CANCEL_EN.test(ans) || !CANCEL_ES.test(ans) ? ['skCancel2'] : null;
    case 'nodeduct': return dedTalk(ans) ? ['deductMiss'] : null;
    case 'paper': return !PAPER_RX.test(ans) ? ['skPaper'] : null;
    case 'owner': return !OWNER_RX.test(ans) ? ['skOwner'] : null;
    case 'ratio': return !NUM_RX.test(ans) ? ['skRatio'] : null;
    /* v9 (T146): photos on the phone, before leaving the yard. */
    case 'phone': return !/\b(?:photos?|pictures?|pics?|phone|fotos?|im[aá]genes|tel[eé]fono|celular)\b/i.test(txt) ? ['skPhone'] : null;
    /* v11: the itemized list goes to both (44-8606); nothing starts inside the 3 days (69-1606(5)); ask before you answer. */
    case 'itemized': return !/itemi[sz]ed|detallad/i.test(ans) || !/insur|asegurador/i.test(ans) ? ['skItemized'] : null;
    case 'nostart': return !CANCEL_OK.test(ans) || startsEarly(ans) ? ['skNoStart'] : null;
    case 'probe': return !(txt.match(/[^.!?]+[.!?]*/g) || []).slice(0, 2).some(x => x.includes('?')) ? ['skProbe'] : null;
    default: return null;
  }
}
async function skillCheck() {
  const d = S.drill, it = d.items[0], ans = $('drillBox').value.trim();
  if (!ans) { $('drillBox').focus(); return; }
  const sid = S.sid;
  const sample = await samplePromise;
  if (sid !== S.sid) return;
  if (!sample) { goOff(); return; }
  d.phase = 'grading'; renderDrill();
  const ctl = new AbortController(); S.ctl = ctl;
  try {
    const data = await timed(sample.json(skillPrompt(it, ans), { cache: false, modelTier: 'quick', signal: ctl.signal }), ctl, QUICK_MS);
    if (sid !== S.sid) return;
    const flags = mergeFlags(data && data.legal_flags, legalScan(ans));
    const illegal = flags.some(f => !CAUTION.has(f.type));
    /* Fail closed: no boolean verdict = couldn't grade (unless a legal flag already fails it). */
    if (!illegal && !(data && typeof data.pass === 'boolean')) throw { code: 'invalid_json' };
    const loc = illegal ? null : skillLocal(it, ans);
    const pass = !illegal && !loc && data.pass === true;
    const raw = data && typeof data.note === 'string' ? data.note.trim() : '';
    const note = illegal ? t('legalNote') : loc && data.pass === true ? t(loc[0], loc[1]) : (legalScan(raw).length ? '' : raw) || (loc ? t(loc[0], loc[1]) : '');
    finishSkill(pass, note, flags, false);
  } catch (e) {
    if (sid !== S.sid) return;
    const code = (e && e.code) || 'upstream_error';
    if (code === 'cancelled') return;
    if (HIDE.has(code)) { goOff(); return; }
    d.phase = 'err'; $('drillErrText').textContent = t('noGrade') + ' ' + errText(code); renderDrill();
  } finally { if (S.ctl === ctl) S.ctl = null; }
}
function finishSkill(pass, note, flags, skipped) {
  const d = S.drill, it = d.items[0], st = S.store;
  st.skills[it.id] = { p: pass ? 1 : 0, d: today(), n: ((st.skills[it.id] && st.skills[it.id].n) || 0) + (skipped ? 0 : 1) };
  if (!skipped) {
    markDay();
    if (!d.counted) { d.counted = true; st.drillLog.push(today()); if (st.drillLog.length > 120) st.drillLog = st.drillLog.slice(-120); }
  }
  saveStore();
  d.res.push({ it, score: pass ? 2 : 0, pass, note, flags, focus: { f: d.focus, pass: null, note: '' } });
  d.phase = 'done';
  renderDrillResult(); renderDrill();
  $('drillRes').scrollIntoView({ block: 'start', behavior: 'auto' });
}
function renderDrill() {
  const d = S.drill; if (!d) return;
  /* v9 fix: on the summary d.i is past the end; a skill drill's chip still names its one item (was a JS error). */
  const it = d.items[Math.min(d.i, d.items.length - 1)], L = Li(), sum = d.phase === 'summary';
  $('drillChip').textContent = d.skill ? t('skillChip') + ' · ' + it.t[L] : t('drillN', Math.min(d.i + 1, d.items.length));
  const pp = $('drillPips'); pp.textContent = ''; pp.hidden = !!d.skill;
  if (!d.skill) for (let i = 0; i < d.items.length; i++) pp.append(el('i', i < d.res.length ? 'on' : ''));
  const fc = $('drillFocus'); fc.textContent = '';
  if (d.skill) fc.append(el('span', null, t('toPass')), el('b', null, it.g[L]));
  else fc.append(el('span', null, t('focusChip')), el('b', null, focusText(d.focus).title[L]));
  if (it) { $('drillWhy').textContent = d.skill ? t(it.solo ? 'skSolo' : 'skDoor') : t('why_' + it.why); $('drillQ').textContent = it.q[L]; }
  const asking = d.phase === 'ask' || d.phase === 'err';
  document.querySelector('#scrDrill .drill-top').hidden = sum;
  fc.hidden = sum;
  $('drillCard').hidden = sum;
  $('drillBox').disabled = !asking;
  $('drillAsk').hidden = !asking;
  $('drillLoading').hidden = d.phase !== 'grading';
  $('drillErr').hidden = d.phase !== 'err';
  $('drillRes').hidden = d.phase !== 'done';
  $('drillDone').hidden = !sum;
}
async function drillCheck() {
  const d = S.drill;
  if (!d || (d.phase !== 'ask' && d.phase !== 'err')) return;
  if (d.skill) return skillCheck();
  const it = d.items[d.i], ans = $('drillBox').value.trim();
  if (!ans) { $('drillBox').focus(); return; }
  const sid = S.sid;
  const sample = await samplePromise;
  if (sid !== S.sid) return;
  if (!sample) { goOff(); return; }
  d.phase = 'grading'; renderDrill();
  const ctl = new AbortController(); S.ctl = ctl;
  try {
    const data = await timed(sample.json(drillPrompt(it, ans), { cache: false, modelTier: 'quick', signal: ctl.signal }), ctl, QUICK_MS);
    if (sid !== S.sid) return;
    const flags = mergeFlags(data && data.legal_flags, legalScan(ans));
    let score = Math.round(Number(data && data.score));
    /* v6: no readable score = couldn't grade (fail closed), never a default "OK". A local legal flag still makes it Weak. */
    if (!(score >= 0 && score <= 2)) { if (flags.some(f => !CAUTION.has(f.type))) score = 0; else throw { code: 'invalid_json' }; }
    /* A legal flag makes it Weak no matter what the coach said; its praise and focus result would contradict the red box. */
    const illegal = flags.some(f => !CAUTION.has(f.type));
    if (illegal) score = 0;
    const cf = !illegal && data && data.focus && typeof data.focus === 'object' ? data.focus : null;
    const focus = cf && cf.applies === true && typeof cf.pass === 'boolean' ? { f: d.focus, pass: cf.pass, note: typeof cf.note === 'string' ? cf.note.trim() : '' } : { f: d.focus, pass: null, note: '' };
    const raw = data && typeof data.note === 'string' ? data.note.trim() : '';
    const note = illegal ? t('legalNote') : legalScan(raw).length ? '' : raw;
    finishItem(score, note, flags, focus, false);
  } catch (e) {
    if (sid !== S.sid) return;
    const code = (e && e.code) || 'upstream_error';
    if (code === 'cancelled') return;
    if (HIDE.has(code)) { goOff(); return; }
    d.phase = 'err'; $('drillErrText').textContent = t('noGrade') + ' ' + errText(code); renderDrill();
  } finally { if (S.ctl === ctl) S.ctl = null; }
}
/* "I don't know, show me": counts as weak (back tomorrow), no AI call, no streak credit. */
function drillShow() {
  const d = S.drill;
  if (!d || (d.phase !== 'ask' && d.phase !== 'err')) return;
  if (d.skill) { finishSkill(false, t('skSkip'), [], true); return; }
  finishItem(0, t('skipNote'), [], { f: d.focus, pass: null, note: '' }, true);
}
function finishItem(score, note, flags, focus, skipped) {
  const d = S.drill, it = d.items[d.i], st = S.store;
  const rec = srsUpdate(S.srs[it.id], score, today());
  S.srs[it.id] = rec; writeJSON(SRS_KEY, S.srs);
  if (!skipped) {
    markDay();
    if (!d.counted) { d.counted = true; st.drillLog.push(today()); if (st.drillLog.length > 120) st.drillLog = st.drillLog.slice(-120); }
  }
  if (focus.pass === true || focus.pass === false) pushTrend(focus.pass, 'drill', d.focus.id);
  saveStore();
  d.res.push({ it, score, box: rec.box, note, flags, focus });
  d.phase = 'done';
  renderDrillResult(); renderDrill();
  $('drillRes').scrollIntoView({ block: 'start', behavior: 'auto' });
}
const RATE_CLS = ['weak', 'ok', 'yes'];
function renderDrillResult() {

  $('drillPill').textContent = d.skill ? t(r.pass ? 'skPass' : 'skMiss') : t('r' + r.score);
  $('drillBack').textContent = d.skill ? '' : t('backIn', SRS_DAYS[r.box]);
  $('drillNote').textContent = r.note; $('drillNote').hidden = !r.note;

  renderFocusRes($('drillFocusRes'), r.focus);
  $('drillModel').textContent = r.it.a[Li()];

}
function drillNext() {

  d.i++;
  if (d.i >= d.items.length) { showDrillDone(); return; }

function showDrillDone() {
  const d = S.drill; d.phase = 'summary';
  const ul = $('drillDoneList'); ul.textContent = '';
  for (const r of d.res) {
    const li = el('li');
    if (d.skill) li.append(el('span', 'done-q', r.it.t[Li()]), el('span', 'pill ' + RATE_CLS[r.score], t(r.pass ? 'skPass' : 'skMiss')), el('span', 'done-when', t('toPass') + ' ' + r.it.g[Li()]));
    else li.append(el('span', 'done-q', r.it.q[Li()]), el('span', 'pill ' + RATE_CLS[r.score], t('r' + r.score)), el('span', 'done-when', t('backIn', SRS_DAYS[r.box])));
    ul.append(li);

function drillStop() {

function goHome() { if (S.ctl) S.ctl.abort(); if (S.hintCtl) S.hintCtl.abort(); S.sid++; S.drill = null; renderSetup(); show('setup'); }

/* ---------- Cheat-sheet-only mode ---------- */

/* ---------- Mic (hidden when the browser has no speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function note(msg) { const n = $('composerNote'); n.textContent = msg || ''; n.hidden = !msg; }

function micOff() { $('micBtn').hidden = true; rec = null; note(t('micBlocked')); }
function toggleMic() {
  if (rec) { stopMic(); return; }

    const r = new SR(); rec = r;
    r.lang = S.sessionLang === 'es' ? 'es-US' : 'en-US';
    r.interimResults = true; r.continuous = false;

    $('micBtn').classList.add('on'); $('micBtn').setAttribute('aria-pressed', 'true'); note(t('listening'));

<title>Practice Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Practice Door v11 (2026-09-28): the Aldaba look (docs/design/product-brand/aldaba/, pages/v25/ds.css): "Aldaba Graphite"
   is the DEFAULT on bare :root, whatever the phone says; "Ledger" light applies only when claude.ai is set to Light
   (data-theme="light"). Bricolage Grotesque = titles and big numbers, Geist = everything else, Geist Mono = labels.
   Every color is a token; no #fff/white/black in components. Orange (--hmp) = the one "do this" button per screen.
   v11 adds: the 4-week Plan (docs/orders/sales-path.md), the ready-to-knock checklist (auto-checked), the top 15
   objections, lesson-prompt buttons, and a MacBook-first wide layout (two columns from 1024 px). */
:root{
  color-scheme:dark;
  --bg:#111214; --card:#18191c; --soft:#232428; --line:#2a2c30; --line-2:#3a3c42;
  --ink:#eceef1; --ink-2:#bfc2c8; --muted:#8f929a; --faint:#6b6e75;
  --hmp:#f5883a; --hmp-press:#e7762a; --hmp-ink:#ffa766; --hmp-bg:rgba(245,136,58,.14); --on-hmp:#1b1206;
  --late:#ff7166; --late-bg:rgba(255,113,102,.13); --late-line:rgba(255,113,102,.34); --warn:#f0b54a; --warn-bg:rgba(240,181,74,.12); --warn-line:rgba(240,181,74,.3);
  --ok:#4cc38a; --ok-bg:rgba(76,195,138,.13); --you:#5b8ff0;
  --on-ink:#111214; --bar:rgba(20,21,24,.92); --scrim:rgba(4,5,6,.62); --thumb:#eceef1;
  --me:#2e3036; --on-me:#eceef1;
  --e1:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.35),0 18px 36px -24px rgba(0,0,0,.9);
  --e2:0 24px 56px -16px rgba(0,0,0,.82),0 2px 8px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);
  --surface:linear-gradient(180deg,#1d1e22 0%,#18191c 72px); --hair:rgba(255,255,255,.075);
  --glow:0 10px 26px -12px rgba(245,136,58,.62),0 2px 6px -2px rgba(245,136,58,.3),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(27,18,6,.18);
  --cta:linear-gradient(180deg,#f8985a 0%,#f5883a 52%,#f0812f 100%);
  --ambient:radial-gradient(900px 420px at 12% -120px,rgba(245,136,58,.10),transparent 70%),radial-gradient(760px 380px at 96% -80px,rgba(120,140,180,.07),transparent 70%);
  --f:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --display:"Bricolage Grotesque","Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --t-label:12px; --t-cap:13px; --t-body:15px; --t-row:17px; --t-title:20px; --t-addr:26px; --t-hero:60px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;
  --hit:44px; --hit-md:48px; --hit-lg:56px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f7f8; --card:#ffffff; --soft:#eff1f3; --line:#e3e5e8; --line-2:#d3d6db;
  --ink:#18191c; --ink-2:#3d3f45; --muted:#676a72; --faint:#9a9da4;
  --hmp-ink:#a4520f; --hmp-bg:#fdf1e7;
  --late:#c2362b; --late-bg:#fdecea; --late-line:#f1c7c2; --warn:#8a5a00; --warn-bg:#fbf2dc; --warn-line:#ecd9a8;
  --ok:#1f7a4d; --ok-bg:#e7f4ed; --you:#2f6fde;
  --on-ink:#ffffff; --bar:rgba(255,255,255,.94); --scrim:rgba(24,25,28,.38); --thumb:#ffffff;
  --me:#18191c; --on-me:#ffffff;
  --e1:0 1px 2px rgba(24,25,28,.05); --e2:0 16px 40px -12px rgba(24,25,28,.28),0 2px 6px rgba(24,25,28,.06);
  --surface:#ffffff; --hair:rgba(24,25,28,.09);
  --glow:0 8px 20px -10px rgba(231,118,42,.6),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(27,18,6,.12);
  --ambient:radial-gradient(900px 420px at 12% -120px,rgba(245,136,58,.08),transparent 70%);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ambient) no-repeat,var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--t-body);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default;opacity:.45}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* icons: one set, 24 grid, 1.75 stroke, round joins */
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}.i-lg{width:24px;height:24px}
.label,.eyebrow{font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:var(--e1)}
.h2{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px;border-radius:var(--r-sm);font-size:12px;font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink-2)}
.chip .i{width:13px;height:13px;stroke-width:2}

/* ---------- frame + top bar ---------- */
.app{max-width:560px;margin:0 auto;padding-inline:var(--s4)}
.top{display:flex;align-items:center;gap:var(--s3);min-height:60px}
.mark{flex:none;display:grid;place-items:center;color:var(--ink)}
.mark svg{display:block;width:30px;height:30px}
.top h1{flex:1;min-width:0;font:700 22px/1.1 var(--display);font-variation-settings:"opsz" 96;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* v11: Practice / Plan / Objections */
.tabs{display:flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--soft)}
.tabs[hidden]{display:none}
.tabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 var(--s3);border-radius:9px;font-size:var(--t-cap);font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button .i{width:17px;height:17px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 1px var(--hair)}
@media (max-width:420px){.top h1{font-size:19px}}
@media (max-width:1023px){.top{flex-wrap:wrap;row-gap:var(--s2);padding-block:var(--s2)}.tabs{order:3;flex-basis:100%}.tabs button{flex:1;min-height:44px}}
@media (min-width:1024px){.tabs{margin-inline:auto}.top h1{flex:0 1 auto}.tabs button{min-height:44px;padding:0 var(--s4)}}
.lang{flex:none;display:flex;background:var(--soft);border-radius:var(--r-md)}
.lang button{min-width:48px;height:var(--hit);padding:0 var(--s2);border:3px solid var(--soft);border-radius:var(--r-md);font:500 12px/1 var(--mono);letter-spacing:.05em;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(24,25,28,.12)}

.screen{display:flex;flex-direction:column;gap:var(--s4);padding-bottom:var(--s8)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.actions{display:grid;gap:var(--s2)}

/* ---------- buttons: one orange per screen ---------- */
.btn-primary{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--hit-lg);padding:0 var(--s5);border-radius:var(--r-md);background:var(--hmp);color:var(--on-hmp);font-size:var(--t-row);font-weight:600;letter-spacing:-.01em}
.btn-primary:active{background:var(--hmp-press)}
.btn-ghost{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--hit-md);padding:0 var(--s4);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);color:var(--ink);font-size:var(--t-body);font-weight:600}
.btn-small{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);padding:0 var(--s3);border-radius:var(--r-md);background:var(--card);border:1px solid var(--line-2);color:var(--ink);font-size:var(--t-cap);font-weight:500;white-space:nowrap}
.btn-small .i{width:17px;height:17px}
.btn-ghost:active,.btn-small:active{background:var(--soft)}

/* ---------- setup ---------- */
#scrSetup{padding-bottom:0}
.intro{display:grid;gap:var(--s2);justify-items:start}
.lede{color:var(--ink-2);max-width:42ch}
.count{display:inline-flex;align-items:center;min-height:24px;padding:3px var(--s2);border-radius:var(--r-sm);background:var(--hmp-bg);color:var(--hmp-ink);font-size:12.5px;font-weight:500;line-height:1.35}
.practice{display:grid;gap:var(--s3)}
.focus{padding:var(--s4);display:grid;gap:var(--s2)}
.focus-t{font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.focus-how{color:var(--ink-2)}
.trend{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:var(--t-cap);color:var(--muted)}
.trend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line-2)}
.trend i.on{background:var(--ok);border-color:var(--ok)}
.trend span{margin-left:6px;font-variant-numeric:tabular-nums}
.prog{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3) var(--s4);margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--line)}
.week{display:flex;gap:6px}
.week div{display:grid;justify-items:center;gap:5px;font:500 12px/1 var(--mono);color:var(--muted)}
.week i{width:22px;height:22px;border-radius:6px;background:var(--soft)}
.week i.on{background:var(--ink)}
.week .today{color:var(--ink)}
.week .today i{box-shadow:inset 0 0 0 1.5px var(--ink)}
.prog-nums{display:flex;gap:var(--s4)}
.stat{display:grid;gap:2px;align-content:start}
.stat b{font-size:var(--t-title);font-weight:600;line-height:1.1;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;line-height:1.25;color:var(--muted);max-width:12ch}
.store-note{flex-basis:100%;font-size:var(--t-cap);color:var(--warn)}
/* list rows (quick drill, skill drills) */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.rows > * + *{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink)}
.row .t{flex:1;min-width:0;display:grid;gap:2px}
.row .t b{font-weight:600;font-size:var(--t-body);line-height:1.3}
.row .t span{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.row .chev{color:var(--faint);transition:transform .2s var(--ease)}
.lead{width:36px;height:36px;border-radius:var(--r-md);background:var(--soft);color:var(--ink-2);display:grid;place-items:center;flex:none}
.lead.hot{background:var(--hmp-bg);color:var(--hmp-ink)}
.skills summary{list-style:none;cursor:pointer}
.skills summary::-webkit-details-marker{display:none}
.skills[open] summary .chev{transform:rotate(180deg)}
.skill-list{display:grid;border-top:1px solid var(--line)}
.skill{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:60px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink)}
.skill + .skill{border-top:1px solid var(--line)}
.skill > span:not(.ks){flex:1;min-width:0;display:grid;gap:2px}
.skill .kt{font-weight:500;line-height:1.3}
.skill .kg{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.skill .kd{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2)}
.skill .kd.pass{background:var(--ok);border-color:var(--ok)}
.skill .kd.miss{background:var(--warn);border-color:var(--warn)}
.skill .ks{flex:none;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.skill .ks.pass{color:var(--ok)}.skill .ks.miss{color:var(--warn)}
/* practice street (offer card) */
.ticket{padding:var(--s4);display:grid;gap:var(--s3)}
.ticket .addr{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.1;margin-top:calc(var(--s1) * -1)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0;border:1px solid var(--line);border-radius:var(--r-md)}
.stats > div{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:2px;min-width:0;padding:10px var(--s3)}
.stats > div + div{border-left:1px solid var(--line)}
.stats dt{font-size:var(--t-cap);color:var(--muted)}
.stats dd{margin:0;font-size:var(--t-title);font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats .hail dd{color:var(--hmp-ink)}
.ago{display:flex;gap:6px;align-items:flex-start;font-size:var(--t-cap);color:var(--ink-2)}
.ago .i{width:16px;height:16px;margin-top:1px;color:var(--hmp-ink)}
/* rookie switch */
.rookie{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:var(--s3) var(--s4);text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.rookie .t{flex:1;min-width:0;display:grid;gap:2px}
.rookie .rt{font-weight:600;line-height:1.3}
.rookie .rs{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.sw{position:relative;flex:none;width:50px;height:30px;border-radius:var(--r-pill);background:var(--line-2);transition:background .18s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .18s var(--ease)}
.rookie[aria-checked="true"] .sw{background:var(--ok)}
.rookie[aria-checked="true"] .sw::after{transform:translateX(20px)}
.rookie[aria-checked="true"] .lead{background:var(--ok-bg);color:var(--ok)}
/* homeowner cards */
.who-sec{display:grid;gap:var(--s3)}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.who-grp{grid-column:1/-1;margin-top:var(--s3)}
.who-grp:first-child{margin-top:0}
.who{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-areas:"ic ck" "name name" "tag tag" "chips chips";grid-template-rows:auto auto auto 1fr;row-gap:2px;align-content:start;min-width:0;min-height:var(--hit);padding:var(--s3);text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.who-ic{grid-area:ic;width:32px;height:32px;margin-bottom:6px;border-radius:var(--r-sm);background:var(--soft);color:var(--ink-2);display:grid;place-items:center}
.who-ic .i{width:18px;height:18px}
.who-ck{grid-area:ck;justify-self:end;align-self:start;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--on-ink)}
.who-ck .i{width:13px;height:13px;stroke-width:2.6;visibility:hidden}
.who-name{grid-area:name;font-weight:600;line-height:1.25}
.who-tag{grid-area:tag;font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.who-chips{grid-area:chips;align-self:end;display:flex;flex-wrap:wrap;gap:4px;padding-top:var(--s2)}
.who[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.who[aria-pressed="true"] .who-ck{background:var(--ink);border-color:var(--ink)}
.who[aria-pressed="true"] .who-ck .i{visibility:visible}
.who[aria-pressed="true"] .who-ic{background:var(--hmp-bg);color:var(--hmp-ink)}
.who-wide,.who-random{grid-column:1/-1;grid-template-columns:32px minmax(0,1fr) 22px;grid-template-areas:"ic name ck" "ic tag ck" "ic chips ck";grid-template-rows:auto auto 1fr;column-gap:var(--s3)}
.who-random{grid-template-areas:"ic name ck" "ic tag ck";grid-template-rows:auto auto;align-items:center}
.who-wide .who-ic,.who-random .who-ic{margin-bottom:0}
.lvl{display:inline-flex;align-items:flex-end;gap:2px;height:11px;margin-right:2px}
.lvl i{width:3px;border-radius:1px;background:var(--line-2)}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:8px}.lvl i:nth-child(3){height:11px}
.lvl i.on{background:currentColor}
.goal{padding:var(--s4);display:grid;gap:var(--s3)}
.goal-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:var(--s3);font-size:var(--t-cap)}
.goal-row .lbl{font-weight:500;color:var(--ink-2)}
.stones{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stones i{height:6px;border-radius:3px;background:var(--line)}
.stones i.on{background:var(--ink)}
.goal-row .n{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.field{padding:var(--s4);display:grid;gap:var(--s3)}
.field > label{font-size:var(--t-cap);color:var(--muted)}
.tbox{width:100%;resize:vertical;min-height:64px;padding:var(--s3);font:16px/1.4 var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md)}
.tbox:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px var(--soft)}
.tbox::placeholder{color:var(--muted)}
.tbox:disabled{opacity:.7}
.field-row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3)}
.field-status{font-size:var(--t-cap);font-weight:500;color:var(--ink-2)}
.field-status.bad{color:var(--late)}.field-status.ok{color:var(--ok)}
.field-list summary{display:flex;align-items:center;min-height:var(--hit);font-weight:500;cursor:pointer}
.field-list .objs{margin-top:var(--s1)}
.obj-x{justify-self:start;margin-top:var(--s1)}
.knock-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);margin-inline:calc(var(--s4) * -1);padding:var(--s3) var(--s4);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.knock-bar .btn-primary{white-space:nowrap;padding-inline:var(--s3)}
.knock-bar .btn-ghost{width:auto;min-height:var(--hit-lg);white-space:nowrap}

/* ---------- at the door: a messaging screen ---------- */
#scrDoor{gap:var(--s3);padding-bottom:128px}
.chat-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:grid;gap:var(--s2);margin-inline:calc(var(--s4) * -1);padding:var(--s2) var(--s4) var(--s3);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-block:1px solid var(--line)}
.ch-row,.ch-row2{display:flex;align-items:center;gap:var(--s3)}
.doorway{position:relative;flex:none;width:44px;height:44px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--hmp-bg);color:var(--hmp-ink)}
.doorway::after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--faint);border:2.5px solid var(--card)}
.doorway.open::after{background:var(--ok)}
.doorway.knocking::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--hmp);animation:ring 1.3s var(--ease) infinite}
.doorway.knocking .av{animation:knock .9s ease-in-out 1}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes knock{0%,100%{transform:none}10%,40%,70%{transform:translateX(-2px)}25%,55%,85%{transform:translateX(2px)}}
.ch-who{flex:1;min-width:0;display:grid;gap:1px}
.porch-who{font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.porch-addr{font-size:var(--t-cap);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pips{flex:1;min-width:0;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.pips i{flex:1;max-width:30px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--ink)}
.pips span{margin-left:var(--s2);white-space:nowrap;font-variant-numeric:tabular-nums}
.divider{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s1)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider > span{display:inline-flex;align-items:center;gap:6px;font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rk-chip{display:inline-flex;align-items:center;height:20px;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--hmp-bg);color:var(--hmp-ink);font:500 12px/1 var(--f);letter-spacing:0;text-transform:none;vertical-align:middle}
.chat{display:flex;flex-direction:column;gap:var(--s3)}
.sys{align-self:center;max-width:36ch;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--soft);font-size:var(--t-cap);line-height:1.4;color:var(--ink-2);text-align:center}
.msg{max-width:86%;display:grid;gap:6px;justify-items:start}
.msg .lab{font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#chat .msg .lab{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.msg .body{padding:10px 14px;border-radius:20px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.home{align-self:flex-start}
.msg.home .body{background:var(--card);color:var(--ink);border:1px solid var(--line);border-top-left-radius:6px;box-shadow:var(--e1)}
#chat .msg.home{position:relative;padding-left:38px}
.mav{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--hmp-bg);color:var(--hmp-ink)}
.mav .i{width:16px;height:16px}
.msg.kenny{align-self:flex-end;justify-items:end}
.msg.kenny .body{background:var(--me);color:var(--on-me);border-top-right-radius:6px}
.msg.kenny.flagged .body{box-shadow:0 0 0 2px var(--late)}
.act{font-style:italic;color:var(--muted)}
.typing{display:inline-flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.flag{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 10px;border-radius:var(--r-sm);background:var(--late-bg);color:var(--late);font-size:12.5px;font-weight:500;line-height:1.3;text-align:left}
.flag .ic{display:inline-grid}.flag .i{width:14px;height:14px;stroke-width:2}
.flag.caution{background:var(--warn-bg);color:var(--warn)}
.hint{display:flex;gap:var(--s2);align-items:flex-start;max-width:100%;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--card);border:1px dashed var(--line-2);font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.hint b{flex:none;font:500 var(--t-label)/1.7 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--hmp-ink)}
.hint.wait{color:var(--muted)}
.err{display:grid;gap:var(--s3);justify-items:start;padding:var(--s4);border-radius:var(--r-lg);background:var(--warn-bg);color:var(--ink)}
.err p{font-weight:500}
.door-end{display:grid;gap:var(--s3);justify-items:center;text-align:center;padding:var(--s5) var(--s4) var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.end-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)}
.end-ic .end-yes,.door-end.yes .end-ic .end-no{display:none}
.door-end.yes .end-ic .end-yes{display:block}
.door-end.yes .end-ic{background:var(--ok-bg);color:var(--ok)}
.door-end h2{font-size:var(--t-title);font-weight:600;letter-spacing:-.015em}
/* composer: mic + keyboard bar, docked at the bottom */
.composer{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:var(--s2) var(--s4) calc(var(--s2) + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.composer-in{max-width:528px;margin:0 auto;display:flex;align-items:flex-end;gap:var(--s2)}
#box{flex:1;min-width:0;height:52px;max-height:140px;resize:none;padding:14px 18px;font:16px/1.4 var(--f);color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:26px}
#box:focus{outline:none;background:var(--card);border-color:var(--line-2)}
#box::placeholder{color:var(--muted)}
.mic,.send{flex:none;width:var(--hit);height:var(--hit);margin-bottom:4px;border-radius:50%;display:grid;place-items:center}
.mic{background:var(--ink);color:var(--on-ink)}
.mic.on{background:var(--late);color:var(--on-ink)}
.send{background:var(--hmp);color:var(--on-hmp)}
.send:disabled{opacity:1;background:var(--soft);color:var(--faint)}
.composer-note{max-width:528px;margin:6px auto 0;font-size:var(--t-cap);color:var(--muted)}

/* ---------- scorecard ---------- */
#scrScore{padding-bottom:0}
.score-head{display:grid;gap:var(--s1)}
.score-head h1{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.15}
.reveal{color:var(--ink-2)}
.loading{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);color:var(--ink-2);font-weight:500}
.score-top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.score-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:var(--s3) var(--s4);padding:var(--s4) var(--s4) var(--s4) var(--s5);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.big{display:flex;align-items:baseline;gap:4px;line-height:.9;font-variant-numeric:tabular-nums}
.big #scoreNum{font-size:var(--t-hero);font-weight:600;letter-spacing:-.045em}
.big small{font-size:var(--t-title);font-weight:500;color:var(--muted)}
.score-fig .cap{display:block;margin-top:var(--s2);font-size:var(--t-cap);color:var(--muted)}
.score-bar{grid-column:1/-1;display:flex;gap:3px}
.score-bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.score-bar i.on{background:var(--ok)}
.score-bar i.bad{background:var(--late)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:var(--r-sm);font-size:var(--t-cap);font-weight:500;white-space:nowrap;background:var(--soft);color:var(--ink-2)}
.pill .i{width:15px;height:15px;stroke-width:2}
.pill.yes{background:var(--ok-bg);color:var(--ok)}
.pill.ok{background:var(--warn-bg);color:var(--warn)}
.pill.weak{background:var(--late-bg);color:var(--late)}
/* legal: clear but calm */
.legal-bad,.legal-warn{display:grid;gap:var(--s3);padding:var(--s4);background:var(--card);border:1px solid var(--late-line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.legal-warn{border-color:var(--warn-line)}
.legal-title{display:flex;align-items:center;gap:var(--s3);font-size:var(--t-row);font-weight:600;letter-spacing:-.01em;color:var(--late)}
.legal-title .ic{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--late-bg);color:var(--late)}
.legal-title .ic .i{width:18px;height:18px}
.legal-warn .legal-title{color:var(--warn)}
.legal-warn .legal-title .ic{background:var(--warn-bg);color:var(--warn)}
.flag-item{display:grid;gap:6px;padding-top:var(--s3);border-top:1px solid var(--line)}
.flag-rule{font-weight:600;line-height:1.35;color:var(--ink)}
.flag-item q{display:block;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--soft);font-style:italic;color:var(--ink-2)}
.flag-fix{color:var(--ink-2)}
.checks{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.checks li{display:flex;align-items:flex-start;gap:var(--s3);min-height:56px;padding:var(--s3) var(--s4)}
.checks li + li{border-top:1px solid var(--line)}
.checks li > div{flex:1;min-width:0;padding-top:3px}
.ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.ck .i{width:15px;height:15px;stroke-width:2.5}
.ck.pass{background:var(--ok-bg);color:var(--ok)}
.ck.fail{background:var(--soft);color:var(--muted)}
.ck.bad{background:var(--late-bg);color:var(--late)}
.ck-l{font-weight:500;line-height:1.35}
li.bad .ck-l{color:var(--late)}
.ck-n{margin-top:2px;font-size:var(--t-cap);line-height:1.4;color:var(--muted)}
.focus-res,.best,.next{display:grid;gap:var(--s2);padding:var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.focus-line{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);font-weight:500}
.focus-note{font-size:var(--t-cap);color:var(--muted)}
.best blockquote{margin:0;padding-left:var(--s3);border-left:3px solid var(--hmp);font-size:var(--t-row);line-height:1.4;color:var(--ink)}
.next ul{margin:0;padding:0;list-style:none;display:grid;gap:var(--s2)}
.next li{display:flex;align-items:flex-start;gap:var(--s2);font-weight:500;line-height:1.4}
.next li .i{width:18px;height:18px;margin-top:1px;color:var(--hmp-ink)}
.transcript{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.transcript summary{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:52px;padding:0 var(--s4);font-weight:500;cursor:pointer;list-style:none}
.transcript summary::-webkit-details-marker{display:none}
.transcript summary .i{color:var(--faint);transition:transform .2s var(--ease)}
.transcript[open] summary .i{transform:rotate(180deg)}
#transcript{display:grid;gap:var(--s2);padding:0 var(--s4) var(--s4)}
#transcript p{font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
#transcript b{font-weight:600;color:var(--ink)}
.act-bar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:3;margin-inline:calc(var(--s4) * -1);padding:var(--s3) var(--s4);background:var(--bar);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}

/* ---------- drills ---------- */
.drill-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--s3)}
.drill-top .pips{margin-top:var(--s2);max-width:120px}
.focus-chip{display:flex;gap:var(--s2);align-items:baseline;padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--soft);font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.focus-chip b{font-weight:500;color:var(--ink)}
.focus-chip > span:first-child{flex:none;white-space:nowrap}
.drill-card{display:grid;gap:var(--s3)}
.drill-card > label{font:500 var(--t-label)/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.drill-q{max-width:100%}
.drill-q .body{padding:var(--s4);font-size:var(--t-title);font-weight:600;letter-spacing:-.015em;line-height:1.3;white-space:normal}
.drill-back{font-size:var(--t-cap);color:var(--muted)}
.drill-note{font-weight:500}
.done-head{display:grid;gap:var(--s1)}
.done-head h2{font-size:var(--t-addr);font-weight:600;letter-spacing:-.025em;line-height:1.15}
.done-head p{color:var(--ink-2)}
.done-list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1)}
.done-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px var(--s3);padding:var(--s3) var(--s4)}
.done-list li + li{border-top:1px solid var(--line)}
.done-q{font-weight:500;line-height:1.35}
.done-when{grid-column:1/-1;font-size:var(--t-cap);color:var(--muted)}

/* ---------- cheat sheet (bottom sheet) ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:calc(100% - 40px);overflow:auto;overscroll-behavior:contain;padding:0 var(--s4) calc(var(--s6) + env(safe-area-inset-bottom,0px));background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--e2);animation:up .28s var(--ease)}
@keyframes up{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;z-index:1;margin-inline:calc(var(--s4) * -1);padding:0 var(--s4) var(--s3);background:var(--bg)}
.grab{width:36px;height:5px;margin:8px auto 6px;border-radius:3px;background:var(--line-2)}
.sh-row{display:flex;align-items:center;gap:var(--s3)}
.sh-row h2{flex:1;min-width:0;font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.x{flex:none;width:var(--hit);height:var(--hit);border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)}
.cheat{display:grid;gap:var(--s5)}
.cheat > section{display:grid;gap:var(--s2)}
.cheat > section > .eyebrow:not(:first-child){margin-top:var(--s2)}
.script{padding:var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);font-size:var(--t-row);line-height:1.45;color:var(--ink)}
.script b{font-weight:600;color:var(--hmp-ink)}
.first3{display:grid;gap:10px;margin:0;padding:var(--s3) var(--s4);list-style:none;counter-reset:f3;border-radius:var(--r-md);background:var(--soft);line-height:1.45;color:var(--ink-2)}
.first3 li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;counter-increment:f3}
.first3 li::before{content:counter(f3);width:22px;height:22px;margin-top:1px;border-radius:50%;background:var(--card);color:var(--ink);font:600 12px/22px var(--f);text-align:center;font-variant-numeric:tabular-nums}
/* v10 (round 47): pro-line library, folded */
.pro{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.pro summary{display:flex;align-items:center;gap:var(--s2);min-height:56px;padding:0 var(--s4);font-weight:600;cursor:pointer;list-style:none}
.pro summary::-webkit-details-marker{display:none}
.pro summary .i{margin-left:auto;color:var(--muted);transition:transform .2s var(--ease)}
.pro[open] summary .i{transform:rotate(180deg)}
.pro-n{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:var(--r-sm);background:var(--soft);color:var(--ink-2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.pro .objs{border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.pl-l{font-size:var(--t-cap);color:var(--muted)}
.pl-a{line-height:1.45;color:var(--ink)}
.pl-n{margin-top:2px;font-size:var(--t-cap);line-height:1.45;color:var(--muted)}
.pl-tip{padding:10px var(--s4);font-size:var(--t-cap);line-height:1.45;background:var(--hmp-bg);color:var(--ink)}
.objs{display:grid;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden}
.objs > * + *{border-top:1px solid var(--line)}
.objs > .eyebrow{padding:10px var(--s4) 6px;background:var(--soft);color:var(--ink-2)}
.obj{display:grid;gap:4px;padding:var(--s3) var(--s4)}
.obj-q{font-weight:600;line-height:1.35}
.obj-a{line-height:1.45;color:var(--ink-2)}
.never{display:grid;background:var(--card);border:1px solid var(--late-line);border-radius:var(--r-lg);overflow:hidden}
.never > div{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:var(--s3);row-gap:3px;padding:var(--s3) var(--s4)}
.never > div + div{border-top:1px solid var(--line)}
.never .i{grid-row:1 / span 2;width:18px;height:18px;margin-top:2px;color:var(--late)}
.never b{font-weight:600;line-height:1.35}
.never span{font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.cmp-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.cmp{width:100%;border-collapse:collapse;font-size:var(--t-cap);line-height:1.35}
.cmp th,.cmp td{padding:var(--s2) var(--s3);text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;font-size:var(--t-body);font-weight:600;color:var(--ink)}
.cmp tbody th{width:32%;font-weight:500;color:var(--muted)}
.cmp td{color:var(--ink);font-variant-numeric:tabular-nums}
.cmp-note{font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.cmp-note b{font-weight:600;color:var(--ink)}
.claim{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.claim-col{display:grid;gap:var(--s2);align-content:start;padding:var(--s3) var(--s4);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.claim-col b{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.claim-col b .i{width:18px;height:18px}
.claim-col.can b{color:var(--ok)}.claim-col.cant b{color:var(--late)}
.claim-col ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
@media (max-width:440px){.claim{grid-template-columns:1fr}}
.off-card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-lg);background:var(--warn-bg)}
.off-card > .i{margin-top:2px;color:var(--warn)}
.off-card h2{font-size:var(--t-row);font-weight:600;line-height:1.3}
.off-card p{margin-top:var(--s1);color:var(--ink-2)}

/* ---------- v11: Aldaba type on titles + big numbers; primary button glow ---------- */
.focus-t,.ticket .addr,.score-head h1,.big #scoreNum,.done-head h2,.sh-row h2,.door-end h2,.stat b,.plan-h,.day-h,.ring-c b,.obj-h h2,.today-t{font-family:var(--display);font-weight:700;font-variation-settings:"opsz" 96;letter-spacing:-.015em}
.big #scoreNum,.ring-c b{letter-spacing:-.03em}
.btn-primary{background:var(--cta);box-shadow:var(--glow)}
.btn-primary:active{background:var(--hmp-press)}
.rows,.who,.rookie,.checks,.done-list,.objs,.pro,.transcript,.script,.score-hero,.focus-res,.best,.next,.door-end,.claim-col,.loading{border-color:var(--hair)}
.rows,.who,.rookie,.score-hero{background:var(--surface)}

/* ---------- v11: today card (top of Practice) ---------- */
.tdcard{padding:var(--s4);display:grid;gap:var(--s2);position:relative;overflow:hidden}
.tdcard::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--hmp),transparent 70%)}
.today-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.today-t{font-size:var(--t-title);line-height:1.2;text-wrap:balance}
.today-n{color:var(--ink-2)}
.today-acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s1)}
/* a drawn checkbox with its words (role=checkbox) */
.tick{display:inline-flex;align-items:center;gap:10px;min-height:var(--hit);padding:0 var(--s3) 0 10px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:var(--t-cap);font-weight:600;text-align:left}
.tick .bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-ink);transition:background .15s var(--ease),border-color .15s var(--ease)}
.tick .bx .i{width:14px;height:14px;stroke-width:2.8;visibility:hidden}
.tick[aria-checked="true"]{border-color:var(--ok);background:var(--ok-bg)}
.tick[aria-checked="true"] .bx{background:var(--ok);border-color:var(--ok)}
.tick[aria-checked="true"] .bx .i{visibility:visible}
.tick.ready{border-color:var(--hmp)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.hot{background:var(--hmp-bg);color:var(--hmp-ink)}

/* ---------- v11: Plan ---------- */
.plan-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s5);align-items:center;padding:var(--s2) 0 var(--s1)}
.ring-wrap{position:relative;width:148px;height:148px;flex:none}
.ring{display:block;width:100%;height:100%}
.ring path{fill:none;stroke:var(--line-2);stroke-width:9;stroke-linecap:butt}
.ring path.on{stroke:var(--ink-2)}
.ring path.cur{stroke:var(--hmp)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;line-height:1}
.ring-c b{font-size:52px}
.ring-c span{margin-top:4px;font-size:var(--t-cap);color:var(--muted)}
.plan-h{font-size:30px;line-height:1.08;text-wrap:balance}
.ph{display:grid;gap:var(--s2);min-width:0}
.ph p{color:var(--ink-2);max-width:52ch}
.ph-stats{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s1)}
.ph-stats .stat span{max-width:none}
.plan-grid{display:grid;gap:var(--s4)}
.plan-main{display:grid;gap:var(--s4);align-content:start;min-width:0}
.day{padding:var(--s4);display:grid;gap:var(--s3);align-content:start}
.day-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.day-h{font-size:26px;line-height:1.1}
.day-n{color:var(--ink-2)}
.steps{display:grid;border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden}
.steps > * + *{border-top:1px solid var(--line)}
.step{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding:var(--s3)}
.step .t{display:grid;gap:4px;min-width:0}
.step .t b{font-weight:600;line-height:1.3}
.step .t .chips{display:flex;flex-wrap:wrap;gap:4px}
.step-go{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.step.lesson{grid-template-columns:36px minmax(0,1fr)}
.prompt{grid-column:1/-1;display:grid;gap:var(--s2)}
.prompt q{display:block;padding:var(--s3);border-radius:var(--r-md);background:var(--soft);color:var(--ink);line-height:1.45;quotes:none;user-select:all;-webkit-user-select:all}
.prompt-acts{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.prompt-acts a{text-decoration:none}
.copy-note{font-size:var(--t-cap);color:var(--ok)}
.day-foot{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.day-foot .hint-t{font-size:var(--t-cap);color:var(--muted)}
.rdcard{padding:var(--s4);display:grid;gap:var(--s3);align-content:start}
.ready-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.ready-top .n{font:700 22px/1 var(--display);font-variation-settings:"opsz" 96;font-variant-numeric:tabular-nums}
.meter{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.meter i{height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--ok)}
.rlist{list-style:none;margin:0;padding:0;display:grid}
.rlist li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-ink)}
.rdot .i{width:13px;height:13px;stroke-width:2.8}
.rdot.ok{background:var(--ok);border-color:var(--ok)}
.rdot.part{border-color:var(--warn);background:conic-gradient(var(--warn) var(--pct,0%),transparent 0)}
.rtext{display:grid;gap:2px;min-width:0}
.rtext b{font-weight:500;line-height:1.35}
.rtext span{font-size:var(--t-cap);line-height:1.35;color:var(--muted)}
.rlist li.ok .rtext b{color:var(--ink-2)}
.gates{font-size:var(--t-cap);line-height:1.45;color:var(--muted);padding-top:var(--s2);border-top:1px solid var(--line)}
.weeks{display:grid;gap:var(--s3)}
.wk{padding:var(--s3) var(--s4) var(--s4);display:grid;gap:var(--s3);align-content:start}
.wk-h{display:grid;gap:2px}
.wk-h b{font-weight:600;line-height:1.3}
.wk-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dp .dl{display:block;font:500 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dp[aria-current="true"] .dl{color:var(--on-ink)}
.dp{display:grid;place-content:center;justify-items:center;gap:2px;min-height:52px;padding:6px 0;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--card);font:600 15px/1 var(--f);font-variant-numeric:tabular-nums;color:var(--ink);position:relative}
.dp.done{background:var(--soft);color:var(--ink-2);border-color:var(--line)}
.dp.done::after{content:"";position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dp.cur{border-color:var(--hmp);box-shadow:0 0 0 1px var(--hmp)}
.dp[aria-current="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.dp .lz{position:absolute;left:6px;bottom:6px;width:7px;height:7px;border-radius:2px;background:var(--you)}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:var(--t-cap);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.legend i.lz{border-radius:2px;background:var(--you)}
.legend i.cu{background:var(--hmp)}

/* ---------- v11: top 15 objections ---------- */
.obj-h{display:grid;gap:var(--s2)}
.obj-h h2{font-size:30px;line-height:1.08}
.obj-h p{color:var(--ink-2);max-width:60ch}
.searchrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.search{flex:1 1 280px;display:flex;align-items:center;gap:var(--s2);min-height:var(--hit-md);padding:0 var(--s3);border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--card);color:var(--muted)}
.search:focus-within{border-color:var(--ink-2)}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;font:16px/1.3 var(--f);color:var(--ink);outline:none}
.search input::placeholder{color:var(--muted)}
.known-n{font-size:var(--t-cap);color:var(--muted);font-variant-numeric:tabular-nums}
.top15{display:grid;gap:var(--s3);align-items:start}
.oc{padding:var(--s4);display:grid;gap:var(--s2)}
.oc-q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:baseline}
.oc-q .no{font:500 12px/1 var(--mono);color:var(--hmp-ink);font-variant-numeric:tabular-nums}
.oc-q b{font-weight:600;font-size:var(--t-row);line-height:1.3}
.oc-a{line-height:1.5;color:var(--ink)}
.oc-b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.oc-b .lg{font:500 11px/1.6 var(--mono);letter-spacing:.06em;color:var(--muted)}
.oc-never{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-md);background:var(--late-bg);font-size:var(--t-cap);line-height:1.45;color:var(--ink)}
.oc-never .i{width:16px;height:16px;margin-top:2px;color:var(--late)}
.oc .tick{justify-self:start;margin-top:var(--s1)}
.empty{color:var(--muted)}

/* ---------- v11: MacBook first (FilthE: design for a MacBook Air screen first) ---------- */
.setup-a,.setup-b,.setup-c{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
@media (min-width:1024px){
  .app{max-width:1180px;padding-inline:var(--s8)}
  .top{min-height:72px}
  #scrDoor,#scrScore,#scrDrill,#scrOff{width:100%;max-width:640px;margin-inline:auto}
  #scrSetup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto 1fr auto;column-gap:var(--s8);row-gap:var(--s4);align-items:start}
  .setup-a{grid-column:1;grid-row:1}
  .setup-b{grid-column:2;grid-row:1 / span 2}
  .setup-c{grid-column:1;grid-row:2}
  #scrSetup > .knock-bar{grid-column:1 / -1;grid-row:3;margin-inline:0;border:1px solid var(--hair);border-radius:var(--r-lg) var(--r-lg) 0 0;max-width:640px;justify-self:center;width:100%}
  .who-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .plan-hero{gap:var(--s8)}
  .ring-wrap{width:184px;height:184px}
  .ring-c b{font-size:64px}
  .plan-h{font-size:40px}
  .plan-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start;gap:var(--s5)}
  .weeks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .obj-h h2{font-size:40px}
  .top15{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet-panel{max-width:720px}
}
@media (max-width:520px){.plan-hero{grid-template-columns:1fr;justify-items:start}.ring-wrap{width:132px;height:132px}.ring-c b{font-size:46px}.step{grid-template-columns:36px minmax(0,1fr)}.step-go{grid-column:1/-1;justify-content:flex-start}}
@media (max-width:380px){.knock-bar .btn-ghost .i{display:none}}
@media (max-width:340px){.who-grid{grid-template-columns:1fr}.who-wide,.who-random{grid-column:auto}.stats dd{font-size:var(--t-row)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  [['“Someone already came by.”', '“Ya vino alguien.”'], ['Good, more eyes never hurt. Did they get on the roof or just look from the ground? Happy to give a free second look.', 'Qué bueno, más ojos nunca están de más. ¿Se subieron al techo o solo vieron desde el suelo? Con gusto le doy una segunda revisión gratis.']],
  [['“I rent.”', '“Yo rento.”'], ["Who owns the house? Can I get the owner's or property manager's office number?", '¿Quién es el dueño de la casa? ¿Me da el teléfono de la oficina del dueño o del administrador?']],
  /* v7 (T137, round 30): isolate the real reason; don't re-pitch. */
  [['“Let me think about it.”', '“Déjeme pensarlo.”'], ['Of course, take your time. So I know what to bring back: is it the price, the timing, another bid, or talking it over with your spouse?', 'Claro, tómese su tiempo. Para saber qué le traigo: ¿es el precio, el tiempo, otra cotización o platicarlo con su esposa o esposo?']],
  [['“Not interested.”', '“No me interesa.”'], ['No worries. Mind if I leave this bilingual card? (Then leave and go to the next door.)', 'No se preocupe. ¿Le puedo dejar esta tarjeta bilingüe? (Luego vete a la siguiente puerta.)']],
  /* Third item = the homeowner this answer is for (shown first when that homeowner is picked). */
  [['“I need three bids.”', '“Necesito tres cotizaciones.”'], ['Smart. Let me give you a free written estimate so you can compare line by line: materials, warranty, who does the work.', 'Muy bien pensado. Le doy un estimado gratis por escrito para que compare punto por punto: materiales, garantía y quién hace el trabajo.'], ['bargain', 'threebids']],
  [['“Why fix it if I’m selling?”', '“¿Para qué lo arreglo si voy a vender?”'], ["Buyers' inspectors check the roof and siding first. A free estimate tells you the cost, so you can fix it or price it in. Your call.", 'El inspector del comprador revisa primero el techo y el siding. Un estimado gratis le dice cuánto cuesta, y usted decide si lo arregla o lo descuenta del precio.'], 'selling'],
  [['“What payment plan do you have?”', '“¿Qué plan de pagos tienen?”'], ["I can't promise loan terms. Let me give you a free estimate, with a repair option too, and you take your time.", 'No le puedo prometer términos de préstamo. Le doy un estimado gratis, también con opción de reparar, y usted se toma su tiempo.'], 'fixed'],
  [['“I don’t sign anything without my son.”', '“No firmo nada sin mi hijo.”'], ["Of course. Nothing to sign today. I'll take free photos now and come back when your son is here. Every paper in Spanish.", 'Claro que sí. Hoy no se firma nada. Le tomo fotos gratis ahora y regreso cuando esté su hijo. Todos los papeles en español.'], 'consuelo'],
  [['“Is this legal? I’ve heard of scams.”', '“¿Esto es legal? He oído de estafas.”'], ["Good question. Here's my card: we're from Fremont, registered and insured. The look is free and I ask for no money today.", 'Buena pregunta. Aquí está mi tarjeta: somos de Fremont, registrados y asegurados. La revisión es gratis y hoy no le pido dinero.'], 'recien'],
  [['“The owner won’t pay unless insurance does. I can’t sign.”', '“El dueño no paga si el seguro no paga. Yo no puedo firmar.”'], ["That's fine, the owner signs. Can I get their name and number? I'll send them free photos.", 'Está bien, el que firma es el dueño. ¿Me da su nombre y número? Le mando fotos gratis.'], 'manager'],
  [['“Do it for less and I keep the difference.”', '“Hágalo por menos y me quedo con la diferencia.”'], ["We bill what we actually do, and the invoice matches the work. Let me look at your roof and the adjuster's paperwork for free.", 'Cobramos lo que de verdad hacemos y la factura es el trabajo real. Déjeme revisar gratis su techo y los papeles del ajustador.'], 'gotcheck'],
  [['“The adjuster said no damage.”', '“El ajustador dijo que no hay daño.”'], ["I can't promise a check or argue with them. I can take free photos. If there's damage, you can ask for a re-inspection and I'll be there.", 'No le puedo prometer un cheque ni pelear con ellos. Le tomo fotos gratis. Si hay daño, usted pide otra inspección y yo voy a estar ahí.'], 'adjno'],
  /* Added 2026-09-26 (v3): cash siding on older houses (research round 5). Third item may be a list of homeowners. */
  [['“That’s too expensive.”', '“Está muy caro.”'], ["Fair question. What number did you have in mind? Let me show you vinyl next to Hardie: what each costs, how long it lasts. Then you pick what fits.", 'Es buena pregunta. ¿Qué cantidad tenía en mente? Déjeme enseñarle el vinyl junto al Hardie: cuánto cuesta cada uno y cuánto dura. Luego usted escoge lo que le conviene.'], CASH_OBJ],
  [['“We’re getting other bids.”', '“Estamos pidiendo otras cotizaciones.”'], ["Good, you should. I'm happy to go over the bids with you line by line, so you're comparing the same work.", 'Qué bueno, así debe ser. Con gusto reviso las cotizaciones con usted punto por punto, para que compare el mismo trabajo.'], CASH_OBJ],
  /* Added 2026-09-26 (v5, research rounds 15-18). */
  [['“You’re one of those storm chasers.”', '“Usted es de esos que persiguen tormentas.”'], ["Fair question. I'm based right here in Fremont, not from out of state. We're registered with the state and insured. Here's my card with our local number. Mind if I take a free look?", 'Buena pregunta. Soy de aquí, de Fremont, no de otro estado. Estamos registrados con el estado y asegurados. Aquí está mi tarjeta con nuestro número local. ¿Le parece si reviso gratis?'], ['chaser', 'retiree']],
  [['“My insurance agent said to wait.”', '“Mi agente de seguros me dijo que espere.”'], ["That's fair, I won't tell you what to do about your policy. A free look just gets you photos you can show your agent. Looking isn't filing a claim.", 'Está bien, no le voy a decir qué hacer con su póliza. Una revisión gratis le da fotos para enseñarle a su agente. Revisar no es hacer un reclamo.'], 'agentwait'],
  [['“I already had a guy look at it.”', '“Ya me lo revisó alguien.”'], ["Good. What did he check, the vents and gutters too? Hail bruises can be hard to spot. A free second look with photos takes about 10 minutes.", 'Qué bueno. ¿Qué revisó, también los ventiladores y las canaletas? Los golpes de granizo a veces no se ven fácil. Una segunda revisión gratis, con fotos, toma unos 10 minutos.'], 'hadlook'],
  [['“Sorry, my English… ¿habla español?”', '“Perdón, mi inglés… ¿habla español?”'], ['Switch right away: “¡Claro que sí! Soy Kenny de HMP Siding & Roofing, una compañía de techos y siding de aquí de Fremont.” Then keep going in Spanish.', 'Cambia de inmediato: “¡Claro que sí! Soy Kenny de HMP Siding & Roofing, una compañía de techos y siding de aquí de Fremont.” Y sigue en español.'], ['rogelio', 'dad', 'recien']],
  [['“I rent. Want the owner’s cell?”', '“Yo rento. ¿Quiere el celular del dueño?”'], ["Thanks, the office line is best. Who owns the house, and what's the company's name?", 'Gracias, mejor el teléfono de la oficina. ¿Quién es el dueño y cómo se llama la compañía?'], ['rental', 'renter']],
  [['“If I sign today, can you start next week?”', '“Si firmo hoy, ¿empiezan la otra semana?”'], ["I'll write you an estimate range first, not the final price. If you sign, you get a 3-day cancel form, in writing, every time. Can I come back Saturday at 10 with it?", 'Primero le escribo un rango de estimado, no es el precio final. Si firma, siempre le doy la forma para cancelar en 3 días, por escrito. ¿Regreso el sábado a las 10 con eso?'], 'oldhouse'],
  [['“What do you give if I send my sister your way?”', '“¿Qué me dan si les mando a mi hermana?”'], ["Thank you, that means a lot. We don't do gifts, just a real thank-you, and we'll take great care of her.", 'Muchas gracias, eso vale mucho. No damos regalos, solo un agradecimiento de verdad, y la vamos a atender muy bien.'], 'oldhouse'],
  [['“Maybe next year.”', '“Mejor el año que entra.”'], ["No problem. Let's put a date on it so it doesn't slip. A Saturday in early spring, say March 7 at 10 AM? Or what day works better?", 'Está bien. Pongamos una fecha para que no se le pase. Un sábado a principios de primavera, ¿el 7 de marzo a las 10 de la mañana? ¿O qué día le queda mejor?'], CASH_OBJ],
  /* v9 (T153, data/objection_scripts_2.json): state facts, never coach a cancel, never disparage; honest no-damage; HOA = the association's claim. */
  [['“I already signed with another company.”', '“Ya firmé con otra compañía.”'], ["Good, you're moving on it. I'm not here to talk you out of anything. If you signed in the last 3 business days, Nebraska gives you the right to cancel, and that's your call. Either way, ask them who handles the warranty. Want a free second look at the scope?", 'Qué bien que ya está avanzando. No vengo a convencerlo de nada. Si firmó en los últimos 3 días hábiles, la ley de Nebraska le da derecho a cancelar, y eso lo decide usted. De todas formas, pregúnteles quién atiende la garantía. ¿Quiere una segunda revisión del alcance, gratis?'], 'signed'],
  [['“You didn’t find anything? My neighbor got a new roof.”', '“¿No encontró nada? A mi vecino le dieron techo nuevo.”'], ["Good news for you: I checked the slopes, vents and gutters and found no hail or wind damage. I won't file something that isn't there. Here are the photos. If a neighbor asks who checked your roof, I'd appreciate the introduction.", 'Buenas noticias: revisé las pendientes, los respiraderos y las canaletas y no encontré daño de granizo ni de viento. No voy a reportar algo que no existe. Aquí están las fotos. Si un vecino pregunta quién revisó su techo, le agradecería la recomendación.'], 'nodamage'],
  /* v9 (data/price_objections.json). */
  [['“Can you just give me a number over the phone?”', '“¿Me puede dar un número por teléfono?”'], ["I'd rather not guess. The real number depends on what I can only see up close: the ventilation, the decking, how many layers are up there. A phone guess that's wrong is worse for both of us. The look is free, about 20 minutes. Can I come by Saturday at 10?", 'Prefiero no adivinar. El número real depende de lo que solo se ve de cerca: la ventilación, la madera debajo de las tejas, cuántas capas tiene. Un número por teléfono que sale mal es peor para los dos. La revisión es gratis, unos 20 minutos. ¿Puedo pasar el sábado a las 10?'], 'phonequote'],
  [['“Should I even bother getting the other two bids?”', '“¿Para qué pido las otras dos cotizaciones?”'], ["Yes, get them, I'd do the same. When you have all three, line them up on scope and warranty, not just the bottom number. I'll leave you everything written out so it's easy to compare.", 'Sí, pídalas, yo haría lo mismo. Cuando tenga las tres, compárelas en el alcance y la garantía, no solo en el precio final. Le dejo todo por escrito para que sea fácil comparar.'], 'threebids'],
  [['“Who pays the deductible? Can you help with my claim?”', '“¿Quién paga el deducible? ¿Me ayuda con mi reclamo?”'], ["That's actually the association's claim, not yours. The roof is common property under the HOA's master policy, and the board decides. I can give the board a written roof report. Can I get the management company's office number?", 'Ese reclamo en realidad le toca a la asociación, no a usted. El techo es propiedad común bajo la póliza maestra de la HOA, y decide la junta. Le puedo dar a la junta un reporte por escrito del techo. ¿Me da el teléfono de la oficina de la compañía administradora?'], 'hoa'],
];

  { id: 'drill-tone-switch', t: ['Friendly tone, not stern tone', 'Tono amable, no tono serio'], loc: 'noPush',

    crit: "Homeowner's warmth score improves by the end of the exchange and Kenny's lines contain no commanding/pressuring phrasing ('you need to', 'you have to act now'). In this one-line drill, judge whether his line would warm up an annoyed homeowner.",
    a: ["Sure, I'll be quick! I'm Kenny with HMP Siding & Roofing from Fremont. The hail hit this street, so we're doing free roof checks. Want me to take a quick look?", '¡Claro, rapidito! Soy Kenny de HMP Siding & Roofing, de Fremont. El granizo pegó en esta calle y estamos revisando techos gratis. ¿Quiere que le eche un vistazo rápido?'] },
  { id: 'drill-not-interested-recovery', t: ['Bouncing back from “not interested”', 'Recuperarse de “no me interesa”'], loc: null,

  { id: 'drill-morning-pitch-warmup', t: ['Say it out loud first', 'Dilo en voz alta primero'], loc: 'intro', solo: true,

    a: ["Hi there! I'm Kenny with HMP Siding & Roofing, right here in Fremont. We do roofs and siding, and after the hail we're giving free roof checks on this street. Mind if I take a look?", '¡Buenas! Soy Kenny de HMP Siding & Roofing, aquí de Fremont. Hacemos techos y siding, y después del granizo estamos revisando techos gratis en esta calle. ¿Me deja echarle un vistazo?'] },
  { id: 'drill-photos-before-paper', t: ['Photos and scope before any signature', 'Fotos y alcance antes de firmar nada'], loc: 'photos',

  { id: 'drill-deductible-question', t: ['When they ask about the deductible', 'Cuando preguntan por el deducible'], loc: 'nodeduct',

  { id: 'spouse', q: ['“I need to talk to my spouse.”', '“Lo tengo que hablar con mi esposo/a.”'],

  { id: 'bids', q: ['“I want three bids before I decide.”', '“Quiero tres cotizaciones antes de decidir.”'],
    a: ["That's smart, I'd do the same. Am I the first one out, or have you got the others? When you've got all three, line them up on scope and warranty, not just the bottom-line number — a lower price is usually a shorter warranty or a lighter material. I'll leave everything written out so it's easy to compare.", 'Es inteligente, yo haría lo mismo. ¿Soy el primero, o ya tiene las otras? Cuando tenga las tres, compárelas en alcance y garantía, no solo el número — un precio más bajo casi siempre es una garantía más corta. Le dejo todo escrito para comparar fácil.'] },

  { id: 'more', q: ['“That’s more than I wanted to spend.” (after a cash quote)', '“Es más de lo que quería gastar.” (después de un precio directo)'],

  { id: 'think', q: ['“Let me think about it.” (price)', '“Déjeme pensarlo.” (el precio)'],

    a: ["That's good you're moving on it — not here to talk you out of anything. If you signed in the last 3 days, Nebraska gives you the right to cancel with no penalty, yours whether it's them or us. Also smart to check who'll still be around in 6 months for a warranty issue. Want a free second look before you're locked in for good?", 'Qué bien que ya avanza — no vengo a convencerlo de nada. Si firmó en los últimos 3 días, la ley de Nebraska le da derecho a cancelar sin penalidad, sea con ellos o con nosotros. También es inteligente ver quién va a estar aquí en 6 meses. ¿Quiere una segunda opinión gratis antes de comprometerse del todo?'],
    n: ['Never say their contract is invalid, call the other company a scam without proof, or tell them to cancel. That’s their call.', 'Nunca digas que su contrato no vale, no llames estafa a la otra compañía sin pruebas y no le digas que cancele. Eso lo decide el dueño.'] },
  { id: 'nodmg', q: ['We inspect and find no damage.', 'Revisamos y no hay daño.'],

  { id: 'adjno', q: ['“The adjuster already said no damage.”', '“El ajustador ya dijo que no hay daño.”'],

  { id: 'cheaper', q: ['“I got a cheaper quote from someone else.”', '“Me dieron un precio más barato en otro lado.”'],

/* Coach flags (only valid ones) + local legalScan flags, without repeats. */
function mergeFlags(coach, local) {

    .filter(f => f && typeof f.quote === 'string' && f.quote.trim())
    .map(f => ({ quote: f.quote.trim(), type: TYPES.includes(f.type) ? f.type : 'deductible' }));

    'Allowed: saying the inspection, look or estimate is free; the insurance company decides what is covered; the deductible is always the homeowner\'s part; HMP meets the adjuster and shows the damage; the homeowner can ask the insurer for a re-inspection; the 3 business days to cancel.',

    ...lines.map((x, i) => `LINE ${i + 1}: <<<${String(x).slice(0, 600)}>>>`),
    '',

async function semanticCheck(sample, lines) {
  const ctl = new AbortController();
  const data = await timed(sample.json(checkPrompt(lines), { cache: false, signal: ctl.signal }), ctl, QUICK_MS);
  const flags = data && typeof data === 'object' && Array.isArray(data.flags) ? data.flags.filter(f => f && typeof f === 'object') : null;
  if (!flags || typeof data.ok !== 'boolean') throw { code: 'invalid_json' };
  if (data.ok === true && flags.length === 0) return { ok: true, flags: [] };
  const out = flags.map(f => ({ type: TYPES.includes(f.type) ? f.type : 'deductible', quote: typeof f.quote === 'string' ? f.quote : '' }));

}

$('sheetBack').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
$('endBtn').addEventListener('click', endNow);
$('scoreBtn').addEventListener('click', goScore);
$('scoreRetry').addEventListener('click', goScore);
$('againBtn').addEventListener('click', () => { if (S.ctl) S.ctl.abort(); S.sc = newScenario(); knock(); });
$('newBtn').addEventListener('click', () => { if (S.ctl) S.ctl.abort(); S.sid++; S.sc = newScenario(); renderSetup(); show('setup'); });
$('composer').addEventListener('submit', e => { e.preventDefault(); send(); });
$('box').addEventListener('input', grow);
$('box').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('micBtn').hidden = !SR;
$('micBtn').addEventListener('click', toggleMic);
/* v4 */
$('drillBtn').addEventListener('click', startDrill);
$('drillCheck').addEventListener('click', drillCheck);
$('drillRetry').addEventListener('click', drillCheck);
$('drillShow').addEventListener('click', drillShow);
$('drillNext').addEventListener('click', drillNext);
$('drillStop').addEventListener('click', drillStop);
$('drillAgain').addEventListener('click', () => { const d = S.drill; if (d && d.skill) startSkill(d.items[0].id); else startDrill(); });
$('drillHome').addEventListener('click', goHome);
$('drillBox').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); drillCheck(); } });
$('fieldAdd').addEventListener('click', addField);
/* v5 */
$('rookieBtn').addEventListener('click', () => { S.store.rookie = !S.store.rookie; saveStore(); $('rookieBtn').setAttribute('aria-checked', String(!!S.store.rookie)); });
/* v11 */
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) goTab(b.dataset.tab); });
$('scrPlan').addEventListener('click', onPlanClick);
$('tdStart').addEventListener('click', () => runStep(S.todayStep));
$('tdCheck').addEventListener('click', () => { if (S.todayDay) toggleDay(S.todayDay); });
$('tdPlan').addEventListener('click', () => goTab('plan'));
$('objSearch').addEventListener('input', renderObj);
$('top15').addEventListener('click', e => {
  const b = e.target.closest('[data-known]'); if (!b) return;
  const id = b.dataset.known;
  if (S.path.known[id]) delete S.path.known[id]; else S.path.known[id] = today();
  savePath(); b.setAttribute('aria-checked', String(!!S.path.known[id]));
  $('objKnown').textContent = t('objKnown', Object.keys(S.path.known).length);
});

S.field = S.field.filter(f => !legalScan(f.a[0]).length && !legalScan(f.a[1]).length);
S.sc = newScenario();
applyLang();
show('setup');
})();
</script>
